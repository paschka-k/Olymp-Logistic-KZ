<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Olymp Logistic KZ · Platform v6 (ru)</title><style>
/* ==========================================================================
   part-D-tokens.css  -  FleetFlow-style design tokens (light theme)
   Source: pixel measurements of 2026-10-18_SampleStructure_Aufzeichnung.mp4
   [M] = measured from frames (video colours drift +-6 per channel; saturated
         colours are ~5% darker than their Tailwind equivalents)
   [I] = inferred (Tailwind-like scale, thin text colours, sizes)
   All lengths are CSS px at design scale 1:1. The video shows the app at
   ~0.76x (1296 recorded px = ~1705 CSS px), so values = video px / 0.76,
   snapped to a 4px grid.  [I]
   ========================================================================== */
:root {
  /* ---- surfaces ---- */
  --bg-page:        #f9fafb;  /* [M #faf9fc] content area behind cards, table header */
  --bg-surface:     #ffffff;  /* [M] sidebar, top bar, cards, drawer, table rows */
  --bg-subtle:      #f3f4f6;  /* [M #f3f3f5] grey button, count badges, 'Data source' chip */
  --bg-selected:    #eff6ff;  /* [M #eff5ff] selected table row, blue alert */
  --bg-hover:       #f9fafb;  /* [M #f7f9fb] hovered table row */
  --border:         #f3f4f6;  /* [M #f3f3f3] sidebar/topbar/card hairlines */
  --border-input:   #e5e7eb;  /* [M ~#e5e5e9] input/select border, progress track, dashed drop zone */

  /* ---- text ---- */
  --text-strong:    #111827;  /* [M #0b0b0e] KPI value, page title */
  --text:           #374151;  /* [I] table body, nav inactive */
  --text-muted:     #6b7280;  /* [I] KPI label, sub-lines, table header caps */
  --text-faint:     #9ca3af;  /* [I] placeholder, 'Not assigned', captions */
  --link:           #2f66c8;  /* [I] Load ID links (thin text looks lighter than it is) */

  /* ---- brand / primary ---- */
  --primary:        #3b82f6;  /* [M #4381ed] active nav pill, primary button, tab, pagination */
  --primary-hover:  #2563eb;  /* [I] */
  --primary-tint:   #dbeafe;  /* [M #dbe9fb] icon badge bg, 'Assigned' chip bg */
  --primary-ring:   #93c5fd;  /* [I] focused select/input ring */
  --on-primary:     #ffffff;

  /* ---- solid accents (icon badges, dots, bars, small buttons) ---- */
  --blue:    #3b82f6;  /* [M #4581eb] */
  --green:   #33d965;  /* [M #33d965] progress fill, icon badge, Accept btn, map 'on time' dot */
  --yellow:  #e1b917;  /* [M #e1b917] icon badge, Override btn, progress warn, delayed dot */
  --red:     #df3149;  /* [M #df3149] icon badge, PDF btn, critical dot */
  --purple:  #9f45ed;  /* [M #9f45ed] icon badge */
  --orange:  #f97316;  /* [I] orange icon badge (fuel KPI measured #d59471 inside pastel) */
  --grey:    #6f737d;  /* [M] Dismiss button */

  /* ---- solid action buttons (large, Quick Actions / header CTAs) ---- */
  --btn-blue:       #4381ed;  /* [M] */
  --btn-green:      #1fcd83;  /* [M] 'Auto-Assign', 'Schedule Maintenance', 'Compliance Report', 'Assign Driver' */
  --btn-purple:     #8d1de5;  /* [M] 'Generate Invoice' */
  --btn-orange:     #dd4d11;  /* [M] 'Plan Route' */
  --btn-red:        #df3147;  /* [M] 'Export PDF' */
  --btn-grey-bg:    #f3f4f6;  /* [M #f3f3f5] 'Import Loads', 'Export Data', 'View History' */
  --btn-grey-text:  #4b5563;  /* [I] */

  /* ---- pastel tints: [bg-from (50) , bg-to (100)] for KPI gradient tiles, [text-strong 900], [label 600] ---- */
  --tint-blue-50:   #eff6ff; --tint-blue-100:   #dbeafe;  /* [M #eaf2fb -> #dce9fa] */
  --tint-green-50:  #f0fdf4; --tint-green-100:  #dcfce7;  /* [M #ecfdf3 -> #e0fee9] */
  --tint-yellow-50: #fefce8; --tint-yellow-100: #fef9c3;  /* [M #fcfcde -> #fcfac9] */
  --tint-red-50:    #fef2f2; --tint-red-100:    #ffe4e6;  /* [M #fcebec -> #f9dfe3] */
  --tint-purple-50: #faf5ff; --tint-purple-100: #f3e8ff;  /* [M #f6effd -> #f0e6fb] */
  --tint-orange-100:#ffedd5;                              /* [M #fbebd7] */
  --tint-gray-100:  #f3f4f6;                              /* [M] */
  --on-blue:   #1e3a8a;  --label-blue:   #3b6fd1;         /* [M value #262e63] */
  --on-green:  #14532d;  --label-green:  #2a9d52;         /* [M value #265333] */
  --on-yellow: #713f12;  --label-yellow: #a16207;         /* [I] */
  --on-red:    #7f1d1d;  --label-red:    #c0394d;         /* [I] */
  --on-purple: #581c87;  --label-purple: #7e3fbf;         /* [M value #42195b] */

  /* ---- status chips: bg [M] / text [I = 800 shade] ---- */
  --chip-green-bg:  #dcfce7;  --chip-green-fg:  #166534;  /* In Transit, Available, Active, On Time, Approved/Paid, Valid, Low(prio) */
  --chip-blue-bg:   #dbeafe;  --chip-blue-fg:   #1e40af;  /* Assigned, Submitted */
  --chip-yellow-bg: #fef9c3;  --chip-yellow-fg: #854d0e;  /* Loading, In Use, Pending, On Trip, Maintenance(wh), Delayed, Medium(prio), Review soon */
  --chip-purple-bg: #f3e8ff;  --chip-purple-fg: #6b21a8;  /* Delivered */
  --chip-red-bg:    #ffe4e6;  --chip-red-fg:    #be123c;  /* Critical, Maintenance(fleet), Overdue, Rejected, High(prio), Blocked */
  --chip-gray-bg:   #f3f4f6;  --chip-gray-fg:   #4b5563;  /* Unassigned, Off Duty, Pending Upload, counts */

  /* ---- health / risk dots ---- */
  --dot-good:  #6de38f;  /* [M #5fe587 fleet / #6de38f HOS] */
  --dot-warn:  #e9cb59;  /* [M] */
  --dot-bad:   #dd4359;  /* [M HOS red; fleet 'critical' is pale #f3c1c9] */
  --dot-bad-soft: #f3c1c9; /* [M] */

  /* ---- progress / utilisation thresholds (Warehouses) ---- */
  --bar-track: #e5e7eb;  /* [M #e5e5e9] */
  --bar-ok:    #35d567;  /* [M] <~75 % */
  --bar-warn:  #dfbb17;  /* [M] ~85-90 % (87.3 %) */
  --bar-crit:  #d1374b;  /* [M] >~90 % (94.8 %) */
  --bar-low:   #4583e7;  /* [M] <50 % (45.2 %, maintenance site) */

  /* ---- map ---- */
  --map-land:   #e5e3df;  /* [M] Google-Maps-like standard tiles */
  --map-park:   #cfe7bf;  /* [M] */
  --map-water:  #80d1e4;  /* [M] */
  --map-road:   #ffffff;  /* [M] minor roads; motorway #e8d576 [M], routes in Routes page: yellow #f2c94c [I] */
  --mk-blue:    #2f61dd; --mk-green: #25b753; --mk-orange: #d95117;
  --mk-red:     #c9172f; --mk-purple: #891fdf; --mk-teal: #1ba183;   /* [M] round markers, white icon */
  --mk-status-green: #37d969; --mk-status-yellow: #dfbb17;           /* [M] corner dot, 8px */

  /* ---- chart palette (Reports) ---- */
  --chart-line: #5aa8d0;  --chart-area: #e8f2fb;   /* [M approx] sky line + gradient area */
  --chart-mint: #94dcc4;  --chart-sky: #5cbce4;    /* [M] stacked bars */
  --chart-amber:#f4bc74;  --chart-blue: #4484ec;   /* [M] */
  --chart-grid: #e5e7eb;                           /* [I] */

  /* ---- avatars (initials, customer colour) ---- */
  --av-1:#315fd1; --av-2:#c7152f; --av-3:#d5511d; --av-4:#8921db;
  --av-5:#1fa183; --av-6:#533bd9; --av-7:#23b553; --av-8:#c7116f;  /* [M] */

  /* ---- alert cards (dashboard, [M] bg) + left border (AI page, [M]) ---- */
  --alert-red-bg:#fef2f2;    --alert-red-fg:#9b1c31;    --alert-red-bd:#970f25;
  --alert-orange-bg:#fff7ed; --alert-orange-fg:#9a3412;
  --alert-blue-bg:#eff6ff;   --alert-blue-fg:#1e3a8a;
  --alert-yellow-bg:#fefce8; --alert-yellow-fg:#854d0e;
  --banner-from:#fef3c7; --banner-to:#fcd9a8; --banner-bd:#d3a739;   /* [M #fdf3c9 -> #fbdbb1], AI disclaimer strip */

  /* ---- radii ---- */
  --r-card:   12px;  /* [M ~9 video px] cards, KPI tiles, drawer sections */
  --r-btn:    10px;  /* [M] buttons, top-bar selects */
  --r-input:  999px; /* [M] filter pill selects, search box, nav pill is 14px */
  --r-nav:    14px;  /* [M] sidebar active pill (28 px high in video -> near full pill) */
  --r-chip:   999px; /* [M] status & priority chips, count badges */
  --r-icon:   12px;  /* [M] KPI icon badge (rounded square); Fleet-style tinted tiles use circle 999px */
  --r-badge:  6px;   /* [I] small PDF/CSV buttons */

  /* ---- shadows ---- */
  --sh-card:  0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);   /* [M subtle 2-3px darker edge] */
  --sh-hover: 0 10px 15px -3px rgba(0,0,0,.10), 0 4px 6px -4px rgba(0,0,0,.06); /* [M] warehouse card hover/selected */
  --sh-pop:   0 4px 12px rgba(0,0,0,.12);                             /* [M] map legend / stat strip */
  --sh-drawer: -8px 0 24px rgba(0,0,0,.08);                           /* [I] left shadow, no scrim */

  /* ---- layout (CSS px @1x) ---- */
  --sidebar-w:  256px;  /* [M 194 video px] */
  --topbar-h:   80px;   /* [M 60 video px] */
  --page-pad:   24px;   /* [M 18 video px] */
  --gap:        24px;   /* [M 19 video px] KPI/card gap */
  --drawer-w:   384px;  /* [M 280 video px] standard detail drawer */
  --drawer-w-xl:840px;  /* [M 641 video px] Reports 'detailed view' */
  --nav-h:      37px;   /* [M 28 video px] */  --nav-pitch: 41px;
  --row-h:      70px;   /* [M orders 53 vp] fleet 74, billing 78, drivers 90 */
  --kpi-h:      125px;  /* [M dashboard tiles 95 vp]; tinted tiles 85 [M 64 vp] */

  /* ---- type ---- */
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;  /* [I] */
  --fs-title: 24px; --fw-title: 700;   /* page title [M cap-height 13 vp] */
  --fs-card:  18px; --fw-card: 600;    /* card title 'Live Operations' */
  --fs-kpi:   30px; --fw-kpi: 700;     /* [M] */
  --fs-body:  14px;                    /* table cells, nav, buttons */
  --fs-small: 12px;                    /* captions, chips, KPI sublines */
  --fs-th:    12px; --fw-th: 500; --ls-th: .05em;  /* TABLE HEADER CAPS */
}

/* ==========================================================================
   Olymp Logistic KZ additions (spec v1.0 §6) - cold chain, ESF, zones
   ========================================================================== */
:root {
  /* temperature status */
  --temp-ok:     #35d567;  --temp-ok-bg:     #dcfce7;
  --temp-warn:   #dfbb17;  --temp-warn-bg:   #fef9c3;
  --temp-breach: #d1374b;  --temp-breach-bg: #ffe4e6;
  /* temperature zones (muted so status colours stay dominant) */
  --zone-frozen:  #60a5fa;  --zone-frozen-bg:  #eff6ff;   /* -18 C */
  --zone-chilled: #2dd4bf;  --zone-chilled-bg: #f0fdfa;   /* 0..+4 C */
  --zone-pharma:  #a78bfa;  --zone-pharma-bg:  #f5f3ff;   /* +2..+8 C */
  --zone-ambient: #a8a29e;  --zone-ambient-bg: #f5f5f4;   /* +15..+25 C */
  /* ESF / ESUTD document state chips reuse chip-* pairs: issued=blue, confirmed=green, rejected=red, draft=gray */
  --step-done: #23cb85; --step-current: #4581eb; --step-failed: #c71531; --step-todo: #e7e7e9;
  --risk-high-bg:#fbdfe1;   --risk-high-bd:#970f25;
  --risk-mid-bg:#fdf3c9;    --risk-mid-bd:#d0a02c;
  --risk-low-bg:#dfffe7;    --risk-low-bd:#33a25b;
  --drawer-w-report: var(--drawer-w-xl);
}

/* ============================ base ============================ */
* { box-sizing: border-box; }
body { margin:0; font-family:var(--font); font-size:var(--fs-body); color:var(--text); background:var(--bg-page); }

/* ============================ shell ============================ */
.app { display:grid; grid-template-columns:var(--sidebar-w) 1fr; min-height:100vh; }
.sidebar { position:sticky; top:0; height:100vh; background:var(--bg-surface); border-right:1px solid var(--border); padding:16px; }
.topbar  { position:sticky; top:0; z-index:20; height:var(--topbar-h); background:var(--bg-surface);
           border-bottom:1px solid var(--border); display:flex; align-items:center; gap:16px; padding:0 var(--page-pad); }
.page-head { position:sticky; top:var(--topbar-h); z-index:10; background:var(--bg-surface); border-bottom:1px solid var(--border); padding:16px var(--page-pad); }
.page-title { font-size:var(--fs-title); font-weight:var(--fw-title); color:var(--text-strong); margin:0; }
.content { padding:var(--page-pad); display:flex; flex-direction:column; gap:var(--gap); }

/* ============================ nav ============================ */
.nav-item { display:flex; align-items:center; gap:12px; height:var(--nav-h); padding:0 12px; margin-bottom:4px;
            border-radius:var(--r-nav); color:var(--text); font-weight:500; cursor:pointer; }
.nav-item:hover  { background:var(--bg-subtle); }
.nav-item.active { background:var(--primary); color:var(--on-primary); }
.nav-item svg { width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.75; }  /* line icons, ~Lucide */


/* ============================ card ============================ */
.card { background:var(--bg-surface); border:1px solid var(--border); border-radius:var(--r-card); box-shadow:var(--sh-card); }
.card-head { padding:20px 24px; border-bottom:1px solid var(--border); font-size:var(--fs-card); font-weight:var(--fw-card); color:var(--text-strong); }
.card-body { padding:24px; }
.card.is-selected, .card:hover.is-hoverable { box-shadow:var(--sh-hover); }

/* ============================ KPI tile ============================ */
.kpi-row  { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:var(--gap); }
.kpi-tile { display:flex; justify-content:space-between; align-items:center; padding:20px 24px;
            background:var(--bg-surface); border:1px solid var(--border); border-radius:var(--r-card); box-shadow:var(--sh-card); }
.kpi-tile .label { font-size:var(--fs-body); color:var(--text-muted); }
.kpi-tile .value { font-size:var(--fs-kpi); font-weight:var(--fw-kpi); color:var(--text-strong); line-height:1.2; }
.kpi-tile .delta { font-size:var(--fs-small); color:#2fa365; }  .kpi-tile .delta.neg { color:#c0394d; }
.kpi-tile .icon  { width:48px; height:48px; border-radius:var(--r-icon); display:grid; place-items:center; background:var(--tint-blue-100); color:#3b6fd1; }
/* tinted variant (Fleet/Drivers/Warehouses/Routes): gradient 50->100, strong coloured value, circle solid icon */
.kpi-tile.tint { padding:16px 24px; border-color:transparent; }
.kpi-tile.tint .icon { width:40px; height:40px; border-radius:50%; color:#fff; }
.kpi-tile.blue   { background:linear-gradient(135deg,var(--tint-blue-50),var(--tint-blue-100)); }   .kpi-tile.blue   .value{color:var(--on-blue)}   .kpi-tile.blue   .label{color:var(--label-blue)}   .kpi-tile.blue   .icon{background:var(--blue)}
.kpi-tile.green  { background:linear-gradient(135deg,var(--tint-green-50),var(--tint-green-100)); } .kpi-tile.green  .value{color:var(--on-green)}  .kpi-tile.green  .label{color:var(--label-green)}  .kpi-tile.green  .icon{background:var(--green)}
.kpi-tile.yellow { background:linear-gradient(135deg,var(--tint-yellow-50),var(--tint-yellow-100));} .kpi-tile.yellow .value{color:var(--on-yellow)} .kpi-tile.yellow .label{color:var(--label-yellow)} .kpi-tile.yellow .icon{background:var(--yellow)}
.kpi-tile.red    { background:linear-gradient(135deg,var(--tint-red-50),var(--tint-red-100)); }     .kpi-tile.red    .value{color:var(--on-red)}    .kpi-tile.red    .label{color:var(--label-red)}    .kpi-tile.red    .icon{background:var(--red)}
.kpi-tile.purple { background:linear-gradient(135deg,var(--tint-purple-50),var(--tint-purple-100));} .kpi-tile.purple .value{color:var(--on-purple)} .kpi-tile.purple .label{color:var(--label-purple)} .kpi-tile.purple .icon{background:var(--purple)}

/* ============================ chip ============================ */
.chip { display:inline-flex; align-items:center; height:22px; padding:0 10px; border-radius:var(--r-chip);
        font-size:var(--fs-small); font-weight:500; background:var(--chip-gray-bg); color:var(--chip-gray-fg); white-space:nowrap; }
.chip.green  { background:var(--chip-green-bg);  color:var(--chip-green-fg); }
.chip.blue   { background:var(--chip-blue-bg);   color:var(--chip-blue-fg); }
.chip.yellow { background:var(--chip-yellow-bg); color:var(--chip-yellow-fg); }
.chip.purple { background:var(--chip-purple-bg); color:var(--chip-purple-fg); }
.chip.red    { background:var(--chip-red-bg);    color:var(--chip-red-fg); }
.chip.gray   { background:var(--chip-gray-bg);   color:var(--chip-gray-fg); }
.dot { width:20px; height:20px; border-radius:50%; display:inline-block; }  /* health / HOS dot: 20px [M 15 vp] */
.dot.good { background:var(--dot-good); } .dot.warn { background:var(--dot-warn); } .dot.bad { background:var(--dot-bad); }

/* ============================ button ============================ */
.btn { display:inline-flex; align-items:center; gap:8px; height:40px; padding:0 16px; border:0; border-radius:var(--r-btn);
       font:500 var(--fs-body)/1 var(--font); cursor:pointer; background:var(--btn-grey-bg); color:var(--btn-grey-text); }
.btn.primary { background:var(--btn-blue);   color:#fff; }  .btn.primary:hover { background:var(--primary-hover); }
.btn.green   { background:var(--btn-green);  color:#fff; }
.btn.purple  { background:var(--btn-purple); color:#fff; }
.btn.orange  { background:var(--btn-orange); color:#fff; }
.btn.red     { background:var(--btn-red);    color:#fff; }
.btn.grey    { background:var(--btn-grey-bg);color:var(--btn-grey-text); }
.btn.dark    { background:var(--grey);       color:#fff; }
.btn.block   { height:72px; justify-content:center; width:100%; }   /* Quick Actions tiles */
.btn.sm      { height:28px; padding:0 10px; font-size:var(--fs-small); border-radius:var(--r-badge); }

/* ============================ inputs / filter row ============================ */
.filters { display:flex; flex-wrap:wrap; align-items:center; gap:16px; }
.filters label { font-size:var(--fs-small); font-weight:500; color:var(--text); }
.select, .search { height:40px; padding:0 16px; border:1px solid var(--border-input); border-radius:var(--r-input);
                   background:var(--bg-surface); font:var(--fs-body) var(--font); color:var(--text); }
.select:focus, .search:focus { outline:2px solid var(--primary); outline-offset:0; border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-ring); }
.clear-all { color:var(--text-muted); background:none; border:0; cursor:pointer; }   /* '× Clear All' */

/* ============================ table ============================ */
.table { width:100%; border-collapse:collapse; background:var(--bg-surface); }
.table th { position:sticky; top:0; background:var(--bg-page); text-align:left; padding:14px 16px; font-size:var(--fs-th);
            font-weight:var(--fw-th); letter-spacing:var(--ls-th); text-transform:uppercase; color:var(--text-muted); }
.table td { padding:12px 16px; border-top:1px solid var(--border); height:var(--row-h); vertical-align:middle; }
.table tr:hover td { background:var(--bg-hover); }
.table tr.is-selected td { background:var(--bg-selected); }
.table .sub { display:block; font-size:var(--fs-small); color:var(--text-faint); }
.table a { color:var(--link); font-weight:500; text-decoration:none; }

/* ============================ drawer ============================ */
.drawer { position:fixed; top:0; right:0; bottom:0; width:var(--drawer-w); background:var(--bg-surface);
          border-left:1px solid var(--border); box-shadow:var(--sh-drawer); z-index:30; overflow:auto;
          transform:translateX(100%); transition:transform .25s ease; }    /* NO scrim in the recording */
.drawer.open { transform:none; }
.drawer.xl { width:var(--drawer-w-xl); }
.drawer-head { display:flex; justify-content:space-between; align-items:center; padding:20px 24px; border-bottom:1px solid var(--border); font-weight:600; font-size:16px; color:var(--text-strong); }
.drawer-tabs { display:flex; gap:24px; padding:0 24px; border-bottom:1px solid var(--border); }
.drawer-tabs .tab { padding:12px 0; color:var(--text-muted); border-bottom:2px solid transparent; }
.drawer-tabs .tab.active { color:var(--primary); border-color:var(--primary); }
.drawer-section { padding:20px 24px; border-bottom:1px solid var(--border); }
.drawer-section h4 { margin:0 0 12px; font-size:16px; font-weight:600; color:var(--text-strong); }

/* ============================ misc ============================ */
.progress { height:8px; border-radius:999px; background:var(--bar-track); overflow:hidden; }
.progress > i { display:block; height:100%; border-radius:999px; background:var(--bar-ok); }
.progress.warn > i { background:var(--bar-warn); } .progress.crit > i { background:var(--bar-crit); } .progress.low > i { background:var(--bar-low); }
.avatar { width:36px; height:36px; border-radius:50%; display:inline-grid; place-items:center; color:#fff; font-size:12px; font-weight:600; }
.badge-count { min-width:18px; height:18px; border-radius:50%; background:var(--red); color:#fff; font-size:10px; display:inline-grid; place-items:center; } /* bell badge [M #e3616d..#df3149] */
.alert-card { border-radius:var(--r-btn); padding:16px; border:1px solid rgba(0,0,0,.04); }
.alert-card.risk { border-left:4px solid var(--alert-red-bd); }
.banner-ai { background:linear-gradient(90deg,var(--banner-from),var(--banner-to)); border-left:4px solid var(--banner-bd); padding:12px 24px; color:#92400e; }
.map { background:var(--map-land); border-radius:var(--r-card); position:relative; }

function assign(id, did, tid) {
  const l = load(id), d = drv(did), t = trk(tid);
  if (!l || !d || !t) return T('Выберите водителя и ТС', 'Fahrer und Fahrzeug wählen', 'Select driver and truck', 'Жүргізуші мен КҚ таңдаңыз');
  const why = compat(l, d, t); if (why.length) return why[0];
  l.driver = did; l.truck = tid; l.status = 'assigned'; d.status = 'busy'; t.status = 'busy';
  l.notes.push({ who: 'System', t: fdt(NOW).slice(-5), text: T('Назначено: ', 'Zugewiesen: ', 'Assigned: ', 'Тағайындалды: ') + d.name + ' / ' + t.plate });
  return null;

function autoAssign() {
  let ok = 0, fail = 0;
  const rank = { high: 0, medium: 1, low: 2 };
  S.loads.filter(l => l.status === 'unassigned').sort((a, b) => rank[a.priority] - rank[b.priority] || a.eta.localeCompare(b.eta)).forEach(l => {
    const ts = S.trucks.filter(t => t.zones.includes(l.zone)).sort((a, b) => a.cap - b.cap);
    const ds = S.drivers.slice().sort((a, b) => a.rto - b.rto);
    let done = false;
    for (const t of ts) { for (const d of ds) { if (!compat(l, d, t).length && !assign(l.id, d.id, t.id)) { done = true; break; } } if (done) break; }
    if (done) ok++; else fail++;
  });
  return { ok, fail };
}

${l.status === 'problem' ? `<div class="prob">${ic('alert', 14)} ${esc(T('Температура вне диапазона', 'Temperatur außerhalb Bereich', 'Temperature out of range', 'Температура диапазоннан тыс'))}</div>` : ''}
<div class="r2">${d ? `<span class="cell">${avatar(d.ini, 1)}<span>${esc(d.name.split(' ')[0])}</span><small>${esc(t.plate)}</small></span>` : `<span class="faint">${esc(T('не назначен', 'offen', 'unassigned', 'тағайындалмаған'))}</span>`}<b>${kzt(revenue(l))}</b></div></div>`;

  function planning() {
    const un = S.loads.filter(l => l.status === 'unassigned');
    const rows = Object.keys(ZONES).map(z => {
      const dem = un.filter(l => l.zone === z).reduce((s, l) => s + l.pallets, 0), n = un.filter(l => l.zone === z).length;

<div class="card tcard"><div class="card-head">${esc(T('Водители и время вождения (РТО)', 'Fahrer und Lenkzeit (RTO)', 'Drivers and driving time (RTO)', 'Жүргізушілер және жүргізу уақыты (РТО)'))}</div><table class="table"><thead><tr><th>${esc(T('Водитель', 'Fahrer', 'Driver', 'Жүргізуші'))}</th><th>${esc(T('Статус', 'Status', 'Status', 'Күйі'))}</th><th>${esc(T('Осталось', 'Verbleibend', 'Remaining', 'Қалды'))}</th></tr></thead><tbody>${dr}</tbody></table></div></div>`;

    dtab: d => { S.dispTab = d.v; render(); },

    actions: () => `<button class="btn green" data-act="auto">${ic('spark')} ${esc(T('Авто-назначение', 'Auto-Zuweisung', 'Auto-Assign', 'Авто-тағайындау'))}</button><button class="btn primary" data-act="create">${ic('plus')} ${esc(T('Создать рейс', 'Fahrt anlegen', 'Create New Load', 'Рейс құру'))}</button>`,
    body: () => `<div class="pill-tabs"><span class="pill-tab${S.dispTab === 'board' ? ' active' : ''}" data-act="dtab" data-v="board">${esc(T('Доска', 'Tafel', 'Board', 'Тақта'))}</span><span class="pill-tab${S.dispTab === 'planning' ? ' active' : ''}" data-act="dtab" data-v="planning">${esc(T('Планирование', 'Planung', 'Planning', 'Жоспарлау'))}</span></div>

  };
  /* drag & drop (HTML5) */
  let dragId = null;
  document.addEventListener('dragstart', e => { const c = e.target.closest && e.target.closest('.kcard'); if (c) { dragId = c.dataset.id; e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', dragId); } catch (_) {} } });
  document.addEventListener('dragover', e => { if (dragId && e.target.closest && e.target.closest('.col')) e.preventDefault(); });
  document.addEventListener('drop', e => {
    const col = e.target.closest && e.target.closest('.col'); if (!col || !dragId) return; e.preventDefault();

  });
})();

      a.href = URL.createObjectURL(new Blob(['﻿' + rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(';')).join('\n')], { type: 'text/csv' })); a.download = 'invoices.csv'; a.click(); },
    cAdd: () => openDrawer({ type: 'cost' }), cDel: (d, el, e) => { e.stopPropagation(); S.costs = S.costs.filter(c => c.id !== d.id); render(); },
    cSave: () => { const a = +$('#ca').value, t = $('#ct').value.trim(); if (!t || !(a > 0)) { $('#ce').textContent = T('Укажите описание и сумму', 'Beschreibung und Betrag angeben', 'Enter a description and an amount', 'Сипаттама мен соманы көрсетіңіз'); return; } S.costs.push({ id: 'C-' + (S.costs.length + 1), date: $('#cd').value, hub: $('#ch').value, text: t, amount: a, ref: '', cat: $('#cc').value }); S.drawer = null; toast(T('Затрата добавлена', 'Kosten erfasst', 'Cost added', 'Шығыс қосылды')); },
  });
  document.addEventListener('input', e => { const k = e.target.dataset && e.target.dataset.bf; if (k) { F[k] = e.target.value; render(); } });
})();

render();

</script></body></html>
