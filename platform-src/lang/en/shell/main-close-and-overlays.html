    </main>
  </div>

  <sc-if value="{{ contactOpen }}">
    <div data-contacts="1" role="dialog" aria-modal="true" aria-label="Partner contacts" style="position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:color-mix(in srgb, var(--color-neutral-900) 50%, transparent)">
      <div class="blueprint" style="width:min(520px,100%);background:var(--color-bg);padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow-lg)"><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
        <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><span style="display:flex;flex-direction:column;gap:2px"><span style="font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-accent-700)">{{ contact.typeL }} · {{ contact.city }}</span><span style="font-family:var(--font-heading);font-weight:600;font-size:22px">{{ contact.name }}</span><span style="font-size:12px;color:var(--color-neutral-700)">{{ contact.svc }}</span></span><span class="tag" style="justify-content:center;background:{{ contact.t.bg }};color:{{ contact.t.fg }};border:1px solid {{ contact.t.bc }};padding:1px 5px;font-size:10px;white-space:nowrap">{{ contact.tierL }}</span></div>
        <sc-for list="{{ contact.people }}" as="c"><div data-contact="1" style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--color-divider)">
          <span style="display:flex;flex-direction:column;gap:1px"><span style="font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:var(--color-neutral-700)">{{ c.role }}</span><span style="font-size:15px;font-weight:500">{{ c.name }}</span><span style="font-size:13px;font-variant-numeric:tabular-nums"><a href="{{ c.telHref }}">{{ c.tel }}</a> · mobile <a href="{{ c.mobHref }}">{{ c.mob }}</a></span></span>
          <button class="btn btn-primary" sc-camel-on-click="{{ c.call }}" style="font-size:12px;padding:6px 10px;white-space:nowrap">Call (simulation)</button>
        </div></sc-for>
        <div style="display:flex;justify-content:flex-end;gap:8px"><button class="btn btn-secondary" sc-camel-on-click="{{ copyContacts }}">Copy contacts</button><button class="btn btn-secondary" sc-camel-on-click="{{ closeContact }}">Close</button></div>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{ hasToast }}">
    <div style="position:fixed;right:24px;bottom:24px;padding:12px 16px;background:var(--color-accent-900);color:var(--color-bg);font-size:14px;box-shadow:var(--shadow-lg);max-width:360px">{{ toast }}</div>
  </sc-if>
</div>
</x-dc>
