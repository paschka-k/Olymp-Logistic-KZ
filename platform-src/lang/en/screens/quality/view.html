      <sc-if value="{{ is.quality }}">
        <section data-screen-label="Quality" style="display:flex;flex-direction:column;gap:22px">
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:24px;align-items:start">
            <div style="display:flex;flex-direction:column;gap:8px;min-width:0">
              <h3 style="margin:0;font-size:20px">Deviations</h3>
              <sc-for list="{{ devs }}" as="d"><button sc-camel-on-click="{{ d.select }}" style="display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px;text-align:left;padding:10px;cursor:pointer;color:var(--color-text);border:1px solid {{ d.bc }};background:{{ d.bg }}"><span class="tag" style="justify-content:center;background:{{ d.l.bg }};color:{{ d.l.fg }};border:1px solid {{ d.l.bc }};padding:1px 5px;font-size:10px;white-space:nowrap">{{ d.l.label }}</span><span style="display:flex;flex-direction:column;gap:2px"><span style="font-size:14px;font-weight:500">{{ d.title }}</span><span style="font-size:12px;color:var(--color-neutral-700)">{{ d.id }} · {{ d.text }}</span></span></button></sc-for>
            </div>
            <div class="blueprint" style="padding:18px;display:flex;flex-direction:column;gap:10px">
              <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
              <span style="display:flex;align-items:center;gap:6px;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-accent-700)">Deviation process · {{ dev.id }} <span style="position:relative;display:inline-flex;vertical-align:middle"><span sc-camel-on-mouse-enter="{{ tips.capa.on }}" sc-camel-on-mouse-leave="{{ tipOff }}" style="width:17px;height:17px;border:1px solid var(--color-accent);color:var(--color-accent-700);font-size:11px;font-family:var(--font-body);display:inline-flex;align-items:center;justify-content:center;cursor:help">?</span><sc-if value="{{ tips.capa.show }}"><span style="position:absolute;top:24px;left:-8px;z-index:30;width:300px;padding:10px 12px;background:var(--color-bg);border:1px solid var(--color-accent);box-shadow:var(--shadow-md);font-size:12px;line-height:1.45;color:var(--color-text);text-transform:none;letter-spacing:0;font-weight:400;font-family:var(--font-body);white-space:normal">{{ tips.capa.text }}</span></sc-if></span></span>
              <h3 style="margin:0;font-size:22px">{{ dev.title }}</h3>
              <sc-for list="{{ qaSteps }}" as="q"><div style="display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:center;font-size:14px"><span style="width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:11px;border:1px solid {{ q.bc }};background:{{ q.fill }};color:{{ q.fg }}">{{ q.n }}</span><span style="color:{{ q.tfg }}">{{ q.t }}</span></div></sc-for>
              <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:4px">
                <sc-if value="{{ canNext }}"><button class="btn btn-primary" sc-camel-on-click="{{ qaNext }}">Next step</button></sc-if>
                <sc-if value="{{ atDecision }}"><button class="btn btn-primary" sc-camel-on-click="{{ qaRelease }}">Release goods</button><button class="btn btn-secondary" sc-camel-on-click="{{ qaBlock }}">Block (quarantine)</button></sc-if>
                <sc-if value="{{ qaDone }}"><span style="font-size:13px;color:var(--color-accent-800)">Deviation closed · report for KDL Olymp ready</span></sc-if>
              </div>
              <div style="padding:10px 12px;background:var(--color-accent-100);color:var(--color-accent-900);font-size:13px"><b style="font-weight:500">CAPA:</b> {{ dev.capa }}</div>
            </div>
          </div>
          <div style="display:flex;flex-direction:column;gap:6px">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h3 style="margin:0;font-size:20px">Logger calibration register</h3><button class="btn btn-secondary" sc-camel-on-click="{{ orderCalib }}" style="font-size:12px">Order calibration L-2208</button></div>
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px">
              <sc-for list="{{ loggers }}" as="g"><div style="display:flex;flex-direction:column;gap:2px;padding:10px;border:1px solid {{ g.l.bc }};background:{{ g.l.bgSoft }}"><span style="display:flex;justify-content:space-between"><span style="font-family:var(--font-heading);font-weight:600;font-size:16px">{{ g.id }}</span><span class="tag" style="justify-content:center;background:{{ g.l.bg }};color:{{ g.l.fg }};border:1px solid {{ g.l.bc }};padding:1px 5px;font-size:10px;white-space:nowrap">{{ g.st }}</span></span><span style="font-size:12px;color:var(--color-neutral-700)">{{ g.veh }} · until {{ g.calib }} · certificate in system</span></div></sc-for>
            </div>
          </div>
        </section>
      </sc-if>
