  <div style="display:flex;flex-direction:column;min-width:0">
    <header style="display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:16px 28px;border-bottom:1px solid var(--color-divider)">
      <div style="display:flex;flex-direction:column;gap:4px;margin-right:auto;min-width:260px">
        <span style="font-size:11px;line-height:1.3;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-accent-700)">{{ screenCode }} · {{ screenSub }}</span>
        <h1 style="margin:0;font-size:30px">{{ screenTitle }}</h1>
      </div>
      <div style="position:relative;width:360px;max-width:100%;display:flex;gap:4px">
        <button sc-camel-on-click="{{ toggleScan }}" aria-pressed="{{ scanPressed }}" aria-label="Режим сканера штрихкода" style="font-size:12px;padding:0 10px;height:36px;white-space:nowrap;cursor:pointer;border:1px solid var(--color-accent);background:{{ scanBg }};color:{{ scanFg }}">{{ scanLabel }}</button>
        <input data-search="1" value="{{ q }}" sc-camel-on-change="{{ onQ }}" sc-camel-on-key-down="{{ onQKey }}" role="combobox" aria-label="Поиск по отправкам" aria-expanded="{{ hasQ }}" aria-controls="olymp-search-results" placeholder="{{ qPlaceholder }}" style="flex:1;min-width:0;box-sizing:border-box;height:36px;padding:6px 10px;font-family:var(--font-body);font-size:13px;border:1px solid var(--color-divider);background:var(--color-surface);color:var(--color-text)">
        <sc-if value="{{ hasQ }}">
          <div data-search-results="1" id="olymp-search-results" role="listbox" style="position:absolute;top:40px;left:0;width:440px;max-width:90vw;z-index:40;background:var(--color-bg);border:1px solid var(--color-accent);box-shadow:var(--shadow-lg);max-height:440px;overflow-y:auto">
            <div style="padding:6px 10px;font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:var(--color-neutral-700);border-bottom:1px solid var(--color-divider)"><span style="display:flex;justify-content:space-between;gap:8px;align-items:center"><span>{{ qCount }}</span><button sc-camel-on-click="{{ toggleArch }}" aria-pressed="{{ qArch }}" style="display:flex;align-items:center;gap:5px;font-size:11px;border:0;background:transparent;cursor:pointer;color:var(--color-text);text-transform:none;letter-spacing:0"><span style="width:12px;height:12px;border:1.5px solid var(--color-accent);background:{{ archBox }}"></span>включая доставленные</button></span></div>
            <sc-for list="{{ qRes }}" as="r"><button sc-camel-on-click="{{ r.go }}" role="option" aria-selected="{{ r.active }}" data-active="{{ r.active }}" style="outline:{{ r.ol }};display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;padding:8px 10px;border:0;border-bottom:1px solid var(--color-divider);background:{{ r.bg }};cursor:pointer;color:var(--color-text)">
              <span style="display:flex;gap:10px;align-items:flex-start"><span data-mlogo="{{ r.mAb }}" title="{{ r.mName }}" style="width:30px;height:30px;flex:none;display:flex;align-items:center;justify-content:center;border:1px solid var(--color-accent);background:var(--color-accent-100);color:var(--color-accent-900);font-family:var(--font-heading);font-weight:600;font-size:11px;line-height:1">{{ r.mAb }}</span><span style="display:flex;flex-direction:column;gap:2px;flex:1;min-width:0"><span style="display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--color-accent-700)"><span>{{ r.field }}: {{ r.hit }}</span><span>{{ r.trip }} · {{ r.veh }} · {{ r.status }}</span></span>
              <span style="font-size:13px;font-weight:500">{{ r.name }}</span>
              <span style="font-size:11px;color:var(--color-neutral-700)">{{ r.art }} · LOT {{ r.lot }} · {{ r.qty }} → {{ r.to }} · {{ r.where }}</span></span></span>
            </button></sc-for>
            <sc-if value="{{ noQ }}"><div style="padding:10px;font-size:13px;color:var(--color-neutral-700)">Ничего не найдено в текущих отправках</div></sc-if>
          </div>
        </sc-if>
      </div>
      <div style="display:flex;border:1px solid var(--color-divider)">
        <sc-for list="{{ hubOpts }}" as="h" hint-placeholder-count="3">
          <button sc-camel-on-click="{{ h.go }}" style="font-size:13px;padding:7px 12px;border:0;border-right:1px solid var(--color-divider);white-space:nowrap;cursor:pointer;background:{{ h.bg }};color:{{ h.fg }}">{{ h.label }}</button>
        </sc-for>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;font-size:12px;color:var(--color-neutral-700)">
        <span style="font-family:var(--font-heading);font-weight:600;font-size:20px;color:var(--color-text)">{{ clock }}</span>
        <span>Вт 06.10.2026 · Астана UTC+5</span>
      </div>
      <button sc-camel-on-click="{{ goOverview }}" style="display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid {{ alertBtnBc }};cursor:pointer;background:{{ alertBtnBg }};color:{{ alertBtnFg }};font-size:13px;white-space:nowrap"><span style="font-family:var(--font-heading);font-weight:600;font-size:18px">{{ alertCount }}</span>активных тревог</button>
    </header>
