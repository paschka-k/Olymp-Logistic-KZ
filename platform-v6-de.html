<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Olymp Logistic KZ · Platform v6 (de)</title><style>
/* ==========================================================================
   part-D-tokens.css  -  FleetFlow-style design tokens (light theme)
   Source: pixel measurements of 2026-10-18_SampleStructure_Aufzeichnung.mp4
   [M] = measured from frames (video colours drift +-6 per channel; saturated
         colours are ~5% darker than their Tailwind equivalents)
   [I] = inferred (Tailwind-like scale, thin text colours, sizes)
   All lengths are CSS px at design scale 1:1. The video shows the app at
   ~0.76x (1296 recorded px = ~1705 CSS px), so values = video px / 0.76,
   snapped to a 4px grid.  [I]
   ========================================================================== */
:root {
  /* ---- surfaces ---- */
  --bg-page:        #f9fafb;  /* [M #faf9fc] content area behind cards, table header */
  --bg-surface:     #ffffff;  /* [M] sidebar, top bar, cards, drawer, table rows */
  --bg-subtle:      #f3f4f6;  /* [M #f3f3f5] grey button, count badges, 'Data source' chip */
  --bg-selected:    #eff6ff;  /* [M #eff5ff] selected table row, blue alert */
  --bg-hover:       #f9fafb;  /* [M #f7f9fb] hovered table row */
  --border:         #f3f4f6;  /* [M #f3f3f3] sidebar/topbar/card hairlines */
  --border-input:   #e5e7eb;  /* [M ~#e5e5e9] input/select border, progress track, dashed drop zone */

  /* ---- text ---- */
  --text-strong:    #111827;  /* [M #0b0b0e] KPI value, page title */
  --text:           #374151;  /* [I] table body, nav inactive */
  --text-muted:     #6b7280;  /* [I] KPI label, sub-lines, table header caps */
  --text-faint:     #9ca3af;  /* [I] placeholder, 'Not assigned', captions */
  --link:           #2f66c8;  /* [I] Load ID links (thin text looks lighter than it is) */

  /* ---- brand / primary ---- */
  --primary:        #3b82f6;  /* [M #4381ed] active nav pill, primary button, tab, pagination */
  --primary-hover:  #2563eb;  /* [I] */
  --primary-tint:   #dbeafe;  /* [M #dbe9fb] icon badge bg, 'Assigned' chip bg */
  --primary-ring:   #93c5fd;  /* [I] focused select/input ring */
  --on-primary:     #ffffff;

  /* ---- solid accents (icon badges, dots, bars, small buttons) ---- */
  --blue:    #3b82f6;  /* [M #4581eb] */
  --green:   #33d965;  /* [M #33d965] progress fill, icon badge, Accept btn, map 'on time' dot */
  --yellow:  #e1b917;  /* [M #e1b917] icon badge, Override btn, progress warn, delayed dot */
  --red:     #df3149;  /* [M #df3149] icon badge, PDF btn, critical dot */
  --purple:  #9f45ed;  /* [M #9f45ed] icon badge */
  --orange:  #f97316;  /* [I] orange icon badge (fuel KPI measured #d59471 inside pastel) */
  --grey:    #6f737d;  /* [M] Dismiss button */

  /* ---- solid action buttons (large, Quick Actions / header CTAs) ---- */
  --btn-blue:       #4381ed;  /* [M] */
  --btn-green:      #1fcd83;  /* [M] 'Auto-Assign', 'Schedule Maintenance', 'Compliance Report', 'Assign Driver' */
  --btn-purple:     #8d1de5;  /* [M] 'Generate Invoice' */
  --btn-orange:     #dd4d11;  /* [M] 'Plan Route' */
  --btn-red:        #df3147;  /* [M] 'Export PDF' */
  --btn-grey-bg:    #f3f4f6;  /* [M #f3f3f5] 'Import Loads', 'Export Data', 'View History' */
  --btn-grey-text:  #4b5563;  /* [I] */

  /* ---- pastel tints: [bg-from (50) , bg-to (100)] for KPI gradient tiles, [text-strong 900], [label 600] ---- */
  --tint-blue-50:   #eff6ff; --tint-blue-100:   #dbeafe;  /* [M #eaf2fb -> #dce9fa] */
  --tint-green-50:  #f0fdf4; --tint-green-100:  #dcfce7;  /* [M #ecfdf3 -> #e0fee9] */
  --tint-yellow-50: #fefce8; --tint-yellow-100: #fef9c3;  /* [M #fcfcde -> #fcfac9] */
  --tint-red-50:    #fef2f2; --tint-red-100:    #ffe4e6;  /* [M #fcebec -> #f9dfe3] */
  --tint-purple-50: #faf5ff; --tint-purple-100: #f3e8ff;  /* [M #f6effd -> #f0e6fb] */
  --tint-orange-100:#ffedd5;                              /* [M #fbebd7] */
  --tint-gray-100:  #f3f4f6;                              /* [M] */
  --on-blue:   #1e3a8a;  --label-blue:   #3b6fd1;         /* [M value #262e63] */
  --on-green:  #14532d;  --label-green:  #2a9d52;         /* [M value #265333] */
  --on-yellow: #713f12;  --label-yellow: #a16207;         /* [I] */
  --on-red:    #7f1d1d;  --label-red:    #c0394d;         /* [I] */
  --on-purple: #581c87;  --label-purple: #7e3fbf;         /* [M value #42195b] */

  /* ---- status chips: bg [M] / text [I = 800 shade] ---- */
  --chip-green-bg:  #dcfce7;  --chip-green-fg:  #166534;  /* In Transit, Available, Active, On Time, Approved/Paid, Valid, Low(prio) */
  --chip-blue-bg:   #dbeafe;  --chip-blue-fg:   #1e40af;  /* Assigned, Submitted */
  --chip-yellow-bg: #fef9c3;  --chip-yellow-fg: #854d0e;  /* Loading, In Use, Pending, On Trip, Maintenance(wh), Delayed, Medium(prio), Review soon */
  --chip-purple-bg: #f3e8ff;  --chip-purple-fg: #6b21a8;  /* Delivered */
  --chip-red-bg:    #ffe4e6;  --chip-red-fg:    #be123c;  /* Critical, Maintenance(fleet), Overdue, Rejected, High(prio), Blocked */
  --chip-gray-bg:   #f3f4f6;  --chip-gray-fg:   #4b5563;  /* Unassigned, Off Duty, Pending Upload, counts */

  /* ---- health / risk dots ---- */
  --dot-good:  #6de38f;  /* [M #5fe587 fleet / #6de38f HOS] */
  --dot-warn:  #e9cb59;  /* [M] */
  --dot-bad:   #dd4359;  /* [M HOS red; fleet 'critical' is pale #f3c1c9] */
  --dot-bad-soft: #f3c1c9; /* [M] */

  /* ---- progress / utilisation thresholds (Warehouses) ---- */
  --bar-track: #e5e7eb;  /* [M #e5e5e9] */
  --bar-ok:    #35d567;  /* [M] <~75 % */
  --bar-warn:  #dfbb17;  /* [M] ~85-90 % (87.3 %) */
  --bar-crit:  #d1374b;  /* [M] >~90 % (94.8 %) */
  --bar-low:   #4583e7;  /* [M] <50 % (45.2 %, maintenance site) */

  /* ---- map ---- */
  --map-land:   #e5e3df;  /* [M] Google-Maps-like standard tiles */
  --map-park:   #cfe7bf;  /* [M] */
  --map-water:  #80d1e4;  /* [M] */
  --map-road:   #ffffff;  /* [M] minor roads; motorway #e8d576 [M], routes in Routes page: yellow #f2c94c [I] */
  --mk-blue:    #2f61dd; --mk-green: #25b753; --mk-orange: #d95117;
  --mk-red:     #c9172f; --mk-purple: #891fdf; --mk-teal: #1ba183;   /* [M] round markers, white icon */
  --mk-status-green: #37d969; --mk-status-yellow: #dfbb17;           /* [M] corner dot, 8px */

  /* ---- chart palette (Reports) ---- */
  --chart-line: #5aa8d0;  --chart-area: #e8f2fb;   /* [M approx] sky line + gradient area */
  --chart-mint: #94dcc4;  --chart-sky: #5cbce4;    /* [M] stacked bars */
  --chart-amber:#f4bc74;  --chart-blue: #4484ec;   /* [M] */
  --chart-grid: #e5e7eb;                           /* [I] */

  /* ---- avatars (initials, customer colour) ---- */
  --av-1:#315fd1; --av-2:#c7152f; --av-3:#d5511d; --av-4:#8921db;
  --av-5:#1fa183; --av-6:#533bd9; --av-7:#23b553; --av-8:#c7116f;  /* [M] */

  /* ---- alert cards (dashboard, [M] bg) + left border (AI page, [M]) ---- */
  --alert-red-bg:#fef2f2;    --alert-red-fg:#9b1c31;    --alert-red-bd:#970f25;
  --alert-orange-bg:#fff7ed; --alert-orange-fg:#9a3412;
  --alert-blue-bg:#eff6ff;   --alert-blue-fg:#1e3a8a;
  --alert-yellow-bg:#fefce8; --alert-yellow-fg:#854d0e;
  --banner-from:#fef3c7; --banner-to:#fcd9a8; --banner-bd:#d3a739;   /* [M #fdf3c9 -> #fbdbb1], AI disclaimer strip */

  /* ---- radii ---- */
  --r-card:   12px;  /* [M ~9 video px] cards, KPI tiles, drawer sections */
  --r-btn:    10px;  /* [M] buttons, top-bar selects */
  --r-input:  999px; /* [M] filter pill selects, search box, nav pill is 14px */
  --r-nav:    14px;  /* [M] sidebar active pill (28 px high in video -> near full pill) */
  --r-chip:   999px; /* [M] status & priority chips, count badges */
  --r-icon:   12px;  /* [M] KPI icon badge (rounded square); Fleet-style tinted tiles use circle 999px */
  --r-badge:  6px;   /* [I] small PDF/CSV buttons */

  /* ---- shadows ---- */
  --sh-card:  0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);   /* [M subtle 2-3px darker edge] */
  --sh-hover: 0 10px 15px -3px rgba(0,0,0,.10), 0 4px 6px -4px rgba(0,0,0,.06); /* [M] warehouse card hover/selected */
  --sh-pop:   0 4px 12px rgba(0,0,0,.12);                             /* [M] map legend / stat strip */
  --sh-drawer: -8px 0 24px rgba(0,0,0,.08);                           /* [I] left shadow, no scrim */

  /* ---- layout (CSS px @1x) ---- */
  --sidebar-w:  256px;  /* [M 194 video px] */
  --topbar-h:   80px;   /* [M 60 video px] */
  --page-pad:   24px;   /* [M 18 video px] */
  --gap:        24px;   /* [M 19 video px] KPI/card gap */
  --drawer-w:   384px;  /* [M 280 video px] standard detail drawer */
  --drawer-w-xl:840px;  /* [M 641 video px] Reports 'detailed view' */
  --nav-h:      37px;   /* [M 28 video px] */  --nav-pitch: 41px;
  --row-h:      70px;   /* [M orders 53 vp] fleet 74, billing 78, drivers 90 */
  --kpi-h:      125px;  /* [M dashboard tiles 95 vp]; tinted tiles 85 [M 64 vp] */

  /* ---- type ---- */
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;  /* [I] */
  --fs-title: 24px; --fw-title: 700;   /* page title [M cap-height 13 vp] */
  --fs-card:  18px; --fw-card: 600;    /* card title 'Live Operations' */
  --fs-kpi:   30px; --fw-kpi: 700;     /* [M] */
  --fs-body:  14px;                    /* table cells, nav, buttons */
  --fs-small: 12px;                    /* captions, chips, KPI sublines */
  --fs-th:    12px; --fw-th: 500; --ls-th: .05em;  /* TABLE HEADER CAPS */
}

/* ==========================================================================
   Olymp Logistic KZ additions (spec v1.0 §6) - cold chain, ESF, zones
   ========================================================================== */
:root {
  /* temperature status */
  --temp-ok:     #35d567;  --temp-ok-bg:     #dcfce7;
  --temp-warn:   #dfbb17;  --temp-warn-bg:   #fef9c3;
  --temp-breach: #d1374b;  --temp-breach-bg: #ffe4e6;
  /* temperature zones (muted so status colours stay dominant) */
  --zone-frozen:  #60a5fa;  --zone-frozen-bg:  #eff6ff;   /* -18 C */
  --zone-chilled: #2dd4bf;  --zone-chilled-bg: #f0fdfa;   /* 0..+4 C */
  --zone-pharma:  #a78bfa;  --zone-pharma-bg:  #f5f3ff;   /* +2..+8 C */
  --zone-ambient: #a8a29e;  --zone-ambient-bg: #f5f5f4;   /* +15..+25 C */
  /* ESF / ESUTD document state chips reuse chip-* pairs: issued=blue, confirmed=green, rejected=red, draft=gray */
  --step-done: #23cb85; --step-current: #4581eb; --step-failed: #c71531; --step-todo: #e7e7e9;
  --risk-high-bg:#fbdfe1;   --risk-high-bd:#970f25;
  --risk-mid-bg:#fdf3c9;    --risk-mid-bd:#d0a02c;
  --risk-low-bg:#dfffe7;    --risk-low-bd:#33a25b;
  --drawer-w-report: var(--drawer-w-xl);
}

/* ============================ base ============================ */
* { box-sizing: border-box; }
body { margin:0; font-family:var(--font); font-size:var(--fs-body); color:var(--text); background:var(--bg-page); }

/* ============================ shell ============================ */
.app { display:grid; grid-template-columns:var(--sidebar-w) 1fr; min-height:100vh; }
.sidebar { position:sticky; top:0; height:100vh; background:var(--bg-surface); border-right:1px solid var(--border); padding:16px; }
.topbar  { position:sticky; top:0; z-index:20; height:var(--topbar-h); background:var(--bg-surface);
           border-bottom:1px solid var(--border); display:flex; align-items:center; gap:16px; padding:0 var(--page-pad); }
.page-head { position:sticky; top:var(--topbar-h); z-index:10; background:var(--bg-surface); border-bottom:1px solid var(--border); padding:16px var(--page-pad); }
.page-title { font-size:var(--fs-title); font-weight:var(--fw-title); color:var(--text-strong); margin:0; }
.content { padding:var(--page-pad); display:flex; flex-direction:column; gap:var(--gap); }

/* ============================ nav ============================ */
.nav-item { display:flex; align-items:center; gap:12px; height:var(--nav-h); padding:0 12px; margin-bottom:4px;
            border-radius:var(--r-nav); color:var(--text); font-weight:500; cursor:pointer; }
.nav-item:hover  { background:var(--bg-subtle); }
.nav-item.active { background:var(--primary); color:var(--on-primary); }
.nav-item svg { width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.75; }  /* line icons, ~Lucide */


/* ============================ card ============================ */
.card { background:var(--bg-surface); border:1px solid var(--border); border-radius:var(--r-card); box-shadow:var(--sh-card); }
.card-head { padding:20px 24px; border-bottom:1px solid var(--border); font-size:var(--fs-card); font-weight:var(--fw-card); color:var(--text-strong); }
.card-body { padding:24px; }
.card.is-selected, .card:hover.is-hoverable { box-shadow:var(--sh-hover); }

/* ============================ KPI tile ============================ */
.kpi-row  { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:var(--gap); }
.kpi-tile { display:flex; justify-content:space-between; align-items:center; padding:20px 24px;
            background:var(--bg-surface); border:1px solid var(--border); border-radius:var(--r-card); box-shadow:var(--sh-card); }
.kpi-tile .label { font-size:var(--fs-body); color:var(--text-muted); }
.kpi-tile .value { font-size:var(--fs-kpi); font-weight:var(--fw-kpi); color:var(--text-strong); line-height:1.2; }
.kpi-tile .delta { font-size:var(--fs-small); color:#2fa365; }  .kpi-tile .delta.neg { color:#c0394d; }
.kpi-tile .icon  { width:48px; height:48px; border-radius:var(--r-icon); display:grid; place-items:center; background:var(--tint-blue-100); color:#3b6fd1; }
/* tinted variant (Fleet/Drivers/Warehouses/Routes): gradient 50->100, strong coloured value, circle solid icon */
.kpi-tile.tint { padding:16px 24px; border-color:transparent; }
.kpi-tile.tint .icon { width:40px; height:40px; border-radius:50%; color:#fff; }
.kpi-tile.blue   { background:linear-gradient(135deg,var(--tint-blue-50),var(--tint-blue-100)); }   .kpi-tile.blue   .value{color:var(--on-blue)}   .kpi-tile.blue   .label{color:var(--label-blue)}   .kpi-tile.blue   .icon{background:var(--blue)}
.kpi-tile.green  { background:linear-gradient(135deg,var(--tint-green-50),var(--tint-green-100)); } .kpi-tile.green  .value{color:var(--on-green)}  .kpi-tile.green  .label{color:var(--label-green)}  .kpi-tile.green  .icon{background:var(--green)}
.kpi-tile.yellow { background:linear-gradient(135deg,var(--tint-yellow-50),var(--tint-yellow-100));} .kpi-tile.yellow .value{color:var(--on-yellow)} .kpi-tile.yellow .label{color:var(--label-yellow)} .kpi-tile.yellow .icon{background:var(--yellow)}
.kpi-tile.red    { background:linear-gradient(135deg,var(--tint-red-50),var(--tint-red-100)); }     .kpi-tile.red    .value{color:var(--on-red)}    .kpi-tile.red    .label{color:var(--label-red)}    .kpi-tile.red    .icon{background:var(--red)}
.kpi-tile.purple { background:linear-gradient(135deg,var(--tint-purple-50),var(--tint-purple-100));} .kpi-tile.purple .value{color:var(--on-purple)} .kpi-tile.purple .label{color:var(--label-purple)} .kpi-tile.purple .icon{background:var(--purple)}

/* ============================ chip ============================ */
.chip { display:inline-flex; align-items:center; height:22px; padding:0 10px; border-radius:var(--r-chip);
        font-size:var(--fs-small); font-weight:500; background:var(--chip-gray-bg); color:var(--chip-gray-fg); white-space:nowrap; }
.chip.green  { background:var(--chip-green-bg);  color:var(--chip-green-fg); }
.chip.blue   { background:var(--chip-blue-bg);   color:var(--chip-blue-fg); }
.chip.yellow { background:var(--chip-yellow-bg); color:var(--chip-yellow-fg); }
.chip.purple { background:var(--chip-purple-bg); color:var(--chip-purple-fg); }
.chip.red    { background:var(--chip-red-bg);    color:var(--chip-red-fg); }
.chip.gray   { background:var(--chip-gray-bg);   color:var(--chip-gray-fg); }
.dot { width:20px; height:20px; border-radius:50%; display:inline-block; }  /* health / HOS dot: 20px [M 15 vp] */
.dot.good { background:var(--dot-good); } .dot.warn { background:var(--dot-warn); } .dot.bad { background:var(--dot-bad); }

/* ============================ button ============================ */
.btn { display:inline-flex; align-items:center; gap:8px; height:40px; padding:0 16px; border:0; border-radius:var(--r-btn);
       font:500 var(--fs-body)/1 var(--font); cursor:pointer; background:var(--btn-grey-bg); color:var(--btn-grey-text); }
.btn.primary { background:var(--btn-blue);   color:#fff; }  .btn.primary:hover { background:var(--primary-hover); }
.btn.green   { background:var(--btn-green);  color:#fff; }
.btn.purple  { background:var(--btn-purple); color:#fff; }
.btn.orange  { background:var(--btn-orange); color:#fff; }
.btn.red     { background:var(--btn-red);    color:#fff; }
.btn.grey    { background:var(--btn-grey-bg);color:var(--btn-grey-text); }
.btn.dark    { background:var(--grey);       color:#fff; }
.btn.block   { height:72px; justify-content:center; width:100%; }   /* Quick Actions tiles */
.btn.sm      { height:28px; padding:0 10px; font-size:var(--fs-small); border-radius:var(--r-badge); }

/* ============================ inputs / filter row ============================ */
.filters { display:flex; flex-wrap:wrap; align-items:center; gap:16px; }
.filters label { font-size:var(--fs-small); font-weight:500; color:var(--text); }
.select, .search { height:40px; padding:0 16px; border:1px solid var(--border-input); border-radius:var(--r-input);
                   background:var(--bg-surface); font:var(--fs-body) var(--font); color:var(--text); }
.select:focus, .search:focus { outline:2px solid var(--primary); outline-offset:0; border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-ring); }
.clear-all { color:var(--text-muted); background:none; border:0; cursor:pointer; }   /* '× Clear All' */

/* ============================ table ============================ */
.table { width:100%; border-collapse:collapse; background:var(--bg-surface); }
.table th { position:sticky; top:0; background:var(--bg-page); text-align:left; padding:14px 16px; font-size:var(--fs-th);
            font-weight:var(--fw-th); letter-spacing:var(--ls-th); text-transform:uppercase; color:var(--text-muted); }
.table td { padding:12px 16px; border-top:1px solid var(--border); height:var(--row-h); vertical-align:middle; }
.table tr:hover td { background:var(--bg-hover); }
.table tr.is-selected td { background:var(--bg-selected); }
.table .sub { display:block; font-size:var(--fs-small); color:var(--text-faint); }
.table a { color:var(--link); font-weight:500; text-decoration:none; }

/* ============================ drawer ============================ */
.drawer { position:fixed; top:0; right:0; bottom:0; width:var(--drawer-w); background:var(--bg-surface);
          border-left:1px solid var(--border); box-shadow:var(--sh-drawer); z-index:30; overflow:auto;
          transform:translateX(100%); transition:transform .25s ease; }    /* NO scrim in the recording */
.drawer.open { transform:none; }
.drawer.xl { width:var(--drawer-w-xl); }
.drawer-head { display:flex; justify-content:space-between; align-items:center; padding:20px 24px; border-bottom:1px solid var(--border); font-weight:600; font-size:16px; color:var(--text-strong); }
.drawer-tabs { display:flex; gap:24px; padding:0 24px; border-bottom:1px solid var(--border); }
.drawer-tabs .tab { padding:12px 0; color:var(--text-muted); border-bottom:2px solid transparent; }
.drawer-tabs .tab.active { color:var(--primary); border-color:var(--primary); }
.drawer-section { padding:20px 24px; border-bottom:1px solid var(--border); }
.drawer-section h4 { margin:0 0 12px; font-size:16px; font-weight:600; color:var(--text-strong); }

/* ============================ misc ============================ */
.progress { height:8px; border-radius:999px; background:var(--bar-track); overflow:hidden; }
.progress > i { display:block; height:100%; border-radius:999px; background:var(--bar-ok); }
.progress.warn > i { background:var(--bar-warn); } .progress.crit > i { background:var(--bar-crit); } .progress.low > i { background:var(--bar-low); }
.avatar { width:36px; height:36px; border-radius:50%; display:inline-grid; place-items:center; color:#fff; font-size:12px; font-weight:600; }
.badge-count { min-width:18px; height:18px; border-radius:50%; background:var(--red); color:#fff; font-size:10px; display:inline-grid; place-items:center; } /* bell badge [M #e3616d..#df3149] */
.alert-card { border-radius:var(--r-btn); padding:16px; border:1px solid rgba(0,0,0,.04); }
.alert-card.risk { border-left:4px solid var(--alert-red-bd); }
.banner-ai { background:linear-gradient(90deg,var(--banner-from),var(--banner-to)); border-left:4px solid var(--banner-bd); padding:12px 24px; color:#92400e; }
.map { background:var(--map-land); border-radius:var(--r-card); position:relative; }

.marker-label { background:#fff; border-radius:6px; padding:1px 6px; font-size:11px; box-shadow:var(--sh-pop); }

/* Components added by spec v1.0 section 4.1 (not in part-D-tokens.css). Uses tokens.css only. */
.page-head .actions { display:flex; gap:12px; align-items:center; }
.page-sub { color:var(--text-muted); font-size:var(--fs-body); margin:4px 0 0; }
.page-head.stuck { box-shadow:0 1px 0 var(--border); }

/* KPI variant A icon badge (white tile) */
.kpi-tile .icon { width:48px; height:48px; border-radius:var(--r-icon); display:grid; place-items:center; }

/* utilisation / threshold bar: ok(default) warn crit low */
.progress > i { display:block; height:100%; border-radius:999px; background:var(--bar-ok); }
.progress.warn > i { background:var(--bar-warn); } .progress.crit > i { background:var(--bar-crit); } .progress.low > i { background:var(--bar-low); }
/* zone bar: several segments in one track */
.zonebar { display:flex; height:8px; border-radius:999px; overflow:hidden; background:var(--bar-track); gap:2px; }
.zonebar > i { display:block; height:100%; }
.zonebar .z-frozen{background:var(--zone-frozen)} .zonebar .z-chilled{background:var(--zone-chilled)}
.zonebar .z-pharma{background:var(--zone-pharma)} .zonebar .z-ambient{background:var(--zone-ambient)}

/* hub card (spec 5.7) */
.hub-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:var(--gap); }
.hub-card { background:var(--bg-surface); border:1px solid var(--border); border-radius:var(--r-card); box-shadow:var(--sh-card); padding:24px; cursor:pointer; transition:box-shadow .15s; }
.hub-card:hover { box-shadow:var(--sh-hover); }
.hub-card.is-selected { outline:2px solid var(--primary); outline-offset:-2px; }
.hub-card .row { display:flex; justify-content:space-between; align-items:center; }
.hub-card h4 { margin:0; font-size:16px; font-weight:600; color:var(--text-strong); }
.hub-card .addr { color:var(--text-faint); font-size:var(--fs-small); margin:4px 0 16px; }
.mini-tiles { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin:16px 0; }
.mini-tile { border-radius:var(--r-btn); padding:12px 8px; text-align:center; }
.mini-tile b { display:block; font-size:20px; font-weight:600; }
.mini-tile small { font-size:var(--fs-small); color:var(--text-muted); }
.mini-tile.blue{background:var(--tint-blue-50);color:var(--on-blue)} .mini-tile.green{background:var(--tint-green-50);color:var(--on-green)} .mini-tile.purple{background:var(--tint-purple-50);color:var(--on-purple)}
.hub-card .foot { text-align:center; font-weight:600; font-size:var(--fs-small); color:var(--text); margin-top:12px; }

/* temperature chip / zone chip */
.chip.temp-ok{background:var(--temp-ok-bg);color:var(--chip-green-fg)} .chip.temp-warn{background:var(--temp-warn-bg);color:var(--chip-yellow-fg)} .chip.temp-breach{background:var(--temp-breach-bg);color:var(--chip-red-fg)}

/* step dots (POD 3-4 steps) */
.steps { display:inline-flex; align-items:center; }
.steps i { width:8px; height:8px; border-radius:50%; background:var(--step-todo); display:block; }
.steps i + i { margin-left:14px; position:relative; }
.steps i + i::before { content:""; position:absolute; right:8px; top:3px; width:14px; height:2px; background:var(--step-todo); }
.steps i.done { background:var(--step-done); } .steps i.current { background:var(--step-current); } .steps i.failed { background:var(--step-failed); }
.steps i.done + i::before { background:var(--step-done); }

.drop-zone:hover { background:#e0f0fb; } .drop-zone b { display:block; color:var(--text-strong); }

</style></head><body><div id="root"></div><script>
/* v6 core: i18n, helpers, icons, store + dispatch rules, shell, drawer, router. */
const LANG = 'de';
const LI = { ru: 0, de: 1, en: 2, kk: 3 }[LANG];
const HOOKS = { status: [] };   // screens subscribe here (e.g. hubs create inbound jobs when a load departs)
const hmm = m => { const x = Math.floor(m + 1e-9); return p2(Math.floor(x / 60) % 24) + ':' + p2(x % 60); };
const fileFor = l => (l === 'ru' ? 'platform-v6.html' : 'platform-v6-' + l + '.html');
const T = (...a) => (a[LI] != null ? a[LI] : a[0]);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const kzt = n => Math.round(n).toLocaleString('ru-RU').replace(/ | /g, ' ') + ' ₸';
const p2 = n => String(n).padStart(2, '0');
const fdt = iso => { const d = new Date(iso); return p2(d.getDate()) + '.' + p2(d.getMonth() + 1) + ', ' + p2(d.getHours()) + ':' + p2(d.getMinutes()); };

const IC = {
  grid: '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
  package: '<path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/>',
  kanban: '<rect x="3" y="3" width="5" height="18" rx="1"/><rect x="10" y="3" width="5" height="12" rx="1"/><rect x="17" y="3" width="4" height="8" rx="1"/>',
  truck: '<path d="M2 6h11v10H2z"/><path d="M13 9h4l4 4v3h-8z"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',

  warehouse: '<path d="M3 21V9l9-5 9 5v12"/><path d="M7 21v-8h10v8"/>',
  file: '<path d="M14 3H6a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2V9z"/><path d="M14 3v6h6"/><path d="M9 15l2 2 4-4"/>',
  receipt: '<path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
  chart: '<path d="M4 20V4"/><path d="M4 20h16"/><rect x="8" y="11" width="3" height="6"/><rect x="14" y="7" width="3" height="10"/>',
  spark: '<path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>',
  cog: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',
  bell: '<path d="M6 8a6 6 0 0112 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 21a2 2 0 004 0"/>',

  plus: '<path d="M12 5v14M5 12h14"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
  therm: '<path d="M14 14.8V5a2 2 0 00-4 0v9.8a4 4 0 104 0z"/>',

  up: '<path d="M7 17L17 7M9 7h8v8"/>',
};
const ic = (n, s = 16) => `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">${IC[n] || ''}</svg>`;

/* ---------- labels & status vocabulary (one palette everywhere, spec P3) ---------- */
const ST = {
  unassigned: { c: 'gray',   l: T('Не назначен', 'Offen', 'Unassigned', 'Тағайындалмаған') },
  assigned:   { c: 'blue',   l: T('Назначен', 'Zugewiesen', 'Assigned', 'Тағайындалған') },
  loading:    { c: 'yellow', l: T('Погрузка', 'Beladung', 'Loading', 'Тиеу') },
  in_transit: { c: 'green',  l: T('В пути', 'Unterwegs', 'In Transit', 'Жолда') },
  delivered:  { c: 'purple', l: T('Доставлен', 'Geliefert', 'Delivered', 'Жеткізілді') },
  problem:    { c: 'red',    l: T('Проблема', 'Problem', 'Problem', 'Мәселе') },
};
const ORDER = ['unassigned', 'assigned', 'loading', 'in_transit', 'delivered', 'problem'];
const PRI = { high: { c: 'red', l: T('Высокий', 'Hoch', 'High', 'Жоғары') }, medium: { c: 'yellow', l: T('Средний', 'Mittel', 'Medium', 'Орташа') }, low: { c: 'green', l: T('Низкий', 'Niedrig', 'Low', 'Төмен') } };
const ESF = {
  none:      { c: 'gray',   l: T('ЭСФ: нет', 'ESF: keine', 'ESF: none', 'ЭШФ: жоқ') },
  issued:    { c: 'blue',   l: T('ЭСФ: выписана', 'ESF: ausgestellt', 'ESF: issued', 'ЭШФ: жазылды') },
  confirmed: { c: 'green',  l: T('ЭСФ: подтверждена', 'ESF: bestätigt', 'ESF: confirmed', 'ЭШФ: расталды') },
};
const chip = (c, t) => `<span class="chip ${c}">${esc(t)}</span>`;
const stChip = s => chip(ST[s].c, ST[s].l);
const zoneChip = z => `<span class="chip zone-${z}">${ZONES[z].label}</span>`;
const fd = iso => { const d = new Date(iso); return p2(d.getDate()) + '.' + p2(d.getMonth() + 1) + '.' + d.getFullYear(); };
/* document validity: expired / renew soon (<= 30 d) / valid */
const docState = iso => { const days = Math.floor((new Date(iso + 'T23:59:59+05:00') - NOW) / 864e5); return days < 0 ? 'expired' : days <= 30 ? 'soon' : 'valid'; };
const DOCST = { valid: { c: 'green', l: T('Действует', 'Gültig', 'Valid', 'Жарамды') }, soon: { c: 'yellow', l: T('Скоро истекает', 'Läuft bald ab', 'Renew soon', 'Жақында аяқталады') }, expired: { c: 'red', l: T('Просрочен', 'Abgelaufen', 'Expired', 'Мерзімі өтті') } };
const avatar = (ini, n) => `<span class="avatar sm" style="background:var(--av-${n || 1})">${esc(ini)}</span>`;

/* ---------- store ---------- */
const S = {
  loads: [], drivers: [], trucks: [],
  route: 'dashboard', drawer: null, toast: null,
  f: { q: '', status: '', cust: '', zone: '', pri: '', hub: '', drv: '', page: 1 },
  dispTab: 'board', nextId: 1856,
  hubTab: 'hubs', hubView: 'cards', clock: 14 * 60 + 32, costs: [], views: [], rf: { st: '', hub: '', q: '', flag: '' },
};
const loadOfTruck = id => S.loads.find(l => l.truck === id && isActive(l));
const loadOfDriver = id => S.loads.find(l => l.driver === id && isActive(l));
const truckLoc = t => { const l = loadOfTruck(t.id); return l && (l.status === 'in_transit' || l.status === 'problem') ? { city: HUBS[l.from].city + ' → ' + HUBS[l.to].city, sub: T('в пути', 'unterwegs', 'en route', 'жолда') } : { city: HUBS[t.hub].city, sub: HUBS[t.hub].name }; };
const truckState = t => { const l = loadOfTruck(t.id); if (t.status === 'service') return 'service'; if (t.health === 'red' || (l && tempState(l) === 'breach')) return 'critical'; return t.status === 'busy' ? 'busy' : 'available'; };
const TS = { available: { c: 'green', l: T('Свободен', 'Frei', 'Available', 'Бос') }, busy: { c: 'yellow', l: T('В рейсе', 'Im Einsatz', 'In use', 'Рейсте') }, service: { c: 'red', l: T('Сервис', 'Service', 'Maintenance', 'Сервис') }, critical: { c: 'red', l: T('Критично', 'Kritisch', 'Critical', 'Сыни') } };
const rtoDot = d => (d.status === 'rest' || d.rto < 4) ? 'bad' : d.rto < 6 ? 'warn' : 'good';
const agoTxt = m => m < 60 ? m + ' ' + T('мин назад', 'Min. her', 'min ago', 'мин бұрын') : Math.round(m / 60) + ' ' + T('ч назад', 'Std. her', 'h ago', 'сағ бұрын');
const cust = id => CUSTOMERS.find(c => c.id === id);
/* loads handed to a partner carrier have no own driver / truck: frozen placeholders keep every screen safe */
const NODRV = Object.freeze({ id: null, code: '—', name: '—', ini: '—', rto: 0, status: 'busy', lic: '—', exp: 0, rating: 0, phone: '—', hub: 'AST', onDuty: 0, week: 0, docs: [] });
const NOTRK = Object.freeze({ id: null, plate: '—', make: '—', year: 0, km: 0, model: '—', zones: [], cap: 0, status: 'busy', hub: 'AST', ping: 0, health: 'green', unit: '—', unitH: 0, docs: { osago: '2099-01-01', cargo: '2099-01-01', calib: '2099-01-01', to: '2099-01-01' }, svc: { last: '2026-01-01', lastKm: 0, nextKm: 0 } });
const pname = id => { const p = (S.partners || []).find(x => 'p:' + x.id === id); return p ? p.name : null; };
const drv = id => S.drivers.find(d => d.id === id) || (pname(id) ? Object.freeze(Object.assign({}, NODRV, { name: pname(id) })) : NODRV);
const trk = id => S.trucks.find(t => t.id === id) || (pname(id) ? Object.freeze(Object.assign({}, NOTRK, { plate: id.slice(2), make: T('Партнёр', 'Partner', 'Partner', 'Серіктес') })) : NOTRK);
const load = id => S.loads.find(l => l.id === id);
const hrs = l => Math.round(dist(l.from, l.to) / 65 * 10) / 10;
/* driving time the driver must still have: one shift (max 9 h); longer routes get planned rest stops (norms to be verified, spec Q5) */
const needRto = l => Math.min(hrs(l), typeof CFG !== 'undefined' ? CFG.live.shift : 9);
const tempState = l => { const z = ZONES[l.zone]; if (l.temp < z.lo || l.temp > z.hi) return 'breach'; return (l.temp - z.lo < 0.8 || z.hi - l.temp < 0.8) ? 'warn' : 'ok'; };
const tempChip = l => `<span class="chip temp-${tempState(l)}">${l.temp > 0 ? '+' : ''}${String(l.temp).replace('.', ',')} °C</span>`;
const revenue = l => dist(l.from, l.to) * ZONES[l.zone].rate;
const cost = l => Math.round(revenue(l) * 0.78);
const isActive = l => ['assigned', 'loading', 'in_transit', 'problem'].includes(l.status);

function compat(l, d, t) {
  const why = [];
  if (!t.zones.includes(l.zone)) why.push(T('ТС не подходит по температурной зоне', 'Fahrzeug passt nicht zur Temperaturzone', 'Truck does not support the temperature zone', 'КҚ температура аймағына сәйкес емес'));
  if (t.cap < l.pallets) why.push(T('Недостаточно паллето-мест', 'Zu wenige Palettenplätze', 'Not enough pallet places', 'Паллет орны жеткіліксіз'));
  if (t.status !== 'available') why.push(T('ТС занято или в сервисе', 'Fahrzeug belegt oder im Service', 'Truck busy or in service', 'КҚ бос емес немесе сервисте'));
  if (d.status !== 'available') why.push(T('Водитель недоступен', 'Fahrer nicht verfügbar', 'Driver unavailable', 'Жүргізуші қолжетімсіз'));
  if (d.rto < needRto(l)) why.push(T('Не хватает времени вождения (РТО)', 'Lenkzeit reicht nicht (RTO)', 'Not enough driving time (RTO)', 'Жүргізу уақыты (РТО) жеткіліксіз'));
  if (d.docs && d.docs.some(x => (x.type === 'lic' || x.type === 'med') && docState(x.to) === 'expired')) why.push(T('У водителя просрочены права или медосмотр', 'Führerschein oder Untersuchung des Fahrers abgelaufen', 'Driver licence or medical certificate expired', 'Жүргізушінің куәлігі немесе медтексеруі мерзімі өтті'));
  if (l.zone === 'pharma' && t.docs && docState(t.docs.calib) === 'expired') why.push(T('Поверка датчиков ТС просрочена (GDP, фарма)', 'Kalibrierung der Sensoren abgelaufen (GDP, Pharma)', 'Sensor calibration expired (GDP, pharma)', 'Датчиктер поверкасы мерзімі өтті (GDP, фарма)'));
  return why;
}
function assign(id, did, tid) {
  const l = load(id), d = drv(did), t = trk(tid);
  if (!l || !did || !tid || !d.id || !t.id) return T('Выберите водителя и ТС', 'Fahrer und Fahrzeug wählen', 'Select driver and truck', 'Жүргізуші мен КҚ таңдаңыз');
  const why = compat(l, d, t); if (why.length) return why[0];
  l.driver = did; l.truck = tid; l.status = 'assigned'; d.status = 'busy'; t.status = 'busy';
  l.notes.push({ who: 'System', t: fdt(NOW).slice(-5), text: T('Назначено: ', 'Zugewiesen: ', 'Assigned: ', 'Тағайындалды: ') + d.name + ' / ' + t.plate });
  return null;
}
function autoAssign() {
  let ok = 0, fail = 0;
  const rank = { high: 0, medium: 1, low: 2 };
  S.loads.filter(l => l.status === 'unassigned').sort((a, b) => rank[a.priority] - rank[b.priority] || a.eta.localeCompare(b.eta)).forEach(l => {
    const ts = S.trucks.filter(t => t.zones.includes(l.zone)).sort((a, b) => a.cap - b.cap);
    const ds = S.drivers.slice().sort((a, b) => a.rto - b.rto);
    let done = false;
    for (const t of ts) { for (const d of ds) { if (!compat(l, d, t).length && !assign(l.id, d.id, t.id)) { done = true; break; } } if (done) break; }
    if (done) ok++; else fail++;
  });
  return { ok, fail };
}
const NEXT = { assigned: 'loading', loading: 'in_transit', in_transit: 'delivered' };
function setStatus(id, st) {
  const l = load(id); if (!l) return;
  const was = l.status; l.status = st;
  if (st === 'in_transit' && l.progress === 0) l.progress = 0.05;
  if (st === 'delivered') {
    l.progress = 1; l.pod = 'pending';
    const d = drv(l.driver), t = trk(l.truck); if (d) d.status = 'available'; if (t) t.status = 'available';
  }
  if (st === 'problem') { l.temp = ZONES[l.zone].hi + 1.4; }
  if (was === 'problem' && st === 'in_transit') { l.temp = ZONES[l.zone].mid; }
  l.notes.push({ who: 'System', t: fdt(NOW).slice(-5), text: ST[was].l + ' → ' + ST[st].l });
  HOOKS.status.forEach(f => f(l, was, st));
}
function canMove(l, to) {
  if (to === 'assigned' && l.status === 'unassigned') return T('Сначала назначьте водителя и ТС', 'Erst Fahrer und Fahrzeug zuweisen', 'Assign a driver and truck first', 'Алдымен жүргізуші мен КҚ тағайындаңыз');
  if (NEXT[l.status] === to) return null;
  if (to === 'problem' && ['loading', 'in_transit'].includes(l.status)) return null;
  if (l.status === 'problem' && to === 'in_transit') return null;
  return T('Недопустимый переход статуса', 'Statuswechsel nicht erlaubt', 'Status change not allowed', 'Күй ауысуына рұқсат жоқ');
}
function createLoad(f) {
  if (f.from === f.to) return T('Пункты отправления и назначения совпадают', 'Start und Ziel sind gleich', 'Origin and destination are the same', 'Жөнелту және межелі пункт бірдей');
  if (!(f.pallets >= 1 && f.pallets <= 33)) return T('Паллет: от 1 до 33', 'Paletten: 1 bis 33', 'Pallets: 1 to 33', 'Паллет: 1-ден 33-ке дейін');
  const id = String(S.nextId++).padStart(6, '0');
  const l = mkLoad(id, f.cust, f.from, f.to, f.zone, f.pallets, f.pallets * 330, f.priority, 'unassigned', new Date(NOW.getTime() + hrs({ from: f.from, to: f.to }) * 3600e3 + 6 * 3600e3).toISOString());
  S.loads.unshift(l); return { ok: l.id };
}

/* ---------- navigation (spec 2.1) ---------- */
const NAV = [
  ['dashboard', 'grid', T('Обзор', 'Übersicht', 'Dashboard', 'Шолу'), 2],
  ['orders', 'package', T('Заказы и рейсы', 'Aufträge & Fahrten', 'Orders & Loads', 'Тапсырыстар мен рейстер'), 2],
  ['dispatch', 'kanban', T('Диспетчерская доска', 'Dispositionstafel', 'Dispatch Board', 'Диспетчерлік тақта'), 2],
  ['fleet', 'truck', T('Автопарк', 'Fuhrpark', 'Fleet', 'Автопарк'), 3],
  ['drivers', 'user', T('Водители', 'Fahrer', 'Drivers', 'Жүргізушілер'), 3],
  ['routes', 'route', T('Маршруты и трекинг', 'Routen & Tracking', 'Routes & Tracking', 'Маршруттар және трекинг'), 3],
  ['hubs', 'warehouse', T('Хабы и склады', 'Hubs & Lager', 'Warehouses & Hubs', 'Хабтар мен қоймалар'), 4],
  ['pod', 'file', T('Подтверждение доставки', 'Lieferbestätigung', 'Proof of Delivery', 'Жеткізуді растау'), 5],
  ['billing', 'receipt', T('Счета и ЭСФ', 'Rechnungen & ESF', 'Billing & Invoices', 'Шоттар және ЭШФ'), 5],
  ['reports', 'chart', T('Отчёты', 'Berichte', 'Reports', 'Есептер'), 6],
  ['ai', 'spark', T('AI-ассистент', 'KI-Assistent', 'AI Ops Assistant', 'AI-көмекші'), 6],
  ['settings', 'cog', T('Настройки', 'Einstellungen', 'Settings', 'Баптаулар'), 6],
];
const SCREENS = {};   // id -> { title, sub, actions(), body(), search }
const navLabel = id => (NAV.find(n => n[0] === id) || [])[2] || id;

function toast(msg, kind) { S.toast = { msg, kind: kind || 'ok' }; render(); clearTimeout(toast.t); toast.t = setTimeout(() => { S.toast = null; render(); }, 3200); }
function go(r) { S.route = r; S.drawer = null; S.f.page = 1; render(); const m = $('main'); if (m) m.scrollTop = 0; }
function openDrawer(d) { S.drawer = d; render(); }
const closeDrawer = () => { S.drawer = null; render(); };
const alertsCount = () => S.loads.filter(l => tempState(l) === 'breach' && isActive(l)).length + S.drivers.filter(d => d.rto < 4 && d.status === 'available').length;

function shell() {
  const sc = SCREENS[S.route];
  const nav = NAV.map(n => `<div class="nav-item${n[0] === S.route ? ' active' : ''}" data-act="go" data-v="${n[0]}">${ic(n[1])}<span>${esc(n[2])}</span></div>`).join('');
  const lang = ['ru', 'de', 'en', 'kk'].map(l => `<a href="${fileFor(l)}"${l === LANG ? ' class="on"' : ''}>${l.toUpperCase()}</a>`).join('');
  const body = sc ? sc.body() : placeholder(S.route);
  const title = sc ? sc.title() : navLabel(S.route);
  return `<div class="app"><aside class="sidebar"><div class="logo">Olymp&nbsp;Logistic</div>${nav}<div class="langs">${lang}</div></aside>
<main><header class="topbar"><span class="crumb">${esc(navLabel('dashboard'))} › <b>${esc(navLabel(S.route))}</b></span>

function placeholder(id) {
  const ph = NAV.find(n => n[0] === id)[3];
  return `<div class="card card-body"><h3 style="margin:0 0 8px">${esc(navLabel(id))}</h3><p class="note">${esc(T('Экран будет перенесён на новую дизайн-систему в фазе ', 'Der Screen wird in Phase ', 'This screen moves to the new design system in phase ', 'Бұл экран жаңа дизайн-жүйеге '))}${ph}${esc(T(' (см. спецификацию, раздел 7).', ' auf das neue Designsystem migriert (siehe Spezifikation, Abschnitt 7).', ' (see specification, section 7).', '-кезеңде көшіріледі (спецификация, 7-бөлім).'))}</p></div>`;
}
function drawerHtml() {
  const d = S.drawer; if (!d) return '';
  const r = DRAWERS[d.type](d);
  return `<aside class="drawer open${r.xl ? ' xl' : ''}"><div class="drawer-head"><span>${esc(r.title)}</span><span class="x" data-act="close">${ic('x', 18)}</span></div>${r.html}</aside>`;
}
const DRAWERS = {};

/* ---------- render + events ---------- */
function render() {
  const keep = { y: ($('main') || {}).scrollTop || 0, f: document.activeElement && document.activeElement.id };
  const pos = document.activeElement && document.activeElement.selectionStart;
  const keepIn = {};   // keep what the user typed in drawer fields across re-renders (e.g. a toast)
  $$('.drawer input[id], .drawer select[id], .drawer textarea[id]').forEach(e => { keepIn[e.id] = e.type === 'checkbox' ? e.checked : e.value; });
  $('#root').innerHTML = shell();
  Object.keys(keepIn).forEach(id => { const e = document.getElementById(id); if (e && e.closest('.drawer')) { if (e.type === 'checkbox') e.checked = keepIn[id]; else e.value = keepIn[id]; } });
  const m = $('main'); if (m) m.scrollTop = keep.y;
  if (keep.f) { const e = document.getElementById(keep.f); if (e) { e.focus(); try { e.setSelectionRange(pos, pos); } catch (_) {} } }
}
const ACT = {};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (fn) { fn(el.dataset, el, e); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'gsearch') { S.f.q = e.target.value; S.f.page = 1; if (S.route !== 'orders') S.route = 'orders'; render(); }
  else if (e.target.dataset && e.target.dataset.f) { S.f[e.target.dataset.f] = e.target.value; S.f.page = 1; render(); }
});
Object.assign(ACT, {
  go: d => go(d.v), close: closeDrawer,
  open: d => openDrawer({ type: 'load', id: d.id, tab: 'overview' }),
  tab: d => { S.drawer.tab = d.v; render(); },
  clear: () => { S.f = { q: '', status: '', cust: '', zone: '', pri: '', hub: '', drv: '', page: 1 }; render(); },
  page: d => { S.f.page = +d.v; render(); },
  create: () => openDrawer({ type: 'create' }),
});

/* Dashboard (spec 5.1): 6 KPI, schematic KZ map + dispatch list, alerts + quick actions. */
(function () {

  function map() {
    const hubs = Object.entries(HUBS).map(([k, h]) => `<g><circle cx="${h.x}" cy="${h.y}" r="7" fill="#fff" stroke="var(--primary)" stroke-width="3"/><text x="${h.x + 12}" y="${h.y + 4}" class="maplbl">${esc(h.city)}</text></g>`).join('');
    const lines = S.loads.filter(l => isActive(l) && l.status !== 'assigned').map(l => { const a = HUBS[l.from], b = HUBS[l.to]; return `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="var(--primary)" stroke-opacity=".35" stroke-width="2" stroke-dasharray="5 4"/>`; }).join('');
    const mk = S.loads.filter(l => l.status === 'in_transit' || l.status === 'problem').map(l => {
      const a = HUBS[l.from], b = HUBS[l.to], x = a.x + (b.x - a.x) * l.progress, y = a.y + (b.y - a.y) * l.progress, ts = tempState(l);
      const col = ts === 'breach' ? 'var(--mk-red)' : ts === 'warn' ? 'var(--mk-status-yellow)' : 'var(--mk-green)', t = trk(l.truck);
      return `<g class="mk" data-act="open" data-id="${l.id}" transform="translate(${x},${y})"><circle r="14" fill="${col}"/><path d="M-7 -3h9v6h-9zM2 -1h4l3 3v2h-7z" fill="#fff"/><circle cx="10" cy="-10" r="4.5" fill="${ts === 'ok' ? 'var(--mk-status-green)' : ts === 'warn' ? 'var(--mk-status-yellow)' : 'var(--red)'}" stroke="#fff" stroke-width="1.5"/><rect x="-44" y="18" width="88" height="17" rx="6" fill="#fff" stroke="var(--border-input)"/><text x="0" y="30" text-anchor="middle" class="maplbl sm">${esc(t ? t.plate.slice(0, 10) : '')} · ${l.temp > 0 ? '+' : ''}${String(l.temp).replace('.', ',')}°</text></g>`;

<div class="legend card"><b>${esc(T('Состояние ТС', 'Fahrzeugstatus', 'Vehicle status', 'КҚ күйі'))}</b><div><i style="background:var(--mk-status-green)"></i>${esc(T('В норме', 'In Ordnung', 'On time', 'Қалыпты'))}</div><div><i style="background:var(--mk-status-yellow)"></i>${esc(T('Близко к границе', 'Nahe Grenzwert', 'Near limit', 'Шекке жақын'))}</div><div><i style="background:var(--red)"></i>${esc(T('Темп. тревога', 'Temp.-Alarm', 'Temp. alarm', 'Темп. дабыл'))}</div></div>
<div class="statstrip card"><span><b>${S.trucks.length}</b> ${esc(T('ТС всего', 'Fahrzeuge', 'Total vehicles', 'КҚ барлығы'))}</span><span><b class="g">${free}</b> ${esc(T('свободно', 'frei', 'available', 'бос'))}</span><span><b class="b">${act}</b> ${esc(T('активных рейсов', 'aktive Fahrten', 'active loads', 'белсенді рейс'))}</span></div></div></div>`;

    S.loads.filter(l => l.status === 'delivered' && l.pod === 'pending').forEach(l => a.push(['blue', T('Ожидает POD', 'POD ausstehend', 'POD pending', 'POD күтілуде'), l.id, l.id]));

  }
  function quick() {
    const b = (cls, i, t, act) => `<button class="btn block ${cls}" data-act="${act}">${ic(i)} ${esc(t)}</button>`;
    return `<div class="card"><div class="card-head">${esc(T('Быстрые действия', 'Schnellaktionen', 'Quick Actions', 'Жылдам әрекеттер'))}</div><div class="card-body qa">${b('primary', 'plus', T('Создать рейс', 'Fahrt anlegen', 'Create Load', 'Рейс құру'), 'create')}${b('green', 'user', T('Назначить водителя', 'Fahrer zuweisen', 'Assign Driver', 'Жүргізуші тағайындау'), 'toDispatch')}${b('purple', 'receipt', T('Сформировать ЭСФ', 'ESF erstellen', 'Generate ESF', 'ЭШФ қалыптастыру'), 'esfAll')}${b('orange', 'route', T('План маршрута', 'Route planen', 'Plan Route', 'Маршрут жоспары'), 'planRoute')}</div></div>`;
  }
  Object.assign(ACT, {
    toDispatch: () => go('dispatch'),
    esfAll: () => { const t = S.loads.filter(l => l.status === 'delivered' && l.pod === 'approved' && l.esf === 'none'); t.forEach(l => l.esf = 'issued'); toast(t.length ? T('Выписано ЭСФ: ', 'ESF ausgestellt: ', 'ESF issued: ', 'ЭШФ жазылды: ') + t.length : T('Нет рейсов для ЭСФ', 'Keine Fahrten für ESF', 'No loads need an ESF', 'ЭШФ үшін рейс жоқ')); },
    planRoute: () => { S.dispTab = 'planning'; go('dispatch'); },
  });
  SCREENS.dashboard = {
    title: () => navLabel('dashboard'),
    sub: () => T('Холодовая цепь: Астана · Алматы · Караганда · Шымкент', 'Kühlkette: Astana · Almaty · Karaganda · Schymkent', 'Cold chain: Astana · Almaty · Karaganda · Shymkent', 'Суық тізбек: Астана · Алматы · Қарағанды · Шымкент'),
    actions: () => `<button class="btn primary" data-act="create">${ic('plus')} ${esc(T('Создать рейс', 'Fahrt anlegen', 'Create Load', 'Рейс құру'))}</button>`,
    body: () => {
      const act = S.loads.filter(isActive), breach = act.filter(l => tempState(l) === 'breach').length;
      const done = S.loads.filter(l => l.status === 'delivered').length;
      const comp = act.length ? Math.round((act.length - breach) / act.length * 100) : 100;
      const rev = S.loads.reduce((s, l) => s + revenue(l), 0) / 1e6;
      const free = S.trucks.filter(t => t.status === 'available' && t.zones.some(z => z !== 'ambient')).length;
      return `<div class="kpi-row k6">
${kpi('blue', 'package', T('Активные рейсы', 'Aktive Fahrten', 'Active loads', 'Белсенді рейстер'), act.length, '↑ ' + done + ' ' + T('доставлено', 'geliefert', 'delivered', 'жеткізілді'))}
${kpi('green', 'check', T('Соблюдение температуры', 'Temperatur-Compliance', 'Temp. compliance', 'Температура сақталуы'), comp + ' %', breach ? '↓ ' + breach + ' ' + T('откл.', 'Abw.', 'excursion', 'ауытқу') : '✓', breach ? 'neg' : 'pos')}
${kpi('purple', 'truck', T('Свободные рефрижераторы', 'Freie Kühlfahrzeuge', 'Free reefers', 'Бос рефрижераторлар'), free, T('из ', 'von ', 'of ', '/ ') + S.trucks.length)}
${kpi('red', 'alert', T('Отклонения температуры', 'Temperaturabweichungen', 'Temp. excursions', 'Температура ауытқулары'), breach, breach ? T('требует реакции', 'Handlungsbedarf', 'needs action', 'әрекет қажет') : 'OK', breach ? 'neg' : 'pos')}
${kpi('orange', 'therm', T('Топливо MTD', 'Kraftstoff MTD', 'Fuel MTD', 'Отын MTD'), '18,4 млн ₸', '↑ 3 %')}
${kpi('green', 'chart', T('Выручка', 'Umsatz', 'Revenue', 'Түсім'), String(rev.toFixed(1)).replace('.', ',') + ' млн ₸', '↑ 12 %', 'pos')}</div>
<div class="grid2">${map()}${dispatchList()}</div><div class="grid2 eq">${alerts()}${quick()}</div>`;

/* Orders & Loads (spec 5.2): filters, table 8/page, 6-tab drawer, create form. */
(function () {
  const PER = 8;
  const sel = (key, label, opts) => `<label>${esc(label)}:</label><select class="select" data-f="${key}">${opts.map(o => `<option value="${esc(o[0])}"${S.f[key] === o[0] ? ' selected' : ''}>${esc(o[1])}</option>`).join('')}</select>`;
  const ALL = T('Все', 'Alle', 'All', 'Барлығы');
  const filtered = () => {
    const f = S.f, q = f.q.trim().toLowerCase();
    return S.loads.filter(l => (!f.status || l.status === f.status) && (!f.cust || l.cust === f.cust) && (!f.zone || l.zone === f.zone) && (!f.pri || l.priority === f.pri) &&
      (!q || (l.id + ' ' + cust(l.cust).name + ' ' + HUBS[l.from].city + ' ' + HUBS[l.to].city + ' ' + (l.truck ? trk(l.truck).plate : '') + ' ' + (l.driver ? drv(l.driver).name : '')).toLowerCase().includes(q)));
  };
  function table() {
    const all = filtered(), pages = Math.max(1, Math.ceil(all.length / PER)); if (S.f.page > pages) S.f.page = pages;
    const rows = all.slice((S.f.page - 1) * PER, S.f.page * PER).map(l => { const c = cust(l.cust), d = l.driver && drv(l.driver), t = l.truck && trk(l.truck), m = Math.round((revenue(l) - cost(l)) / revenue(l) * 100);
      return `<tr class="${S.drawer && S.drawer.id === l.id ? 'is-selected' : ''}" data-act="open" data-id="${l.id}"><td><a class="lnk">${l.id}</a><div class="sub">${esc(T('создан', 'erstellt', 'created', 'құрылды'))} ${fdt(l.created).slice(0, 5)}</div></td>
<td><div class="cell">${avatar(c.ini, c.av)}<div><b>${esc(c.name)}</b><div class="sub">${esc(T('БИН', 'BIN', 'BIN', 'БСН'))} ${c.bin}</div></div></div></td>
<td><b>${esc(HUBS[l.from].city)} → ${esc(HUBS[l.to].city)}</b><div class="sub">${dist(l.from, l.to)} ${esc(T('км', 'km', 'km', 'км'))} · ${l.pallets} ${esc(T('пал.', 'Pal.', 'pal.', 'пал.'))}</div></td>
<td>${fdt(l.eta)}</td><td>${zoneChip(l.zone)}<div class="sub">${tempChip(l)}</div></td><td>${stChip(l.status)}</td><td>${chip(PRI[l.priority].c, PRI[l.priority].l)}</td>
<td>${d ? `<b>${esc(d.name)}</b><div class="sub">${esc(t.plate)}</div>` : '<span class="faint">—</span>'}</td>
<td><b>${kzt(revenue(l))}</b><div class="sub">${esc(T('маржа', 'Marge', 'margin', 'маржа'))} ${m} %</div></td><td>${chip(ESF[l.esf].c, ESF[l.esf].l)}</td></tr>`; }).join('');
    const th = [T('Рейс', 'Fahrt', 'Load ID', 'Рейс'), T('Клиент', 'Kunde', 'Customer', 'Клиент'), T('Маршрут', 'Route', 'Route', 'Маршрут'), 'ETA', T('Темп. зона', 'Temp.-Zone', 'Temp zone', 'Темп. аймақ'), T('Статус', 'Status', 'Status', 'Күйі'), T('Приоритет', 'Priorität', 'Priority', 'Басымдық'), T('Водитель / ТС', 'Fahrer / Fzg.', 'Driver / Truck', 'Жүргізуші / КҚ'), T('Ставка', 'Satz', 'Rate', 'Бағасы'), 'ЭСФ'];
    const pg = Array.from({ length: pages }, (_, i) => `<button class="pgb${i + 1 === S.f.page ? ' on' : ''}" data-act="page" data-v="${i + 1}">${i + 1}</button>`).join('');

<div class="pager"><span>${esc(T('Показано', 'Angezeigt', 'Showing', 'Көрсетілді'))} ${all.length ? (S.f.page - 1) * PER + 1 : 0}–${Math.min(S.f.page * PER, all.length)} ${esc(T('из', 'von', 'of', '/'))} ${all.length}</span><span>${pg}</span></div></div>`;

  };

  /* ---------- drawer: load ---------- */
  function spark(l) {
    let h = 0; for (const ch of l.id) h = (h * 31 + ch.charCodeAt(0)) % 997;
    const z = ZONES[l.zone], pts = Array.from({ length: 24 }, (_, i) => z.mid + Math.sin((i + h) / 2.3) * (z.hi - z.lo) * 0.18 + ((h + i * 7) % 5 - 2) * 0.12);
    if (tempState(l) === 'breach') for (let i = 18; i < 24; i++) pts[i] = l.temp + (i - 21) * 0.1;
    else pts[23] = l.temp;
    const mn = Math.min(z.lo - 1, ...pts), mx = Math.max(z.hi + 1, ...pts), Y = v => 80 - (v - mn) / (mx - mn) * 76, p = pts.map((v, i) => `${i * 12.4},${Y(v).toFixed(1)}`).join(' ');
    const ex = pts.filter(v => v < z.lo || v > z.hi).length * 15;

    let b = '';
    if (tab === 'overview') {
      let asg;
      if (l.status === 'unassigned') {
        const ds = S.drivers.filter(x => x.status === 'available'), ts = S.trucks.filter(x => x.status === 'available');
        asg = `<div class="drawer-section"><h4>${esc(T('Назначение', 'Zuweisung', 'Assignment', 'Тағайындау'))}</h4><label class="fl">${esc(T('Водитель', 'Fahrer', 'Driver', 'Жүргізуші'))}<select class="select" id="as_d"><option value="">—</option>${ds.map(x => `<option value="${x.id}">${esc(x.name)} · РТО ${x.rto} ${esc(T('ч', 'h', 'h', 'сағ'))}</option>`).join('')}</select></label>
<label class="fl">${esc(T('Транспорт', 'Fahrzeug', 'Truck', 'Көлік'))}<select class="select" id="as_t"><option value="">—</option>${ts.map(x => `<option value="${x.id}">${esc(x.plate)} · ${esc(x.model)} · ${x.cap} ${esc(T('пал.', 'Pal.', 'pal.', 'пал.'))}</option>`).join('')}</select></label>
<button class="btn primary block" data-act="doAssign" data-id="${l.id}">${esc(T('Назначить', 'Zuweisen', 'Assign', 'Тағайындау'))}</button><p class="note">${esc(T('Требуется ТС с подходящей температурной зоной и водитель с достаточным временем вождения (РТО ≥ ', 'Benötigt: passende Temperaturzone und ausreichende Lenkzeit (RTO ≥ ', 'Needs a truck for the temperature zone and a driver with enough driving time (RTO ≥ ', 'Температура аймағына сай КҚ және жеткілікті жүргізу уақыты (РТО ≥ '))}${needRto(l)} ${esc(T('ч)', 'h)', 'h)', 'сағ)'))}</p></div>`;

/* Dispatch Board (spec 5.3) + Planning tab (decision Q4): kanban, Auto-Assign, drag & drop with status rules. */
(function () {
  const ALL = T('Все', 'Alle', 'All', 'Барлығы');
  const sel = (key, label, opts) => `<label>${esc(label)}:</label><select class="select" data-f="${key}">${opts.map(o => `<option value="${esc(o[0])}"${S.f[key] === o[0] ? ' selected' : ''}>${esc(o[1])}</option>`).join('')}</select>`;

  function card(l) {

    return `<div class="kcard${S.drawer && S.drawer.id === l.id ? ' sel' : ''}" draggable="true" data-id="${l.id}" data-act="open"><div class="r1"><a class="lnk">${l.id}</a>${chip(PRI[l.priority].c, PRI[l.priority].l)}</div>
<div class="rt">${esc(HUBS[l.from].city)} → ${esc(HUBS[l.to].city)}</div><div class="sub">${zoneChip(l.zone)} ${l.status === 'in_transit' || l.status === 'problem' ? tempChip(l) : ''}</div>
<div class="sub">ETA ${fdt(l.eta)} · ${l.pallets} ${esc(T('пал.', 'Pal.', 'pal.', 'пал.'))}</div>
${l.status === 'problem' ? `<div class="prob">${ic('alert', 14)} ${esc(T('Температура вне диапазона', 'Temperatur außerhalb Bereich', 'Temperature out of range', 'Температура диапазоннан тыс'))}</div>` : ''}
<div class="r2">${d ? `<span class="cell">${avatar(d.ini, 1)}<span>${esc(d.name.split(' ')[0])}</span><small>${esc(t.plate)}</small></span>` : `<span class="faint">${esc(T('не назначен', 'offen', 'unassigned', 'тағайындалмаған'))}</span>`}<b>${kzt(revenue(l))}</b></div></div>`;
  }
  function board() {
    const f = S.f;
    const ls = S.loads.filter(l => (!f.pri || l.priority === f.pri) && (!f.hub || l.from === f.hub || l.to === f.hub) && (!f.drv || (l.driver && drv(l.driver).status === f.drv)));
    return `<div class="board">${ORDER.map(s => { const c = ls.filter(l => l.status === s);
      return `<div class="col" data-col="${s}"><div class="colh"><span class="d ${ST[s].c}"></span><b>${esc(ST[s].l)}</b><span class="cnt">${c.length}</span></div><div class="colb">${c.map(card).join('') || `<div class="empty">—</div>`}</div></div>`; }).join('')}</div>`;
  }
  function planning() {
    const un = S.loads.filter(l => l.status === 'unassigned');
    const rows = Object.keys(ZONES).map(z => {
      const dem = un.filter(l => l.zone === z).reduce((s, l) => s + l.pallets, 0), n = un.filter(l => l.zone === z).length;
      const cap = S.trucks.filter(t => t.status === 'available' && t.zones.includes(z)).reduce((s, t) => s + t.cap, 0), pct = cap ? Math.round(dem / cap * 100) : (dem ? 100 : 0);
      const cls = pct >= 90 ? 'crit' : pct >= 80 ? 'warn' : pct < 50 ? 'low' : '';
      return `<tr><td>${zoneChip(z)}</td><td>${n}</td><td>${dem}</td><td>${cap}</td><td style="width:32%"><div class="progress ${cls}"><i style="width:${Math.min(100, pct)}%"></i></div></td><td><b>${pct} %</b></td></tr>`;
    }).join('');
    const dr = S.drivers.map(d => `<tr><td><span class="cell">${avatar(d.ini, 1)}<b>${esc(d.name)}</b></span></td><td>${chip(d.status === 'available' ? 'green' : d.status === 'busy' ? 'blue' : 'gray', DRV[d.status])}</td><td><span class="dot ${d.rto >= 6 ? 'good' : d.rto >= 4 ? 'warn' : 'bad'}" style="width:12px;height:12px"></span> ${String(d.rto).replace('.', ',')} ${esc(T('ч', 'h', 'h', 'сағ'))}</td></tr>`).join('');
    return `<div class="grid2 eq"><div class="card tcard"><div class="card-head">${esc(T('Спрос и ёмкость по температурным зонам', 'Bedarf und Kapazität je Temperaturzone', 'Demand vs capacity by temperature zone', 'Температура аймақтары бойынша сұраныс пен сыйымдылық'))}</div><table class="table"><thead><tr><th>${esc(T('Зона', 'Zone', 'Zone', 'Аймақ'))}</th><th>${esc(T('Рейсов', 'Fahrten', 'Loads', 'Рейс'))}</th><th>${esc(T('Паллет', 'Paletten', 'Pallets', 'Паллет'))}</th><th>${esc(T('Места', 'Plätze', 'Places', 'Орын'))}</th><th></th><th>${esc(T('Загрузка', 'Auslastung', 'Utilization', 'Жүктеме'))}</th></tr></thead><tbody>${rows}</tbody></table></div>
<div class="card tcard"><div class="card-head">${esc(T('Водители и время вождения (РТО)', 'Fahrer und Lenkzeit (RTO)', 'Drivers and driving time (RTO)', 'Жүргізушілер және жүргізу уақыты (РТО)'))}</div><table class="table"><thead><tr><th>${esc(T('Водитель', 'Fahrer', 'Driver', 'Жүргізуші'))}</th><th>${esc(T('Статус', 'Status', 'Status', 'Күйі'))}</th><th>${esc(T('Осталось', 'Verbleibend', 'Remaining', 'Қалды'))}</th></tr></thead><tbody>${dr}</tbody></table></div></div>`;
  }
  Object.assign(ACT, {
    auto: () => { const r = autoAssign(); toast(r.ok ? T('Назначено автоматически: ', 'Automatisch zugewiesen: ', 'Auto-assigned: ', 'Автоматты тағайындалды: ') + r.ok + (r.fail ? T('; не удалось: ', '; nicht möglich: ', '; could not assign: ', '; болмады: ') + r.fail : '') : T('Нет подходящих ТС/водителей для свободных рейсов', 'Keine passenden Fahrzeuge/Fahrer', 'No matching trucks/drivers for unassigned loads', 'Сәйкес КҚ/жүргізуші жоқ'), r.ok ? 'ok' : 'err'); },
    dtab: d => { S.dispTab = d.v; render(); },
  });
  SCREENS.dispatch = {
    title: () => navLabel('dispatch'),
    sub: () => T('Перетащите карточку в следующий столбец или откройте её для назначения', 'Karte in die nächste Spalte ziehen oder öffnen, um zuzuweisen', 'Drag a card to the next column or open it to assign', 'Картаны келесі бағанға сүйреңіз немесе тағайындау үшін ашыңыз'),
    actions: () => `<button class="btn green" data-act="auto">${ic('spark')} ${esc(T('Авто-назначение', 'Auto-Zuweisung', 'Auto-Assign', 'Авто-тағайындау'))}</button><button class="btn primary" data-act="create">${ic('plus')} ${esc(T('Создать рейс', 'Fahrt anlegen', 'Create New Load', 'Рейс құру'))}</button>`,
    body: () => `<div class="pill-tabs"><span class="pill-tab${S.dispTab === 'board' ? ' active' : ''}" data-act="dtab" data-v="board">${esc(T('Доска', 'Tafel', 'Board', 'Тақта'))}</span><span class="pill-tab${S.dispTab === 'planning' ? ' active' : ''}" data-act="dtab" data-v="planning">${esc(T('Планирование', 'Planung', 'Planning', 'Жоспарлау'))}</span><span class="pill-tab${S.dispTab === 'partners' ? ' active' : ''}" data-act="dtab" data-v="partners">${esc(T('Партнёры', 'Partner', 'Partners', 'Серіктестер'))}</span></div>
${S.dispTab === 'board' ? `<div class="filters">${sel('pri', T('Приоритет', 'Priorität', 'Priority', 'Басымдық'), [['', ALL], ...Object.keys(PRI).map(p => [p, PRI[p].l])])}${sel('drv', T('Статус водителя', 'Fahrerstatus', 'Driver status', 'Жүргізуші күйі'), [['', ALL], ...Object.keys(DRV).map(k => [k, DRV[k]])])}${sel('hub', T('Хаб', 'Hub', 'Hub', 'Хаб'), [['', ALL], ...Object.keys(HUBS).map(k => [k, HUBS[k].city])])}<button class="clear-all" data-act="clear">× ${esc(T('Сбросить', 'Zurücksetzen', 'Clear All', 'Тазалау'))}</button></div>${board()}` : S.dispTab === 'planning' ? planning() : partnersBody()}`,
  };
  /* drag & drop (HTML5) */
  let dragId = null;
  document.addEventListener('dragstart', e => { const c = e.target.closest && e.target.closest('.kcard'); if (c) { dragId = c.dataset.id; e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', dragId); } catch (_) {} } });
  const colOf = e => e.target.closest && e.target.closest('.col');
  const clearHi = () => $$('.col.drop-ok,.col.drop-no').forEach(c => c.classList.remove('drop-ok', 'drop-no'));
  document.addEventListener('dragover', e => { const col = colOf(e); if (!dragId || !col) return; e.preventDefault(); const l = load(dragId), ok = l.status === col.dataset.col || !canMove(l, col.dataset.col) || (l.status === 'unassigned' && col.dataset.col === 'assigned'); if (!col.classList.contains(ok ? 'drop-ok' : 'drop-no')) { clearHi(); col.classList.add(ok ? 'drop-ok' : 'drop-no'); } });
  document.addEventListener('dragend', () => { dragId = null; clearHi(); });
  document.addEventListener('drop', e => {
    const col = colOf(e); clearHi(); if (!col || !dragId) return; e.preventDefault();
    const l = load(dragId), to = col.dataset.col; dragId = null; if (l.status === to) return;
    if (l.status === 'unassigned' && to === 'assigned') {   // dropping an open load on "Assigned" picks the best eligible driver + truck
      const ts = S.trucks.filter(t => t.zones.includes(l.zone)).sort((a, b) => a.cap - b.cap), ds = S.drivers.slice().sort((a, b) => a.rto - b.rto);

      openDrawer({ type: 'load', id: l.id, tab: 'overview' }); return toast(T('Нет подходящей пары водитель + ТС — назначьте вручную', 'Kein passendes Paar Fahrer + Fahrzeug — manuell zuweisen', 'No eligible driver + truck pair — assign manually', 'Жарамды жұп жоқ — қолмен тағайындаңыз'), 'err');
    }
    const err = canMove(l, to); if (err) return toast(err, 'err');
    setStatus(l.id, to); render();
  });
})();

/* Reports (spec 5.10): six identical report-cards (chart + exactly 3 KPIs + PDF/CSV + View Details + AI summary),
   sticky filters, 840 px detail drawer (chart with tooltip, 4 KPIs, table, raw export). Numbers come from S.loads / S.invoices / S.costs;
   trend history before the current period is derived demo data. */
(function () {
  const R = { from: '2026-09-01', to: '2026-10-31', hub: '', zone: '', sum: {} };
  const dec = s => (LANG === 'en' ? s : s.replace('.', ','));
  const pc = v => dec(v.toFixed(1)) + ' %';
  const sg = v => (v < 0 ? '−' : '+') + dec(Math.abs(v).toFixed(1)) + ' %';
  const nf = n => Math.round(n).toLocaleString('ru-RU');
  const mio = n => n >= 1e6 ? dec((n / 1e6).toFixed(1)) + ' ' + T('млн', 'Mio.', 'M', 'млн') + ' ₸' : n >= 1e3 ? dec((n / 1e3).toFixed(1)) + ' ' + T('тыс', 'Tsd.', 'K', 'мың') + ' ₸' : nf(n) + ' ₸';
  const dd = iso => { const d = new Date(iso); return p2(d.getDate()) + '.' + p2(d.getMonth() + 1) + '.' + d.getFullYear(); };
  const lane = l => HUBS[l.from].city + ' → ' + HUBS[l.to].city;
  const day = iso => String(iso).slice(0, 10);
  const loadsF = () => S.loads.filter(l => day(l.eta) >= R.from && day(l.eta) <= R.to && (!R.hub || l.from === R.hub || l.to === R.hub) && (!R.zone || l.zone === R.zone));
  const invF = () => S.invoices.filter(i => i.created >= R.from && i.created <= R.to && (!R.zone || i.zone === R.zone) && (!R.hub || (i.load && load(i.load) && (load(i.load).from === R.hub || load(i.load).to === R.hub))));
  const sumLines = (iv, t) => iv.reduce((s, i) => s + i.lines.filter(x => x.type === t).reduce((a, x) => a + x.amount, 0), 0);
  const hist = k => [...k].reduce((s, c) => s + c.charCodeAt(0), 0) % 4 + 1;   // deterministic 30-day history per lane (demo)
  const excMin = l => (l.exc || 0) + (tempState(l) === 'breach' && isActive(l) ? 12 : 0);

  /* ---------- SVG charts ---------- */
  const CO = {};
  function chart(o) {
    if (!o.w) CO[o.id] = o;   // {type: area|bars|line|stack, labels, series:[[..]], colors:[..], min, max, step, w, h, tips, dots}
    const W = o.w || 300, H = o.h || 160, L = 28, B = 18, Tp = 6, iw = W - L - 6, ih = H - B - Tp, n = o.labels.length, ymin = o.min, ymax = o.max;
    const Y = v => Tp + ih - (v - ymin) / (ymax - ymin) * ih, X = i => L + (o.type === 'area' || o.type === 'line' ? (n === 1 ? iw / 2 : i / (n - 1) * iw) : (i + 0.5) * iw / n);
    let g = '';
    for (let v = ymin; v <= ymax + 1e-9; v += o.step) g += `<line x1="${L}" x2="${W - 6}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--chart-grid)" stroke-width="1"/><text x="${L - 4}" y="${Y(v) + 3}" font-size="8" fill="#9ca3af" text-anchor="end">${+v.toFixed(1)}</text>`;
    g += o.labels.map((t, i) => `<text x="${X(i)}" y="${H - 5}" font-size="8" fill="#9ca3af" text-anchor="middle">${esc(t)}</text>`).join('');
    const smooth = pts => pts.map((p, i) => i ? `C${(pts[i - 1][0] + p[0]) / 2},${pts[i - 1][1]} ${(pts[i - 1][0] + p[0]) / 2},${p[1]} ${p[0]},${p[1]}` : `M${p[0]},${p[1]}`).join(' ');
    const s0 = o.series[0], tipFor = (i, v) => (o.tips ? o.tips[i] : o.labels[i] + ': ' + dec(String(+v.toFixed(1))));
    if (o.type === 'area' || o.type === 'line') {
      const pts = s0.map((v, i) => [X(i), Y(v)]), path = smooth(pts);
      if (o.type === 'area') g += `<defs><linearGradient id="ga${o.id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--chart-area)"/><stop offset="1" stop-color="#fff" stop-opacity=".2"/></linearGradient></defs><path d="${path} L${pts[n - 1][0]},${Y(ymin)} L${pts[0][0]},${Y(ymin)}Z" fill="url(#ga${o.id})"/>`;
      g += `<path d="${path}" fill="none" stroke="${o.colors[0]}" stroke-width="2"/>`;
      if (o.dots) g += pts.map((p, i) => { const tx = Math.min(Math.max(p[0] - 40, 2), W - 84); return `<g class="pt"><circle cx="${p[0]}" cy="${p[1]}" r="4" fill="${o.dots}" stroke="#fff" stroke-width="1.5"/><g class="tip"><rect x="${tx}" y="${Math.max(p[1] - 36, 0)}" width="82" height="26" rx="6" fill="#fff" stroke="#e5e7eb"/><text x="${tx + 8}" y="${Math.max(p[1] - 20, 12)}" font-size="9" fill="#111827">${esc(tipFor(i, s0[i]))}</text></g></g>`; }).join('');
    } else {
      const bw = Math.min(34, iw / n * 0.55);
      o.series.forEach((s, k) => s.forEach((v, i) => { const below = o.type === 'stack' ? o.series.slice(0, k).reduce((a, q) => a + q[i], 0) : 0; const y1 = Y(below + v), y0 = Y(below);
        g += `<g class="pt"><rect x="${X(i) - bw / 2}" y="${y1}" width="${bw}" height="${Math.max(y0 - y1, 0)}" rx="3" fill="${o.colors[o.type === 'stack' ? k : i % o.colors.length]}"/><g class="tip"><rect x="${Math.min(Math.max(X(i) - 41, 2), W - 84)}" y="${Math.max(y1 - 30, 0)}" width="82" height="22" rx="6" fill="#fff" stroke="#e5e7eb"/><text x="${Math.min(Math.max(X(i) - 41, 2), W - 84) + 8}" y="${Math.max(y1 - 15, 12)}" font-size="9" fill="#111827">${esc(tipFor(i, v))}</text></g></g>`; }));
    }
    return `<svg viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
  }
  const hi = (a, st) => { const m = Math.max(...a, 1), s = st || (m <= 10 ? 2 : m <= 50 ? 10 : 20); return Math.ceil(m / s) * s; };

  /* ---------- the six cards ---------- */
  function cards() {
    const L = loadsF(), I = invF(), dv = L.filter(l => l.status === 'delivered'), net = I.reduce((s, i) => s + i.net, 0), cst = S.costs.filter(c => c.date >= R.from && c.date <= R.to && (!R.hub || c.hub === R.hub)).reduce((s, c) => s + c.amount, 0);
    const good = dv.filter(l => !l.exc && l.pod !== 'rejected').length, otif = dv.length ? good / dv.length * 100 : 0;
    const ev = L.filter(l => excMin(l) > 0), mins = ev.length ? ev.reduce((s, l) => s + excMin(l), 0) / ev.length : 0;
    const lanes = {}; L.forEach(l => { const k = lane(l); lanes[k] = lanes[k] || { n: 0 }; }); Object.keys(lanes).forEach(k => { lanes[k].n = hist(k) + ev.filter(l => lane(l) === k).length; });
    const lk = Object.keys(lanes).sort((a, b) => lanes[b].n - lanes[a].n).slice(0, 5), exTotal = lk.reduce((s, k) => s + lanes[k].n, 0);
    const act = S.drivers.filter(d => d.status !== 'rest').length, rate = S.drivers.length ? S.drivers.reduce((s, d) => s + d.rating, 0) / S.drivers.length : 0, fin = L.filter(l => ['delivered', 'problem'].includes(l.status)), comp = fin.length ? fin.filter(l => l.status === 'delivered').length / fin.length * 100 : 0;
    const mg = net ? (net - cst) / net * 100 : 0, nm = mg - 5.5;
    const reefer = sumLines(I, 'reefer'), fuel = sumLines(I, 'fuel'), det = S.costs.filter(c => c.cat === 'detention' && c.date >= R.from && c.date <= R.to).reduce((s, c) => s + c.amount, 0), acc = reefer + fuel + det;
    const cnt = I.reduce((s, i) => s + i.lines.filter(x => x.type !== 'freight').length, 0) + S.costs.filter(c => c.cat === 'detention').length;
    const wk = [T('Нед. 1', 'Wo 1', 'Wk 1', '1-апта'), T('Нед. 2', 'Wo 2', 'Wk 2', '2-апта'), T('Нед. 3', 'Wo 3', 'Wk 3', '3-апта'), T('Нед. 4', 'Wo 4', 'Wk 4', '4-апта'), T('Нед. 5', 'Wo 5', 'Wk 5', '5-апта')];
    const mo = [T('Май', 'Mai', 'May', 'Мамыр'), T('Июн', 'Jun', 'Jun', 'Мау'), T('Июл', 'Jul', 'Jul', 'Шіл'), T('Авг', 'Aug', 'Aug', 'Там'), T('Сен', 'Sep', 'Sep', 'Қыр'), T('Окт', 'Okt', 'Oct', 'Қаз')];
    const f3 = [0.62, 0.7, 0.78, 0.85, 0.93, 1].map(k => net * k);
    const r = (id, g, title, period, ch, k, extra, rows, cols) => ({ id, g, title, period, ch, k, extra, rows, cols });
    const tone = (v, l, t) => ({ v, l, t });
    const lr = ls => ls.map(l => [dd(l.eta), lane(l), drv(l.driver) ? drv(l.driver).name : '—', trk(l.truck) ? trk(l.truck).plate : '—', (l.temp - 0.6).toFixed(1) + ' / ' + (l.temp + 0.9).toFixed(1) + ' °C', (excMin(l) ? 'exc' : l.status === 'delivered' ? 'ok' : l.status), l.id]);
    const lcols = [T('Дата', 'Datum', 'Date', 'Күні'), T('Маршрут', 'Route', 'Route', 'Маршрут'), T('Водитель', 'Fahrer', 'Driver', 'Жүргізуші'), T('ТС (ГРЗ)', 'Fzg. (Kennz.)', 'Vehicle (plate)', 'КҚ (ГРЗ)'), T('t мин / макс', 't min / max', 't min / max', 't мин / макс'), T('Статус', 'Status', 'Status', 'Күйі'), 'ID'];
    const ir = iv => iv.map(i => [dd(i.created), i.id, cust(i.cust).name, i.route, nf(i.net), nf(i.total), i.paidAt ? 'paid' : 'open']);
    const icols = [T('Дата', 'Datum', 'Date', 'Күні'), T('Счёт', 'Rechnung', 'Invoice', 'Шот'), T('Клиент', 'Kunde', 'Customer', 'Клиент'), T('Маршрут', 'Route', 'Route', 'Маршрут'), T('Без НДС, ₸', 'Netto, ₸', 'Net, ₸', 'ҚҚС-сіз, ₸'), T('С НДС, ₸', 'Brutto, ₸', 'Gross, ₸', 'ҚҚС-пен, ₸'), T('Оплата', 'Zahlung', 'Payment', 'Төлем')];
    const otifS = [91.8, 92.6, 93.1, 93.9, otif || 94];
    return [
      r('otif', 'op', T('OTIF по хабам', 'OTIF je Hub', 'OTIF by hub', 'Хабтар бойынша OTIF'), T('30 дней', '30 Tage', 'Last 30 days', '30 күн'), chart({ id: 1, type: 'area', labels: wk, series: [otifS], colors: ['var(--chart-line)'], min: Math.floor(Math.min(...otifS) / 10) * 10, max: 100, step: 10, dots: 'var(--chart-line)', tips: otifS.map((v, i) => wk[i] + ': ' + dec(v.toFixed(1)) + ' %') }),

<div class="grid2 eq"><div class="card card-body"><h3 style="margin:0 0 8px;font-size:15px">${esc(T('Передача отправки партнёру', 'Sendung an Partner übergeben', 'Hand a load over to a partner', 'Жөнелтуді серіктеске тапсыру'))}</h3>
<label class="fl">${esc(T('Открытый рейс', 'Offene Fahrt', 'Open load', 'Ашық рейс'))}<select class="select" id="ho_l">${open.map(l => `<option value="${l.id}">${l.id} · ${esc(HUBS[l.from].city)} → ${esc(HUBS[l.to].city)} · ${ZONES[l.zone].label}</option>`).join('') || '<option value="">—</option>'}</select></label>
<label class="fl">${esc(T('Партнёр', 'Partner', 'Partner', 'Серіктес'))}<select class="select" id="ho_p">${lps.map(p => `<option value="${p.id}"${ok(p) ? '' : ' disabled'}>${esc(p.name)} · ${esc(city(p))} · ${TIER[p.tier][1]}</option>`).join('')}</select></label>
<button class="btn primary" data-act="hoNew"${open.length ? '' : ' disabled'}>${esc(T('Запросить передачу', 'Übergabe anfordern', 'Request handover', 'Тапсыруды сұрау'))}</button><p class="note" id="ho_e" style="color:var(--chip-red-fg)"></p>
${S.handovers.map(h => { const l = load(h.load), p = S.partners.find(x => x.id === h.p); return `<div class="tinted-row ${h.st === 'approved' ? 'green' : 'yellow'}"><span style="flex:1"><b>${h.id} · ${l.id}</b><div class="sub">${esc(p.name)} · ${esc(ST[l.status].l)}</div></span>${h.st === 'pending' ? `<button class="btn sm green" data-act="hoOk" data-id="${h.id}">${esc(T('Согласовать', 'Genehmigen', 'Approve', 'Келісу'))}</button>` : chip('green', T('Передано', 'Übergeben', 'Handed over', 'Тапсырылды'))}</div>`; }).join('')}</div>
<div class="card card-body"><h3 style="margin:0 0 8px;font-size:15px">${esc(T('Заявка в сервис', 'Werkstattauftrag', 'Workshop request', 'Сервіске өтінім'))}</h3>
<label class="fl">${esc(T('ТС', 'Fahrzeug', 'Truck', 'КҚ'))}<select class="select" id="wr_t">${trucks.map(t => `<option value="${t.id}">${esc(t.plate)} · ${esc(t.model)}</option>`).join('')}</select></label>
<label class="fl">${esc(T('Сервис', 'Werkstatt', 'Workshop', 'Сервис'))}<select class="select" id="wr_p">${ws.map(p => `<option value="${p.id}"${ok(p) ? '' : ' disabled'}>${esc(p.name)} · ${esc(city(p))}${p.cold ? ' · ' + T('реф', 'Kühl', 'reefer', 'реф') : ''}</option>`).join('')}</select></label>
<button class="btn primary" data-act="wrNew">${esc(T('Создать заявку', 'Auftrag erstellen', 'Create request', 'Өтінім құру'))}</button>
${S.wreq.map(r => `<div class="tinted-row ${r.st === 'closed' ? 'green' : 'blue'}"><span style="flex:1"><b>${r.id} · ${esc(trk(r.t).plate)}</b><div class="sub">${esc(S.partners.find(x => x.id === r.p).name)}</div></span>${r.st === 'open' ? `<input class="inp" style="width:110px" id="wc_${r.id}" type="number" min="1" placeholder="₸"><button class="btn sm green" data-act="wrClose" data-id="${r.id}">${esc(T('Закрыть', 'Schließen', 'Close', 'Жабу'))}</button>` : chip('green', nfk(r.cost))}</div>`).join('')}</div></div>`;
  };
  const nfk = n => Math.round(n).toLocaleString('ru-RU') + ' ₸';
  Object.assign(ACT, {
    ptRenew: d => { const p = S.partners.find(x => x.id === d.id); p.until = p.until.replace(/\d{4}$/, y => +y + 1); audit('Partners', p.id, 'Renew', p.until); render(); },
    ptQ: () => { go('pod'); S.podTab = 'quality'; render(); },
    ptUnb: d => { const p = S.partners.find(x => x.id === d.id); p.tier = 'bronze'; p.block = ''; p.until = '12.2027'; audit('Partners', p.id, 'Unblock', p.dev); render(); },
    hoNew: () => { const l = load($('#ho_l').value), p = S.partners.find(x => x.id === $('#ho_p').value); if (!l || !p) return; if (!fits(p, l)) { $('#ho_e').textContent = T('Партнёр не подходит: нужны ', 'Partner ungeeignet: nötig ', 'Partner not suitable: needs ', 'Серіктес жарамайды: қажет ') + need(l).trim().toUpperCase().replace('COLD', '2–8 °C'); return; } if (S.handovers.some(h => h.load === l.id)) return; S.handovers.push({ id: 'HO-' + String(S.handovers.length + 1).padStart(3, '0'), load: l.id, p: p.id, st: 'pending' }); render(); },
    hoOk: d => { const h = S.handovers.find(x => x.id === d.id), l = load(h.load), p = S.partners.find(x => x.id === h.p); h.st = 'approved'; l.partner = p.id; l.driver = 'p:' + p.id; l.truck = 'p:' + p.id; l.status = 'assigned'; l.notes.push({ who: 'System', t: fdt(NOW).slice(-5), text: T('Передано партнёру: ', 'An Partner übergeben: ', 'Handed over to partner: ', 'Серіктеске тапсырылды: ') + p.name }); audit('Partners', h.id, 'Handover', l.id + ' → ' + p.id); toast(T('Рейс передан партнёру', 'Fahrt an Partner übergeben', 'Load handed over to the partner', 'Рейс серіктеске тапсырылды')); },
    wrNew: () => { S.wreq.push({ id: 'WR-' + String(S.wreq.length + 1).padStart(3, '0'), t: $('#wr_t').value, p: $('#wr_p').value, st: 'open' }); render(); },
    wrClose: d => { const r = S.wreq.find(x => x.id === d.id), v = +($('#wc_' + d.id) || {}).value; if (!(v > 0)) return toast(T('Укажите сумму акта', 'Betrag der Abrechnung angeben', 'Enter the invoice amount', 'Акт сомасын көрсетіңіз'), 'err'); r.st = 'closed'; r.cost = v; S.costs.push({ id: 'C-' + (S.costs.length + 1), date: '2026-10-18', hub: trk(r.t).hub, text: T('Сервис: ', 'Service: ', 'Service: ', 'Сервис: ') + trk(r.t).plate + ' · ' + S.partners.find(x => x.id === r.p).name, amount: v, ref: '', cat: 'service' }); audit('Partners', r.id, 'Service closed', nfk(v)); toast(T('Затрата добавлена в «Счета → Затраты»', 'Kosten unter „Rechnungen → Kosten“ erfasst', 'Cost booked under Billing → Costs', 'Шығыс «Шоттар → Шығыстар» бөліміне қосылды')); },
  });
  document.addEventListener('input', e => { const k = e.target.dataset && e.target.dataset.pf; if (k) { F[k] = e.target.value; render(); } });
})();

render();

</script></body></html>
