* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); }
a { color: var(--accent); }
a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1040px; margin: 0 auto; padding: 32px 16px 64px; display: flex; flex-direction: column; gap: 20px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 13px; }
.seg { display: inline-flex; border: 1px solid var(--line); background: var(--surface); }
.seg button { border: 0; background: transparent; color: var(--ink); font: inherit; padding: 5px 10px; cursor: pointer; min-width: 40px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--bg); }
.eyebrow { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
h1 { margin: 4px 0 8px; font: 600 clamp(30px, 5.5vw, 42px)/1.05 var(--display); text-wrap: balance; }
.lead { margin: 0; color: var(--muted); max-width: 75ch; }
.counts { display: flex; flex-wrap: wrap; gap: 8px; }
.counts button { font: inherit; font-size: 13px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 6px 10px; display: inline-flex; gap: 8px; align-items: baseline; }
.counts button b { font-variant-numeric: tabular-nums; font-size: 16px; }
.counts button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.filters { display: grid; grid-template-columns: minmax(0, 2fr) repeat(3, minmax(0, 1fr)); gap: 10px; align-items: end; position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 10px 0; border-bottom: 1px solid var(--line); }
.filters label { display: flex; flex-direction: column; gap: 3px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); min-width: 0; }
.filters input, .filters select { font: 14px var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); padding: 7px 8px; width: 100%; min-width: 0; }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.bar .btns { display: flex; gap: 8px; flex-wrap: wrap; }
.bar button { font: inherit; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 5px 10px; cursor: pointer; }
.list { display: flex; flex-direction: column; gap: 10px; }
article { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--line); }
article.bug { border-left-color: var(--p-crit); }
article.FR { border-left-color: var(--accent); }
details > summary { list-style: none; cursor: pointer; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
details > summary::-webkit-details-marker { display: none; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12.5px; color: var(--muted); }
.id { font: 600 15px var(--display); color: var(--ink); letter-spacing: .02em; }
.tag { font-size: 11.5px; padding: 1px 7px; border: 1px solid currentColor; white-space: nowrap; }
.st-in_progress { color: var(--s-prog); background: var(--s-prog-bg); }
.st-implemented_partial { color: var(--s-part); background: var(--s-part-bg); }
.st-implemented, .st-fixed { color: var(--s-done); background: var(--s-done-bg); }
.st-planned { color: var(--s-plan); background: var(--s-plan-bg); }
.st-open_question { color: var(--s-q); background: var(--s-q-bg); }
.st-closed { color: var(--s-closed); background: var(--s-closed-bg); }
.pr { font-size: 12px; white-space: nowrap; }
.pr::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 5px; vertical-align: 1px; background: currentColor; }
.pr-critical { color: var(--p-crit); font-weight: 600; } .pr-critical::before { transform: rotate(45deg); }
.pr-high { color: var(--p-high); } .pr-medium { color: var(--p-med); } .pr-low { color: var(--p-low); } .pr-none { color: var(--p-low); } .pr-none::before { background: transparent; border: 1px solid currentColor; }
.ttl { font-weight: 600; font-size: 15.5px; line-height: 1.35; }
.chev { margin-left: auto; color: var(--muted); font-size: 12px; }
details[open] .chev { transform: rotate(180deg); }
.body { padding: 0 14px 14px; display: grid; gap: 10px; font-size: 14px; }
.body h3 { margin: 0 0 2px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.body p { margin: 0; overflow-wrap: anywhere; }
.note { border-left: 3px solid var(--s-part); padding: 4px 10px; background: var(--s-part-bg); }
.facts { font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 16px; overflow-wrap: anywhere; }
code { font: 12.5px var(--mono); background: var(--code); padding: 0 3px; overflow-wrap: anywhere; }
.empty { padding: 24px; text-align: center; color: var(--muted); border: 1px dashed var(--line); }
footer { font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }
@media (max-width: 720px) { .filters { grid-template-columns: 1fr 1fr; position: static; } .filters label.q { grid-column: 1 / -1; } }
@media (prefers-reduced-motion: no-preference) { .chev { transition: transform .15s; } }
@media print {
  :root { --bg: #fff; --surface: #fff; --ink: #000; --muted: #333; --line: #999; --code: #eee; }
  body { font-size: 10.5pt; }
  .top, .filters, .bar .btns, .chev { display: none !important; }
  .filters { position: static; }
  article { break-inside: avoid; border-left-width: 3px; }
  details > summary { padding: 6px 8px; } .body { padding: 0 8px 8px; }
  .counts button { border: 0; padding: 0 8px 0 0; }
}

,"priority":null,"status":"fixed","group":{"en":"Reported bugs (platform)","de":"Gemeldete Fehler (Plattform)","ru":"Сообщённые ошибки (платформа)"},"source":"docs/CHANGE-REQUESTS-2.md","en":{"title":"\"No line connects pick-up and destination\" shown to customers","finding":"\"No line connects pick-up and destination\" shown to customers","change":"Never refuse: route via a hub (transshipment), show +1–2 business days as info","acceptance":""},"de":{"title":"„Keine Linie verbindet Abholung und Ziel“ wird Kunden angezeigt","finding":"„Keine Linie verbindet Abholung und Ziel“ wird Kunden angezeigt","change":"Nie ablehnen: Route über einen Hub (Umschlag), +1–2 Arbeitstage als Info anzeigen","acceptance":""},"ru":{"title":"Клиентам показывается «Нет линии между пунктом забора и назначения»","finding":"Клиентам показывается «Нет линии между пунктом забора и назначения»","change":"Никогда не отказывать: маршрут через хаб (перевалка), показывать +1–2 рабочих дня как информацию","acceptance":""}},{"id":"B-09","type":"bug","date":"2026-10-12","priority":null,"status":"fixed","group":{"en":"Reported bugs (platform)","de":"Gemeldete Fehler (Plattform)","ru":"Сообщённые ошибки (платформа)"},"source":"docs/CHANGE-REQUESTS-2.md","en":{"title":"Portal pick-up/destination lists offer \"KDL Olymp · hub/branch\"; external customers ship from/to their own sites","finding":"Portal pick-up/destination lists offer \"KDL Olymp · hub/branch\"; external customers ship from/to their own sites","change":"City lists without KDL Olymp; street address mandatory and validated against the street directory of the city","acceptance":""},"de":{"title":"Abhol-/Ziellisten im Portal bieten „KDL Olymp · Hub/Niederlassung“ an; externe Kunden versenden von/zu eigenen Standorten","finding":"Abhol-/Ziellisten im Portal bieten „KDL Olymp · Hub/Niederlassung“ an; externe Kunden versenden von/zu eigenen Standorten","change":"Städtelisten ohne KDL Olymp; Straßenadresse Pflicht und gegen das Straßenverzeichnis der Stadt validiert","acceptance":""},"ru":{"title":"Списки забора/назначения в портале предлагают «KDL Olymp · хаб/филиал»; внешние клиенты отправляют со своих площадок и на свои","finding":"Списки забора/назначения в портале предлагают «KDL Olymp · хаб/филиал»; внешние клиенты отправляют со своих площадок и на свои","change":"Списки городов без KDL Olymp; адрес с улицей обязателен и проверяется по справочнику улиц города","acceptance":""}},{"id":"FR-138","type":"FR","date":"2026-10-11","priority":"medium","status":"implemented_partial","status_note":{"en":"Initial bundle for /s/overview is 412 KB against the 350 KB target.","de":"Initiales Bundle für /s/overview 412 KB statt Ziel 350 KB.","ru":"Начальный бандл для /s/overview 412 КБ при цели 350 КБ."},"group":{"en":"Operations, UX, i18n, testing & performance","de":"Betrieb, UX, i18n, Tests & Performance","ru":"Эксплуатация, UX, i18n, тестирование и производительность"},"depends":"FR-84, FR-131","effort":"M","source":"docs/CHANGE-REQUESTS.md","en":{"title":"Isolate the 2-s live tick from the app tree; code-split screens; bundle budget","finding":"Every 2 s `setUiState(tick)` replaces `ui` (`V5.tsx:100`), which recreates `E` (`V5.tsx:132-135`). The whole tree re-renders, including the sidebar (`useV5Nav` recomputes `loadCalc` + `alertsAll` + `navBadges`, `Shell.tsx:20-27`) and the header (`alertsAll`, `searchLines`, `Shell.tsx:63-65`), even when the tab is hidden. The production JS is one 972 KB chunk (`frontend/dist/assets/index-COiDXqTD.js`), up from ~640 KB. Only DemoBar is lazy (`main.tsx:15`); the 721-line `integrationsCatalog.ts` and ~1,500 lines of help are always loaded.","change":"Move `live`, `t` and `door` into a separate `LiveContext` (only Thermo, Overview and Driver subscribe). Memoize `alertsAll` and `navBadges` on `doc`. Pause the tick on `document.hidden`. `React.lazy` per screen, plus help and integrations catalogue. Add a CI budget (`vite build` → fail if the initial JS exceeds 400 KB gzip or any chunk exceeds 250 KB).","acceptance":"React Profiler: an idle tick re-renders ≤ 3 components outside Thermo. Initial JS for `/s/overview` is ≤ 350 KB uncompressed. With the tab hidden for 60 s, 0 ticks run. The budget check runs in `ci.yml`."},"de":{"title":"2-s-Live-Tick vom App-Baum isolieren; Bildschirme per Code-Splitting; Bundle-Budget","finding":"Alle 2 s ersetzt `setUiState(tick)` das `ui` (`V5.tsx:100`), was `E` neu erzeugt (`V5.tsx:132-135`). Der ganze Baum rendert neu, einschließlich Seitenleiste (`useV5Nav` berechnet `loadCalc` + `alertsAll` + `navBadges` neu, `Shell.tsx:20-27`) und Kopfzeile (`alertsAll`, `searchLines`, `Shell.tsx:63-65`), auch bei verborgenem Tab. Das Produktiv-JS ist ein einziger Chunk von 972 KB (`frontend/dist/assets/index-COiDXqTD.js`), gestiegen von ~640 KB. Nur DemoBar ist lazy (`main.tsx:15`); die 721 Zeilen `integrationsCatalog.ts` und ~1 500 Zeilen Hilfe werden immer geladen.","change":"`live`, `t` und `door` in einen eigenen `LiveContext` verlagern (nur Thermo, Übersicht und Fahrer abonnieren). `alertsAll` und `navBadges` auf `doc` memoisieren. Tick bei `document.hidden` pausieren. `React.lazy` je Bildschirm plus Hilfe und Integrationskatalog. CI-Budget (`vite build` → Fehler, wenn das initiale JS 400 KB gzip oder ein Chunk 250 KB übersteigt).","acceptance":"React Profiler: ein Leerlauf-Tick rendert außerhalb von Thermo ≤ 3 Komponenten neu. Das initiale JS für `/s/overview` ist ≤ 350 KB unkomprimiert. Bei 60 s verborgenem Tab laufen 0 Ticks. Die Budgetprüfung läuft in `ci.yml`."},"ru":{"title":"Изолировать 2-секундный такт «онлайн» от дерева приложения; разделение экранов на чанки; бюджет бандла","finding":"Каждые 2 с `setUiState(tick)` заменяет `ui` (`V5.tsx:100`), что пересоздаёт `E` (`V5.tsx:132-135`). Всё дерево перерисовывается, включая боковую панель (`useV5Nav` пересчитывает `loadCalc` + `alertsAll` + `navBadges`, `Shell.tsx:20-27`) и заголовок (`alertsAll`, `searchLines`, `Shell.tsx:63-65`), даже на скрытой вкладке. Продуктивный JS — один чанк 972 КБ (`frontend/dist/assets/index-COiDXqTD.js`), вырос с ~640 КБ. Лениво загружается только DemoBar (`main.tsx:15`); 721 строка `integrationsCatalog.ts` и ~1 500 строк справки загружаются всегда.","change":"Перенести `live`, `t` и `door` в отдельный `LiveContext` (подписаны только «Термостатус», «Обзор» и «Водитель»). Мемоизировать `alertsAll` и `navBadges` по `doc`. Останавливать такт при `document.hidden`. `React.lazy` для каждого экрана, а также справки и каталога интеграций. Бюджет в CI (`vite build` → ошибка, если начальный JS превышает 400 КБ gzip или любой чанк — 250 КБ).","acceptance":"React Profiler: такт в простое перерисовывает ≤ 3 компонентов вне «Термостатуса». Начальный JS для `/s/overview` ≤ 350 КБ без сжатия. При скрытой вкладке 60 с выполняется 0 тактов. Проверка бюджета работает в `ci.yml`."}},{"id":"FR-137","type":"FR","date":"2026-10-11","priority":"medium","status":"implemented","group":{"en":"Operations, UX, i18n, testing & performance","de":"Betrieb, UX, i18n, Tests & Performance","ru":"Эксплуатация, UX, i18n, тестирование и производительность"},"depends":"FR-85, FR-132","effort":"S","source":"docs/CHANGE-REQUESTS.md","en":{"title":"Generate screen and help permissions from the backend; exhaustive role × action test","finding":"Permissions are kept in four places: `rbac.py:265-286`, `frontend/src/v5/screens/index.ts:23-40` (screen perms), `frontend/src/help/screens.ts` (`perm:` per screen) and `help/roles.ts:1-2` (\"mirror of rbac.py … keep in sync\"). The concept's role logic is visible only per module test (`tests/test_v5_*.py`). A driver can open Dispatcher, Load, Docs, Weather and Partners because they need only `trips:read` (`screens/index.ts:25-34`), which the driver role holds (`rbac.py:279`).","change":"Extend `scripts/dump_v5_meta.py` to emit `ROLE_PERMS`, the screen→perm map and the action→perm map. The frontend imports meta for nav, help and Guard. Add a parametrized pytest over all roles × 46+ actions (expected 200/403 from a declarative table) and over all roles × 17 screens. Decide the driver's screen set explicitly (Driver, Coverage only).","acceptance":"Changing a perm in `rbac.py` without regenerating meta fails CI (checksum). The role × action table test covers 100 % of `ACTIONS`. A driver sees exactly the screens in the agreed list. The help page \"who can open\" equals the backend matrix."},"de":{"title":"Bildschirm- und Hilfeberechtigungen aus dem Backend generieren; vollständiger Test Rolle × Aktion","finding":"Berechtigungen werden an vier Stellen gepflegt: `rbac.py:265-286`, `frontend/src/v5/screens/index.ts:23-40` (Bildschirmrechte), `frontend/src/help/screens.ts` (`perm:` je Bildschirm) und `help/roles.ts:1-2` („mirror of rbac.py … keep in sync“). Die Rollenlogik des Konzepts ist nur in einzelnen Modultests sichtbar (`tests/test_v5_*.py`). Ein Fahrer kann Disponent, Beladung, Dokumente, Wetter und Partner öffnen, weil diese nur `trips:read` brauchen (`screens/index.ts:25-34`), das die Fahrerrolle besitzt (`rbac.py:279`).","change":"`scripts/dump_v5_meta.py` erweitern, sodass es `ROLE_PERMS`, die Zuordnung Bildschirm→Recht und Aktion→Recht ausgibt. Das Frontend importiert die Metadaten für Navigation, Hilfe und Guard. Parametrisierter pytest über alle Rollen × 46+ Aktionen (erwartet 200/403 aus einer deklarativen Tabelle) und über alle Rollen × 17 Bildschirme. Bildschirmumfang des Fahrers ausdrücklich festlegen (nur Fahrer, Abdeckung).","acceptance":"Eine Rechteänderung in `rbac.py` ohne Neugenerierung der Metadaten lässt die CI fehlschlagen (Prüfsumme). Der Tabellentest Rolle × Aktion deckt 100 % von `ACTIONS` ab. Ein Fahrer sieht genau die Bildschirme der vereinbarten Liste. Die Hilfeseite „wer darf öffnen“ entspricht der Backend-Matrix."},"ru":{"title":"Генерировать права экранов и справки из бэкенда; полный тест роль × действие","finding":"Права хранятся в четырёх местах: `rbac.py:265-286`, `frontend/src/v5/screens/index.ts:23-40` (права экранов), `frontend/src/help/screens.ts` (`perm:` по экрану) и `help/roles.ts:1-2` («mirror of rbac.py … keep in sync»). Ролевая логика концепта видна только в отдельных тестах модулей (`tests/test_v5_*.py`). Водитель может открыть «Диспетчер», «Загрузку», «Документы», «Погоду» и «Партнёров», потому что им нужен только `trips:read` (`screens/index.ts:25-34`), который есть у роли водителя (`rbac.py:279`).","change":"Расширить `scripts/dump_v5_meta.py`, чтобы он выводил `ROLE_PERMS`, соответствие экран→право и действие→право. Фронтенд импортирует метаданные для навигации, справки и Guard. Параметризованный pytest по всем ролям × 46+ действиям (ожидаемые 200/403 из декларативной таблицы) и по всем ролям × 17 экранам. Явно определить набор экранов водителя (только «Водитель», «Покрытие»).","acceptance":"Изменение права в `rbac.py` без перегенерации метаданных роняет CI (контрольная сумма). Табличный тест роль × действие покрывает 100 % `ACTIONS`. Водитель видит ровно экраны согласованного списка. Страница справки «кто может открыть» совпадает с матрицей бэкенда."}},{"id":"FR-136","type":"FR","date":"2026-10-11","priority":"medium","status":"implemented","group":{"en":"Operations, UX, i18n, testing & performance","de":"Betrieb, UX, i18n, Tests & Performance","ru":"Эксплуатация, UX, i18n, тестирование и производительность"},"depends":"FR-137","effort":"L","source":"docs/CHANGE-REQUESTS.md","en":{"title":"Run the 494 suite against the real backend in CI; parity of the demo mirror","finding":"The 494 scenarios run only against the browser demo (`.github/workflows/pages.yml` \"Run ported UI suite\"), where `DEMO_SINGLE_USER = true` disables the four-eyes rules (`frontend/src/demo/v5/costs.ts:8`, `baseline.ts:31`, `partners.ts:67`). The 46 server actions are re-implemented in TS (`frontend/src/demo/v5/*.ts`) with no parity check. `ci.yml` (push/PR) runs neither the suite nor `oxlint`, and `pages.yml` runs only on `main`, so PRs are not gated by the UI suite. Ordered stateful tests (`V5-PORT.md:198`) make failures cascade.","change":"(1) Add a CI job: `docker compose -f deploy/demo/docker-compose.yml up`, seed users per role, and run `suite.dc.js` and `suite-ext.js` against the real API (logins scripted with a TOTP secret from a test fixture). (2) Add a parity test: a shared JSON fixture of (action, payload, role) is run through the Python handler and the TS mirror, and the documents and statuses are compared. (3) Run the suite on PRs. (4) Reset state per module group (`/api/v5/reset` in non-prod) to cut cascades.","acceptance":"A PR that changes `modules/costs.py` without the TS mirror fails the parity job. The suite runs green against the backend with four-eyes active (the second signature by a second user). `ci.yml` runs on PRs: lint, tsc, pytest and the UI suite (backend)."},"de":{"title":"494er-Suite in der CI gegen das echte Backend; Parität des Demo-Spiegels","finding":"Die 494 Szenarien laufen nur gegen das Browser-Demo (`.github/workflows/pages.yml` „Run ported UI suite“), wo `DEMO_SINGLE_USER = true` die Vier-Augen-Regeln abschaltet (`frontend/src/demo/v5/costs.ts:8`, `baseline.ts:31`, `partners.ts:67`). Die 46 Serveraktionen sind in TS nachimplementiert (`frontend/src/demo/v5/*.ts`) ohne Paritätsprüfung. `ci.yml` (Push/PR) führt weder die Suite noch `oxlint` aus, und `pages.yml` läuft nur auf `main`, sodass PRs nicht durch die UI-Suite abgesichert sind. Geordnete zustandsbehaftete Tests (`V5-PORT.md:198`) lassen Fehler kaskadieren.","change":"(1) CI-Job: `docker compose -f deploy/demo/docker-compose.yml up`, Nutzer je Rolle anlegen und `suite.dc.js` und `suite-ext.js` gegen die echte API ausführen (Logins skriptgesteuert mit TOTP-Secret aus einer Test-Fixture). (2) Paritätstest: eine gemeinsame JSON-Fixture aus (Aktion, Payload, Rolle) läuft durch den Python-Handler und den TS-Spiegel, Dokumente und Status werden verglichen. (3) Suite auf PRs ausführen. (4) Zustand je Modulgruppe zurücksetzen (`/api/v5/reset` außerhalb von Prod), um Kaskaden zu vermeiden.","acceptance":"Ein PR, der `modules/costs.py` ohne den TS-Spiegel ändert, lässt den Paritätsjob fehlschlagen. Die Suite läuft grün gegen das Backend mit aktivem Vier-Augen-Prinzip (zweite Unterschrift durch einen zweiten Nutzer). `ci.yml` läuft auf PRs: Lint, tsc, pytest und UI-Suite (Backend)."},"ru":{"title":"Набор 494 в CI против реального бэкенда; паритет демо-зеркала","finding":"494 сценария выполняются только на браузерном демо (`.github/workflows/pages.yml` «Run ported UI suite»), где `DEMO_SINGLE_USER = true` отключает правила «четыре глаза» (`frontend/src/demo/v5/costs.ts:8`, `baseline.ts:31`, `partners.ts:67`). 46 серверных действий заново реализованы на TS (`frontend/src/demo/v5/*.ts`) без проверки паритета. `ci.yml` (push/PR) не запускает ни набор, ни `oxlint`, а `pages.yml` работает только на `main`, поэтому PR не защищены UI-набором. Упорядоченные тесты с состоянием (`V5-PORT.md:198`) дают каскад падений.","change":"(1) Задание CI: `docker compose -f deploy/demo/docker-compose.yml up`, создать пользователей по ролям и запустить `suite.dc.js` и `suite-ext.js` против реального API (входы по скрипту с секретом TOTP из тестовой фикстуры). (2) Тест паритета: общая JSON-фикстура (действие, данные, роль) прогоняется через Python-обработчик и TS-зеркало, документы и статусы сравниваются. (3) Запускать набор на PR. (4) Сбрасывать состояние по группам модулей (`/api/v5/reset` вне продуктива), чтобы избежать каскадов.","acceptance":"PR, меняющий `modules/costs.py` без TS-зеркала, роняет задание паритета. Набор проходит против бэкенда с включёнными «четырьмя глазами» (вторая подпись — вторым пользователем). `ci.yml` работает на PR: lint, tsc, pytest и UI-набор (бэкенд)."}},{"id":"FR-135","type":"FR","date":"2026-10-11","priority":"medium","status":"implemented_partial","status_note":{"en":"KATO codes not yet verified (→ FR-169); some Kazakh texts still fall back to RU (→ FR-170).","de":"KATO-Codes noch nicht verifiziert (→ FR-169); einige kasachische Texte fallen noch auf RU zurück (→ FR-170).","ru":"Коды КАТО ещё не проверены (→ FR-169); часть казахских текстов пока откатывается на RU (→ FR-170)."},"group":{"en":"Operations, UX, i18n, testing & performance","de":"Betrieb, UX, i18n, Tests & Performance","ru":"Эксплуатация, UX, i18n, тестирование и производительность"},"depends":"FR-71, FR-78","effort":"M","source":"docs/CHANGE-REQUESTS.md","en":{"title":"City/location master with ids; Kazakh UI; transliteration of external texts","finding":"Cities are joined by display strings. `WX` is keyed by localized name (`mock-v5.de.json` `WX` keys \"Astana\", \"Karaganda\"), `CITY_RU` is derived by index (`ref.py:190`), external events must name cities in RU (`inbox.py:13`), and baseline data stores `[\"Астана\",\"Astana\"]` pairs (`BLR.route`, `BLC`). Inbox `title/text` from connectors is stored as received (RU), so DE/EN screens show Cyrillic, against the DOM rule \"no Cyrillic on DE/EN\" (`V5-PORT.md:182`). Kazakh exists only in the driver app (`i18n.tsx:4` LANGS = ru/de/en, `DV`).","change":"Add a `locations` master (id `KZ-AST`, names ru/kk/de/en, KATO code, coordinates, hub). Replace name keys in WX, BLC, BLR and LINES with ids, and have the inbox accept `city_id` or a resolver (RU/KK/Latin aliases). Add a `translit(ru→Latin, BGN/PCGN)` helper for external free text on DE/EN, with the original on hover. Add `kk` as a 4th UI language (start with nav, Overview and Driver, falling back to RU).","acceptance":"A test over the 3 reference files finds no city name used as a key. An inbox event with `city:\"Қарағанды\"` or `\"Karaganda\"` routes like `\"Караганда\"`. A DE screen with an RU inbox message passes the no-Cyrillic DOM walk. A KK language switch is available, and missing keys fall back to RU with a CI report."},"de":{"title":"Orts-/Standortstamm mit IDs; kasachische UI; Transliteration externer Texte","finding":"Städte werden über Anzeigetexte verknüpft. `WX` ist nach lokalisiertem Namen geschlüsselt (`mock-v5.de.json`, `WX`-Schlüssel „Astana“, „Karaganda“), `CITY_RU` wird per Index abgeleitet (`ref.py:190`), externe Ereignisse müssen Städte auf Russisch nennen (`inbox.py:13`), und die Ausgangsdaten speichern Paare `[\"Астана\",\"Astana\"]` (`BLR.route`, `BLC`). `title/text` aus Konnektoren werden in der Inbox wie empfangen (RU) gespeichert, sodass DE/EN-Bildschirme Kyrillisch zeigen – gegen die DOM-Regel „kein Kyrillisch auf DE/EN“ (`V5-PORT.md:182`). Kasachisch gibt es nur in der Fahrer-App (`i18n.tsx:4` LANGS = ru/de/en, `DV`).","change":"Stamm `locations` ergänzen (ID `KZ-AST`, Namen ru/kk/de/en, KATO-Code, Koordinaten, Hub). Namensschlüssel in WX, BLC, BLR und LINES durch IDs ersetzen; die Inbox akzeptiert `city_id` oder einen Resolver (RU/KK/lateinische Aliasse). Helfer `translit(ru→Latin, BGN/PCGN)` für externen Freitext auf DE/EN, Original per Hover. `kk` als 4. UI-Sprache (Beginn mit Navigation, Übersicht und Fahrer, Fallback auf RU).","acceptance":"Ein Test über die 3 Referenzdateien findet keinen Städtenamen als Schlüssel. Ein Inbox-Ereignis mit `city:\"Қарағанды\"` oder `\"Karaganda\"` wird wie `\"Караганда\"` geroutet. Ein DE-Bildschirm mit einer RU-Inbox-Nachricht besteht den DOM-Durchlauf „kein Kyrillisch“. Eine KK-Sprachumschaltung ist verfügbar, fehlende Schlüssel fallen mit CI-Bericht auf RU zurück."},"ru":{"title":"Справочник городов/пунктов с id; казахский интерфейс; транслитерация внешних текстов","finding":"Города связываются по отображаемым строкам. `WX` использует локализованное название как ключ (`mock-v5.de.json`, ключи `WX` «Astana», «Karaganda»), `CITY_RU` выводится по индексу (`ref.py:190`), внешние события должны называть города по-русски (`inbox.py:13`), а исходные данные хранят пары `[\"Астана\",\"Astana\"]` (`BLR.route`, `BLC`). `title/text` входящих от коннекторов сохраняются как получены (RU), поэтому экраны DE/EN показывают кириллицу вопреки DOM-правилу «нет кириллицы на DE/EN» (`V5-PORT.md:182`). Казахский есть только в приложении водителя (`i18n.tsx:4` LANGS = ru/de/en, `DV`).","change":"Добавить справочник `locations` (id `KZ-AST`, названия ru/kk/de/en, код КАТО, координаты, хаб). Заменить ключи-названия в WX, BLC, BLR и LINES на id; входящие принимают `city_id` или резолвер (псевдонимы RU/KK/латиница). Помощник `translit(ru→Latin, BGN/PCGN)` для внешнего свободного текста на DE/EN, оригинал при наведении. `kk` как 4-й язык интерфейса (начать с навигации, «Обзора» и «Водителя», с откатом на RU).","acceptance":"Тест по 3 справочным файлам не находит названий городов в роли ключей. Входящее событие с `city:\"Қарағанды\"` или `\"Karaganda\"` маршрутизируется как `\"Караганда\"`. Экран DE с входящим сообщением на RU проходит DOM-проверку «нет кириллицы». Доступно переключение на KK, отсутствующие ключи откатываются на RU с отчётом CI."}},{"id":"FR-134","type":"FR","date":"2026-10-11","priority":"medium","status":"implemented_partial","status_note":{"en":"No real axe-core run in the UI suite yet.","de":"Noch kein echter axe-core-Lauf in der UI-Suite.","ru":"Реального прогона axe-core в UI-наборе пока нет."},"group":{"en":"Operations, UX, i18n, testing & performance","de":"Betrieb, UX, i18n, Tests & Performance","ru":"Эксплуатация, UX, i18n, тестирование и производительность"},"depends":"FR-133","effort":"S","source":"docs/CHANGE-REQUESTS.md","en":{"title":"Navigation as links, skip link, non-colour status cues","finding":"The v5 nav items are `<button onClick={go(...)}>` without `href` (`Layout.tsx:52-59`): no \"open in new tab\", no link semantics for screen readers. There is no skip-to-content link and no `prefers-reduced-motion` handling (`index.css`, `v5.css`). Traffic-light tags carry meaning by inline oklch colour (`<Tag l>`, `V5-PORT.md` DOM contract).","change":"Render `<a href=\"/s/<key>\" data-nav>` with the same classes. Adapt the ported selector `nav button` → `nav [data-nav]` with a `// port:` marker (allowed by V5-PORT rules). Add a skip link to `main` and an `aria-live` region for toasts (already `role=status`, keep). Prefix each Tag with a level glyph or text (●/▲/■ + \"крит.\"). Add a reduced-motion media query for the live pulse.","acceptance":"axe-core run in the UI suite shows 0 serious or critical violations on all 17 screens. Middle-click on a nav item opens a new tab. Tags are distinguishable in a grayscale screenshot (level text present)."},"de":{"title":"Navigation als Links, Skip-Link, Statushinweise nicht nur über Farbe","finding":"Die v5-Navigationspunkte sind `<button onClick={go(...)}>` ohne `href` (`Layout.tsx:52-59`): kein „in neuem Tab öffnen“, keine Link-Semantik für Screenreader. Es gibt keinen Skip-to-content-Link und keine Behandlung von `prefers-reduced-motion` (`index.css`, `v5.css`). Ampel-Tags tragen ihre Bedeutung über Inline-oklch-Farbe (`<Tag l>`, DOM-Vertrag in `V5-PORT.md`).","change":"`<a href=\"/s/<key>\" data-nav>` mit denselben Klassen rendern. Den portierten Selektor `nav button` → `nav [data-nav]` mit `// port:`-Markierung anpassen (nach V5-PORT-Regeln erlaubt). Skip-Link zu `main` und eine `aria-live`-Region für Toasts (bereits `role=status`, beibehalten). Jedem Tag ein Stufenzeichen oder Text voranstellen (●/▲/■ + „крит.“). Reduced-Motion-Media-Query für den Live-Puls.","acceptance":"Ein axe-core-Lauf in der UI-Suite zeigt 0 schwere oder kritische Verstöße auf allen 17 Bildschirmen. Mittelklick auf einen Navigationspunkt öffnet einen neuen Tab. Tags sind in einem Graustufen-Screenshot unterscheidbar (Stufentext vorhanden)."},"ru":{"title":"Навигация ссылками, ссылка «к содержимому», статусы не только цветом","finding":"Пункты навигации v5 — `<button onClick={go(...)}>` без `href` (`Layout.tsx:52-59`): нет «открыть в новой вкладке», нет семантики ссылки для экранных дикторов. Нет ссылки перехода к содержимому и обработки `prefers-reduced-motion` (`index.css`, `v5.css`). Метки-светофоры передают смысл только встроенным цветом oklch (`<Tag l>`, DOM-контракт в `V5-PORT.md`).","change":"Рендерить `<a href=\"/s/<key>\" data-nav>` с теми же классами. Адаптировать перенесённый селектор `nav button` → `nav [data-nav]` с пометкой `// port:` (разрешено правилами V5-PORT). Добавить ссылку перехода к `main` и область `aria-live` для всплывающих сообщений (уже `role=status`, сохранить). Перед каждой меткой — символ или текст уровня (●/▲/■ + «крит.»). Медиазапрос reduced-motion для пульсации «онлайн».","acceptance":"Прогон axe-core в UI-наборе показывает 0 серьёзных или критических нарушений на всех 17 экранах. Средний клик по пункту навигации открывает новую вкладку. Метки различимы на скриншоте в оттенках серого (есть текст уровня)."}},{"id":"FR-133","type":"FR","date":"2026-10-11","priority":"medium","status":"implemented","group":{"en":"Operations, UX, i18n, testing & performance","de":"Betrieb, UX, i18n, Tests & Performance","ru":"Эксплуатация, UX, i18n, тестирование и производительность"},"depends":"FR-134, FR-136","effort":"M","source":"docs/CHANGE-REQUESTS.md","en":{"title":"Phone-width navigation drawer and viewport/overlap tests in the UI suite","finding":"Below 900 px the sidebar becomes static and all ≈40 nav buttons (17 v5, 5 simulation buttons, ~20 records items, help) wrap above the content (`index.css:162-165`). A dispatcher on a phone scrolls past the whole menu on every screen. The UI suite runs only at 1500×1000 (`scripts/ui_suite.py:38`, `tools/run-ui-tests.cjs:7`). The sticky trip panel covering \"Лента приложения водителя\" on Dispatcher was found manually and fixed only by removing `position: sticky` (`v5/v5.css` diff on `.v5-ops-aside`), with no test.","change":"Add a hamburger drawer (`<nav>` off-canvas, `aria-expanded`) under 900 px and a bottom bar for the 4 most-used screens per role. Add `suite-layout.js`: for each of the 17 screens at 390×844, 1024×768 and 1500×1000, assert no horizontal page scroll (`scrollWidth <= innerWidth`) and no overlap of `section`/`aside` bounding boxes (`[data-disp-drv]` vs `.v5-ops-aside`).","acceptance":"At 390 px the first screen content is visible without scrolling past the nav. The layout suite passes for 17 screens × 3 viewports and fails if `.v5-ops-aside` is made sticky again. Lighthouse mobile accessibility ≥ 90 on `/s/overview`."},"de":{"title":"Navigationsschublade für Smartphone-Breite und Viewport-/Überlappungstests in der UI-Suite","finding":"Unter 900 px wird die Seitenleiste statisch, und alle ≈40 Navigationsknöpfe (17 v5, 5 Simulationsknöpfe, ~20 Registereinträge, Hilfe) umbrechen über dem Inhalt (`index.css:162-165`). Ein Disponent am Telefon scrollt auf jedem Bildschirm am ganzen Menü vorbei. Die UI-Suite läuft nur bei 1500×1000 (`scripts/ui_suite.py:38`, `tools/run-ui-tests.cjs:7`). Das klebende Tourpanel, das „Лента приложения водителя“ im Disponenten verdeckte, wurde manuell gefunden und nur durch Entfernen von `position: sticky` behoben (`v5/v5.css`-Diff an `.v5-ops-aside`), ohne Test.","change":"Hamburger-Schublade (`<nav>` off-canvas, `aria-expanded`) unter 900 px und eine untere Leiste für die 4 meistgenutzten Bildschirme je Rolle. `suite-layout.js` ergänzen: für jeden der 17 Bildschirme bei 390×844, 1024×768 und 1500×1000 prüfen, dass kein horizontales Seitenscrollen auftritt (`scrollWidth <= innerWidth`) und sich die Begrenzungsrahmen von `section`/`aside` nicht überlappen (`[data-disp-drv]` vs. `.v5-ops-aside`).","acceptance":"Bei 390 px ist der erste Bildschirminhalt sichtbar, ohne am Menü vorbeizuscrollen. Die Layout-Suite besteht für 17 Bildschirme × 3 Viewports und schlägt fehl, wenn `.v5-ops-aside` wieder sticky gemacht wird. Lighthouse-Mobile-Barrierefreiheit ≥ 90 auf `/s/overview`."},"ru":{"title":"Выдвижное меню на ширине телефона и тесты вьюпорта/перекрытий в UI-наборе","finding":"Ниже 900 px боковая панель становится статичной, и все ≈40 кнопок навигации (17 v5, 5 кнопок симуляции, ~20 пунктов учёта, справка) переносятся над содержимым (`index.css:162-165`). Диспетчер на телефоне на каждом экране пролистывает всё меню. UI-набор работает только при 1500×1000 (`scripts/ui_suite.py:38`, `tools/run-ui-tests.cjs:7`). Липкая панель рейса, перекрывавшая «Ленту приложения водителя» в «Диспетчере», найдена вручную и исправлена только удалением `position: sticky` (diff `v5/v5.css` для `.v5-ops-aside`), без теста.","change":"Выдвижное меню-«гамбургер» (`<nav>` вне экрана, `aria-expanded`) ниже 900 px и нижняя панель с 4 самыми используемыми экранами по роли. Добавить `suite-layout.js`: для каждого из 17 экранов при 390×844, 1024×768 и 1500×1000 проверять отсутствие горизонтальной прокрутки страницы (`scrollWidth <= innerWidth`) и неперекрытие рамок `section`/`aside` (`[data-disp-drv]` vs `.v5-ops-aside`).","acceptance":"При 390 px первое содержимое экрана видно без пролистывания меню. Набор вёрстки проходит для 17 экранов × 3 вьюпорта и падает, если `.v5-ops-aside` снова сделать липкой. Доступность Lighthouse mobile ≥ 90 на `/s/overview`."}},{"id":"FR-132","type":"FR","date":"2026-10-11","priority":"high","status":"implemented","group":{"en":"Operations, UX, i18n, testing & performance","de":"Betrieb, UX, i18n, Tests & Performance","ru":"Эксплуатация, UX, i18n, тестирование и производительность"},"depends":"FR-137","effort":"M","source":"docs/CHANGE-REQUESTS.md","en":{"title":"One navigation model: remove duplicate menu items and fix screen numbering","finding":"The sidebar shows the 17 v5 screens and then the group «Учёт и администрирование» with entries of the same name: «Диспетчер» (`i18n.tsx:14`, `Layout.tsx:14`), «Термостатус» (`i18n.tsx:17`, `Layout.tsx:17`) and «Автопарк» (`i18n.tsx:19`, `Layout.tsx:22`). They lead to different legacy pages (`/dispatch`, `/temperature`, `/fleet`), and \"Сводка по рейсам\" duplicates Overview. The concept codes in `NAV` repeat 04 (ship, thermo) and 10 (partners, staff) and skip 14, while the Shell renumbers by index (`Shell.tsx:26, 85`), so codes in concept and FR documents do not match the UI.","change":"Merge the legacy functions into the v5 screens as tabs (Fleet → `/s/fleet` tab \"Записи/Документы\"; Temperature readings → `/s/thermo` tab \"Журнал\"; trip planning → `/s/dispatch`), or rename them clearly (\"Журнал температур\", \"Реестр ТС\"). Keep only true admin and records pages in group 2. Add one numbering table (`SCREENS.code`) used by the nav, help and FR documents. Redirect old routes.","acceptance":"No two sidebar entries share a label in RU/DE/EN (unit test over NAV and i18n). Codes 01–17 are unique and identical in nav, eyebrow and `help/screens.ts`. Old URLs `/dispatch`, `/temperature` and `/fleet` redirect. The suite stays green."},"de":{"title":"Ein Navigationsmodell: doppelte Menüpunkte entfernen und Bildschirmnummerierung korrigieren","finding":"Die Seitenleiste zeigt die 17 v5-Bildschirme und danach die Gruppe «Учёт и администрирование» mit gleichnamigen Einträgen: «Диспетчер» (`i18n.tsx:14`, `Layout.tsx:14`), «Термостатус» (`i18n.tsx:17`, `Layout.tsx:17`) und «Автопарк» (`i18n.tsx:19`, `Layout.tsx:22`). Sie führen zu anderen Altseiten (`/dispatch`, `/temperature`, `/fleet`), und „Сводка по рейсам“ dupliziert die Übersicht. Die Konzeptcodes in `NAV` wiederholen 04 (ship, thermo) und 10 (partners, staff) und überspringen 14, während die Shell nach Index neu nummeriert (`Shell.tsx:26, 85`), sodass Codes in Konzept- und FR-Dokumenten nicht zur UI passen.","change":"Die Altfunktionen als Tabs in die v5-Bildschirme übernehmen (Fuhrpark → `/s/fleet` Tab „Записи/Документы“; Temperaturmesswerte → `/s/thermo` Tab „Журнал“; Tourenplanung → `/s/dispatch`) oder eindeutig umbenennen („Журнал температур“, „Реестр ТС“). In Gruppe 2 nur echte Admin- und Registerseiten belassen. Eine Nummerierungstabelle (`SCREENS.code`) für Navigation, Hilfe und FR-Dokumente. Alte Routen umleiten.","acceptance":"Keine zwei Einträge der Seitenleiste haben in RU/DE/EN dieselbe Bezeichnung (Unit-Test über NAV und i18n). Codes 01–17 sind eindeutig und in Navigation, Eyebrow und `help/screens.ts` identisch. Alte URLs `/dispatch`, `/temperature` und `/fleet` leiten um. Die Suite bleibt grün."},"ru":{"title":"Единая модель навигации: убрать дублирующиеся пункты меню и исправить нумерацию экранов","finding":"Боковая панель показывает 17 экранов v5, а затем группу «Учёт и администрирование» с одноимёнными пунктами: «Диспетчер» (`i18n.tsx:14`, `Layout.tsx:14`), «Термостатус» (`i18n.tsx:17`, `Layout.tsx:17`) и «Автопарк» (`i18n.tsx:19`, `Layout.tsx:22`). Они ведут на другие старые страницы (`/dispatch`, `/temperature`, `/fleet`), а «Сводка по рейсам» дублирует «Обзор». Коды концепта в `NAV` повторяют 04 (ship, thermo) и 10 (partners, staff) и пропускают 14, а Shell перенумеровывает по индексу (`Shell.tsx:26, 85`), поэтому коды в документах концепта и FR не совпадают с UI.","change":"Встроить старые функции во вкладки экранов v5 (Автопарк → `/s/fleet` вкладка «Записи/Документы»; показания температуры → `/s/thermo` вкладка «Журнал»; планирование рейсов → `/s/dispatch`) или однозначно переименовать («Журнал температур», «Реестр ТС»). В группе 2 оставить только реальные страницы администрирования и учёта. Одна таблица нумерации (`SCREENS.code`) для навигации, справки и документов FR. Перенаправить старые маршруты.","acceptance":"Никакие два пункта боковой панели не совпадают по названию в RU/DE/EN (юнит-тест по NAV и i18n). Коды 01–17 уникальны и одинаковы в навигации, надзаголовке и `help/screens.ts`. Старые URL `/dispatch`, `/temperature` и `/fleet` перенаправляются. Набор тестов остаётся зелёным."}},{"id":"FR-131","type":"FR","date":"2026-10-11","priority":"medium","status":"implemented","group":{"en":"Operations, UX, i18n, testing & performance","de":"Betrieb, UX, i18n, Tests & Performance","ru":"Эксплуатация, UX, i18n, тестирование и производительность"},"depends":"FR-74, FR-81","effort":"S","source":"docs/CHANGE-REQUESTS.md","en":{"title":"Push or poll document changes to open clients","finding":"`/api/v5/state` is loaded once on mount (`V5.tsx:77-95`) and refreshed only after one's own `act`. Changes by other dispatchers, the worker (coverage monitor, Wialon alarms) or inbound webhooks (SOS, workshop status) appear only after a manual reload. The live indicator \"Онлайн · обновление каждые 2 с\" (`Shell.tsx:48`) suggests the opposite.","change":"Add `GET /api/v5/version` (cheap, returns `{version}`), polled every 5 s while visible, and fetch `/state` (or a delta, C05) when it changes. Phase 2: an SSE endpoint `/api/v5/events` through nginx (`proxy_buffering off`, auth via session cookie, hub-filtered per C01). Show \"updated hh:mm:ss\" and a banner for new level ≥ 2 alarms.","acceptance":"An event ingested via `/api/v1/inbound/security` appears in another browser session within ≤ 10 s without a reload (Playwright test with 2 contexts). Idle polling costs ≤ 1 small request per 5 s per client. The live label shows the real last-sync time."},"de":{"title":"Dokumentänderungen an offene Clients pushen oder pollen","finding":"`/api/v5/state` wird einmal beim Mount geladen (`V5.tsx:77-95`) und nur nach dem eigenen `act` aktualisiert. Änderungen anderer Disponenten, des Workers (Coverage-Monitor, Wialon-Alarme) oder eingehender Webhooks (SOS, Werkstattstatus) erscheinen erst nach manuellem Neuladen. Die Live-Anzeige „Онлайн · обновление каждые 2 с“ (`Shell.tsx:48`) suggeriert das Gegenteil.","change":"`GET /api/v5/version` (günstig, liefert `{version}`), alle 5 s gepollt, solange sichtbar; bei Änderung `/state` (oder ein Delta, C05) laden. Phase 2: SSE-Endpunkt `/api/v5/events` über nginx (`proxy_buffering off`, Auth per Session-Cookie, hub-gefiltert nach C01). „aktualisiert hh:mm:ss“ und ein Banner für neue Alarme ab Stufe 2 anzeigen.","acceptance":"Ein über `/api/v1/inbound/security` eingespieltes Ereignis erscheint in einer anderen Browsersitzung innerhalb von ≤ 10 s ohne Neuladen (Playwright-Test mit 2 Kontexten). Leerlauf-Polling kostet ≤ 1 kleine Anfrage je 5 s und Client. Das Live-Label zeigt die tatsächliche letzte Synchronisationszeit."},"ru":{"title":"Доставлять изменения документа открытым клиентам (push или опрос)","finding":"`/api/v5/state` загружается один раз при монтировании (`V5.tsx:77-95`) и обновляется только после собственного `act`. Изменения других диспетчеров, воркера (монитор покрытия, тревоги Wialon) или входящих вебхуков (SOS, статус сервиса) видны только после ручной перезагрузки. Индикатор «Онлайн · обновление каждые 2 с» (`Shell.tsx:48`) говорит об обратном.","change":"Добавить `GET /api/v5/version` (лёгкий, возвращает `{version}`), опрашиваемый каждые 5 с, пока вкладка видима; при изменении загружать `/state` (или дельту, C05). Этап 2: SSE-эндпоинт `/api/v5/events` через nginx (`proxy_buffering off`, аутентификация по cookie сессии, фильтр по хабу по C01). Показывать «обновлено чч:мм:сс» и баннер о новых тревогах уровня ≥ 2.","acceptance":"Событие, принятое через `/api/v1/inbound/security`, появляется в другой сессии браузера за ≤ 10 с без перезагрузки (Playwright-тест с 2 контекстами). Опрос в простое стоит ≤ 1 небольшого запроса в 5 с на клиента. Метка «онлайн» показывает реальное время последней синхронизации."}},{"id":"FR-130","type":"FR","date":"2026-10-11","priority":"high","status":"implemented","group":{"en":"Operations, UX, i18n, testing & performance","de":"Betrieb, UX, i18n, Tests & Performance","ru":"Эксплуатация, UX, i18n, тестирование и производительность"},"depends":"FR-129; `integrations/hub.py` (`mark_sync`)","effort":"M","source":"docs/CHANGE-REQUESTS.md","en":{"title":"Per-task worker scheduling, heartbeats, deep health check and alerting","finding":"The worker runs all 7 tasks sequentially in one loop with `time.sleep(60)` (`integrations/worker.py:334-359`). A slow connector (HTTP timeout to goszakup, 2GIS or Wialon) delays `coverage-monitor` and SOS escalation for everyone. The integrations container has `healthcheck: { disable: true }` (`deploy/docker-compose.yml:117`), and `api` has no healthcheck. Monitoring is \"docker compose logs\" only (`DEPLOYMENT.md` §6): no metrics and no alerts.","change":"Give each task its own interval and timeout (e.g. coverage 60 s, alarms 30 s, goszakup 6 h) using a thread pool or one process per critical task. Add a `worker_heartbeat(task, last_ok, last_error, duration)` table. `GET /api/health/deep` (internal network or admin) checks DB, heartbeats, backup age and audit-head export. Add a Prometheus-format `/metrics` on the internal network and alert rules (worker stale > 5 min, backup > 26 h, 5xx rate, login failures).","acceptance":"With the goszakup adapter stubbed to block 120 s, the coverage monitor still runs every 60 s (test). Docker marks `integrations` unhealthy when a heartbeat is > 5 min old. `/api/health/deep` lists every check. The alert rules are documented in DEPLOYMENT.md."},"de":{"title":"Worker-Zeitplanung je Task, Heartbeats, tiefer Health-Check und Alarmierung","finding":"Der Worker führt alle 7 Tasks nacheinander in einer Schleife mit `time.sleep(60)` aus (`integrations/worker.py:334-359`). Ein langsamer Konnektor (HTTP-Timeout zu goszakup, 2GIS oder Wialon) verzögert `coverage-monitor` und die SOS-Eskalation für alle. Der Integrations-Container hat `healthcheck: { disable: true }` (`deploy/docker-compose.yml:117`), und `api` hat keinen Healthcheck. Überwachung ist nur „docker compose logs“ (`DEPLOYMENT.md` §6): keine Metriken, keine Alarme.","change":"Jedem Task ein eigenes Intervall und Timeout geben (z. B. coverage 60 s, alarms 30 s, goszakup 6 h) über einen Thread-Pool oder einen Prozess je kritischem Task. Tabelle `worker_heartbeat(task, last_ok, last_error, duration)`. `GET /api/health/deep` (internes Netz oder Admin) prüft DB, Heartbeats, Backup-Alter und Export des Audit-Kopfes. `/metrics` im Prometheus-Format im internen Netz und Alarmregeln (Worker veraltet > 5 min, Backup > 26 h, 5xx-Rate, Login-Fehlschläge).","acceptance":"Mit einem 120 s blockierenden goszakup-Stub läuft der Coverage-Monitor weiterhin alle 60 s (Test). Docker markiert `integrations` als unhealthy, wenn ein Heartbeat > 5 min alt ist. `/api/health/deep` listet jede Prüfung. Die Alarmregeln sind in DEPLOYMENT.md dokumentiert."},"ru":{"title":"Расписание воркера по задачам, heartbeat, глубокая проверка здоровья и оповещения","finding":"Воркер выполняет все 7 задач последовательно в одном цикле с `time.sleep(60)` (`integrations/worker.py:334-359`). Медленный коннектор (HTTP-таймаут к goszakup, 2GIS или Wialon) задерживает `coverage-monitor` и эскалацию SOS для всех. У контейнера интеграций `healthcheck: { disable: true }` (`deploy/docker-compose.yml:117`), а у `api` нет healthcheck. Мониторинг — только «docker compose logs» (`DEPLOYMENT.md` §6): ни метрик, ни оповещений.","change":"Дать каждой задаче свой интервал и таймаут (напр. coverage 60 с, alarms 30 с, goszakup 6 ч) через пул потоков или отдельный процесс на критичную задачу. Таблица `worker_heartbeat(task, last_ok, last_error, duration)`. `GET /api/health/deep` (внутренняя сеть или администратор) проверяет БД, heartbeat, возраст резервной копии и экспорт головы аудита. `/metrics` в формате Prometheus во внутренней сети и правила оповещений (воркер устарел > 5 мин, резервная копия > 26 ч, доля 5xx, неудачные входы).","acceptance":"При заглушке goszakup, блокирующей 120 с, монитор покрытия по-прежнему работает каждые 60 с (тест). Docker помечает `integrations` как unhealthy, если heartbeat старше 5 мин. `/api/health/deep` перечисляет каждую проверку. Правила оповещений задокументированы в DEPLOYMENT.md."}},{"id":"FR-129","type":"FR","date":"2026-10-11","priority":"high","status":"implemented","group":{"en":"Operations, UX, i18n, testing & performance","de":"Betrieb, UX, i18n, Tests & Performance","ru":"Эксплуатация, UX, i18n, тестирование и производительность"},"depends":"FR-130","effort":"S","source":"docs/CHANGE-REQUESTS.md","en":{"title":"Reliable backup job: pipefail, separate MAC key, schedule, off-site copy, failure alert","finding":"`pg_dump | gzip | openssl` runs under `sh` with `set -eu` but without `pipefail` (`backup.sh:13-14`). A failing `pg_dump` produces a truncated file that is logged as \"backup ok\". The same `backup_key` encrypts and MACs (`backup.sh:15, 18`). The loop sleeps 86,400 s from container start (`backup.sh:23`), so the time drifts and is not nightly. The off-site copy is manual (`DEPLOYMENT.md` §4). Nothing alerts on failure, and the READY checklist only checks that a file exists (`CLAUDE.md` §4).","change":"Use `set -o pipefail` (busybox ash supports it) or check `pg_dump` via `PIPESTATUS`/a FIFO. Use `pg_dump -Fc` with `--file` plus a `pg_restore --list` sanity check. Use a separate `backup_mac_key`. Schedule at 02:30 Asia/Almaty via crond. Write a status file `last_ok.json` that the health endpoint reads (C12). Add an optional rsync/sftp target inside KZ. Run an automated monthly restore test into a throw-away container.","acceptance":"Killing `pg_dump` mid-run leaves no `.enc` file and logs \"FAILED\" (test script). `last_ok.json` older than 26 h turns `/api/health/deep` to `degraded`. A restore test job reports the table counts. Encryption and MAC use different keys."},"de":{"title":"Zuverlässiger Backup-Job: pipefail, separater MAC-Schlüssel, Zeitplan, externe Kopie, Fehleralarm","finding":"`pg_dump | gzip | openssl` läuft unter `sh` mit `set -eu`, aber ohne `pipefail` (`backup.sh:13-14`). Ein fehlschlagender `pg_dump` erzeugt eine abgeschnittene Datei, die als „backup ok“ protokolliert wird. Derselbe `backup_key` verschlüsselt und berechnet den MAC (`backup.sh:15, 18`). Die Schleife schläft 86 400 s ab Containerstart (`backup.sh:23`), die Uhrzeit driftet also und ist nicht nächtlich. Die externe Kopie ist manuell (`DEPLOYMENT.md` §4). Nichts alarmiert bei Fehlern, und die READY-Checkliste prüft nur, ob eine Datei existiert (`CLAUDE.md` §4).","change":"`set -o pipefail` nutzen (busybox ash unterstützt es) oder `pg_dump` über `PIPESTATUS`/eine FIFO prüfen. `pg_dump -Fc` mit `--file` plus Plausibilitätsprüfung `pg_restore --list`. Separater `backup_mac_key`. Zeitplan 02:30 Asia/Almaty per crond. Statusdatei `last_ok.json`, die der Health-Endpunkt liest (C12). Optionales rsync/sftp-Ziel innerhalb KZ. Automatisierter monatlicher Wiederherstellungstest in einen Wegwerf-Container.","acceptance":"Abbruch von `pg_dump` während des Laufs hinterlässt keine `.enc`-Datei und protokolliert „FAILED“ (Testskript). Ein `last_ok.json` älter als 26 h setzt `/api/health/deep` auf `degraded`. Ein Wiederherstellungstest-Job meldet die Tabellenzählungen. Verschlüsselung und MAC nutzen verschiedene Schlüssel."},"ru":{"title":"Надёжное резервное копирование: pipefail, отдельный ключ MAC, расписание, внешняя копия, оповещение о сбое","finding":"`pg_dump | gzip | openssl` выполняется под `sh` с `set -eu`, но без `pipefail` (`backup.sh:13-14`). Сбойный `pg_dump` даёт обрезанный файл, который записывается в журнал как «backup ok». Один и тот же `backup_key` используется для шифрования и MAC (`backup.sh:15, 18`). Цикл спит 86 400 с от старта контейнера (`backup.sh:23`), поэтому время дрейфует и копирование не ночное. Внешняя копия делается вручную (`DEPLOYMENT.md` §4). Ничто не оповещает о сбое, а чек-лист READY проверяет лишь наличие файла (`CLAUDE.md` §4).","change":"Использовать `set -o pipefail` (поддерживается busybox ash) или проверять `pg_dump` через `PIPESTATUS`/FIFO. `pg_dump -Fc` с `--file` плюс проверка `pg_restore --list`. Отдельный `backup_mac_key`. Расписание 02:30 Asia/Almaty через crond. Файл статуса `last_ok.json`, читаемый эндпоинтом здоровья (C12). Опциональная цель rsync/sftp внутри РК. Автоматический ежемесячный тест восстановления во временный контейнер.","acceptance":"Прерывание `pg_dump` во время работы не оставляет файла `.enc` и пишет в журнал «FAILED» (тестовый скрипт). `last_ok.json` старше 26 ч переводит `/api/health/deep` в `degraded`. Задание теста восстановления сообщает количество строк в таблицах. Шифрование и MAC используют разные ключи."}},{"id":"FR-128","type":"FR","date":"2026-10-11","priority":"medium","status":"implemented","group":{"en":"Finance, commercial & partner API","de":"Finanzen, Vertrieb & Partner-API","ru":"Финансы, коммерция и партнёрский API"},"depends":"FR-108, FR-116, FR-118","effort":"M","source":"docs/CHANGE-REQUESTS.md","en":{"title":"Strict idempotency, GDP data and lifecycle endpoints","finding":"A repeated `external_ref` with a **different** body silently returns the old booking (`be/routers/partner_api.py:119-121`). The shipment endpoint returns only the last temperature reading (`:155-159`), with no series, excursions, ePOD or document numbers, although GDP customers need them. There is no cancel or amend endpoint. Booking capacity checks pallets only, not `weight_kg` (`be/booking.py:72`, `:106`).","change":"Store a request hash. Same ref + different hash → 409 `idempotency_conflict`. New endpoints: `GET /shipments/{n}/temperature` (series, min/max, excursions), `/pod` (final ePOD metadata + hash), `/documents` (ESF/TTN numbers and status), `POST /bookings/{n}/cancel` before cut-off (webhook `booking.cancelled`). Add a kg capacity check per departure.","acceptance":"(1) Contract tests for the 409 on a body mismatch. (2) The temperature endpoint returns only the caller's orders. (3) A booking that exceeds kg capacity returns 409. (4) The spec in `docs/partner-api.json` is updated."},"de":{"title":"Strikte Idempotenz, GDP-Daten und Lebenszyklus-Endpunkte","finding":"Eine wiederholte `external_ref` mit **anderem** Body liefert stillschweigend die alte Buchung (`be/routers/partner_api.py:119-121`). Der Sendungs-Endpunkt liefert nur den letzten Temperaturwert (`:155-159`), ohne Verlauf, Abweichungen, ePOD oder Belegnummern, obwohl GDP-Kunden sie brauchen. Es gibt keinen Storno- oder Änderungs-Endpunkt. Die Buchungskapazität prüft nur Paletten, nicht `weight_kg` (`be/booking.py:72`, `:106`).","change":"Request-Hash speichern. Gleiche Ref + anderer Hash → 409 `idempotency_conflict`. Neue Endpunkte: `GET /shipments/{n}/temperature` (Verlauf, Min/Max, Abweichungen), `/pod` (Metadaten des finalen ePOD + Hash), `/documents` (ESF-/TTN-Nummern und Status), `POST /bookings/{n}/cancel` vor Annahmeschluss (Webhook `booking.cancelled`). kg-Kapazitätsprüfung je Abfahrt.","acceptance":"(1) Vertragstests für 409 bei abweichendem Body. (2) Der Temperatur-Endpunkt liefert nur die Aufträge des Aufrufers. (3) Eine Buchung über der kg-Kapazität liefert 409. (4) Die Spezifikation in `docs/partner-api.json` ist aktualisiert."},"ru":{"title":"Строгая идемпотентность, данные GDP и эндпоинты жизненного цикла","finding":"Повторный `external_ref` с **другим** телом молча возвращает старое бронирование (`be/routers/partner_api.py:119-121`). Эндпоинт отправки возвращает только последнее показание температуры (`:155-159`), без ряда, отклонений, ePOD и номеров документов, хотя они нужны клиентам с GDP. Эндпоинтов отмены и изменения нет. Мощность бронирования проверяется только по паллетам, не по `weight_kg` (`be/booking.py:72`, `:106`).","change":"Сохранять хеш запроса. Тот же ref + другой хеш → 409 `idempotency_conflict`. Новые эндпоинты: `GET /shipments/{n}/temperature` (ряд, мин/макс, отклонения), `/pod` (метаданные финального ePOD + хеш), `/documents` (номера и статус ЭСФ/ТТН), `POST /bookings/{n}/cancel` до отсечки (вебхук `booking.cancelled`). Проверка мощности по кг на отправление.","acceptance":"(1) Контрактные тесты на 409 при несовпадении тела. (2) Эндпоинт температуры возвращает только заказы вызывающего. (3) Бронирование сверх мощности по кг возвращает 409. (4) Спецификация в `docs/partner-api.json` обновлена."}},{"id":"FR-127","type":"FR","date":"2026-10-11","priority":"high","status":"implemented","group":{"en":"Finance, commercial & partner API","de":"Finanzen, Vertrieb & Partner-API","ru":"Финансы, коммерция и партнёрский API"},"depends":"FR-90, FR-124","effort":"M","source":"docs/CHANGE-REQUESTS.md","en":{"title":"Structured tender leads, tasks and onboarding of won customers","finding":"goszakup `end_date` and `customer_bin` exist only in the event data and the lead message text (`be/integrations/worker.py:249-254`). The Lead model has no BIN, deadline or tender number (`be/models.py:364-386`). A manual `inbox.add` of kind lead or tender creates **no** CRM lead (`inbox.py:359`). `convert_lead` creates a Customer without BIN and without duplicate check (`be/routers/crm.py:199`). Partner gaps found by `partners.task` (`partners.py:314-332`) are a flag, not a CRM task.","change":"Add Lead fields `bin`, `deadline`, `tender_no`, `source_ref`. Auto-create a task \"prepare bid\" due on deadline−3 days with an assignee by hub. A manual tender or lead in the inbox creates a lead. On convert: match on BIN, then a wizard to create a customer portal user and/or ApiClient with scopes and webhook. `partners.task` creates a CRM Task with owner and due date.","acceptance":"(1) A goszakup tender creates a lead with BIN and deadline and one task. (2) Converting a second lead with the same BIN links to the existing customer. (3) A manual tender creates a lead visible in CRM → Leads."},"de":{"title":"Strukturierte Ausschreibungs-Leads, Aufgaben und Onboarding gewonnener Kunden","finding":"`end_date` und `customer_bin` aus goszakup existieren nur in den Ereignisdaten und im Nachrichtentext des Leads (`be/integrations/worker.py:249-254`). Das Lead-Modell hat weder BIN noch Frist noch Ausschreibungsnummer (`be/models.py:364-386`). Ein manuelles `inbox.add` der Art Lead oder Ausschreibung erzeugt **keinen** CRM-Lead (`inbox.py:359`). `convert_lead` legt einen Kunden ohne BIN und ohne Dublettenprüfung an (`be/routers/crm.py:199`). Von `partners.task` gefundene Partnerlücken (`partners.py:314-332`) sind ein Flag, keine CRM-Aufgabe.","change":"Lead-Felder `bin`, `deadline`, `tender_no`, `source_ref`. Automatisch eine Aufgabe „Angebot vorbereiten“ mit Fälligkeit Frist−3 Tage und Bearbeiter je Hub anlegen. Eine manuelle Ausschreibung oder ein manueller Lead in der Inbox erzeugt einen Lead. Bei Konvertierung: Abgleich über BIN, dann Assistent zum Anlegen eines Kundenportal-Nutzers und/oder ApiClient mit Scopes und Webhook. `partners.task` erzeugt eine CRM-Aufgabe mit Verantwortlichem und Fälligkeit.","acceptance":"(1) Eine goszakup-Ausschreibung erzeugt einen Lead mit BIN und Frist und eine Aufgabe. (2) Die Konvertierung eines zweiten Leads mit derselben BIN verknüpft mit dem bestehenden Kunden. (3) Eine manuelle Ausschreibung erzeugt einen in CRM → Leads sichtbaren Lead."},"ru":{"title":"Структурированные тендерные лиды, задачи и подключение выигранных клиентов","finding":"`end_date` и `customer_bin` из goszakup есть только в данных события и тексте сообщения лида (`be/integrations/worker.py:249-254`). В модели Lead нет БИН, срока и номера тендера (`be/models.py:364-386`). Ручное `inbox.add` вида лид или тендер **не** создаёт лид CRM (`inbox.py:359`). `convert_lead` создаёт клиента без БИН и без проверки дублей (`be/routers/crm.py:199`). Пробелы по партнёрам, найденные `partners.task` (`partners.py:314-332`), — флаг, а не задача CRM.","change":"Поля лида `bin`, `deadline`, `tender_no`, `source_ref`. Автоматически создавать задачу «подготовить заявку» со сроком «срок−3 дня» и исполнителем по хабу. Ручной тендер или лид во входящих создаёт лид. При конвертации: сопоставление по БИН, затем мастер создания пользователя портала клиента и/или ApiClient со скоупами и вебхуком. `partners.task` создаёт задачу CRM с ответственным и сроком.","acceptance":"(1) Тендер goszakup создаёт лид с БИН и сроком и одну задачу. (2) Конвертация второго лида с тем же БИН связывается с существующим клиентом. (3) Ручной тендер создаёт лид, видимый в CRM → Лиды."}},{"id":"FR-126","type":"FR","date":"2026-10-11","priority":"medium","status":"implemented","group":{"en":"Finance, commercial & partner API","de":"Finanzen, Vertrieb & Partner-API","ru":"Финансы, коммерция и партнёрский API"},"depends":"FR-124","effort":"M","source":"docs/CHANGE-REQUESTS.md","en":{"title":"Deadline, notification and effect for express approvals","finding":"`baseline.exSign`/`exReject` only store signatures (`be/v5/modules/baseline.py:52-90`). There is no due time, no message to the three signers (CEO, analytics, purchasing), and no automatic outcome at cut-off. Approved 3/3 creates no express order or trip. Rejected only shows the saving as a toast.","change":"Add `due_at` (cut-off of the express slot). Notify the 3 roles (B04), with reminders at due−30 min. At the due time, open requests are auto-rejected to a regular trip (audited as \"system: timeout\"). 3/3 creates an express order (or partner hand-over request) linked to EX-id.","acceptance":"(1) An unsigned request past due_at becomes `rejected_timeout`. (2) 3/3 creates exactly one order with a reference to the EX-id. (3) The signers receive in-app notifications."},"de":{"title":"Frist, Benachrichtigung und Wirkung für Express-Freigaben","finding":"`baseline.exSign`/`exReject` speichern nur Unterschriften (`be/v5/modules/baseline.py:52-90`). Es gibt keine Fälligkeit, keine Nachricht an die drei Unterzeichner (Geschäftsführer, Analytik, Einkauf) und kein automatisches Ergebnis zum Annahmeschluss. Eine Freigabe 3/3 erzeugt weder Express-Auftrag noch Tour. Eine Ablehnung zeigt die Einsparung nur als Toast.","change":"`due_at` (Annahmeschluss des Express-Slots) ergänzen. Die 3 Rollen benachrichtigen (B04), mit Erinnerungen bei Fälligkeit−30 min. Zum Fälligkeitszeitpunkt werden offene Anträge automatisch auf eine Regeltour abgelehnt (auditiert als „system: timeout“). 3/3 erzeugt einen Express-Auftrag (oder eine Partner-Übergabeanfrage), verknüpft mit der EX-ID.","acceptance":"(1) Ein nicht unterschriebener Antrag nach due_at wird `rejected_timeout`. (2) 3/3 erzeugt genau einen Auftrag mit Verweis auf die EX-ID. (3) Die Unterzeichner erhalten In-App-Benachrichtigungen."},"ru":{"title":"Срок, уведомление и последствия для согласования экспресса","finding":"`baseline.exSign`/`exReject` лишь сохраняют подписи (`be/v5/modules/baseline.py:52-90`). Нет срока, нет сообщения трём подписантам (генеральный директор, аналитика, закупки) и нет автоматического итога к отсечке. Одобрение 3/3 не создаёт ни экспресс-заказа, ни рейса. Отказ лишь показывает экономию во всплывающем сообщении.","change":"Добавить `due_at` (отсечка экспресс-слота). Уведомлять 3 роли (B04) с напоминанием за 30 мин до срока. В момент срока открытые запросы автоматически отклоняются в пользу регулярного рейса (аудит «system: timeout»). 3/3 создаёт экспресс-заказ (или запрос передачи партнёру), связанный с id EX.","acceptance":"(1) Неподписанный запрос после due_at становится `rejected_timeout`. (2) 3/3 создаёт ровно один заказ со ссылкой на id EX. (3) Подписанты получают уведомления в приложении."}},{"id":"FR-125","type":"FR","date":"2026-10-11","priority":"high","status":"implemented","group":{"en":"Finance, commercial & partner API","de":"Finanzen, Vertrieb & Partner-API","ru":"Финансы, коммерция и партнёрский API"},"depends":"FR-78, FR-116, FR-123","effort":"L","source":"docs/CHANGE-REQUESTS.md","en":{"title":"Actual-cost ledger next to the bottom-up model","finding":"Затраты is pure model. Fuel actuals `x.act` come from reference, and the app's fuel fill is just a note (`fe/v5/engine/costs.ts:120`). Tolls are \"not in model\" (`:36`). Fines are excluded (`:98`). Hand-over costs (`partners.py:182`) and ticket costs (reference string \"80 000–150 000 ₸\") never reach the screen. The outsourcing comparison uses the constant `CP.outs`.","change":"Add a `cost_entry` table (date, vehicle or trip, category fuel/toll/service/handover/fine/other, amount, source ref, document ref). Feeds: driver fuel (litres, price, odometer, receipt photo hash), service ticket close (actual cost required), hand-over/ESF in (B17), fines (B03), toll statement CSV import. Show plan vs actual per vehicle/month and l/100 km from the app odometer.","acceptance":"(1) Closing a ticket without an actual cost returns 422. (2) Two fuel fills compute the real l/100 km in the fuel tab. (3) Monthly actuals match the sum of the entries (test)."},"de":{"title":"Ist-Kosten-Ledger neben dem Bottom-up-Modell","finding":"Затраты ist reines Modell. Ist-Kraftstoff `x.act` stammt aus der Referenz, und die Tankung in der App ist nur eine Notiz (`fe/v5/engine/costs.ts:120`). Maut ist „nicht im Modell“ (`:36`). Bußgelder sind ausgeschlossen (`:98`). Übergabekosten (`partners.py:182`) und Ticketkosten (Referenztext „80 000–150 000 ₸“) erreichen den Bildschirm nie. Der Outsourcing-Vergleich nutzt die Konstante `CP.outs`.","change":"Tabelle `cost_entry` (Datum, Fahrzeug oder Tour, Kategorie Kraftstoff/Maut/Werkstatt/Übergabe/Bußgeld/Sonstiges, Betrag, Quell-Ref, Beleg-Ref). Zuflüsse: Fahrer-Tankung (Liter, Preis, Kilometerstand, Hash des Belegfotos), Abschluss eines Werkstatttickets (Ist-Kosten Pflicht), Übergabe/Eingangs-ESF (B17), Bußgelder (B03), CSV-Import der Mautabrechnung. Plan vs. Ist je Fahrzeug/Monat und l/100 km aus dem App-Kilometerstand anzeigen.","acceptance":"(1) Abschluss eines Tickets ohne Ist-Kosten liefert 422. (2) Zwei Tankungen ergeben im Kraftstoff-Tab den echten Verbrauch l/100 km. (3) Die monatlichen Ist-Kosten entsprechen der Summe der Einträge (Test)."},"ru":{"title":"Учёт фактических затрат рядом с моделью «снизу вверх»","finding":"«Затраты» — чистая модель. Фактический расход топлива `x.act` берётся из справочника, а заправка в приложении — лишь заметка (`fe/v5/engine/costs.ts:120`). Платные дороги «не в модели» (`:36`). Штрафы исключены (`:98`). Затраты на передачу (`partners.py:182`) и на заявки (справочная строка «80 000–150 000 ₸») на экран не попадают. Сравнение с аутсорсингом использует константу `CP.outs`.","change":"Таблица `cost_entry` (дата, ТС или рейс, категория топливо/платная дорога/сервис/передача/штраф/прочее, сумма, ссылка на источник, ссылка на документ). Источники: заправка водителем (литры, цена, одометр, хеш фото чека), закрытие сервисной заявки (фактическая стоимость обязательна), передача/входящая ЭСФ (B17), штрафы (B03), импорт CSV-выписки по платным дорогам. Показывать план vs факт по ТС/месяцу и л/100 км по одометру приложения.","acceptance":"(1) Закрытие заявки без фактической стоимости возвращает 422. (2) Две заправки дают реальный расход л/100 км на вкладке топлива. (3) Месячный факт равен сумме записей (тест)."}},{"id":"FR-124","type":"FR","date":"2026-10-11","priority":"high","status":"implemented","group":{"en":"Resources, staff, partners & planning","de":"Ressourcen, Personal, Partner & Planung","ru":"Ресурсы, персонал, партнёры и планирование"},"depends":"FR-83","effort":"M","source":"docs/CHANGE-REQUESTS.md","en":{"title":"Real message channel to drivers and accounting","finding":"`reports.notify` only writes a log line and a toast \"sent (driver app)\" (`be/v5/modules/reports.py:86-97`). The driver app's messages are the fixed ids m1–m3 (`be/v5/modules/driver.py:33`). The fines screen claims \"reminder sent to driver and accounting\" for every fine whose 50 % discount ends in ≤ 7 days, but nothing is sent (`fe/v5/engine/reports.ts:54`). The only outbound notification in the backend is the lead e-mail (`be/routers/public.py:126`).","change":"Add a `notification` table (recipient user or role, channel in_app/e-mail/SMS, ref object, due, read_at, ack_at). The driver app reads its own messages and acks with `driver.ack(id)`. A scheduler job creates reminders at due-2d and due-0d for fines, contract renewals (B21) and document expiries (B12, B15). Overdue items escalate to the role head.","acceptance":"(1) `reports.notify` creates one in_app message visible only to the attributed driver. Ack is recorded with a time. (2) A fine with due = today+2 creates exactly one reminder for the driver and one for accounting. (3) The UI text \"reminder sent\" appears only when a notification row exists."},"de":{"title":"Echter Nachrichtenkanal zu Fahrern und Buchhaltung","finding":"`reports.notify` schreibt nur eine Protokollzeile und einen Toast „gesendet (Fahrer-App)“ (`be/v5/modules/reports.py:86-97`). Die Nachrichten der Fahrer-App sind die festen IDs m1–m3 (`be/v5/modules/driver.py:33`). Der Bußgeldbildschirm behauptet „Erinnerung an Fahrer und Buchhaltung gesendet“ für jedes Bußgeld, dessen 50-%-Rabatt in ≤ 7 Tagen endet, aber nichts wird gesendet (`fe/v5/engine/reports.ts:54`). Die einzige ausgehende Benachrichtigung im Backend ist die Lead-E-Mail (`be/routers/public.py:126`).","change":"Tabelle `notification` (Empfänger Nutzer oder Rolle, Kanal in_app/E-Mail/SMS, Bezugsobjekt, Fälligkeit, read_at, ack_at). Die Fahrer-App liest ihre eigenen Nachrichten und quittiert mit `driver.ack(id)`. Ein Scheduler-Job erzeugt Erinnerungen bei Fälligkeit−2 T und Fälligkeit−0 T für Bußgelder, Vertragsverlängerungen (B21) und Dokumentabläufe (B12, B15). Überfällige Punkte eskalieren an den Rollenverantwortlichen.","acceptance":"(1) `reports.notify` erzeugt eine in_app-Nachricht, die nur der zugeordnete Fahrer sieht; die Quittung wird mit Zeit erfasst. (2) Ein Bußgeld mit Fälligkeit = heute+2 erzeugt genau eine Erinnerung für den Fahrer und eine für die Buchhaltung. (3) Der UI-Text „Erinnerung gesendet“ erscheint nur, wenn eine Benachrichtigungszeile existiert."},"ru":{"title":"Реальный канал сообщений водителям и бухгалтерии","finding":"`reports.notify` лишь пишет строку журнала и всплывающее «отправлено (приложение водителя)» (`be/v5/modules/reports.py:86-97`). Сообщения приложения водителя — фиксированные id m1–m3 (`be/v5/modules/driver.py:33`). Экран штрафов заявляет «напоминание отправлено водителю и бухгалтерии» для каждого штрафа, у которого скидка 50 % заканчивается через ≤ 7 дней, но ничего не отправляется (`fe/v5/engine/reports.ts:54`). Единственное исходящее уведомление в бэкенде — письмо о лиде (`be/routers/public.py:126`).","change":"Таблица `notification` (получатель — пользователь или роль, канал in_app/e-mail/SMS, объект ссылки, срок, read_at, ack_at). Приложение водителя читает свои сообщения и подтверждает через `driver.ack(id)`. Задание планировщика создаёт напоминания за 2 дня и в день срока для штрафов, продлений договоров (B21) и истечения документов (B12, B15). Просроченное эскалируется руководителю роли.","acceptance":"(1) `reports.notify` создаёт одно сообщение in_app, видимое только привязанному водителю; подтверждение фиксируется со временем. (2) Штраф со сроком = сегодня+2 создаёт ровно одно напоминание водителю и одно бухгалтерии. (3) Текст UI «напоминание отправлено» появляется только при наличии строки уведомления."}},{"id":"FR-123","type":"FR","date":"2026-10-11","priority":"high","status":"implemented","group":{"en":"Resources, staff, partners & planning","de":"Ressourcen, Personal, Partner & Planung","ru":"Ресурсы, персонал, партнёры и планирование"},"depends":"FR-122, FR-124, FR-125","effort":"M","source":"docs/CHANGE-REQUESTS.md","en":{"title":"Fine ledger with recharge workflow","finding":"`reports.fine` → `deduct` only stores the label \"payroll deduction agreed\" (`be/v5/modules/reports.py:65`, `:70-83`). There is no driver acknowledgement, no amount or period for payroll, and no record of who pays first. Costs excludes fines entirely (\"driver liability\", `fe/v5/engine/costs.ts:98`), although the company pays them as the vehicle owner (BIN).","change":"Create a fine ledger. Status flow: unpaid → paid_by_company(amount, date, 50 % flag) → recharge_requested → acknowledged_by_driver (driver app) or disputed → deducted(payroll period, export line) or written_off (company cost). The company-paid amount goes to the cost ledger (B18). Deductions respect the statutory deduction cap (Labour Code RK, article to verify).","acceptance":"(1) `deduct` is impossible without driver acknowledgement or an HR override with a reason, and every step is audited. (2) A monthly payroll export (CSV) lists driver ref, fine no. and amount, and is not exported twice. (3) A written-off fine appears in Затраты as an actual cost."},"de":{"title":"Bußgeldkonto mit Weiterbelastungsprozess","finding":"`reports.fine` → `deduct` speichert nur das Label „Lohnabzug vereinbart“ (`be/v5/modules/reports.py:65`, `:70-83`). Es gibt keine Bestätigung des Fahrers, keinen Betrag oder Zeitraum für die Lohnabrechnung und keinen Nachweis, wer zuerst zahlt. Die Kosten schließen Bußgelder ganz aus („Fahrerhaftung“, `fe/v5/engine/costs.ts:98`), obwohl das Unternehmen sie als Fahrzeughalter (BIN) zahlt.","change":"Bußgeldkonto anlegen. Statusablauf: unpaid → paid_by_company(Betrag, Datum, 50-%-Flag) → recharge_requested → acknowledged_by_driver (Fahrer-App) oder disputed → deducted(Abrechnungszeitraum, Exportzeile) oder written_off (Unternehmenskosten). Der vom Unternehmen gezahlte Betrag geht ins Ist-Kosten-Ledger (B18). Abzüge beachten die gesetzliche Abzugsobergrenze (Arbeitsgesetzbuch RK, Artikel zu verifizieren).","acceptance":"(1) `deduct` ist ohne Fahrerbestätigung oder HR-Übersteuerung mit Begründung unmöglich, jeder Schritt wird auditiert. (2) Ein monatlicher Lohnexport (CSV) listet Fahrer-Ref, Bußgeld-Nr. und Betrag und wird nicht doppelt exportiert. (3) Ein abgeschriebenes Bußgeld erscheint in Затраты als Ist-Kosten."},"ru":{"title":"Учёт штрафов с процессом возмещения","finding":"`reports.fine` → `deduct` сохраняет лишь метку «удержание из зарплаты согласовано» (`be/v5/modules/reports.py:65`, `:70-83`). Нет подтверждения водителя, суммы и периода для зарплаты, нет записи о том, кто платит первым. «Затраты» полностью исключают штрафы («ответственность водителя», `fe/v5/engine/costs.ts:98`), хотя компания оплачивает их как владелец ТС (БИН).","change":"Создать учёт штрафов. Статусы: unpaid → paid_by_company(сумма, дата, признак 50 %) → recharge_requested → acknowledged_by_driver (приложение водителя) или disputed → deducted(расчётный период, строка выгрузки) или written_off (затраты компании). Оплаченная компанией сумма попадает в учёт фактических затрат (B18). Удержания соблюдают законный предел удержаний (Трудовой кодекс РК, статью уточнить).","acceptance":"(1) `deduct` невозможен без подтверждения водителя или переопределения кадровой службой с причиной; каждый шаг аудируется. (2) Ежемесячная выгрузка для зарплаты (CSV) содержит ссылку на водителя, № штрафа и сумму и не выгружается дважды. (3) Списанный штраф появляется в «Затратах» как фактическая затрата."}},{"id":"FR-122","type":"FR","date":"2026-10-11","priority":"high","status":"implemented","group":{"en":"Resources, staff, partners & planning","de":"Ressourcen, Personal, Partner & Planung","ru":"Ресурсы, персонал, партнёры и планирование"},"depends":"FR-83, FR-90, FR-120","effort":"M","source":"docs/CHANGE-REQUESTS.md","en":{"title":"Attribute fines to the driver at offence time","finding":"Inbound fines are attributed to the driver of the vehicle's **current** trip. When there is none, the code falls back to the **first driver in the reference list** (`be/v5/modules/inbox.py:245-253`). The usage-log segment is then forced to the whole day `[0,1440]` (`:263`). A camera fine that arrives 3–10 days late therefore lands on the wrong person. The UI tells the user \"driver identified automatically\" (`be/v5/modules/reports.py:58-59`, `fe/v5/engine/reports.ts:21`).","change":"Attribute from the vehicle-assignment history at the offence date and time. Sources: trip actual departure and arrival, trip sheet (driver + vehicle), and the Wialon driver card or iButton if available. If nothing matches, set status `unattributed`. Show the evidence (trip, trip sheet, time window).","acceptance":"(1) A fine for V04 at 05.10 14:20 is attributed to the driver of the trip sheet covering that time, not the driver of today's trip. (2) A vehicle with no assignment at that time gives `unattributed` and never falls back to an arbitrary driver. (3) `reports.notify` and `deduct` are refused (409) while a fine is `unattributed`."},"de":{"title":"Bußgelder dem Fahrer zum Tatzeitpunkt zuordnen","finding":"Eingehende Bußgelder werden dem Fahrer der **aktuellen** Tour des Fahrzeugs zugeordnet. Gibt es keine, fällt der Code auf den **ersten Fahrer der Referenzliste** zurück (`be/v5/modules/inbox.py:245-253`). Das Segment des Nutzungsprotokolls wird dann auf den ganzen Tag `[0,1440]` gesetzt (`:263`). Ein Blitzerbescheid, der 3–10 Tage später eintrifft, landet daher bei der falschen Person. Die UI meldet dem Nutzer „Fahrer automatisch ermittelt“ (`be/v5/modules/reports.py:58-59`, `fe/v5/engine/reports.ts:21`).","change":"Zuordnung aus der Historie der Fahrzeugzuordnung zu Tatdatum und -uhrzeit. Quellen: tatsächliche Abfahrt und Ankunft der Tour, Fahrtenblatt (Fahrer + Fahrzeug) sowie, falls vorhanden, Wialon-Fahrerkarte oder iButton. Passt nichts, Status `unattributed`. Den Nachweis anzeigen (Tour, Fahrtenblatt, Zeitfenster).","acceptance":"(1) Ein Bußgeld für V04 am 05.10 um 14:20 wird dem Fahrer des Fahrtenblatts für diesen Zeitraum zugeordnet, nicht dem Fahrer der heutigen Tour. (2) Ein Fahrzeug ohne Zuordnung zu dieser Zeit ergibt `unattributed` und fällt nie auf einen beliebigen Fahrer zurück. (3) `reports.notify` und `deduct` werden abgelehnt (409), solange ein Bußgeld `unattributed` ist."},"ru":{"title":"Привязка штрафа к водителю на момент нарушения","finding":"Входящие штрафы привязываются к водителю **текущего** рейса ТС. Если его нет, код берёт **первого водителя из справочного списка** (`be/v5/modules/inbox.py:245-253`). Сегмент журнала использования затем принудительно ставится на весь день `[0,1440]` (`:263`). Поэтому штраф с камеры, пришедший через 3–10 дней, попадает не тому человеку. UI сообщает пользователю «водитель определён автоматически» (`be/v5/modules/reports.py:58-59`, `fe/v5/engine/reports.ts:21`).","change":"Привязывать по истории назначения ТС на дату и время нарушения. Источники: фактический выезд и прибытие рейса, путевой лист (водитель + ТС), а также карта водителя Wialon или iButton, если есть. Если ничего не совпадает — статус `unattributed`. Показывать доказательство (рейс, путевой лист, временное окно).","acceptance":"(1) Штраф по V04 за 05.10 14:20 привязывается к водителю по путевому листу на это время, а не к водителю сегодняшнего рейса. (2) ТС без назначения на это время даёт `unattributed` и никогда не подставляет произвольного водителя. (3) `reports.notify` и `deduct` отклоняются (409), пока штраф `unattributed`."}},{"id":"FR-121","type":"FR","date":"2026-10-11","priority":"medium","status":"implemented","group":{"en":"Resources, staff, partners & planning","de":"Ressourcen, Personal, Partner & Planung","ru":"Ресурсы, персонал, партнёры и планирование"},"depends":"FR-78, FR-108","effort":"M","source":"docs/CHANGE-REQUESTS.md","en":{"title":"Measured partner SLA, daily capacity and controlled renewals","finding":"The SLA is a static reference string, which demotes tier only via text parsing (`be/v5/modules/partners.py:46-56`). `capUsed` (\"today\") is never reset or reduced (`:187`). Contract renewal is +1 year by a single user, with no contract document (`:280-294`). A workshop can be called once ever (`wsCalls`, `:247-248`). Ticket ETA has a hard-coded date \"06.10\" (`:251`). The hand-over id is derived from `len(hos)` (`:180`), against the rule in V5-PORT.md.","change":"Monthly SLA computed from hand-overs and tickets (on-time ePOD, ETA vs onsite from `wsSt`), with tier proposals for four-eyes approval. Capacity ledger per partner and day. Renewal needs an uploaded contract (hash) + second approver + insurance validity date. `wsCalls` per ticket. ETA from the server time. Hand-over ids from a sequence.","acceptance":"(1) After midnight (KZ) free capacity resets. (2) Renewal by the requester alone returns 409. (3) A partner with 3 late ePODs out of 10 shows SLA 70 % and a demotion proposal."},"de":{"title":"Gemessenes Partner-SLA, Tageskapazität und kontrollierte Vertragsverlängerungen","finding":"Das SLA ist ein statischer Referenztext, der die Stufe nur per Textparsing herabsetzt (`be/v5/modules/partners.py:46-56`). `capUsed` („heute“) wird nie zurückgesetzt oder reduziert
