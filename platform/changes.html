(`:187`). Die Vertragsverlängerung ist +1 Jahr durch einen einzelnen Nutzer, ohne Vertragsdokument (`:280-294`). Eine Werkstatt kann nur ein einziges Mal gerufen werden (`wsCalls`, `:247-248`). Die Ticket-ETA hat das fest codierte Datum „06.10“ (`:251`). Die Übergabe-ID wird aus `len(hos)` abgeleitet (`:180`), entgegen der Regel in V5-PORT.md.","change":"Monatliches SLA aus Übergaben und Tickets berechnet (pünktlicher ePOD, ETA vs. Ankunft vor Ort aus `wsSt`), mit Stufenvorschlägen zur Vier-Augen-Freigabe. Kapazitätskonto je Partner und Tag. Verlängerung erfordert hochgeladenen Vertrag (Hash) + zweiten Freigeber + Gültigkeitsdatum der Versicherung. `wsCalls` je Ticket. ETA aus der Serverzeit. Übergabe-IDs aus einer Sequenz.","acceptance":"(1) Nach Mitternacht (KZ) wird die freie Kapazität zurückgesetzt. (2) Verlängerung allein durch den Antragsteller liefert 409. (3) Ein Partner mit 3 verspäteten ePODs von 10 zeigt SLA 70 % und einen Herabstufungsvorschlag."},"ru":{"title":"Измеряемый SLA партнёров, суточная мощность и контролируемое продление договоров","finding":"SLA — статическая справочная строка, понижающая уровень только через разбор текста (`be/v5/modules/partners.py:46-56`). `capUsed` («сегодня») никогда не сбрасывается и не уменьшается (`:187`). Продление договора — +1 год одним пользователем, без документа договора (`:280-294`). Сервис можно вызвать лишь один раз за всё время (`wsCalls`, `:247-248`). В ETA заявки жёстко задана дата «06.10» (`:251`). Id передачи выводится из `len(hos)` (`:180`) вопреки правилу V5-PORT.md.","change":"Ежемесячный SLA, рассчитанный по передачам и заявкам (своевременный ePOD, ETA vs прибытие на место из `wsSt`), с предложениями смены уровня на согласование «четыре глаза». Учёт мощности по партнёру и дню. Продление требует загруженного договора (хеш) + второго согласующего + даты действия страховки. `wsCalls` по каждой заявке. ETA по серверному времени. Id передач из последовательности.","acceptance":"(1) После полуночи (РК) свободная мощность сбрасывается. (2) Продление только инициатором возвращает 409. (3) Партнёр с 3 просроченными ePOD из 10 показывает SLA 70 % и предложение понижения."}},{"id":"FR-120","type":"FR","date":"2026-10-11","priority":"high","status":"implemented","group":{"en":"Resources, staff, partners & planning","de":"Ressourcen, Personal, Partner & Planung","ru":"Ресурсы, персонал, партнёры и планирование"},"depends":"FR-78, FR-83, FR-114, FR-118","effort":"L","source":"docs/CHANGE-REQUESTS.md","en":{"title":"Driver hours ledger and data-based urgent assignment","finding":"Driving time comes from static `TACHO`. The only rule is \"9 h − driven ≥ 6 h\" (`be/v5/modules/staff.py:42-43`). There are no rules for continuous driving, daily rest or weekly rest. Shift-end hours are the fixed text \"9,0 h\" (`driver.py:98-100`). The scenario date is fixed (`staff.py:16`, `TODAY = 06.10.2026`). Busy vehicles are hard-coded (`staff.py:52`, `fe/v5/engine/staff.ts:23`). The urgent trip is always \"U-01\", and assignment creates no trip (`staff.py:69-83`). Licence and ADR validity come from reference, not from `Driver.license_until`/`adr_until` (`be/models.py:222-223`).","change":"Build a time ledger from app shift start and end plus Wialon driver activity where available. Rules: daily driving, 4.5 h continuous, daily rest, weekly rest, per the MID work/rest order (adilet V1500014095, thresholds to verify; tachograph needed for DG). Urgent pick uses ledger, vehicle calendar, DB documents and a valid medcheck (B15), and creates a Trip `U-<n>` with audit. Use the server date everywhere.","acceptance":"(1) A driver with 4 h 20 min continuous driving is not offered for a 2 h trip without a break. (2) An expired licence in the DB excludes the driver. (3) The assignment creates a trip visible in Dispatcher. (4) No hard-coded vehicle or date constants remain (grep test)."},"de":{"title":"Lenkzeitkonto der Fahrer und datenbasierte Eilzuordnung","finding":"Die Lenkzeit stammt aus dem statischen `TACHO`. Die einzige Regel ist „9 h − gefahren ≥ 6 h“ (`be/v5/modules/staff.py:42-43`). Es gibt keine Regeln für ununterbrochenes Fahren, Tages- oder Wochenruhe. Die Stunden bei Schichtende sind der feste Text „9,0 h“ (`driver.py:98-100`). Das Szenariodatum ist fix (`staff.py:16`, `TODAY = 06.10.2026`). Belegte Fahrzeuge sind fest codiert (`staff.py:52`, `fe/v5/engine/staff.ts:23`). Die Eiltour ist immer „U-01“, und die Zuordnung legt keine Tour an (`staff.py:69-83`). Gültigkeit von Führerschein und ADR stammt aus der Referenz, nicht aus `Driver.license_until`/`adr_until` (`be/models.py:222-223`).","change":"Zeitkonto aus Schichtbeginn und -ende in der App plus Wialon-Fahreraktivität, sofern verfügbar. Regeln: Tageslenkzeit, 4,5 h ununterbrochen, Tagesruhe, Wochenruhe gemäß Arbeits-/Ruhezeitverordnung des MID (adilet V1500014095, Schwellen zu verifizieren; Fahrtschreiber für Gefahrgut erforderlich). Die Eilauswahl nutzt Zeitkonto, Fahrzeugkalender, DB-Dokumente und gültigen Medizincheck (B15) und legt eine Tour `U-<n>` mit Audit an. Überall das Serverdatum verwenden.","acceptance":"(1) Ein Fahrer mit 4 h 20 min ununterbrochener Lenkzeit wird für eine 2-h-Tour ohne Pause nicht angeboten. (2) Ein in der DB abgelaufener Führerschein schließt den Fahrer aus. (3) Die Zuordnung legt eine im Disponenten sichtbare Tour an. (4) Keine fest codierten Fahrzeug- oder Datumskonstanten mehr (grep-Test)."},"ru":{"title":"Учёт рабочего времени водителей и срочное назначение по данным","finding":"Время вождения берётся из статического `TACHO`. Единственное правило — «9 ч − отъезжено ≥ 6 ч» (`be/v5/modules/staff.py:42-43`). Нет правил непрерывного вождения, ежедневного и еженедельного отдыха. Часы в конце смены — фиксированный текст «9,0 ч» (`driver.py:98-100`). Дата сценария фиксирована (`staff.py:16`, `TODAY = 06.10.2026`). Занятые ТС заданы жёстко (`staff.py:52`, `fe/v5/engine/staff.ts:23`). Срочный рейс всегда «U-01», а назначение не создаёт рейс (`staff.py:69-83`). Сроки прав и ДОПОГ берутся из справочника, а не из `Driver.license_until`/`adr_until` (`be/models.py:222-223`).","change":"Вести учёт времени по началу и концу смены в приложении плюс активности водителя в Wialon, где доступно. Правила: суточное вождение, 4,5 ч непрерывно, ежедневный отдых, еженедельный отдых — по приказу МИИР о режиме труда и отдыха (adilet V1500014095, пороги уточнить; для опасных грузов нужен тахограф). Срочный подбор использует учёт времени, календарь ТС, документы БД и действующий медосмотр (B15) и создаёт рейс `U-<n>` с аудитом. Везде использовать серверную дату.","acceptance":"(1) Водитель с 4 ч 20 мин непрерывного вождения не предлагается на 2-часовой рейс без перерыва. (2) Истёкшие права в БД исключают водителя. (3) Назначение создаёт рейс, видимый в «Диспетчере». (4) Жёстко заданных констант ТС и дат не осталось (grep-тест)."}},{"id":"FR-119","type":"FR","date":"2026-10-11","priority":"high","status":"implemented","group":{"en":"Resources, staff, partners & planning","de":"Ressourcen, Personal, Partner & Planung","ru":"Ресурсы, персонал, партнёры и планирование"},"depends":"FR-118, FR-120","effort":"M","source":"docs/CHANGE-REQUESTS.md","en":{"title":"Compute the 7-day capacity plan from real data","finding":"Demand, vehicle availability and driver availability are hard-coded arrays (`fe/v5/engine/planning.ts:13`, `:19`, `:20`). The recommendations are fixed texts with concept dates (`:31-34`). The backend module has no state or actions (`be/v5/modules/planning.py:10-12`). The screen cannot react to a real booking, ticket or sick leave.","change":"`GET /api/v5/plan?days=7` computes demand from bookings and orders per departure date (pallets, kg, temperature class). Supply comes from the vehicle calendar (B10) and driver availability (B12). Weather risk comes from active `roadMsg`. A shortfall day offers actions: hand-over request to partners, external carrier with cost check (B19), express decision (B20). What-if scenarios stay client-side on top of the real baseline.","acceptance":"(1) Adding a 6-pallet booking for day 3 changes \"vehicles needed\" for day 3. (2) An open service ticket reduces \"available\". (3) The recommendation lists the real affected trips."},"de":{"title":"7-Tage-Kapazitätsplan aus echten Daten berechnen","finding":"Bedarf, Fahrzeug- und Fahrerverfügbarkeit sind fest codierte Arrays (`fe/v5/engine/planning.ts:13`, `:19`, `:20`). Die Empfehlungen sind feste Texte mit Konzeptdaten (`:31-34`). Das Backend-Modul hat weder Zustand noch Aktionen (`be/v5/modules/planning.py:10-12`). Der Bildschirm kann auf keine echte Buchung, kein Ticket und keine Krankmeldung reagieren.","change":"`GET /api/v5/plan?days=7` berechnet den Bedarf aus Buchungen und Aufträgen je Abfahrtsdatum (Paletten, kg, Temperaturklasse). Das Angebot kommt aus dem Fahrzeugkalender (B10) und der Fahrerverfügbarkeit (B12). Das Wetterrisiko kommt aus aktiven `roadMsg`. Ein Fehlmengentag bietet Maßnahmen: Übergabeanfrage an Partner, externer Frachtführer mit Kostenprüfung (B19), Express-Entscheidung (B20). What-if-Szenarien bleiben clientseitig auf der realen Basis.","acceptance":"(1) Eine Buchung über 6 Paletten für Tag 3 ändert „benötigte Fahrzeuge“ für Tag 3. (2) Ein offenes Werkstattticket reduziert „verfügbar“. (3) Die Empfehlung listet die tatsächlich betroffenen Touren."},"ru":{"title":"Рассчитывать 7-дневный план мощностей по реальным данным","finding":"Спрос, доступность ТС и водителей — жёстко заданные массивы (`fe/v5/engine/planning.ts:13`, `:19`, `:20`). Рекомендации — фиксированные тексты с датами концепта (`:31-34`). У модуля бэкенда нет ни состояния, ни действий (`be/v5/modules/planning.py:10-12`). Экран не реагирует на реальное бронирование, заявку или больничный.","change":"`GET /api/v5/plan?days=7` считает спрос по бронированиям и заказам на дату отправления (паллеты, кг, температурный класс). Предложение — из календаря ТС (B10) и доступности водителей (B12). Погодный риск — из активных `roadMsg`. День с дефицитом предлагает действия: запрос передачи партнёрам, внешний перевозчик с проверкой стоимости (B19), решение по экспрессу (B20). Сценарии what-if остаются на клиенте поверх реальной базы.","acceptance":"(1) Бронирование на 6 паллет на день 3 меняет «нужно ТС» на день 3. (2) Открытая сервисная заявка уменьшает «доступно». (3) Рекомендация перечисляет реально затронутые рейсы."}},{"id":"FR-118","type":"FR","date":"2026-10-11","priority":"high","status":"implemented","group":{"en":"Resources, staff, partners & planning","de":"Ressourcen, Personal, Partner & Planung","ru":"Ресурсы, персонал, партнёры и планирование"},"depends":"FR-78, FR-128","effort":"L","source":"docs/CHANGE-REQUESTS.md","en":{"title":"Service tickets drive vehicle availability and slot capacity","finding":"`partners.call` sets only the v5 document `vehSt` (`be/v5/modules/partners.py:254`). The platform `Vehicle.status` (`be/models.py:204`) stays active. Booking slots use the static `Schedule.pallets_capacity`, which is not linked to any vehicle (`be/booking.py:72`, `:106`, `be/models.py:433`), so customers can still book departures of a broken truck. A breakdown in the driver app and a defect reported at shift end only create events (`driver.py:295-322`), although the docstring promises a service request (`:312`).","change":"Add a vehicle availability calendar (service ticket open → unavailable until ETA or close). The app's breakdown and defect reports create a service ticket draft. Schedule gets assigned vehicles, and capacity = min(schedule, sum of available vehicle pallets/kg). If a departure that has bookings loses its vehicle: dispatcher alarm + webhook `booking.at_risk` to the API customer.","acceptance":"(1) An open ticket on the vehicle of line X reduces free pallets of the affected departures to its replacement capacity. (2) Shift end with `defect=true` creates exactly one ticket. (3) Closing the ticket restores capacity and is audited."},"de":{"title":"Werkstatttickets steuern Fahrzeugverfügbarkeit und Slotkapazität","finding":"`partners.call` setzt nur `vehSt` im v5-Dokument (`be/v5/modules/partners.py:254`). Der Plattformstatus `Vehicle.status` (`be/models.py:204`) bleibt aktiv. Buchungsslots nutzen die statische `Schedule.pallets_capacity`, die mit keinem Fahrzeug verknüpft ist (`be/booking.py:72`, `:106`, `be/models.py:433`), sodass Kunden weiterhin Abfahrten eines defekten Lkw buchen können. Eine Panne in der Fahrer-App und ein bei Schichtende gemeldeter Mangel erzeugen nur Ereignisse (`driver.py:295-322`), obwohl der Docstring einen Werkstattauftrag verspricht (`:312`).","change":"Verfügbarkeitskalender für Fahrzeuge (offenes Werkstattticket → nicht verfügbar bis ETA oder Abschluss). Panne- und Mangelmeldungen aus der App erzeugen einen Werkstattticket-Entwurf. Der Fahrplan erhält zugeordnete Fahrzeuge, Kapazität = min(Fahrplan, Summe verfügbarer Fahrzeugpaletten/-kg). Verliert eine Abfahrt mit Buchungen ihr Fahrzeug: Disponentenalarm + Webhook `booking.at_risk` an den API-Kunden.","acceptance":"(1) Ein offenes Ticket am Fahrzeug der Linie X reduziert die freien Paletten der betroffenen Abfahrten auf die Ersatzkapazität. (2) Schichtende mit `defect=true` erzeugt genau ein Ticket. (3) Das Schließen des Tickets stellt die Kapazität wieder her und wird auditiert."},"ru":{"title":"Сервисные заявки определяют доступность ТС и мощность слотов","finding":"`partners.call` меняет только `vehSt` в документе v5 (`be/v5/modules/partners.py:254`). Статус платформы `Vehicle.status` (`be/models.py:204`) остаётся активным. Слоты бронирования используют статическую `Schedule.pallets_capacity`, не связанную ни с одним ТС (`be/booking.py:72`, `:106`, `be/models.py:433`), поэтому клиенты могут бронировать отправления сломанной машины. Поломка в приложении водителя и дефект, заявленный в конце смены, создают только события (`driver.py:295-322`), хотя docstring обещает сервисную заявку (`:312`).","change":"Календарь доступности ТС (открыта сервисная заявка → недоступно до ETA или закрытия). Сообщения о поломке и дефекте из приложения создают черновик сервисной заявки. Графику назначаются ТС, мощность = min(график, сумма паллет/кг доступных ТС). Если отправление с бронированиями теряет ТС: тревога диспетчеру + вебхук `booking.at_risk` клиенту API.","acceptance":"(1) Открытая заявка на ТС линии X уменьшает свободные паллеты затронутых отправлений до мощности замены. (2) Конец смены с `defect=true` создаёт ровно одну заявку. (3) Закрытие заявки восстанавливает мощность и аудируется."}},{"id":"FR-117","type":"FR","date":"2026-10-11","priority":"high","status":"implemented","group":{"en":"Compliance & state documents","de":"Compliance & Staatsdokumente","ru":"Соответствие требованиям и государственные документы"},"depends":"FR-78, FR-108","effort":"M","source":"docs/CHANGE-REQUESTS.md","en":{"title":"GDP evidence for partner legs","finding":"The hand-over check is the boolean `gdp`/`cold` per partner (`partners.py:111-116`). There is no qualification certificate or expiry, no temperature record for the partner leg, and no logger read at hand-over or at the partner's delivery. The partner portal has 3 click steps (`partners.py:221-234`). GDP (MoH ҚР ДСМ-15/2021, EEC Decision 80) needs continuous records and qualified vehicles per leg.","change":"Add partner GDP qualification (vehicle mapping, audit date, expiry) as master data. At hand-over, record the logger id and temperature, and seal number, at both ends. The partner ePOD requires a logger read or a data upload. A missing record or an excursion opens a deviation in Quality automatically.","acceptance":"(1) A hand-over to a partner with an expired qualification returns 409. (2) A partner ePOD without logger data cannot be `final`. (3) An excursion in the upload creates a DEV entry linked to the HO id."},"de":{"title":"GDP-Nachweise für Partnerstrecken","finding":"Die Übergabeprüfung ist das Boolesche `gdp`/`cold` je Partner (`partners.py:111-116`). Es gibt kein Qualifizierungszertifikat und kein Ablaufdatum, keine Temperaturaufzeichnung für die Partnerstrecke und kein Auslesen des Loggers bei Übergabe oder bei Zustellung durch den Partner. Das Partnerportal hat 3 Klickschritte (`partners.py:221-234`). GDP (MoH ҚР ДСМ-15/2021, EEC-Entscheidung 80) verlangt lückenlose Aufzeichnungen und qualifizierte Fahrzeuge je Strecke.","change":"GDP-Qualifizierung von Partnern (Fahrzeugzuordnung, Auditdatum, Ablauf) als Stammdaten. Bei Übergabe an beiden Enden Logger-ID und Temperatur sowie Plombennummer erfassen. Der Partner-ePOD erfordert ein Logger-Auslesen oder einen Daten-Upload. Fehlende Aufzeichnung oder Abweichung öffnet automatisch eine Abweichung in Qualität.","acceptance":"(1) Übergabe an einen Partner mit abgelaufener Qualifizierung liefert 409. (2) Ein Partner-ePOD ohne Loggerdaten kann nicht `final` sein. (3) Eine Abweichung im Upload erzeugt einen DEV-Eintrag mit Verweis auf die HO-ID."},"ru":{"title":"GDP-доказательства для плеч партнёров","finding":"Проверка передачи — булевы `gdp`/`cold` по партнёру (`partners.py:111-116`). Нет сертификата квалификации и срока его действия, нет записи температуры на плече партнёра, нет считывания логгера при передаче и при доставке партнёром. Портал партнёра — 3 шага нажатий (`partners.py:221-234`). GDP (приказ МЗ ҚР ДСМ-15/2021, Решение ЕЭК № 80) требует непрерывных записей и квалифицированных ТС на каждом плече.","change":"GDP-квалификация партнёра (привязка ТС, дата аудита, срок) как мастер-данные. При передаче на обоих концах фиксировать id логгера, температуру и номер пломбы. ePOD партнёра требует считывания логгера или загрузки данных. Отсутствие записи или отклонение автоматически открывает отклонение в «Качестве».","acceptance":"(1) Передача партнёру с истёкшей квалификацией возвращает 409. (2) ePOD партнёра без данных логгера не может быть `final`. (3) Отклонение в загрузке создаёт запись DEV со ссылкой на id HO."}},{"id":"FR-116","type":"FR","date":"2026-10-11","priority":"high","status":"implemented","group":{"en":"Compliance & state documents","de":"Compliance & Staatsdokumente","ru":"Соответствие требованиям и государственные документы"},"depends":"FR-108, FR-125","effort":"L","source":"docs/CHANGE-REQUESTS.md","en":{"title":"Generate ESF from the delivered order and record incoming partner invoices","finding":"The `esf` state document holds only `{order, vat_rate:16}`, with no amount, buyer or turnover date (`be/routers/integrations.py:380-382`). The v5 documents screen simulates \"sent to IS ESF\" in its own document store (`be/v5/modules/docs.py:186-195`), so there are two ESF worlds. There is no deadline check for issuing an ESF after the turnover date (statutory period, to verify). Partner hand-over cost `n × rate` (`partners.py:182`) and workshop cost are never recorded as an incoming invoice.","change":"On a final ePOD (B06), create an ESF draft from `Booking.price_net`/`vat` and `Customer.bin`, using `esf.invoice_xml`. Use one store (`state_document`) for the v5 docs screen as well. Add an issuance-deadline alarm. Add an incoming register (supplier BIN, ESF no., amount) linked to the HO-/SR- id and fed into the cost ledger (B18).","acceptance":"(1) A delivered order produces exactly one ESF draft with net, VAT 16 % and buyer BIN. (2) The v5 docs screen shows the same status as `/api/state-docs`. (3) An ESF not registered by deadline−2d raises an inbox `doc_status` lvl 2."},"de":{"title":"ESF aus dem zugestellten Auftrag erzeugen und eingehende Partnerrechnungen erfassen","finding":"Das Staatsdokument `esf` enthält nur `{order, vat_rate:16}`, ohne Betrag, Käufer oder Umsatzdatum (`be/routers/integrations.py:380-382`). Der v5-Dokumentenbildschirm simuliert „an IS ESF gesendet“ in einem eigenen Dokumentspeicher (`be/v5/modules/docs.py:186-195`), es gibt also zwei ESF-Welten. Es gibt keine Fristprüfung für die Ausstellung einer ESF nach dem Umsatzdatum (gesetzliche Frist, zu verifizieren). Übergabekosten an Partner `n × rate` (`partners.py:182`) und Werkstattkosten werden nie als Eingangsrechnung erfasst.","change":"Bei finalem ePOD (B06) einen ESF-Entwurf aus `Booking.price_net`/`vat` und `Customer.bin` über `esf.invoice_xml` erzeugen. Einen Speicher (`state_document`) auch für den v5-Dokumentenbildschirm nutzen. Alarm für die Ausstellungsfrist. Eingangsregister (Lieferanten-BIN, ESF-Nr., Betrag), verknüpft mit der HO-/SR-ID und in das Ist-Kosten-Ledger eingespeist (B18).","acceptance":"(1) Ein zugestellter Auftrag erzeugt genau einen ESF-Entwurf mit Netto, MwSt. 16 % und Käufer-BIN. (2) Der v5-Dokumentenbildschirm zeigt denselben Status wie `/api/state-docs`. (3) Eine bis Frist−2 T nicht registrierte ESF löst ein Inbox-`doc_status` Stufe 2 aus."},"ru":{"title":"Формировать ЭСФ из доставленного заказа и учитывать входящие счета партнёров","finding":"Государственный документ `esf` содержит только `{order, vat_rate:16}`, без суммы, покупателя и даты оборота (`be/routers/integrations.py:380-382`). Экран документов v5 симулирует «отправлено в ИС ЭСФ» в собственном хранилище документов (`be/v5/modules/docs.py:186-195`), то есть существуют два мира ЭСФ. Нет контроля срока выписки ЭСФ после даты оборота (законный срок, уточнить). Стоимость передачи партнёру `n × rate` (`partners.py:182`) и стоимость сервиса никогда не учитываются как входящий счёт.","change":"При финальном ePOD (B06) создавать черновик ЭСФ из `Booking.price_net`/`vat` и `Customer.bin` через `esf.invoice_xml`. Использовать одно хранилище (`state_document`) и для экрана документов v5. Тревога по сроку выписки. Реестр входящих (БИН поставщика, № ЭСФ, сумма), связанный с id HO-/SR- и передаваемый в учёт фактических затрат (B18).","acceptance":"(1) Доставленный заказ создаёт ровно один черновик ЭСФ с суммой без НДС, НДС 16 % и БИН покупателя. (2) Экран документов v5 показывает тот же статус, что `/api/state-docs`. (3) ЭСФ, не зарегистрированная к сроку−2 дня, поднимает входящее `doc_status` уровня 2."}},{"id":"FR-115","type":"FR","date":"2026-10-11","priority":"high","status":"implemented","group":{"en":"Compliance & state documents","de":"Compliance & Staatsdokumente","ru":"Соответствие требованиям и государственные документы"},"depends":"FR-78","effort":"M","source":"docs/CHANGE-REQUESTS.md","en":{"title":"Dangerous-goods and dry-ice data per shipment","finding":"The TTN payload always has `dangerous_goods: None` (`be/integrations/esutd.py:67`). The booking API has no DG fields (`be/routers/partner_api.py:97-106`). ADR checks in hand-over and urgent assignment use reference line flags (`partners.py:102`, `staff.py:45`). Research requires UN number, LQ flag and dry-ice kg per shipment (UN 1845, ADR 5.5.3).","change":"Add `un_number`, `lq` (bool), `dry_ice_kg` and `adr_class` to Order and Booking (portal + API v1 + spec). Fill the TTN `dangerous_goods` from them. The hand-over, urgent-pick and vehicle checks read the order data. Over the LQ limits: require an ADR driver and vehicle and a tachograph (B12).","acceptance":"(1) An API booking with `dry_ice_kg=20` appears on the TTN print. (2) A hand-over of an ADR order to a partner with `adr=false` returns 409. (3) The OpenAPI spec is updated, and a DG field without a UN number returns 422."},"de":{"title":"Gefahrgut- und Trockeneisdaten je Sendung","finding":"Die TTN-Payload hat immer `dangerous_goods: None` (`be/integrations/esutd.py:67`). Die Buchungs-API hat keine Gefahrgutfelder (`be/routers/partner_api.py:97-106`). ADR-Prüfungen bei Übergabe und Eilzuordnung nutzen Flags der Referenzpositionen (`partners.py:102`, `staff.py:45`). Die Recherche verlangt UN-Nummer, LQ-Kennzeichen und kg Trockeneis je Sendung (UN 1845, ADR 5.5.3).","change":"`un_number`, `lq` (bool), `dry_ice_kg` und `adr_class` zu Order und Booking hinzufügen (Portal + API v1 + Spezifikation). `dangerous_goods` der TTN daraus befüllen. Übergabe-, Eilauswahl- und Fahrzeugprüfungen lesen die Auftragsdaten. Über den LQ-Grenzen: ADR-Fahrer und -Fahrzeug sowie Fahrtschreiber erforderlich (B12).","acceptance":"(1) Eine API-Buchung mit `dry_ice_kg=20` erscheint im TTN-Druck. (2) Die Übergabe eines ADR-Auftrags an einen Partner mit `adr=false` liefert 409. (3) Die OpenAPI-Spezifikation ist aktualisiert, ein Gefahrgutfeld ohne UN-Nummer liefert 422."},"ru":{"title":"Данные об опасных грузах и сухом льде по каждой отправке","finding":"В данных ТТН всегда `dangerous_goods: None` (`be/integrations/esutd.py:67`). В API бронирования нет полей опасных грузов (`be/routers/partner_api.py:97-106`). Проверки ДОПОГ при передаче и срочном назначении используют флаги справочных строк (`partners.py:102`, `staff.py:45`). Исследование требует номер ООН, признак LQ и кг сухого льда по каждой отправке (UN 1845, ДОПОГ 5.5.3).","change":"Добавить `un_number`, `lq` (bool), `dry_ice_kg` и `adr_class` в Order и Booking (портал + API v1 + спецификация). Заполнять из них `dangerous_goods` в ТТН. Проверки передачи, срочного подбора и ТС читают данные заказа. Сверх лимитов LQ: требуются водитель и ТС с допуском ДОПОГ и тахограф (B12).","acceptance":"(1) API-бронирование с `dry_ice_kg=20` появляется в печатной ТТН. (2) Передача заказа ДОПОГ партнёру с `adr=false` возвращает 409. (3) Спецификация OpenAPI обновлена, поле опасного груза без номера ООН возвращает 422."}},{"id":"FR-114","type":"FR","date":"2026-10-11","priority":"critical","status":"implemented","group":{"en":"Compliance & state documents","de":"Compliance & Staatsdokumente","ru":"Соответствие требованиям и государственные документы"},"depends":"FR-83, FR-120","effort":"M","source":"docs/CHANGE-REQUESTS.md","en":{"title":"Enforce pre-trip medical check before 01.01.2027","finding":"`medcheck` is an optional manual state document (`be/routers/integrations.py:365-372`). The trip sheet is built with `pretrip_medical_check` possibly None (`be/integrations/esutd.py:86`), and nothing blocks release. The driver app's trip-sheet signature only needs the checklist (`driver.py:167-178`). The trip-sheet payload leaves `pretrip_technical_check` and `odometer_start`/`end` empty (`esutd.py:85-87`), although the app records the checklist and odometers (`driver.py:51-55`, `:98-100`).","change":"From a configurable date (default 2027-01-01), for vehicles > 3.5 t: `driver.signSheet` and the Go/No-Go release require a medcheck with admitted=true and checked_at ≤ 8 h before departure (value to verify). The trip sheet is filled from the app checklist and odometers. Integration hub shows a deadline panel with a countdown to 01.01.2027 and 01.06.2027 and the share of trips with a complete trip sheet and TTN data.","acceptance":"(1) After the cut-over date, signing without a medcheck returns 409 with a clear reason. (2) The trip-sheet payload has the odometer and the technical-check result. (3) The panel shows days left and readiness % per hub."},"de":{"title":"Vorfahrt-Medizincheck vor dem 01.01.2027 erzwingen","finding":"`medcheck` ist ein optionales manuelles Staatsdokument (`be/routers/integrations.py:365-372`). Das Fahrtenblatt wird mit möglicherweise leerem `pretrip_medical_check` erzeugt (`be/integrations/esutd.py:86`), und nichts sperrt die Freigabe. Die Unterschrift unter das Fahrtenblatt in der Fahrer-App braucht nur die Checkliste (`driver.py:167-178`). Die Fahrtenblatt-Payload lässt `pretrip_technical_check` und `odometer_start`/`end` leer (`esutd.py:85-87`), obwohl die App Checkliste und Kilometerstände erfasst (`driver.py:51-55`, `:98-100`).","change":"Ab einem konfigurierbaren Datum (Standard 2027-01-01) für Fahrzeuge > 3,5 t: `driver.signSheet` und die Go/No-Go-Freigabe verlangen einen Medizincheck mit admitted=true und checked_at ≤ 8 h vor Abfahrt (Wert zu verifizieren). Das Fahrtenblatt wird aus Checkliste und Kilometerständen der App befüllt. Der Integrations-Hub zeigt ein Fristenpanel mit Countdown zum 01.01.2027 und 01.06.2027 und dem Anteil der Touren mit vollständigen Fahrtenblatt- und TTN-Daten.","acceptance":"(1) Nach dem Stichtag liefert das Unterschreiben ohne Medizincheck 409 mit klarer Begründung. (2) Die Fahrtenblatt-Payload enthält Kilometerstand und Ergebnis der technischen Kontrolle. (3) Das Panel zeigt Resttage und Bereitschaft in % je Hub."},"ru":{"title":"Обязательный предрейсовый медосмотр до 01.01.2027","finding":"`medcheck` — необязательный ручной государственный документ (`be/routers/integrations.py:365-372`). Путевой лист формируется с возможно пустым `pretrip_medical_check` (`be/integrations/esutd.py:86`), и ничто не блокирует выпуск. Подпись путевого листа в приложении водителя требует только чек-лист (`driver.py:167-178`). В данных путевого листа `pretrip_technical_check` и `odometer_start`/`end` пусты (`esutd.py:85-87`), хотя приложение фиксирует чек-лист и показания одометра (`driver.py:51-55`, `:98-100`).","change":"С настраиваемой даты (по умолчанию 2027-01-01) для ТС > 3,5 т: `driver.signSheet` и выпуск Go/No-Go требуют медосмотр с admitted=true и checked_at ≤ 8 ч до выезда (значение уточнить). Путевой лист заполняется из чек-листа и одометра приложения. Хаб интеграций показывает панель сроков с обратным отсчётом до 01.01.2027 и 01.06.2027 и долей рейсов с полными данными путевого листа и ТТН.","acceptance":"(1) После даты перехода подпись без медосмотра возвращает 409 с понятной причиной. (2) Данные путевого листа содержат одометр и результат техосмотра. (3) Панель показывает оставшиеся дни и готовность в % по хабам."}},{"id":"FR-113","type":"FR","date":"2026-10-11","priority":"medium","status":"implemented","group":{"en":"Delivery, driver app, coverage & SMS","de":"Zustellung, Fahrer-App, Netzabdeckung & SMS","ru":"Доставка, приложение водителя, покрытие связи и SMS"},"depends":"FR-73, FR-98, FR-107","effort":"M","source":"docs/CHANGE-REQUESTS.md","en":{"title":"Reflect partner hand-over in orders, stops and tracking","finding":"`partners.handover` and the partner-portal steps change only the v5 document (partners.py:145-235). The relational order stays on the own trip as `in_transit`, its stop still blocks trip completion, and tracking and webhooks keep showing our vehicle.","change":"The hand-over moves the selected orders/packages to `handed_over` (partner id, time). The own trip's stop is marked `handed_over`, which counts as completed. The partner's ePOD upload sets the order to delivered; the public tracking event \"handed to partner carrier\" has no partner personal data.","acceptance":"(1) After hand-over the own trip can be closed. (2) Tracking shows \"handed to partner\". (3) The partner's ePOD → order delivered plus `shipment.delivered`."},"de":{"title":"Partnerübergabe in Aufträgen, Stopps und Tracking abbilden","finding":"`partners.handover` und die Schritte des Partnerportals ändern nur das v5-Dokument (partners.py:145-235). Der relationale Auftrag bleibt auf der eigenen Tour als `in_transit`, sein Stopp blockiert weiter den Tourabschluss, und Tracking und Webhooks zeigen weiter unser Fahrzeug.","change":"Die Übergabe setzt die gewählten Aufträge/Packstücke auf `handed_over` (Partner-ID, Zeit). Der Stopp der eigenen Tour wird als `handed_over` markiert und gilt als erledigt. Der ePOD-Upload des Partners setzt den Auftrag auf zugestellt; das öffentliche Tracking-Ereignis „an Partnerfrachtführer übergeben“ enthält keine personenbezogenen Partnerdaten.","acceptance":"(1) Nach der Übergabe kann die eigene Tour abgeschlossen werden. (2) Das Tracking zeigt „an Partner übergeben“. (3) ePOD des Partners → Auftrag zugestellt plus `shipment.delivered`."},"ru":{"title":"Отражать передачу партнёру в заказах, точках и трекинге","finding":"`partners.handover` и шаги портала партнёра меняют только документ v5 (partners.py:145-235). Реляционный заказ остаётся на собственном рейсе как `in_transit`, его точка по-прежнему мешает закрыть рейс, а трекинг и вебхуки продолжают показывать наше ТС.","change":"Передача переводит выбранные заказы/места в `handed_over` (id партнёра, время). Точка собственного рейса отмечается `handed_over` и считается выполненной. Загрузка ePOD партнёром переводит заказ в «доставлено»; публичное событие трекинга «передано перевозчику-партнёру» без персональных данных партнёра.","acceptance":"(1) После передачи собственный рейс можно закрыть. (2) Трекинг показывает «передано партнёру». (3) ePOD партнёра → заказ доставлен плюс `shipment.delivered`."}},{"id":"FR-112","type":"FR","date":"2026-10-11","priority":"medium","status":"implemented","group":{"en":"Delivery, driver app, coverage & SMS","de":"Zustellung, Fahrer-App, Netzabdeckung & SMS","ru":"Доставка, приложение водителя, покрытие связи и SMS"},"depends":"FR-94, FR-98","effort":"M","source":"docs/CHANGE-REQUESTS.md","en":{"title":"Per-stop ETA and an event timeline in tracking","finding":"Tracking shows the trip-level ETA (the last stop) for every order on a multi-stop trip (public.py:229). The ETA is never recalculated after delivered stops, delays or a replan. There is no event history. After a trip is cancelled the order silently falls back to `new` (operations.py:436-437).","change":"Add `TripStop.eta_planned`/`eta_current` (updated by replan, arrivals and the 2GIS routes worker). Tracking returns the order's own stop ETA plus a timeline of non-personal events (booked, planned, loaded, departed, arrived, delivered, handed over, delay category) and a temperature-compliance flag (yes/no only). Add webhook `shipment.eta_changed` when the ETA moves by more than 60 min.","acceptance":"(1) On a 3-stop trip, each order's tracking ETA equals its own stop's ETA. (2) A replan updates the tracking ETA and queues `shipment.eta_changed`. (3) The tracking response contains no names, phones or plates (test)."},"de":{"title":"ETA je Stopp und Ereignis-Zeitleiste im Tracking","finding":"Das Tracking zeigt für jeden Auftrag einer Mehrstopp-Tour die ETA der Tour (des letzten Stopps) (public.py:229). Die ETA wird nach zugestellten Stopps, Verspätungen oder Umplanung nie neu berechnet. Es gibt keine Ereignishistorie. Nach Stornierung einer Tour fällt der Auftrag stillschweigend auf `new` zurück (operations.py:436-437).","change":"`TripStop.eta_planned`/`eta_current` ergänzen (aktualisiert durch Umplanung, Ankünfte und den 2GIS-Routen-Worker). Das Tracking liefert die ETA des eigenen Stopps des Auftrags plus eine Zeitleiste nicht personenbezogener Ereignisse (gebucht, geplant, verladen, abgefahren, angekommen, zugestellt, übergeben, Verspätungskategorie) und ein Temperatur-Konformitätsflag (nur ja/nein). Webhook `shipment.eta_changed`, wenn sich die ETA um mehr als 60 min verschiebt.","acceptance":"(1) Auf einer Tour mit 3 Stopps entspricht die Tracking-ETA jedes Auftrags der ETA seines Stopps. (2) Eine Umplanung aktualisiert die Tracking-ETA und stellt `shipment.eta_changed` ein. (3) Die Tracking-Antwort enthält keine Namen, Telefonnummern oder Kennzeichen (Test)."},"ru":{"title":"ETA по каждой точке и лента событий в трекинге","finding":"Трекинг показывает ETA рейса (последней точки) для каждого заказа многоточечного рейса (public.py:229). ETA не пересчитывается после доставленных точек, задержек или перепланирования. Истории событий нет. После отмены рейса заказ молча возвращается в `new` (operations.py:436-437).","change":"Добавить `TripStop.eta_planned`/`eta_current` (обновляются перепланированием, прибытиями и воркером маршрутов 2GIS). Трекинг возвращает ETA собственной точки заказа плюс ленту событий без персональных данных (забронирован, запланирован, погружен, выехал, прибыл, доставлен, передан, категория задержки) и признак соблюдения температуры (только да/нет). Вебхук `shipment.eta_changed` при сдвиге ETA более чем на 60 мин.","acceptance":"(1) В рейсе с 3 точками ETA трекинга каждого заказа равна ETA его точки. (2) Перепланирование обновляет ETA трекинга и ставит в очередь `shipment.eta_changed`. (3) Ответ трекинга не содержит имён, телефонов и госномеров (тест)."}},{"id":"FR-111","type":"FR","date":"2026-10-11","priority":"low","status":"implemented","group":{"en":"Delivery, driver app, coverage & SMS","de":"Zustellung, Fahrer-App, Netzabdeckung & SMS","ru":"Доставка, приложение водителя, покрытие связи и SMS"},"depends":"FR-109","effort":"M","source":"docs/CHANGE-REQUESTS.md","en":{"title":"Learn real dead zones from telematics gaps","finding":"All 23 stretches are `conf: estimated` (`be/v5/reference/coverage.json`, research §1.2). The expected window that suppresses level-2 alarms depends on these estimates (`be/v5/modules/coverage.py:225`). TTC masts are due by the end of 2026 on republican roads (research F5), so the model will age quickly. ROADMAP lists \"learn the real dead zones\", but nothing stores gaps today.","change":"Store every telematics or app gap > 10 min (start/end position, operator, vehicle, stretch). A monthly job proposes class changes per stretch (needs ≥ N passes). An analyst accepts them, which sets `conf: verified, source: own telematics`. The map shows model vs measured.","acceptance":"(1) A gap of 25 min between km 120–150 is stored with its stretch id. (2) After 5 passes the proposal shows on the coverage page. (3) Accepting it changes the expected window used by `evaluate`."},"de":{"title":"Reale Funklöcher aus Telematiklücken lernen","finding":"Alle 23 Streckenabschnitte sind `conf: estimated` (`be/v5/reference/coverage.json`, Recherche §1.2). Das erwartete Fenster, das Alarme der Stufe 2 unterdrückt, hängt von diesen Schätzungen ab (`be/v5/modules/coverage.py:225`). TTC-Masten sollen bis Ende 2026 an republikanischen Straßen stehen (Recherche F5), das Modell veraltet also schnell. Die ROADMAP nennt „reale Funklöcher lernen“, doch heute speichert nichts Lücken.","change":"Jede Telematik- oder App-Lücke > 10 min speichern (Start-/Endposition, Netzbetreiber, Fahrzeug, Abschnitt). Ein monatlicher Job schlägt Klassenänderungen je Abschnitt vor (braucht ≥ N Durchfahrten). Ein Analyst übernimmt sie, was `conf: verified, source: own telematics` setzt. Die Karte zeigt Modell vs. Messung.","acceptance":"(1) Eine Lücke von 25 min zwischen km 120–150 wird mit ihrer Abschnitts-ID gespeichert. (2) Nach 5 Durchfahrten erscheint der Vorschlag auf der Abdeckungsseite. (3) Die Übernahme ändert das von `evaluate` genutzte erwartete Fenster."},"ru":{"title":"Определять реальные зоны без связи по пропускам телематики","finding":"Все 23 участка имеют `conf: estimated` (`be/v5/reference/coverage.json`, исследование §1.2). Ожидаемое окно, подавляющее тревоги уровня 2, зависит от этих оценок (`be/v5/modules/coverage.py:225`). Вышки ТТК на республиканских трассах должны появиться до конца 2026 г. (исследование F5), поэтому модель быстро устареет. ROADMAP содержит «изучить реальные зоны без связи», но пропуски сегодня нигде не сохраняются.","change":"Сохранять каждый пропуск телематики или приложения > 10 мин (начальная/конечная позиция, оператор, ТС, участок). Ежемесячное задание предлагает смену класса по участку (нужно ≥ N проездов). Аналитик принимает предложение, что устанавливает `conf: verified, source: own telematics`. Карта показывает модель vs измерения.","acceptance":"(1) Пропуск 25 мин между км 120–150 сохраняется с id участка. (2) После 5 проездов предложение появляется на странице покрытия. (3) Принятие меняет ожидаемое окно, используемое `evaluate`."}},{"id":"FR-110","type":"FR","date":"2026-10-11","priority":"high","status":"implemented","group":{"en":"Delivery, driver app, coverage & SMS","de":"Zustellung, Fahrer-App, Netzabdeckung & SMS","ru":"Доставка, приложение водителя, покрытие связи и SMS"},"depends":"FR-104","effort":"S","source":"docs/CHANGE-REQUESTS.md","en":{"title":"Delivery status and ack timeout for dispatcher SMS","finding":"An instruction is only `queued → sent` (`be/v5/modules/coverage.py:409-411`). An `AK` only stores `ack` (`:335-339`). A STOP or CHKT instruction that is never acknowledged produces no alarm. SMSC delivery reports are planned (ROADMAP) but not built.","change":"Add the SMSC status callback (signed, same inbound path) → `delivered`/`undeliverable`. Ack deadline per code: STOP 10 min, CHKT 15 min, WAIT, CALL and PARK 30 min. On timeout: inbox lvl 2 + \"call driver\" task + optional resend (respects the 3 SMS / 10 min limit).","acceptance":"(1) `delivered` is set from the callback. A bad signature returns 401. (2) No AK for 15 min after CHKT → one inbox event `sms_ack_timeout`. (3) An AK after the timeout closes the event."},"de":{"title":"Zustellstatus und Quittungs-Timeout für Disponenten-SMS","finding":"Eine Anweisung ist nur `queued → sent` (`be/v5/modules/coverage.py:409-411`). Ein `AK` speichert nur `ack` (`:335-339`). Eine nie quittierte STOP- oder CHKT-Anweisung erzeugt keinen Alarm. SMSC-Zustellberichte sind geplant (ROADMAP), aber nicht umgesetzt.","change":"SMSC-Status-Callback ergänzen (signiert, derselbe eingehende Pfad) → `delivered`/`undeliverable`. Quittungsfrist je Code: STOP 10 min, CHKT 15 min, WAIT, CALL und PARK 30 min. Bei Timeout: Inbox Stufe 2 + Aufgabe „Fahrer anrufen“ + optional erneutes Senden (unter Beachtung des Limits 3 SMS / 10 min).","acceptance":"(1) `delivered` wird aus dem Callback gesetzt; eine falsche Signatur liefert 401. (2) Kein AK 15 min nach CHKT → ein Inbox-Ereignis `sms_ack_timeout`. (3) Ein AK nach dem Timeout schließt das Ereignis."},"ru":{"title":"Статус доставки и таймаут подтверждения для SMS диспетчера","finding":"Указание проходит только `queued → sent` (`be/v5/modules/coverage.py:409-411`). `AK` лишь сохраняет `ack` (`:335-339`). Неподтверждённое указание STOP или CHKT не порождает тревогу. Отчёты о доставке SMSC запланированы (ROADMAP), но не реализованы.","change":"Добавить callback статуса SMSC (подписанный, тот же входящий путь) → `delivered`/`undeliverable`. Срок подтверждения по коду: STOP 10 мин, CHKT 15 мин, WAIT, CALL и PARK 30 мин. По таймауту: входящее уровня 2 + задача «позвонить водителю» + опциональная повторная отправка (с учётом лимита 3 SMS / 10 мин).","acceptance":"(1) `delivered` устанавливается из callback; неверная подпись возвращает 401. (2) Нет AK через 15 мин после CHKT → одно входящее событие `sms_ack_timeout`. (3) AK после таймаута закрывает событие."}},{"id":"FR-109","type":"FR","date":"2026-10-11","priority":"critical","status":"implemented","group":{"en":"Delivery, driver app, coverage & SMS","de":"Zustellung, Fahrer-App, Netzabdeckung & SMS","ru":"Доставка, приложение водителя, покрытие связи и SMS"},"depends":"FR-78, FR-83","effort":"M","source":"docs/CHANGE-REQUESTS.md","en":{"title":"Monitor all vehicles from telematics, not only the app","finding":"`covContact` is updated only by the driver app (V01 only, `be/v5/modules/driver.py:128`, `:339`) and by OL1 SMS (`coverage.py:307-311`). `sync_temperatures` and `poll_wialon_alarms` never touch it (`be/integrations/worker.py:90-124`, `:154-219`). `evaluate` skips vehicles without a `data` timestamp (`coverage.py:215-217`). A vehicle whose app was never opened, or whose tracker went silent, therefore never raises a contact alarm.","change":"Each minute the worker writes the Wialon last-message time and position per unit into `covContact[veh]` (field `tm`). Last contact = the newest of app, telematics and SMS. The monitor iterates every vehicle on a trip in loading or in_transit. \"No contact since departure\" counts from the actual departure time.","acceptance":"(1) A vehicle in transit with no app use and a tracker silent for 35 min outside a known zone raises a level-2 alarm. (2) Telematics messages alone keep it at level 0. (3) Unit test with a mocked adapter."},"de":{"title":"Alle Fahrzeuge über Telematik überwachen, nicht nur über die App","finding":"`covContact` wird nur von der Fahrer-App (nur V01, `be/v5/modules/driver.py:128`, `:339`) und von OL1-SMS (`coverage.py:307-311`) aktualisiert. `sync_temperatures` und `poll_wialon_alarms` berühren es nie (`be/integrations/worker.py:90-124`, `:154-219`). `evaluate` überspringt Fahrzeuge ohne `data`-Zeitstempel (`coverage.py:215-217`). Ein Fahrzeug, dessen App nie geöffnet wurde oder dessen Tracker verstummt ist, löst daher nie einen Kontaktalarm aus.","change":"Der Worker schreibt minütlich die letzte Wialon-Nachrichtenzeit und Position je Einheit in `covContact[veh]` (Feld `tm`). Letzter Kontakt = das Neueste aus App, Telematik und SMS. Der Monitor durchläuft jedes Fahrzeug einer Tour in loading oder in_transit. „Kein Kontakt seit Abfahrt“ zählt ab der tatsächlichen Abfahrtszeit.","acceptance":"(1) Ein Fahrzeug unterwegs ohne App-Nutzung, dessen Tracker 35 min außerhalb einer bekannten Zone schweigt, löst einen Alarm der Stufe 2 aus. (2) Telematiknachrichten allein halten es auf Stufe 0. (3) Unit-Test mit gemocktem Adapter."},"ru":{"title":"Контроль всех ТС по телематике, а не только по приложению","finding":"`covContact` обновляется только приложением водителя (только V01, `be/v5/modules/driver.py:128`, `:339`) и SMS OL1 (`coverage.py:307-311`). `sync_temperatures` и `poll_wialon_alarms` его не затрагивают (`be/integrations/worker.py:90-124`, `:154-219`). `evaluate` пропускает ТС без метки `data` (`coverage.py:215-217`). Поэтому ТС, на котором приложение ни разу не открывали или трекер замолчал, никогда не поднимает тревогу потери связи.","change":"Воркер каждую минуту пишет время последнего сообщения Wialon и позицию по каждому объекту в `covContact[veh]` (поле `tm`). Последний контакт = самый свежий из приложения, телематики и SMS. Монитор перебирает все ТС рейсов в loading или in_transit. «Нет связи с отправления» считается от фактического времени выезда.","acceptance":"(1) ТС в пути без использования приложения, трекер которого молчит 35 мин вне известной зоны, поднимает тревогу уровня 2. (2) Одних сообщений телематики достаточно для уровня 0. (3) Юнит-тест с mock-адаптером."}},{"id":"FR-108","type":"FR","date":"2026-10-11","priority":"critical","status":"implemented","group":{"en":"Delivery, driver app, coverage & SMS","de":"Zustellung, Fahrer-App, Netzabdeckung & SMS","ru":"Доставка, приложение водителя, покрытие связи и SMS"},"depends":"FR-83, FR-116","effort":"L","source":"docs/CHANGE-REQUESTS.md","en":{"title":"ePOD with legally usable evidence","finding":"The ePOD is a counter: steps \"photo\" and \"signature\" just increment `drvStep` (`be/v5/modules/driver.py:181-197`). The signatory name is a static string (`fe/v5/engine/driver.ts:22`). Queued offline events get the **server** time at sync (`driver.py:125`). An SMS `ST` creates an `epod` stub with no content (`be/v5/modules/coverage.py:283-287`). The partner-portal \"Upload ePOD\" step is clicked by our own staff with `partners:write` (`be/v5/modules/partners.py:225-234`). This would not hold up in a GDP or customer dispute.","change":"Add an ePOD record per stop: device capture time + server receipt time, GPS, consignee name and position, signature image and photo (stored on the local object store, SHA-256 in the record and in the audit log), SSCC scanned vs expected, exceptions, thermochron result. SMS `ST` sets `pod_status=preliminary_sms`, which only becomes `final` after the full sync. A partner ePOD is uploaded by a partner portal account, or flagged \"entered on behalf\" with the reason and a scan.","acceptance":"(1) The customer API's `delivered_at` and invoicing (B17) use only `final` ePODs. (2) An offline ePOD keeps its device time. Server time ≥ device time is stored separately. (3) A changed photo makes the hash check fail. (4) The partner ePOD shows who entered it."},"de":{"title":"ePOD mit rechtlich verwertbaren Nachweisen","finding":"Der ePOD ist ein Zähler: die Schritte „Foto“ und „Unterschrift“ erhöhen nur `drvStep` (`be/v5/modules/driver.py:181-197`). Der Name des Unterzeichners ist ein statischer Text (`fe/v5/engine/driver.ts:22`). Offline gepufferte Ereignisse erhalten beim Sync die **Server**zeit (`driver.py:125`). Eine SMS `ST` erzeugt einen leeren `epod`-Platzhalter (`be/v5/modules/coverage.py:283-287`). Den Schritt „ePOD hochladen“ im Partnerportal klicken eigene Mitarbeiter mit `partners:write` (`be/v5/modules/partners.py:225-234`). Das hielte in einem GDP- oder Kundenstreit nicht stand.","change":"ePOD-Datensatz je Stopp: Erfassungszeit am Gerät + Empfangszeit am Server, GPS, Name und Funktion des Empfängers, Unterschriftsbild und Foto (im lokalen Objektspeicher, SHA-256 im Datensatz und im Audit-Log), gescannte vs. erwartete SSCC, Ausnahmen, Thermochron-Ergebnis. SMS `ST` setzt `pod_status=preliminary_sms`, das erst nach vollständigem Sync `final` wird. Ein Partner-ePOD wird über ein Partnerportal-Konto hochgeladen oder als „im Auftrag erfasst“ mit Grund und Scan markiert.","acceptance":"(1) `delivered_at` der Kunden-API und die Fakturierung (B17) nutzen nur `final`-ePODs. (2) Ein Offline-ePOD behält seine Gerätezeit; Serverzeit ≥ Gerätezeit wird separat gespeichert. (3) Ein verändertes Foto lässt die Hash-Prüfung scheitern. (4) Der Partner-ePOD zeigt, wer ihn erfasst hat."},"ru":{"title":"ePOD с юридически значимыми доказательствами","finding":"ePOD — это счётчик: шаги «фото» и «подпись» лишь увеличивают `drvStep` (`be/v5/modules/driver.py:181-197`). Имя подписанта — статическая строка (`fe/v5/engine/driver.ts:22`). Офлайн-события из очереди получают **серверное** время при синхронизации (`driver.py:125`). SMS `ST` создаёт пустую заглушку `epod` (`be/v5/modules/coverage.py:283-287`). Шаг «Загрузить ePOD» в портале партнёра нажимают наши же сотрудники с `partners:write` (`be/v5/modules/partners.py:225-234`). В споре по GDP или с клиентом это не выдержит проверки.","change":"Запись ePOD по каждой точке: время фиксации на устройстве + время получения сервером, GPS, ФИО и должность получателя, изображение подписи и фото (в локальном объектном хранилище, SHA-256 в записи и журнале аудита), отсканированные vs ожидаемые SSCC, исключения, результат термохрона. SMS `ST` устанавливает `pod_status=preliminary_sms`, который становится `final` только после полной синхронизации. ePOD партнёра загружается учётной записью портала партнёра или помечается «внесено от имени» с причиной и сканом.","acceptance":"(1) `delivered_at` в API клиента и выставление счетов (B17) используют только `final` ePOD. (2) Офлайн-ePOD сохраняет время устройства; серверное время ≥ времени устройства хранится отдельно. (3) Изменённое фото проваливает проверку хеша. (4) ePOD партнёра показывает, кто его внёс."}},{"id":"FR-107","type":"FR","date":"2026-10-11","priority":"critical","status":"implemented","group":{"en":"Delivery, driver app, coverage & SMS","de":"Zustellung, Fahrer-App, Netzabdeckung & SMS","ru":"Доставка, приложение водителя, покрытие связи и SMS"},"depends":"FR-71, FR-73, FR-98","effort":"L","source":"docs/CHANGE-REQUESTS.md","en":{"title":"Connect the driver-app ePOD to stop delivery and order status","finding":"The driver-app module is hard-wired to R-103/V01 (driver.py:27). Finishing the stop flow (`driver.step` reaching 4) only appends an event (driver.py:181-195). The relational stop stays pending, orders are not set to delivered, and tracking and webhooks do not fire. The `epod` document is always \"wait\" (docs.py:121,127). `deliver_stop` stores only a timestamp: no recipient, signature, package count or chamber temperature (operations.py:461-484).","change":"Add an `epod` table: stop id, recipient name (encrypted, row-bound context), signature/photo object ids, scanned vs expected packages, exceptions per package (dmg/short/ref), arrived_at/left_at, chamber temperature at handover. The driver app works on the signed-in driver's own DB trip (`Driver.user_id`). Completing the ePOD runs the `deliver_stop` logic, marks the `epod` document ready, and exceptions trigger A12/A15.","acceptance":"(1) A driver completing the ePOD on their DB trip → stop delivered, orders delivered, `shipment.delivered` in the outbox, ePOD document ready. (2) Another driver's trip → 404. (3) A \"short\" exception → order `partially_delivered` plus a deviation. (4) No personal data in audit details."},"de":{"title":"ePOD der Fahrer-App mit Stoppzustellung und Auftragsstatus verbinden","finding":"Das Fahrer-App-Modul ist fest auf R-103/V01 verdrahtet (driver.py:27). Das Abschließen des Stoppablaufs (`driver.step` erreicht 4) hängt nur ein Ereignis an (driver.py:181-195). Der relationale Stopp bleibt offen, Aufträge werden nicht auf zugestellt gesetzt, Tracking und Webhooks lösen nicht aus. Das Dokument `epod` ist immer „wait“ (docs.py:121,127). `deliver_stop` speichert nur einen Zeitstempel: keinen Empfänger, keine Unterschrift, keine Packstückzahl, keine Kammertemperatur (operations.py:461-484).","change":"Tabelle `epod`: Stopp-ID, Empfängername (verschlüsselt, zeilengebundener Kontext), Objekt-IDs von Unterschrift/Foto, gescannte vs. erwartete Packstücke, Ausnahmen je Packstück (dmg/short/ref), arrived_at/left_at, Kammertemperatur bei Übergabe. Die Fahrer-App arbeitet auf der eigenen DB-Tour des angemeldeten Fahrers (`Driver.user_id`). Der Abschluss des ePOD führt die Logik von `deliver_stop` aus, markiert das `epod`-Dokument als fertig, und Ausnahmen lösen A12/A15 aus.","acceptance":"(1) Ein Fahrer schließt den ePOD auf seiner DB-Tour ab → Stopp zugestellt, Aufträge zugestellt, `shipment.delivered` im Outbox, ePOD-Dokument fertig. (2) Tour eines anderen Fahrers → 404. (3) Ausnahme „short“ → Auftrag `partially_delivered` plus Abweichung. (4) Keine personenbezogenen Daten in Audit-Details."},"ru":{"title":"Связать ePOD приложения водителя с доставкой точки и статусом заказа","finding":"Модуль приложения водителя жёстко привязан к R-103/V01 (driver.py:27). Завершение сценария точки (`driver.step` достигает 4) лишь добавляет событие (driver.py:181-195). Реляционная точка остаётся в ожидании, заказы не переводятся в «доставлено», трекинг и вебхуки не срабатывают. Документ `epod` всегда «wait» (docs.py:121,127). `deliver_stop` сохраняет только метку времени: без получателя, подписи, количества мест и температуры камеры (operations.py:461-484).","change":"Таблица `epod`: id точки, имя получателя (зашифровано, контекст привязан к строке), id объектов подписи/фото, отсканированные vs ожидаемые места, исключения по местам (dmg/short/ref), arrived_at/left_at, температура камеры при передаче. Приложение водителя работает с собственным рейсом вошедшего водителя в БД (`Driver.user_id`). Завершение ePOD выполняет логику `deliver_stop`, отмечает документ `epod` готовым, а исключения запускают A12/A15.","acceptance":"(1) Водитель завершает ePOD по своему рейсу БД → точка доставлена, заказы доставлены, `shipment.delivered` в outbox, документ ePOD готов. (2) Рейс другого водителя → 404. (3) Исключение «short» → заказ `partially_delivered` плюс отклонение. (4) В деталях аудита нет персональных данных."}},{"id":"FR-106","type":"FR","date":"2026-10-11","priority":"medium","status":"implemented","group":{"en":"Cold chain, alarms & quality","de":"Kühlkette, Alarme & Qualität","ru":"Холодовая цепь, тревоги и качество"},"depends":"FR-76","effort":"M","source":"docs/CHANGE-REQUESTS.md","en":{"title":"Real forecast import instead of a refresh timestamp","finding":"`weather.refresh` only stamps the time (weather.py:58-65), while `WX` is a static reference. Dispatcher risk, the alarm list and the Go/No-Go gate all depend on it (dispatch.py:37-46, docs.py:71-83,144).","change":"Add a worker task `forecast` (integrations worker only; city coordinates only, no personal data; add the host to the egress allow-list) storing per city/day: min/max, wind, condition, level by `WX_RULES`. `wxRisk` and the gate read the table. A forecast older than 6 h → staleness warning, and the gate turns amber.","acceptance":"(1) After a worker run the table holds 7 days for every route city. (2) Dispatcher shows the stored values. (3) A stale forecast (>6 h) shows the warning, and the gate does not pass silently."},"de":{"title":"Echter Prognoseimport statt eines Aktualisierungszeitstempels","finding":"`weather.refresh` setzt nur den Zeitstempel (weather.py:58-65), während `WX` eine statische Referenz ist. Disponentenrisiko, Alarmliste und Go/No-Go-Gate hängen alle davon ab (dispatch.py:37-46, docs.py:71-83,144).","change":"Worker-Task `forecast` (nur Integrations-Worker; nur Stadtkoordinaten, keine personenbezogenen Daten; Host in die Egress-Allowlist aufnehmen), speichert je Stadt/Tag: Min/Max, Wind, Wetterlage, Stufe nach `WX_RULES`. `wxRisk` und das Gate lesen die Tabelle. Prognose älter als 6 h → Aktualitätswarnung, das Gate wird gelb.","acceptance":"(1) Nach einem Worker-Lauf enthält die Tabelle 7 Tage für jede Routenstadt. (2) Der Disponent zeigt die gespeicherten Werte. (3) Eine veraltete Prognose (> 6 h) zeigt die Warnung, und das Gate passiert nicht stillschweigend."},"ru":{"title":"Реальный импорт прогноза вместо метки времени обновления","finding":"`weather.refresh` только ставит время (weather.py:58-65), а `WX` — статический справочник. От него зависят риск в «Диспетчере», список тревог и контроль Go/No-Go (dispatch.py:37-46, docs.py:71-83,144).","change":"Задача воркера `forecast` (только воркер интеграций; только координаты городов, без персональных данных; хост — в список разрешённых исходящих), сохраняет по городу/дню: мин/макс, ветер, явления, уровень по `WX_RULES`. `wxRisk` и контроль читают таблицу. Прогноз старше 6 ч → предупреждение об устаревании, контроль становится жёлтым.","acceptance":"(1) После прогона воркера в таблице 7 дней по каждому городу маршрутов. (2) «Диспетчер» показывает сохранённые значения. (3) Устаревший прогноз (> 6 ч) показывает предупреждение, контроль не проходит молча."}},{"id":"FR-105","type":"FR","date":"2026-10-11","priority":"medium","status":"implemented","group":{"en":"Cold chain, alarms & quality","de":"Kühlkette, Alarme & Qualität","ru":"Холодовая цепь, тревоги и качество"},"depends":"FR-101, FR-107","effort":"M","source":"docs/CHANGE-REQUESTS.md","en":{"title":"SOS from the real driver/vehicle; explicit hub; mandatory resolution","finding":"Panic/SOS always creates \"V01 · A. Nurlanov · km 168\" (security.py:26,60-66), whoever triggers it. The incident hub is parsed from the text prefix (security.py:29-33), so incidents without a vehicle are actionable by users of every hub. Closing an incident (security.py:73-88) and resolving an alarm (resources.py:342-343,391) need no resolution text.","change":"SOS uses the signed-in driver's active trip, vehicle and last GPS/OL1 position. Incidents get an explicit `hub_id`. Close/resolve requires a category plus ≥ 10 characters of text. Level-3 incidents must be acknowledged before closing.","acceptance":"(1) SOS from a driver on V04 creates a V04 incident with that trip. (2) An ALA user gets 403 on an AST incident without a vehicle. (3) Close without text → 422. (4) new→closed on level 3 → 409."},"de":{"title":"SOS vom echten Fahrer/Fahrzeug; expliziter Hub; Pflicht-Abschlussvermerk","finding":"Panik/SOS erzeugt immer „V01 · A. Nurlanov · km 168“ (security.py:26,60-66), egal wer auslöst. Der Hub des Vorfalls wird aus dem Textpräfix geparst (security.py:29-33), sodass Vorfälle ohne Fahrzeug von Nutzern jedes Hubs bearbeitet werden können. Das Schließen eines Vorfalls (security.py:73-88) und das Auflösen eines Alarms (resources.py:342-343,391) brauchen keinen Abschlusstext.","change":"SOS nutzt die aktive Tour, das Fahrzeug und die letzte GPS/OL1-Position des angemeldeten Fahrers. Vorfälle erhalten eine explizite `hub_id`. Schließen/Auflösen erfordert eine Kategorie plus ≥ 10 Zeichen Text. Vorfälle der Stufe 3 müssen vor dem Schließen quittiert sein.","acceptance":"(1) SOS eines Fahrers auf V04 erzeugt einen V04-Vorfall mit dieser Tour. (2) Ein ALA-Nutzer erhält 403 für einen AST-Vorfall ohne Fahrzeug. (3) Schließen ohne Text → 422. (4) new→closed bei Stufe 3 → 409."},"ru":{"title":"SOS от реального водителя/ТС; явный хаб; обязательное описание закрытия","finding":"Паника/SOS всегда создаёт «V01 · A. Nurlanov · km 168» (security.py:26,60-66), кто бы ни нажал. Хаб инцидента разбирается из префикса текста (security.py:29-33), поэтому инциденты без ТС доступны пользователям любого хаба. Закрытие инцидента (security.py:73-88) и устранение тревоги (resources.py:342-343,391) не требуют текста решения.","change":"SOS использует активный рейс, ТС и последнюю позицию GPS/OL1 вошедшего водителя. У инцидентов явный `hub_id`. Закрытие/устранение требует категорию и ≥ 10 символов текста. Инциденты уровня 3 должны быть подтверждены до закрытия.","acceptance":"(1) SOS водителя на V04 создаёт инцидент V04 с этим рейсом. (2) Пользователь ALA получает 403 на инцидент AST без ТС. (3) Закрытие без текста → 422. (4) new→closed на уровне 3 → 409."}},{"id":"FR-104","type":"FR","date":"2026-10-11","priority":"critical","status":"implemented","group":{"en":"Cold chain, alarms & quality","de":"Kühlkette, Alarme & Qualität","ru":"Холодовая цепь, тревоги и качество"},"depends":"FR-110","effort":"M","source":"docs/CHANGE-REQUESTS.md","en":{"title":"One escalation service for every level-3 event","finding":"Only Wialon security events are escalated to the security partner (`be/integrations/worker.py:194-215`). Events that only create an incident in the UI: SOS by SMS (`coverage.py:322-323`), SOS from the driver app (`driver.py:343-348`), accident by SMS (`coverage.py:329-330`) and cold-cargo contact loss level 3 (`coverage.py:229`). The label `esc=\"guard\"` (`inbox.py:317`) triggers nothing. At night nobody watching the screen means nobody is alerted.","change":"Add a hook on `push_incident` for lvl ≥ 3 in an outbox table. Delivery: signed partner webhook, SMS to the on-call duty number (SMSC), e-mail. Escalation timer: no ack within 5 min (configurable) → next level (head of security, then CEO). Every step is audited. No personal data in payloads.","acceptance":"(1) SOS by SMS → partner webhook + on-call SMS within 60 s (worker test with a mock transport). (2) Without ack the second level fires after the timeout. (3) With ack within the timeout, no second level."},"de":{"title":"Ein Eskalationsdienst für jedes Ereignis der Stufe 3","finding":"Nur Wialon-Sicherheitsereignisse werden an den Sicherheitspartner eskaliert (`be/integrations/worker.py:194-215`). Ereignisse, die nur einen Vorfall in der UI erzeugen: SOS per SMS (`coverage.py:322-323`), SOS aus der Fahrer-App (`driver.py:343-348`), Unfall per SMS (`coverage.py:329-330`) und Kontaktverlust bei Kühlgut Stufe 3 (`coverage.py:229`). Das Label `esc=\"guard\"` (`inbox.py:317`) löst nichts aus. Nachts, wenn niemand auf den Bildschirm schaut, wird niemand alarmiert.","change":"Hook auf `push_incident` für lvl ≥ 3 in eine Outbox-Tabelle. Zustellung: signierter Partner-Webhook, SMS an die Bereitschaftsnummer (SMSC), E-Mail. Eskalationstimer: keine Quittung innerhalb von 5 min (konfigurierbar) → nächste Stufe (Leiter Sicherheit, dann Geschäftsführer). Jeder Schritt wird auditiert. Keine personenbezogenen Daten in den Payloads.","acceptance":"(1) SOS per SMS → Partner-Webhook + Bereitschafts-SMS innerhalb von 60 s (Worker-Test mit Mock-Transport). (2) Ohne Quittung löst nach dem Timeout die zweite Stufe aus. (3) Mit Quittung innerhalb des Timeouts keine zweite Stufe."},"ru":{"title":"Единая служба эскалации для каждого события уровня 3","finding":"Партнёру по безопасности эскалируются только события безопасности Wialon (`be/integrations/worker.py:194-215`). События, которые лишь создают инцидент в UI: SOS по SMS (`coverage.py:322-323`), SOS из приложения водителя (`driver.py:343-348`), ДТП по SMS (`coverage.py:329-330`) и потеря связи с холодовым грузом уровня 3 (`coverage.py:229`). Метка `esc=\"guard\"` (`inbox.py:317`) ничего не запускает. Ночью, когда никто не смотрит на экран, никто не оповещается.","change":"Хук на `push_incident` для lvl ≥ 3 в таблицу outbox. Доставка: подписанный вебхук партнёра, SMS на номер дежурного (SMSC), e-mail. Таймер эскалации: нет подтверждения за 5 мин (настраивается) → следующий уровень (руководитель СБ, затем генеральный директор). Каждый шаг аудируется. Без персональных данных в сообщениях.","acceptance":"(1) SOS по SMS → вебхук партнёра + SMS дежурному в течение 60 с (тест воркера с mock-транспортом). (2) Без подтверждения после таймаута срабатывает второй уровень. (3) При подтверждении в пределах таймаута второго уровня нет."}},{"id":"FR-103","type":"FR","date":"2026-10-11","priority":"high","status":"implemented","group":{"en":"Cold chain, alarms & quality","de":"Kühlkette, Alarme & Qualität","ru":"Холодовая цепь, тревоги и качество"},"depends":"FR-98, FR-101, FR-102","effort":"L","source":"docs/CHANGE-REQUESTS.md","en":{"title":"Quality hold for orders affected by an excursion","finding":"Alarms reference only trip and vehicle (models.py:303-304), never the affected orders. The QA release/block decision applies only to static deviation ids (quality.py:78,96-118) and changes nothing operationally. `deliver_stop` does not check any quality hold (operations.py:461-477). The customer sees only the last reading (partner_api.py `shipment_dict`).","change":"Add a `deviation` table created from a temperature alarm, with affected orders = orders of that vehicle and chamber during the excursion window, which sets `Order.quality_hold`. Delivery of a held order is either refused (409) or recorded as \"delivered in quarantine\". The QA decision clears the hold (release) or sets refused/returned (block). Add webhook `shipment.temperature_excursion` (no raw personal data).","acceptance":"(1) An excursion on V01's cold chamber puts all cold orders on that trip on hold. (2) Delivering a held order → 409 unless delivered in quarantine. (3) QA \"block\" → order `returned` plus a webhook. (4) The 7-step workflow runs on DB deviations."},"de":{"title":"Qualitätssperre für von einer Abweichung betroffene Aufträge","finding":"Alarme verweisen nur auf Tour und Fahrzeug (models.py:303-304), nie auf die betroffenen Aufträge. Die QS-Entscheidung Freigabe/Sperre gilt nur für statische Abweichungs-IDs (quality.py:78,96-118) und ändert operativ nichts. `deliver_stop` prüft keine Qualitätssperre (operations.py:461-477). Der Kunde sieht nur den letzten Messwert (partner_api.py `shipment_dict`).","change":"Tabelle `deviation`, erzeugt aus einem Temperaturalarm, mit betroffenen Aufträgen = Aufträge dieses Fahrzeugs und dieser Kammer im Abweichungsfenster; setzt `Order.quality_hold`. Die Zustellung eines gesperrten Auftrags wird abgewiesen (409) oder als „in Quarantäne zugestellt“ erfasst. Die QS-Entscheidung hebt die Sperre auf (Freigabe) oder setzt refused/returned (Sperre). Webhook `shipment.temperature_excursion` (ohne personenbezogene Rohdaten).","acceptance":"(1) Eine Abweichung in der Kühlkammer von V01 sperrt alle Kühlaufträge dieser Tour. (2) Zustellung eines gesperrten Auftrags → 409, außer Zustellung in Quarantäne. (3) QS „Sperre“ → Auftrag `returned` plus Webhook. (4) Der 7-Schritt-Workflow läuft auf DB-Abweichungen."},"ru":{"title":"Карантин качества для заказов, затронутых отклонением","finding":"Тревоги ссылаются только на рейс и ТС (models.py:303-304), но не на затронутые заказы. Решение ОК о выпуске/блокировке применяется только к статическим id отклонений (quality.py:78,96-118) и ничего не меняет в операциях. `deliver_stop` не проверяет карантин качества (operations.py:461-477). Клиент видит только последнее показание (partner_api.py `shipment_dict`).","change":"Таблица `deviation`, создаваемая из температурной тревоги, с затронутыми заказами = заказы этого ТС и камеры в окне отклонения; устанавливает `Order.quality_hold`. Доставка заказа в карантине отклоняется (409) или фиксируется как «доставлено в карантин». Решение ОК снимает карантин (выпуск) или ставит refused/returned (блокировка). Вебхук `shipment.temperature_excursion` (без сырых персональных данных).","acceptance":"(1) Отклонение в холодовой камере V01 ставит в карантин все холодовые заказы этого рейса. (2) Доставка заказа в карантине → 409, кроме доставки в карантин. (3) «Блокировка» ОК → заказ `returned` плюс вебхук. (4) Процесс из 7 шагов работает на отклонениях из БД."}},{"id":"FR-102","type":"FR","date":"2026-10-11","priority":"critical","status":"implemented","group":{"en":"Cold chain, alarms & quality","de":"Kühlkette, Alarme & Qualität","ru":"Холодовая цепь, тревоги и качество"},"depends":"FR-101","effort":"M","source":"docs/CHANGE-REQUESTS.md","en":{"title":"Per-chamber sensor mapping and alarm evaluation for all reading sources","finding":"The worker import stores readings but never raises alarms (worker.py:104-116); only manual entry does (resources.py:289-302), and it creates a new alarm for every out-of-range reading with no dedupe. The worker assigns the single sensor to the coldest class (worker.py:107-108), so a +5 °C reading from V01's 2–8 °C chamber is stored as an out-of-range `frozen` reading. A thermochron import is only a flag (thermo.py:17-34) and stores no readings. The v5 Thermo screen shows simulated values (shared.ts:214-224).","change":"Add a `vehicle_sensors` mapping (telematics sensor → chamber/temp class). Add a shared `evaluate_reading()` used by manual, worker and thermochron import: one open alarm per vehicle+chamber, updated with max deviation and duration, with hysteresis before auto-resolving. Thermochron upload stores readings with `source=thermochron`. Thermo reads the latest reading per chamber from the DB.","acceptance":"(1) Worker import of an out-of-range value creates one alarm; ten consecutive readings keep one alarm with the updated max. (2) V01's cold sensor is stored as `cold`. (3) A thermochron file creates N readings, and the excursion minutes match the file."},"de":{"title":"Sensorzuordnung je Kammer und Alarmauswertung für alle Messquellen","finding":"Der Worker-Import speichert Messwerte, löst aber nie Alarme aus (worker.py:104-116); das tut nur die manuelle Eingabe (resources.py:289-302), und sie erzeugt für jeden Wert außerhalb des Bereichs einen neuen Alarm ohne Deduplizierung. Der Worker ordnet den einzigen Sensor der kältesten Klasse zu (worker.py:107-108), sodass ein Wert von +5 °C aus der 2–8-°C-Kammer von V01 als `frozen`-Wert außerhalb des Bereichs gespeichert wird. Ein Thermochron-Import ist nur ein Flag (thermo.py:17-34) und speichert keine Messwerte. Der v5-Thermobildschirm zeigt simulierte Werte (shared.ts:214-224).","change":"Zuordnung `vehicle_sensors` (Telematiksensor → Kammer/Temperaturklasse). Gemeinsame `evaluate_reading()` für manuelle Eingabe, Worker und Thermochron-Import: ein offener Alarm je Fahrzeug+Kammer, aktualisiert mit maximaler Abweichung und Dauer, mit Hysterese vor dem automatischen Schließen. Thermochron-Upload speichert Messwerte mit `source=thermochron`. Thermo liest den letzten Messwert je Kammer aus der DB.","acceptance":"(1) Worker-Import eines Werts außerhalb des Bereichs erzeugt einen Alarm; zehn aufeinanderfolgende Werte halten einen Alarm mit aktualisiertem Maximum. (2) Der Kühlsensor von V01 wird als `cold` gespeichert. (3) Eine Thermochron-Datei erzeugt N Messwerte, und die Abweichungsminuten stimmen mit der Datei überein."},"ru":{"title":"Привязка датчиков к камерам и оценка тревог для всех источников показаний","finding":"Импорт воркера сохраняет показания, но никогда не поднимает тревоги (worker.py:104-116); это делает только ручной ввод (resources.py:289-302), причём на каждое показание вне диапазона создаётся новая тревога без дедупликации. Воркер относит единственный датчик к самому холодному классу (worker.py:107-108), поэтому +5 °C из камеры 2–8 °C у V01 сохраняется как показание `frozen` вне диапазона. Импорт термохрона — лишь флаг (thermo.py:17-34) и не сохраняет показания. Экран «Термостатус» v5 показывает симулированные значения (shared.ts:214-224).","change":"Привязка `vehicle_sensors` (датчик телематики → камера/температурный класс). Общая `evaluate_reading()` для ручного ввода, воркера и импорта термохрона: одна открытая тревога на ТС+камеру, обновляемая максимальным отклонением и длительностью, с гистерезисом перед автозакрытием. Загрузка термохрона сохраняет показания с `source=thermochron`. «Термостатус» читает последнее показание по каждой камере из БД.","acceptance":"(1) Импорт воркером значения вне диапазона создаёт одну тревогу; десять подряд показаний сохраняют одну тревогу с обновлённым максимумом. (2) Холодовой датчик V01 сохраняется как `cold`. (3) Файл термохрона создаёт N показаний, минуты отклонения совпадают с файлом."}},{"id":"FR-101","type":"FR","date":"2026-10-11","priority":"critical","status":"implemented","group":{"en":"Cold chain, alarms & quality","de":"Kühlkette, Alarme & Qualität","ru":"Холодовая цепь, тревоги и качество"},"depends":"FR-71, FR-102","effort":"L","source":"docs/CHANGE-REQUESTS.md","en":{"title":"Single alarm and incident store","finding":"There are two independent alarm systems. One is the relational `Alarm` table (models.py:296-309; /alarms; classic Overview). The other is the v5 list computed in the browser from simulated telemetry, reference weather and `extraInc` (shared.ts:227-258; simulation tick V5.tsx:97-101, which also runs in production). A Wialon alarm creates both an `Alarm` row and a v5 incident (worker.py:203-207), and they are acknowledged and closed separately (resources.py:379-394 vs security.py:73-88).","change":"Make `Alarm` the single store: add source, dedupe key, level 1–3, escalation, incident fields and resolution category. v5 Security and the Overview alarm list read `/api/alarms`; v5 incident actions update the same row. Show weather/load/road risks as \"risks\", separate from alarms. Run the telemetry simulation only in demo.","acceptance":"(1) Acknowledging a Wialon alarm on `/s/security` shows \"acknowledged\" on `/alarms`, and the reverse. (2) The production bundle does not start `tick()`. (3) One Wialon event yields exactly one alarm."},"de":{"title":"Ein gemeinsamer Speicher für Alarme und Vorfälle","finding":"Es gibt zwei unabhängige Alarmsysteme. Das eine ist die relationale Tabelle `Alarm` (models.py:296-309; /alarms; klassische Übersicht). Das andere ist die v5-Liste, im Browser aus simulierter Telemetrie, Referenzwetter und `extraInc` berechnet (shared.ts:227-258; Simulations-Tick V5.tsx:97-101, der auch im Produktivbetrieb läuft). Ein Wialon-Alarm erzeugt sowohl eine `Alarm`-Zeile als auch einen v5-Vorfall (worker.py:203-207), die getrennt quittiert und geschlossen werden (resources.py:379-394 vs. security.py:73-88).","change":"`Alarm` zum einzigen Speicher machen: Quelle, Dedup-Schlüssel, Stufe 1–3, Eskalation, Vorfallfelder und Abschlusskategorie ergänzen. v5-Sicherheit und die Alarmliste der Übersicht lesen `/api/alarms`; v5-Vorfallaktionen aktualisieren dieselbe Zeile. Wetter-/Lade-/Straßenrisiken als „Risiken“ getrennt von Alarmen zeigen. Die Telemetriesimulation nur im Demo ausführen.","acceptance":"(1) Quittieren eines Wialon-Alarms auf `/s/security` zeigt „quittiert“ auf `/alarms` und umgekehrt. (2) Das Produktiv-Bundle startet `tick()` nicht. (3) Ein Wialon-Ereignis ergibt genau einen Alarm."},"ru":{"title":"Единое хранилище тревог и инцидентов","finding":"Существуют две независимые системы тревог. Одна — реляционная таблица `Alarm` (models.py:296-309; /alarms; классический «Обзор»). Другая — список v5, вычисляемый в браузере из симулированной телеметрии, справочной погоды и `extraInc` (shared.ts:227-258; такт симуляции V5.tsx:97-101, работающий и в продуктиве). Тревога Wialon создаёт и строку `Alarm`, и инцидент v5 (worker.py:203-207), которые подтверждаются и закрываются раздельно (resources.py:379-394 vs security.py:73-88).","change":"Сделать `Alarm` единственным хранилищем: добавить источник, ключ дедупликации, уровень 1–3, эскалацию, поля инцидента и категорию закрытия. «Безопасность» v5 и список тревог «Обзора» читают `/api/alarms`; действия с инцидентами v5 обновляют ту же строку. Риски погоды/загрузки/дорог показывать как «риски» отдельно от тревог. Симуляцию телеметрии запускать только в демо.","acceptance":"(1) Подтверждение тревоги Wialon в `/s/security` отображается как «подтверждено» в `/alarms`, и наоборот. (2) Продуктивный бандл не запускает `tick()`. (3) Одно событие Wialon даёт ровно одну тревогу."}},{"id":"FR-100","type":"FR","date":"2026-10-11","priority":"medium","status":"implemented","group":{"en":"Trip flow, dispatch & Go/No-Go release","de":"Tourablauf, Disposition & Go/No-Go-Freigabe","ru":"Процесс рейса, диспетчеризация и выпуск Go/No-Go"},"depends":"–","effort":"S","source":"docs/CHANGE-REQUESTS.md","en":{"title":"Correct \"trips today\" and alarm counters","finding":"`trips_today` counts every non-cancelled trip ever created (operations.py:132-136,150). `open_alarms` and `critical_alarms` are counted from a list limited to 20 rows (operations.py:140-142,153-154), so the KPI never exceeds 20 and the critical count is incomplete.","change":"Filter trips by `planned_departure`/`eta` overlapping today in KZ time. Count alarms by severity with SQL `COUNT … GROUP BY`. Keep the 20-row list only for display.","acceptance":"With 25 open alarms (3 critical, 1 older than the newest 20) the KPI shows 25/3. A trip delivered last week is not in `trips_today`."},"de":{"title":"„Touren heute“ und Alarmzähler korrigieren","finding":"`trips_today` zählt jede jemals angelegte, nicht stornierte Tour (operations.py:132-136,150). `open_alarms` und `critical_alarms` werden aus einer auf 20 Zeilen begrenzten Liste gezählt (operations.py:140-142,153-154), sodass der KPI nie 20 übersteigt und die kritische Anzahl unvollständig ist.","change":"Touren nach `planned_departure`/`eta` mit Überschneidung zum heutigen Tag in KZ-Zeit filtern. Alarme je Schweregrad per SQL `COUNT … GROUP BY` zählen. Die 20-Zeilen-Liste nur zur Anzeige behalten.","acceptance":"Bei 25 offenen Alarmen (3 kritisch, 1 älter als die neuesten 20) zeigt der KPI 25/3. Eine letzte Woche zugestellte Tour ist nicht in `trips_today`."},"ru":{"title":"Исправить «рейсы сегодня» и счётчики тревог","finding":"`trips_today` считает все когда-либо созданные неотменённые рейсы (operations.py:132-136,150). `open_alarms` и `critical_alarms` считаются по списку, ограниченному 20 строками (operations.py:140-142,153-154), поэтому KPI никогда не превышает 20, а число критичных неполное.","change":"Фильтровать рейсы по пересечению `planned_departure`/`eta` с сегодняшним днём по времени РК. Считать тревоги по уровню через SQL `COUNT … GROUP BY`. Список из 20 строк оставить только для отображения.","acceptance":"При 25 открытых тревогах (3 критичных, 1 старше последних 20) KPI показывает 25/3. Рейс, доставленный на прошлой неделе, не входит в `trips_today`."}},{"id":"FR-99","type":"FR","date":"2026-10-11","priority":"high","status":"implemented","group":{"en":"Trip flow, dispatch & Go/No-Go release","de":"Tourablauf, Disposition & Go/No-Go-Freigabe","ru":"Процесс рейса, диспетчеризация и выпуск Go/No-Go"},"depends":"FR-71, FR-73","effort":"L","source":"docs/CHANGE-REQUESTS.md","en":{"title":"Server-side load calculation for any trip and vehicle","finding":"The load calculation exists only in the browser and is fixed to R-106 on V02: `loadCalc` (shared.ts:43-50), the default profile (trucks.ts:74-76), the capacity check only for R-106 (dispatch.ts:50,88-89), `LOAD_TRIP` (load.py:117), and `dispatch.assign` always targets R-106 with Astana orders only (dispatch.py:87-99, dispatch.ts:96). The server's `load.plan` saves a vehicle type without checking fit (load.py:206-258), and `_attach_orders` checks only total kg and pallets, ignoring chambers, m³ and axle loads (operations.py:367-372).","change":"Port `loadCalc` and `vehicleMatch` to `app/loadcalc.py`, parameterised by the trip's orders and a vehicle profile (trucks.json + new Vehicle fields: zones, chamber pallet places, thermo-container places, axle model). Use it in `assign_orders`, `load.plan` and the release gate. Add `GET /api/trips/{id}/load`, which the screen renders.","acceptance":"(1) A golden test for R-106/V02 reproduces the v5.2 numbers (bars, axle loads, alerts). (2) Assigning an order that overloads zone 1 → 409. (3) `load.plan` with a non-fitting type → 409 unless forced with a reason. (4) Works for any DB trip."},"de":{"title":"Serverseitige Ladeber
