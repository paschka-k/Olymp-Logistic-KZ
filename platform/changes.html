s, Stopps ohne Aufträge, v5-Dokument vs. DB. In der CI nach dem Seed ausführen.","acceptance":"(1) Der Seed besteht alle API-Validierungen. (2) `check-consistency` meldet nach frischem Seed 0 Befunde und listet jede in einer Test-Fixture eingebaute Inkonsistenz."},"ru":{"title":"Начальные данные — через сервисные правила, плюс проверка согласованности","finding":"Начальные данные нарушают собственные правила платформы. Заказ заморозки З-2295 запланирован на изотермическое V02 (seed.py:157-160 vs operations.py:363-364). Все 10 справочных заказов запланированы на R-106, а v5 отмечает 6 (load.py:118). У R-103 (хаб AST) есть точка в Алматы, относящаяся к хабу ALA (seed.py:152; запрещено operations.py:359-360). Учётная запись приложения водителя связана с D2 (seed.py:239), а водитель R-103 — D3 (seed.py:152), поэтому `driver.v01` не видит рейс, который симулирует приложение водителя.","change":"Заполнять начальные данные через сервисные функции (`create_trip`/`_attach_orders`/`confirm`). Добавить `python -m app.cli check-consistency`: класс vs ТС, точки чужого хаба, заказы без точек, точки без заказов, документ v5 vs БД. Запускать в CI после заполнения.","acceptance":"(1) Начальные данные проходят все проверки API. (2) `check-consistency` после свежего заполнения сообщает 0 проблем и перечисляет каждую внесённую в тестовую фикстуру несогласованность."}},{"id":"FR-78","type":"FR","date":"2026-10-11","priority":"high","status":"implemented","group":{"en":"One source of truth & architecture","de":"Eine Datenquelle & Architektur","ru":"Единый источник данных и архитектура"},"depends":"FR-71, FR-85, FR-118, FR-120, FR-121, FR-125, FR-135; – (base for )","effort":"L","source":"docs/CHANGE-REQUESTS.md","en":{"title":"Make reference master data editable and versioned","finding":"Operational master data is read-only in `be/v5/reference/mock-v5.*.json`: PARTNERS (tier, SLA, capacity, rates, contract end, insurance), FEES (vehicle OGPO, KASKO and TI deadlines), STAFF/LIC/TACHO, CP (diesel, MRP, salaries), COWN, BLEX, CAPR. Scenario constants: `NOW_YM` (`partners.py:29`), `TODAY` (`staff.py:16`). Fleet has no actions at all (`be/v5/modules/fleet.py:10-12`). The inbox validates vehicles only against the reference `VM`, so real vehicle codes are rejected with `err=\"veh\"` (`inbox.py:219-221`, `:283`).","change":"Add DB tables + admin CRUD screens with audit: vehicles (extend `Vehicle`: OGPO, KASKO, TI, logger calibration, ADR approval), partners (+ contacts, B14), staff calendar, cost parameters with `valid_from` (history kept for cost reports). Tier or rate changes need a four-eyes approval. `/api/v5/ref` reads the DB, and the reference JSON is only seed data.","acceptance":"(1) A new vehicle created in the UI is accepted by Wialon alarms, fines and SMS ingest. (2) Changing the diesel price with a valid_from does not change past monthly costs. (3) A tier change by one user stays pending until a second user approves.<br>CI fails on a schema violation or on an RU/DE number mismatch. A planner can add a vehicle with chambers and see it on Fleet and Load. Every master-data change appears in the audit log with the changed field names. Invalid BIN or plate is rejected with 422.","merged":"Schema-validated reference data and master-data screens with change audit — Reference data is three hand-extracted JSON files per language (`v5/reference/mock-v5.{ru,de,en}.json`, 130–160 KB each) plus `trucks.json` and `coverage.json`, with no schema. Numbers are duplicated per language (only keys differ: `PKG`, `CCODE`, `CGRP`, `EV`, `WX`), and positional arrays such as `BLC = [name, latin, type, kg, …]` are read by index (`engine/baseline.ts:35-44`). Vehicles, partners, cost model and staff calendar cannot be edited in the UI (ROADMAP v0.3)."},"de":{"title":"Referenz-Stammdaten bearbeitbar und versioniert machen","finding":"Betriebliche Stammdaten sind schreibgeschützt in `be/v5/reference/mock-v5.*.json`: PARTNERS (Stufe, SLA, Kapazität, Tarife, Vertragsende, Versicherung), FEES (Fristen für Kfz-Haftpflicht OGPO, Kasko und HU), STAFF/LIC/TACHO, CP (Diesel, MRP, Gehälter), COWN, BLEX, CAPR. Szenariokonstanten: `NOW_YM` (`partners.py:29`), `TODAY` (`staff.py:16`). Der Fuhrpark hat überhaupt keine Aktionen (`be/v5/modules/fleet.py:10-12`). Die Inbox validiert Fahrzeuge nur gegen das Referenz-`VM`, sodass echte Fahrzeugcodes mit `err=\"veh\"` abgewiesen werden (`inbox.py:219-221`, `:283`).","change":"DB-Tabellen + Admin-CRUD-Masken mit Audit: Fahrzeuge (`Vehicle` erweitern: OGPO, Kasko, HU, Logger-Kalibrierung, ADR-Zulassung), Partner (+ Kontakte, B14), Personalkalender, Kostenparameter mit `valid_from` (Historie bleibt für Kostenberichte erhalten). Stufen- oder Tarifänderungen brauchen eine Vier-Augen-Freigabe. `/api/v5/ref` liest aus der DB, das Referenz-JSON dient nur noch als Seed.","acceptance":"(1) Ein in der UI angelegtes neues Fahrzeug wird von Wialon-Alarmen, Bußgeld- und SMS-Ingest akzeptiert. (2) Eine Dieselpreisänderung mit valid_from ändert vergangene Monatskosten nicht. (3) Eine Stufenänderung durch einen Nutzer bleibt offen, bis ein zweiter Nutzer freigibt.<br>Die CI schlägt bei Schemaverletzung oder abweichenden RU/DE-Zahlen fehl. Ein Planer kann ein Fahrzeug mit Kammern anlegen und sieht es in Fuhrpark und Beladung. Jede Stammdatenänderung erscheint im Audit-Log mit den geänderten Feldnamen. Ungültige BIN oder Kennzeichen werden mit 422 abgewiesen.","merged":"Schema-validierte Referenzdaten und Stammdatenmasken mit Änderungsaudit — Referenzdaten sind drei von Hand extrahierte JSON-Dateien je Sprache (`v5/reference/mock-v5.{ru,de,en}.json`, je 130–160 KB) plus `trucks.json` und `coverage.json`, ohne Schema. Zahlen sind je Sprache dupliziert (nur Schlüssel unterscheiden sich: `PKG`, `CCODE`, `CGRP`, `EV`, `WX`), und Positions-Arrays wie `BLC = [name, latin, type, kg, …]` werden per Index gelesen (`engine/baseline.ts:35-44`). Fahrzeuge, Partner, Kostenmodell und Personalkalender sind in der UI nicht bearbeitbar (ROADMAP v0.3)."},"ru":{"title":"Справочные мастер-данные — редактируемые и версионные","finding":"Операционные мастер-данные доступны только для чтения в `be/v5/reference/mock-v5.*.json`: PARTNERS (уровень, SLA, мощность, тарифы, окончание договора, страхование), FEES (сроки ОГПО, КАСКО и техосмотра ТС), STAFF/LIC/TACHO, CP (дизель, МРП, оклады), COWN, BLEX, CAPR. Константы сценария: `NOW_YM` (`partners.py:29`), `TODAY` (`staff.py:16`). У автопарка вообще нет действий (`be/v5/modules/fleet.py:10-12`). Входящие проверяют ТС только по справочному `VM`, поэтому реальные коды ТС отклоняются с `err=\"veh\"` (`inbox.py:219-221`, `:283`).","change":"Таблицы БД + экраны администрирования (CRUD) с аудитом: ТС (расширить `Vehicle`: ОГПО, КАСКО, техосмотр, калибровка логгера, допуск ДОПОГ), партнёры (+ контакты, B14), календарь персонала, параметры затрат с `valid_from` (история сохраняется для отчётов по затратам). Изменение уровня или тарифа — с согласованием «четыре глаза». `/api/v5/ref` читает из БД, справочный JSON — только начальные данные.","acceptance":"(1) Новое ТС, созданное в UI, принимается тревогами Wialon, приёмом штрафов и SMS. (2) Изменение цены дизеля с valid_from не меняет прошлые месячные затраты. (3) Изменение уровня одним пользователем ожидает подтверждения второго.<br>CI падает при нарушении схемы или расхождении чисел RU/DE. Планировщик может добавить ТС с камерами и увидеть его в «Автопарке» и «Загрузке». Каждое изменение мастер-данных попадает в журнал аудита с именами изменённых полей. Неверный БИН или госномер отклоняется с 422.","merged":"Справочные данные с проверкой схемы и экраны мастер-данных с аудитом изменений — Справочные данные — три вручную извлечённых JSON-файла по языкам (`v5/reference/mock-v5.{ru,de,en}.json`, по 130–160 КБ) плюс `trucks.json` и `coverage.json`, без схемы. Числа продублированы по языкам (отличаются только ключи: `PKG`, `CCODE`, `CGRP`, `EV`, `WX`), а позиционные массивы вроде `BLC = [name, latin, type, kg, …]` читаются по индексу (`engine/baseline.ts:35-44`). ТС, партнёров, модель затрат и календарь персонала нельзя редактировать в UI (ROADMAP v0.3)."}},{"id":"FR-77","type":"FR","date":"2026-10-11","priority":"medium","status":"implemented","group":{"en":"One source of truth & architecture","de":"Eine Datenquelle & Architektur","ru":"Единый источник данных и архитектура"},"depends":"FR-74","effort":"M","source":"docs/CHANGE-REQUESTS.md","en":{"title":"Real database migrations (Alembic) instead of `create_all`","finding":"`init-db` runs `Base.metadata.create_all(engine)` (`backend/app/cli.py:54`). It creates missing tables but never alters existing ones (new columns, types, the JSON→JSONB change in C05, indexes). `DEPLOYMENT.md` §5 promises \"migrate runs automatically\" on `git pull && up --build`, which is false for changed tables.","change":"Add Alembic with a baseline revision equal to the current schema. The `migrate` service runs `alembic upgrade head` and then the grants and triggers. CI checks `alembic check` (models vs migrations) and runs upgrade and downgrade on an empty DB.","acceptance":"Adding a column to `Vehicle` without a migration fails CI. An upgrade from the v0.2.0 schema to head on a DB with data keeps all rows (test). The runbook lists the rollback command."},"de":{"title":"Echte Datenbankmigrationen (Alembic) statt `create_all`","finding":"`init-db` führt `Base.metadata.create_all(engine)` aus (`backend/app/cli.py:54`). Es legt fehlende Tabellen an, ändert bestehende aber nie (neue Spalten, Typen, der JSON→JSONB-Wechsel aus C05, Indizes). `DEPLOYMENT.md` §5 verspricht „migrate runs automatically“ bei `git pull && up --build` – für geänderte Tabellen falsch.","change":"Alembic mit einer Basisrevision gleich dem aktuellen Schema einführen. Der Dienst `migrate` führt `alembic upgrade head` und danach Grants und Trigger aus. CI prüft `alembic check` (Modelle vs. Migrationen) und führt Upgrade und Downgrade auf einer leeren DB aus.","acceptance":"Eine neue Spalte in `Vehicle` ohne Migration lässt die CI fehlschlagen. Ein Upgrade vom v0.2.0-Schema auf head bei einer DB mit Daten erhält alle Zeilen (Test). Das Runbook nennt den Rollback-Befehl."},"ru":{"title":"Настоящие миграции БД (Alembic) вместо `create_all`","finding":"`init-db` выполняет `Base.metadata.create_all(engine)` (`backend/app/cli.py:54`). Он создаёт недостающие таблицы, но никогда не изменяет существующие (новые колонки, типы, переход JSON→JSONB из C05, индексы). `DEPLOYMENT.md` §5 обещает «migrate runs automatically» при `git pull && up --build` — для изменённых таблиц это неверно.","change":"Внедрить Alembic с базовой ревизией, равной текущей схеме. Сервис `migrate` выполняет `alembic upgrade head`, затем права и триггеры. CI проверяет `alembic check` (модели vs миграции) и выполняет upgrade и downgrade на пустой БД.","acceptance":"Добавление колонки в `Vehicle` без миграции роняет CI. Обновление со схемы v0.2.0 до head на БД с данными сохраняет все строки (тест). В регламенте указана команда отката."}},{"id":"FR-76","type":"FR","date":"2026-10-11","priority":"high","status":"implemented","group":{"en":"One source of truth & architecture","de":"Eine Datenquelle & Architektur","ru":"Единый источник данных и архитектура"},"depends":"FR-71, FR-84","effort":"M","source":"docs/CHANGE-REQUESTS.md","en":{"title":"Replace the fixed scenario date with a server business date","finding":"The frontend fixes `TODAY = 06.10.2026` (core.ts:60-62); it drives licence, calibration and fee countdowns, while the backend compliance list uses the real date (resources.py:413), so the two disagree. Weather has 7 reference days from 06.10, and `wx_risk` skips indexes ≥ 7 (docs.py:76-78, dispatch.py:41-44), so the weather gate passes silently without data. Document date `06.10.2026` (docs.ts:101) and track-and-trace times `05.10 18:20 … 08.10 06:00` (ship.ts:36-58) are hard-coded. The ops log uses the client clock (registry.py:66-68,77-78).","change":"The server sends a `business_date` and `now` in `/api/v5/state`: the real KZ date in production, the scenario date only in demo. All engines and modules use it. Missing forecast data → gate amber (\"no data\"), not green. Document and event timestamps come from stored server times.","acceptance":"(1) With a production config, `daysTo` and `/api/compliance` give identical days-left for the same licence. (2) A trip departing beyond the forecast horizon shows the weather gate as \"no data\" (blocking unless overridden). (3) No literal `06.10`/`2026` remains in engine output when demo is off (grep test).<br>In production mode the header shows the real date. A contract expiring next month turns yellow relative to the real date (test with frozen time). Printed documents carry the server date. A `clock` payload sent in production is ignored (pytest). The demo keeps 06.10.2026 and the suite stays green.","merged":"Replace the scenario date 06.10.2026 with a server clock service (scenario only in demo) — The date is hard-coded in the engine and modules: `core.ts:60-62` (`TODAY`, `NOW_YM`), `partners.py:29`, `staff.py:16`, `coverage.ts:14`, the header text \"Вт 06.10.2026\" (`Shell.tsx:122`) and the printed KZ document \"Дата: 06.10.2026\" (`engine/docs.ts:101`). The ops log uses the client-supplied clock (`registry.py:77-78`, `ActIn.clock`, `router.py:88`). Meanwhile the worker and inbox use the real clock (`router.py:131`, `coverage_monitor`). Expiry of contracts, ADR and calibration is therefore computed against a fixed date."},"de":{"title":"Festes Szenariodatum durch ein Server-Geschäftsdatum ersetzen","finding":"Das Frontend fixiert `TODAY = 06.10.2026` (core.ts:60-62); es steuert die Countdowns für Führerschein, Kalibrierung und Gebühren, während die Compliance-Liste im Backend das reale Datum nutzt (resources.py:413) – beide widersprechen sich. Das Wetter hat 7 Referenztage ab 06.10, und `wx_risk` überspringt Indizes ≥ 7 (docs.py:76-78, dispatch.py:41-44), sodass das Wetter-Gate ohne Daten stillschweigend grün ist. Dokumentdatum `06.10.2026` (docs.ts:101) und Track-&-Trace-Zeiten `05.10 18:20 … 08.10 06:00` (ship.ts:36-58) sind fest codiert. Das Betriebsprotokoll nutzt die Client-Uhr (registry.py:66-68,77-78).","change":"Der Server liefert `business_date` und `now` in `/api/v5/state`: im Produktivbetrieb das reale KZ-Datum, nur im Demo das Szenariodatum. Alle Engines und Module nutzen es. Fehlende Prognosedaten → Gate gelb („keine Daten“), nicht grün. Dokument- und Ereigniszeitstempel stammen aus gespeicherten Serverzeiten.","acceptance":"(1) In Produktivkonfiguration liefern `daysTo` und `/api/compliance` für denselben Führerschein identische Resttage. (2) Eine Tour mit Abfahrt jenseits des Prognosehorizonts zeigt das Wetter-Gate als „keine Daten“ (sperrend, sofern nicht übersteuert). (3) Bei ausgeschaltetem Demo enthält die Engine-Ausgabe kein literales `06.10`/`2026` mehr (grep-Test).<br>Im Produktivmodus zeigt die Kopfzeile das reale Datum. Ein im nächsten Monat auslaufender Vertrag wird relativ zum realen Datum gelb (Test mit eingefrorener Zeit). Gedruckte Dokumente tragen das Serverdatum. Eine im Produktivbetrieb gesendete `clock` wird ignoriert (pytest). Das Demo behält 06.10.2026 und die Suite bleibt grün.","merged":"Szenariodatum 06.10.2026 durch einen Server-Uhrendienst ersetzen (Szenario nur im Demo) — Das Datum ist in Engine und Modulen fest codiert: `core.ts:60-62` (`TODAY`, `NOW_YM`), `partners.py:29`, `staff.py:16`, `coverage.ts:14`, Kopfzeile „Вт 06.10.2026“ (`Shell.tsx:122`) und das gedruckte KZ-Dokument „Дата: 06.10.2026“ (`engine/docs.ts:101`). Das Betriebsprotokoll nutzt die vom Client gelieferte Uhr (`registry.py:77-78`, `ActIn.clock`, `router.py:88`). Worker und Inbox nutzen dagegen die reale Uhr (`router.py:131`, `coverage_monitor`). Abläufe von Verträgen, ADR und Kalibrierung werden daher gegen ein festes Datum berechnet."},"ru":{"title":"Заменить фиксированную дату сценария серверной рабочей датой","finding":"Фронтенд фиксирует `TODAY = 06.10.2026` (core.ts:60-62); от неё считаются сроки прав, калибровки и сборов, а список соответствия в бэкенде использует реальную дату (resources.py:413) — значения расходятся. Погода содержит 7 справочных дней с 06.10, а `wx_risk` пропускает индексы ≥ 7 (docs.py:76-78, dispatch.py:41-44), поэтому погодный контроль без данных молча зелёный. Дата документа `06.10.2026` (docs.ts:101) и время track & trace `05.10 18:20 … 08.10 06:00` (ship.ts:36-58) заданы жёстко. Журнал операций использует часы клиента (registry.py:66-68,77-78).","change":"Сервер передаёт `business_date` и `now` в `/api/v5/state`: в продуктиве — реальную дату РК, дату сценария — только в демо. Все движки и модули используют её. Нет данных прогноза → контроль жёлтый («нет данных»), а не зелёный. Метки времени документов и событий берутся из сохранённого серверного времени.","acceptance":"(1) В продуктивной конфигурации `daysTo` и `/api/compliance` дают одинаковое число оставшихся дней для одного удостоверения. (2) Рейс с выездом за горизонтом прогноза показывает погодный контроль «нет данных» (блокирует, если не переопределён). (3) При выключенном демо в выводе движка нет литералов `06.10`/`2026` (grep-тест).<br>В продуктивном режиме заголовок показывает реальную дату. Договор, истекающий в следующем месяце, желтеет относительно реальной даты (тест с замороженным временем). Печатные документы содержат серверную дату. Переданный в продуктиве `clock` игнорируется (pytest). Демо сохраняет 06.10.2026, набор тестов остаётся зелёным.","merged":"Заменить дату сценария 06.10.2026 серверной службой времени (сценарий только в демо) — Дата жёстко задана в движке и модулях: `core.ts:60-62` (`TODAY`, `NOW_YM`), `partners.py:29`, `staff.py:16`, `coverage.ts:14`, заголовок «Вт 06.10.2026» (`Shell.tsx:122`) и печатный документ РК «Дата: 06.10.2026» (`engine/docs.ts:101`). Журнал операций использует часы, переданные клиентом (`registry.py:77-78`, `ActIn.clock`, `router.py:88`). При этом воркер и входящие используют реальные часы (`router.py:131`, `coverage_monitor`). Поэтому истечение договоров, ДОПОГ и калибровки считается от фиксированной даты."}},{"id":"FR-75","type":"FR","date":"2026-10-11","priority":"high","status":"implemented","group":{"en":"One source of truth & architecture","de":"Eine Datenquelle & Architektur","ru":"Единый источник данных и архитектура"},"depends":"FR-74; `audit.py`","effort":"L","source":"docs/CHANGE-REQUESTS.md","en":{"title":"Versioned history of the document and archive tables instead of silent list caps","finding":"Growing lists are cut silently: ops log 8 (`registry.py:18, 80`), inbox 200, fines 100, tickets 100 (`inbox.py:47-53`), driver events 200 (`driver.py:36`), SMS 100 (`coverage.py` `LOG_MAX/OUT_MAX`). Evicted fines, service tickets and ePOD events (financial and GDP evidence) exist afterwards only as ≤80-char audit details (`registry.py:84`). There is no previous state of `v5_doc`, no multi-day operation and no \"show 05.10\".","change":"Add `v5_doc_history(version, ts, actor, action, patch JSONB)`, written in the same transaction as each `/act` and `apply_external_event`. Add archive tables `v5_archive_<kind>(id, hub, day, payload JSONB)`, into which capped items are moved instead of deleted. Add a day key (`opsDay`) and a nightly roll-over job that archives closed trips. Add `GET /api/v5/history?entity=&from=` (auditor).","acceptance":"No fine, ticket or driver event is lost after 1,000 ingests (test). Any document version can be reconstructed from history (replay test). The auditor can list all fines of September. Archive rows are hub-scoped."},"de":{"title":"Versionierte Dokumenthistorie und Archivtabellen statt stiller Listenkürzung","finding":"Wachsende Listen werden stillschweigend gekürzt: Betriebsprotokoll 8 (`registry.py:18, 80`), Inbox 200, Bußgelder 100, Tickets 100 (`inbox.py:47-53`), Fahrerereignisse 200 (`driver.py:36`), SMS 100 (`coverage.py` `LOG_MAX/OUT_MAX`). Verdrängte Bußgelder, Werkstatttickets und ePOD-Ereignisse (Finanz- und GDP-Nachweise) existieren danach nur noch als Audit-Details mit ≤ 80 Zeichen (`registry.py:84`). Es gibt keinen früheren Zustand von `v5_doc`, keinen mehrtägigen Betrieb und kein „05.10 anzeigen“.","change":"`v5_doc_history(version, ts, actor, action, patch JSONB)` ergänzen, in derselben Transaktion wie jedes `/act` und `apply_external_event` geschrieben. Archivtabellen `v5_archive_<kind>(id, hub, day, payload JSONB)`, in die gekappte Einträge verschoben statt gelöscht werden. Tagesschlüssel (`opsDay`) und nächtlicher Roll-over-Job, der abgeschlossene Touren archiviert. `GET /api/v5/history?entity=&from=` (Auditor).","acceptance":"Nach 1 000 Ingests geht kein Bußgeld, Ticket oder Fahrerereignis verloren (Test). Jede Dokumentversion ist aus der Historie rekonstruierbar (Replay-Test). Der Auditor kann alle Bußgelder des Septembers auflisten. Archivzeilen sind hub-bezogen."},"ru":{"title":"Версионная история документа и архивные таблицы вместо молчаливого обрезания списков","finding":"Растущие списки молча обрезаются: журнал операций 8 (`registry.py:18, 80`), входящие 200, штрафы 100, заявки 100 (`inbox.py:47-53`), события водителя 200 (`driver.py:36`), SMS 100 (`coverage.py` `LOG_MAX/OUT_MAX`). Вытесненные штрафы, сервисные заявки и события ePOD (финансовые и GDP-доказательства) остаются потом только как детали аудита ≤ 80 символов (`registry.py:84`). Нет предыдущего состояния `v5_doc`, нет многодневной работы и нет «показать 05.10».","change":"Добавить `v5_doc_history(version, ts, actor, action, patch JSONB)`, записываемую в той же транзакции, что и каждый `/act` и `apply_external_event`. Архивные таблицы `v5_archive_<kind>(id, hub, day, payload JSONB)`, куда обрезанные записи переносятся, а не удаляются. Ключ дня (`opsDay`) и ночное задание перехода дня, архивирующее закрытые рейсы. `GET /api/v5/history?entity=&from=` (аудитор).","acceptance":"После 1 000 приёмов не теряется ни один штраф, заявка или событие водителя (тест). Любая версия документа восстанавливается из истории (replay-тест). Аудитор может вывести все штрафы за сентябрь. Строки архива привязаны к хабу."}},{"id":"FR-74","type":"FR","date":"2026-10-11","priority":"high","status":"implemented_partial","status_note":{"en":"Load-test target p95 < 300 ms was not reached in the implementation wave; it was met later.","de":"Lasttestziel p95 < 300 ms wurde in der Umsetzungswelle nicht erreicht; später erfüllt.","ru":"Цель нагрузочного теста p95 < 300 мс в волне реализации не достигнута; выполнена позже."},"group":{"en":"One source of truth & architecture","de":"Eine Datenquelle & Architektur","ru":"Единый источник данных и архитектура"},"depends":"FR-71, FR-75, FR-131","effort":"L/M","source":"docs/CHANGE-REQUESTS.md","en":{"title":"Move v5 operational state from one JSON document to tables","finding":"All v5 state is one JSON row (router.py:31,53-63). Every action locks that row across all hubs (router.py:100), and the full document is returned after each action (router.py:114) and on `/state` to all staff without hub filtering (router.py:76-81). Caps fit a demo, not a fleet: 50 extra incidents, then 409 \"Too many open incidents\" (security.py:45-48). Lists truncate silently: `/api/trips` limit 100 with no offset (operations.py:329-343), Dispatch loads 200 open orders (Operations.tsx:21), and search scans all `LINES` in the client (search.ts:28).","change":"Move each module's keys into tables keyed by DB ids (trip_release, trip_document, load_plan, package scans, incidents, hand-overs) with row-level locks. `/state` returns only the user's hubs. Add offset/total pagination to trips and orders. Add a server search endpoint (order no., LOT, SSCC; GS1 scanner input).","acceptance":"(1) Two concurrent actions on different trips do not block each other (lock-timeout test). (2) 500 open incidents are accepted. (3) An Almaty user's `/state` contains no Astana incidents or road messages. (4) 1,000 open orders are reachable through paging and search in the UI.<br>Two parallel `/act` calls with the same `base_version`: the second gets 409. The `/act` response for `dispatch.send` is < 5 KB. A load test (k6 or locust, 20 users, 2 actions/s plus worker ingest at 1/s) holds p95 < 300 ms.","merged":"Optimistic concurrency, delta responses and JSONB for the operations document — All writes take `SELECT … FOR UPDATE` on the single row `id='ops'` (`router.py:53-57, 100, 128`), including worker and inbound webhooks. The model docstring says \"optimistic version counter\" (`v5/models.py:208`), but the client never sends a version (`V5.tsx:118`), so it can act on a stale view without noticing. The column is `JSON`, not `JSONB` (`v5/models.py:212`). Every action deep-copies the document, rewrites it and sends it back in full (`router.py:101, 108, 114`)."},"de":{"title":"Betriebszustand v5 aus einem JSON-Dokument in Tabellen verlagern","finding":"Der gesamte v5-Zustand ist eine JSON-Zeile (router.py:31,53-63). Jede Aktion sperrt diese Zeile hubübergreifend (router.py:100), und das vollständige Dokument wird nach jeder Aktion (router.py:114) sowie über `/state` an alle Mitarbeiter ohne Hubfilter zurückgegeben (router.py:76-81). Die Obergrenzen passen zu einem Demo, nicht zu einer Flotte: 50 zusätzliche Vorfälle, danach 409 „Too many open incidents“ (security.py:45-48). Listen werden stillschweigend abgeschnitten: `/api/trips` Limit 100 ohne Offset (operations.py:329-343), der Disponent lädt 200 offene Aufträge (Operations.tsx:21), und die Suche durchläuft alle `LINES` im Client (search.ts:28).","change":"Die Schlüssel jedes Moduls in Tabellen mit DB-IDs überführen (trip_release, trip_document, load_plan, Packstück-Scans, Vorfälle, Übergaben) mit Zeilensperren. `/state` liefert nur die Hubs des Nutzers. Offset-/Total-Paginierung für Touren und Aufträge. Serverseitiger Such-Endpunkt (Auftragsnr., Charge, SSCC; GS1-Scannereingabe).","acceptance":"(1) Zwei gleichzeitige Aktionen auf verschiedenen Touren blockieren sich nicht (Lock-Timeout-Test). (2) 500 offene Vorfälle werden angenommen. (3) Das `/state` eines Almaty-Nutzers enthält keine Astana-Vorfälle oder Straßenmeldungen. (4) 1 000 offene Aufträge sind in der UI über Paging und Suche erreichbar.<br>Zwei parallele `/act`-Aufrufe mit derselben `base_version`: der zweite erhält 409. Die `/act`-Antwort für `dispatch.send` ist < 5 KB. Ein Lasttest (k6 oder locust, 20 Nutzer, 2 Aktionen/s plus Worker-Ingest 1/s) hält p95 < 300 ms.","merged":"Optimistische Nebenläufigkeit, Delta-Antworten und JSONB für das Betriebsdokument — Alle Schreibvorgänge nehmen `SELECT … FOR UPDATE` auf die einzige Zeile `id='ops'` (`router.py:53-57, 100, 128`), auch Worker und eingehende Webhooks. Der Modell-Docstring nennt einen „optimistic version counter“ (`v5/models.py:208`), aber der Client sendet nie eine Version (`V5.tsx:118`) und kann daher unbemerkt auf veraltetem Stand handeln. Die Spalte ist `JSON`, nicht `JSONB` (`v5/models.py:212`). Jede Aktion kopiert das Dokument tief, schreibt es neu und sendet es vollständig zurück (`router.py:101, 108, 114`)."},"ru":{"title":"Перенести операционное состояние v5 из одного JSON-документа в таблицы","finding":"Всё состояние v5 — одна JSON-строка (router.py:31,53-63). Каждое действие блокирует эту строку для всех хабов (router.py:100), а полный документ возвращается после каждого действия (router.py:114) и через `/state` всем сотрудникам без фильтра по хабу (router.py:76-81). Лимиты рассчитаны на демо, а не на автопарк: 50 дополнительных инцидентов, затем 409 «Too many open incidents» (security.py:45-48). Списки молча обрезаются: `/api/trips` — лимит 100 без смещения (operations.py:329-343), «Диспетчер» загружает 200 открытых заказов (Operations.tsx:21), а поиск перебирает все `LINES` в клиенте (search.ts:28).","change":"Перенести ключи каждого модуля в таблицы с id из БД (trip_release, trip_document, load_plan, сканы мест, инциденты, передачи) с блокировкой на уровне строк. `/state` возвращает только хабы пользователя. Пагинация offset/total для рейсов и заказов. Серверный эндпоинт поиска (№ заказа, серия, SSCC; ввод со сканера GS1).","acceptance":"(1) Два одновременных действия по разным рейсам не блокируют друг друга (тест lock-timeout). (2) Принимаются 500 открытых инцидентов. (3) `/state` пользователя Алматы не содержит инцидентов и дорожных сообщений Астаны. (4) 1 000 открытых заказов доступны в UI через пагинацию и поиск.<br>Два параллельных вызова `/act` с одинаковой `base_version`: второй получает 409. Ответ `/act` на `dispatch.send` < 5 КБ. Нагрузочный тест (k6 или locust, 20 пользователей, 2 действия/с плюс приём воркера 1/с) держит p95 < 300 мс.","merged":"Оптимистичная конкурентность, дельта-ответы и JSONB для операционного документа — Все записи берут `SELECT … FOR UPDATE` на единственную строку `id='ops'` (`router.py:53-57, 100, 128`), включая воркер и входящие вебхуки. В docstring модели указан «optimistic version counter» (`v5/models.py:208`), но клиент никогда не отправляет версию (`V5.tsx:118`) и может незаметно действовать по устаревшим данным. Колонка имеет тип `JSON`, а не `JSONB` (`v5/models.py:212`). Каждое действие глубоко копирует документ, перезаписывает его и отправляет целиком (`router.py:101, 108, 114`)."}},{"id":"FR-73","type":"FR","date":"2026-10-11","priority":"high","status":"implemented","group":{"en":"One source of truth & architecture","de":"Eine Datenquelle & Architektur","ru":"Единый источник данных и архитектура"},"depends":"FR-71","effort":"L","source":"docs/CHANGE-REQUESTS.md","en":{"title":"Order lines, packages and SSCC as first-class tables","finding":"`Order` (models.py:231-249) has no volume, package count, SSCC, ADR/UN, third-party flag, manufacturer, expiry or article. The v5 load, ship and docs logic depends on exactly these fields (`o.m3`, `o.adr`, `o.third`, `PKG`, `LINES`: shared.ts:53-80, docs.py:47-68, ship.ts:17-58). As a result, SSCC reconciliation, ADR documents and labels cannot work for real orders.","change":"Add the tables `order_lines` (art, mfr, lot, exp, qty, temp class) and `packages` (sscc unique, order_line_id, status picked/loaded/handed/delivered/missing, scanned_at, scanned_by). Add `Order.m3`, `adr_un`, `third_party`. Generate the SSCC on the server (GS1 company prefix from settings + serial + mod-10 check digit). Add scan endpoints for loading and unloading (audited).","acceptance":"(1) Creating an order with lines yields packages whose SSCCs are unique and pass the GS1 check digit. (2) `/s/ship` lists the packages of a DB trip. (3) The reconciliation gate counts scanned rows from `packages`. (4) A duplicate SSCC scan returns 409."},"de":{"title":"Auftragspositionen, Packstücke und SSCC als eigene Tabellen","finding":"`Order` (models.py:231-249) hat kein Volumen, keine Packstückzahl, keine SSCC, kein ADR/UN, kein Fremd-Flag, keinen Hersteller, kein Verfallsdatum und keinen Artikel. Die v5-Logik für Beladung, Sendungen und Dokumente hängt genau von diesen Feldern ab (`o.m3`, `o.adr`, `o.third`, `PKG`, `LINES`: shared.ts:53-80, docs.py:47-68, ship.ts:17-58). Daher können SSCC-Abgleich, ADR-Dokumente und Etiketten für echte Aufträge nicht funktionieren.","change":"Tabellen `order_lines` (Artikel, Hersteller, Charge, Verfall, Menge, Temperaturklasse) und `packages` (SSCC eindeutig, order_line_id, Status kommissioniert/verladen/übergeben/zugestellt/fehlend, scanned_at, scanned_by) anlegen. `Order.m3`, `adr_un`, `third_party` ergänzen. SSCC serverseitig erzeugen (GS1-Basisnummer aus den Einstellungen + laufende Nummer + Prüfziffer mod 10). Scan-Endpunkte für Be- und Entladung (auditiert).","acceptance":"(1) Ein Auftrag mit Positionen erzeugt Packstücke mit eindeutigen SSCC, die die GS1-Prüfziffer bestehen. (2) `/s/ship` listet die Packstücke einer DB-Tour. (3) Das Abgleich-Gate zählt gescannte Zeilen aus `packages`. (4) Ein doppelter SSCC-Scan liefert 409."},"ru":{"title":"Строки заказа, места и SSCC — отдельные таблицы","finding":"У `Order` (models.py:231-249) нет объёма, количества мест, SSCC, ДОПОГ/UN, признака стороннего груза, производителя, срока годности и артикула. Логика v5 для загрузки, отправок и документов зависит именно от этих полей (`o.m3`, `o.adr`, `o.third`, `PKG`, `LINES`: shared.ts:53-80, docs.py:47-68, ship.ts:17-58). Поэтому сверка SSCC, документы ДОПОГ и этикетки для реальных заказов работать не могут.","change":"Добавить таблицы `order_lines` (артикул, производитель, серия, срок годности, количество, температурный класс) и `packages` (уникальный SSCC, order_line_id, статус собрано/погружено/передано/доставлено/отсутствует, scanned_at, scanned_by). Добавить `Order.m3`, `adr_un`, `third_party`. SSCC генерируется на сервере (префикс компании GS1 из настроек + серийный номер + контрольная цифра mod 10). Эндпоинты сканирования при погрузке и выгрузке (с аудитом).","acceptance":"(1) Заказ со строками создаёт места с уникальными SSCC, проходящими проверку контрольной цифры GS1. (2) `/s/ship` показывает места рейса БД. (3) Контроль сверки считает отсканированные строки из `packages`. (4) Повторный скан SSCC возвращает 409."}},{"id":"FR-72","type":"FR","date":"2026-10-11","priority":"critical","status":"implemented","group":{"en":"One source of truth & architecture","de":"Eine Datenquelle & Architektur","ru":"Единый источник данных и архитектура"},"depends":"FR-71, FR-80","effort":"S","source":"docs/CHANGE-REQUESTS.md","en":{"title":"Remove trip-number collision between DB and reference","finding":"DB trips are numbered `R-101…` (operations.py:393), the same range as the reference trips R-102…R-106. The worker puts the relational `trip.number` into inbox events (worker.py:199-200), and inbox routing resolves them against `R[\"TRIPS\"]` (inbox.py `_route_doc`, ~l.332). A real DB trip \"R-106\" would inherit the hard-coded load list, replan window and Go/No-Go specials (load.py:117, dispatch.py:16, docs.py:98).","change":"Use a distinct namespace for DB trips: a sequence-based `R-<yy>-<nnnn>` or a configurable prefix. Prefix reference trips with `DEMO-` in the demo build. Inbox events carry the DB trip id, and the router resolves DB trips first.","acceptance":"(1) A test creates DB trips until the counter passes 106: no v5 view or action treats them as reference trips. (2) A `doc_status` inbox event for a DB trip links to that trip (no `err:\"trip\"`)."},"de":{"title":"Kollision der Tournummern zwischen DB und Referenz beseitigen","finding":"DB-Touren werden `R-101…` nummeriert (operations.py:393) – derselbe Bereich wie die Referenztouren R-102…R-106. Der Worker schreibt die relationale `trip.number` in Inbox-Ereignisse (worker.py:199-200), und das Inbox-Routing löst sie gegen `R[\"TRIPS\"]` auf (inbox.py `_route_doc`, ~Z. 332). Eine echte DB-Tour „R-106“ würde die fest codierte Ladeliste, das Umplanungsfenster und die Go/No-Go-Sonderregeln erben (load.py:117, dispatch.py:16, docs.py:98).","change":"Eigenen Namensraum für DB-Touren verwenden: sequenzbasiert `R-<yy>-<nnnn>` oder konfigurierbares Präfix. Referenztouren im Demo-Build mit `DEMO-` präfixieren. Inbox-Ereignisse tragen die DB-Tour-ID, und der Router löst zuerst DB-Touren auf.","acceptance":"(1) Ein Test legt DB-Touren an, bis der Zähler 106 überschreitet: keine v5-Ansicht oder -Aktion behandelt sie als Referenztouren. (2) Ein Inbox-Ereignis `doc_status` zu einer DB-Tour wird dieser Tour zugeordnet (kein `err:\"trip\"`)."},"ru":{"title":"Устранить совпадение номеров рейсов БД и справочника","finding":"Рейсы БД нумеруются `R-101…` (operations.py:393) — тот же диапазон, что у справочных рейсов R-102…R-106. Воркер записывает реляционный `trip.number` в события входящих (worker.py:199-200), а маршрутизация входящих сопоставляет их с `R[\"TRIPS\"]` (inbox.py `_route_doc`, ~стр. 332). Реальный рейс БД «R-106» унаследовал бы жёстко заданный список загрузки, окно перепланирования и особые правила Go/No-Go (load.py:117, dispatch.py:16, docs.py:98).","change":"Отдельное пространство номеров для рейсов БД: по последовательности `R-<yy>-<nnnn>` или настраиваемый префикс. В демо-сборке справочные рейсы получают префикс `DEMO-`. События входящих несут id рейса в БД, маршрутизатор сначала ищет рейсы БД.","acceptance":"(1) Тест создаёт рейсы БД, пока счётчик не превысит 106: ни один экран или действие v5 не считает их справочными. (2) Событие входящих `doc_status` по рейсу БД привязывается к этому рейсу (нет `err:\"trip\"`)."}},{"id":"FR-71","type":"FR","date":"2026-10-11","priority":"critical","status":"implemented","group":{"en":"One source of truth & architecture","de":"Eine Datenquelle & Architektur","ru":"Единый источник данных и архитектура"},"depends":"FR-72, FR-73, FR-74, FR-78, FR-83, FR-135","effort":"L","source":"docs/CHANGE-REQUESTS.md","en":{"title":"Drive v5 operations screens from live DB trips/orders","finding":"The v5 engines read only reference data (`R.TRIPS`, `R.ORD`, `R.VEH`, `R.LINES`: dispatch.ts:18, shared.ts:50-53, search.ts:28). No engine calls `/api/trips` or `/api/orders`, and every v5 action looks ids up in `ctx.R[\"TRIPS\"]`/`ctx.R[\"ORD\"]` (dispatch.py:24-30, docs.py:86-92, load.py:126-132). Overview, Dispatcher, Load, Ship, Docs, Thermo and Security therefore show the fictitious 06.10.2026 scenario even in production, and the default landing page after login is `/s/overview` (App.tsx:50).","change":"Add a server view layer (`app/v5/live.py`) that builds the TRIPS/ORD/VM/DRV/LINES shapes from DB rows (hub-filtered, keyed by DB trip number/order number) and serve it via `GET /api/v5/ops`. The engines take that instead of the reference keys. Reference JSON is served only when `OLYMP_ENV` is demo or `OLYMP_ALLOW_DEMO=1`. v5 actions resolve trips and orders in the DB.","acceptance":"(1) In a production configuration, a trip created via `POST /api/trips` appears on Обзор, Диспетчер and Документы РК after one reload. (2) `docs.release` / `load.plan` with a DB-only trip (e.g. R-107) returns 200. (3) Reference trips R-102…R-106 are not delivered by any endpoint when demo is off. (4) The 494-scenario UI suite still passes in demo mode.<br>A booking confirmed in `/bookings` shows up as an order on `/s/dispatch` within one reload. The v5 screens show the vehicles from `/fleet` (count equal). The 494 suite still passes on the demo. Backend tests cover the adapter.","merged":"One source of truth: relational trips, vehicles, drivers and orders feed the 17 screens — Two operational models run side by side. Relational `Vehicle/Driver/Order/Trip/TripStop` (`backend/app/models.py:194-282`) serve the booking portal, partner API and legacy pages. The 17 v5 screens use the fixed JSON scenario (`TRIPS` 5, `VEH` 4, `DRV` 6, `ORD` 10 in `mock-v5.ru.json`). An order created by a confirmed booking (`routers/booking.py`) never appears on Dispatcher, Load or Docs."},"de":{"title":"v5-Betriebsbildschirme aus echten DB-Touren/-Aufträgen speisen","finding":"Die v5-Engines lesen nur Referenzdaten (`R.TRIPS`, `R.ORD`, `R.VEH`, `R.LINES`: dispatch.ts:18, shared.ts:50-53, search.ts:28). Keine Engine ruft `/api/trips` oder `/api/orders` auf, und jede v5-Aktion sucht IDs in `ctx.R[\"TRIPS\"]`/`ctx.R[\"ORD\"]` (dispatch.py:24-30, docs.py:86-92, load.py:126-132). Übersicht, Disponent, Beladung, Sendungen, Dokumente, Thermo und Sicherheit zeigen daher auch im Produktivbetrieb das fiktive Szenario vom 06.10.2026, und die Startseite nach dem Login ist `/s/overview` (App.tsx:50).","change":"Server-View-Schicht (`app/v5/live.py`) ergänzen, die die Strukturen TRIPS/ORD/VM/DRV/LINES aus DB-Zeilen aufbaut (hub-gefiltert, Schlüssel = DB-Tour-/Auftragsnummer) und über `GET /api/v5/ops` ausliefert. Die Engines nutzen diese statt der Referenzschlüssel. Referenz-JSON wird nur ausgeliefert, wenn `OLYMP_ENV` = demo oder `OLYMP_ALLOW_DEMO=1`. v5-Aktionen lösen Touren und Aufträge in der DB auf.","acceptance":"(1) In Produktivkonfiguration erscheint eine per `POST /api/trips` angelegte Tour nach einem Neuladen in Обзор, Диспетчер und Документы РК. (2) `docs.release` / `load.plan` mit einer reinen DB-Tour (z. B. R-107) liefert 200. (3) Referenztouren R-102…R-106 werden bei ausgeschaltetem Demo von keinem Endpunkt geliefert. (4) Die 494-Szenarien-UI-Suite läuft im Demomodus weiterhin grün.<br>Eine in `/bookings` bestätigte Buchung erscheint nach einem Neuladen als Auftrag in `/s/dispatch`. Die v5-Bildschirme zeigen die Fahrzeuge aus `/fleet` (gleiche Anzahl). Die 494er-Suite läuft auf dem Demo weiterhin grün. Backend-Tests decken den Adapter ab.","merged":"Eine Datenquelle: relationale Touren, Fahrzeuge, Fahrer und Aufträge speisen die 17 Bildschirme — Zwei Betriebsmodelle laufen parallel. Relationale `Vehicle/Driver/Order/Trip/TripStop` (`backend/app/models.py:194-282`) bedienen Buchungsportal, Partner-API und Altseiten. Die 17 v5-Bildschirme nutzen das feste JSON-Szenario (`TRIPS` 5, `VEH` 4, `DRV` 6, `ORD` 10 in `mock-v5.ru.json`). Ein aus einer bestätigten Buchung erzeugter Auftrag (`routers/booking.py`) erscheint nie in Disponent, Beladung oder Dokumente."},"ru":{"title":"Экраны операций v5 — из реальных рейсов и заказов БД","finding":"Движки v5 читают только справочные данные (`R.TRIPS`, `R.ORD`, `R.VEH`, `R.LINES`: dispatch.ts:18, shared.ts:50-53, search.ts:28). Ни один движок не вызывает `/api/trips` или `/api/orders`, а каждое действие v5 ищет id в `ctx.R[\"TRIPS\"]`/`ctx.R[\"ORD\"]` (dispatch.py:24-30, docs.py:86-92, load.py:126-132). Поэтому «Обзор», «Диспетчер», «Загрузка», «Отправки», «Документы», «Термостатус» и «Безопасность» даже в продуктиве показывают вымышленный сценарий 06.10.2026, а стартовая страница после входа — `/s/overview` (App.tsx:50).","change":"Добавить серверный слой представления (`app/v5/live.py`), который строит структуры TRIPS/ORD/VM/DRV/LINES из строк БД (с фильтром по хабу, ключ — номер рейса/заказа в БД), и отдавать его через `GET /api/v5/ops`. Движки используют его вместо справочных ключей. Справочный JSON отдаётся только при `OLYMP_ENV` = demo или `OLYMP_ALLOW_DEMO=1`. Действия v5 находят рейсы и заказы в БД.","acceptance":"(1) В продуктивной конфигурации рейс, созданный через `POST /api/trips`, после одной перезагрузки виден в «Обзоре», «Диспетчере» и «Документах РК». (2) `docs.release` / `load.plan` для рейса только из БД (напр. R-107) возвращает 200. (3) При выключенном демо справочные рейсы R-102…R-106 не отдаёт ни один эндпоинт. (4) UI-набор из 494 сценариев по-прежнему проходит в демо-режиме.<br>Бронирование, подтверждённое в `/bookings`, после одной перезагрузки появляется как заказ в `/s/dispatch`. Экраны v5 показывают ТС из `/fleet` (количество совпадает). Набор 494 по-прежнему проходит на демо. Адаптер покрыт бэкенд-тестами.","merged":"Единый источник данных: реляционные рейсы, ТС, водители и заказы питают 17 экранов — Параллельно работают две операционные модели. Реляционные `Vehicle/Driver/Order/Trip/TripStop` (`backend/app/models.py:194-282`) обслуживают портал бронирования, партнёрский API и старые страницы. 17 экранов v5 используют фиксированный JSON-сценарий (`TRIPS` 5, `VEH` 4, `DRV` 6, `ORD` 10 в `mock-v5.ru.json`). Заказ, созданный из подтверждённого бронирования (`routers/booking.py`), не появляется в «Диспетчере», «Загрузке» и «Документах»."}},{"id":"B-08","type":"bug","date":"2026-10-11","priority":null,"status":"fixed","group":{"en":"Reported bugs (platform)","de":"Gemeldete Fehler (Plattform)","ru":"Сообщённые ошибки (платформа)"},"source":"docs/CHANGE-REQUESTS-2.md","en":{"title":"Locations in Russian on EN/DE pages (portal)","finding":"Locations in Russian on EN/DE pages (portal)","change":"Fixed in wave 1 (display translation) and FR-135 (location master)","acceptance":""},"de":{"title":"Orte auf EN/DE-Seiten (Portal) auf Russisch","finding":"Orte auf EN/DE-Seiten (Portal) auf Russisch","change":"Behoben in Welle 1 (Anzeigeübersetzung) und FR-135 (Standortstamm)","acceptance":""},"ru":{"title":"Пункты на страницах EN/DE (портал) на русском","finding":"Пункты на страницах EN/DE (портал) на русском","change":"Исправлено в волне 1 (перевод отображения) и FR-135 ( de 1","ru":"Концепт v2→v3 · запросы на доработку, раунд 1"},"module":{"en":"Shipments","de":"Sendungen","ru":"Отправки"},"source":"Olymp-Logistic-KZ/tests.html","en":{"title":"GS1-128 printing and ZPL export","finding":"The label is a mock-up and the barcode encodes no data. The SSCC check digit was corrected and is now covered by a test.","change":"","acceptance":"Real GS1-128 (AI 00, 02, 10, 17), printing on Zebra 100×150 mm, ZPL/PDF."},"de":{"title":"GS1-128-Druck und ZPL-Export","finding":"Das Etikett ist ein Muster, der Barcode codiert keine Daten. Die SSCC-Prüfziffer wurde korrigiert und ist jetzt per Test abgesichert.","change":"","acceptance":"Echter GS1-128 (AI 00, 02, 10, 17), Druck auf Zebra 100×150 mm, ZPL/PDF."},"ru":{"title":"Печать GS1-128 и экспорт ZPL","finding":"Этикетка — макет, штрихкод не кодирует данные. Контрольная цифра SSCC исправлена и теперь проверяется тестом.","change":"","acceptance":"Реальный GS1-128 (AI 00, 02, 10, 17), печать на Zebra 100×150 мм, ZPL/PDF."}},{"id":"FR-03","type":"FR","date":"2026-10-02","date_approx":true,"priority":"high","status":"implemented","group":{"en":"Concept v2→v3 · change requests round 1","de":"Konzept v2→v3 · Änderungsanträge Runde 1","ru":"Концепт v2→v3 · запросы на доработку, раунд 1"},"module":{"en":"Shipments","de":"Sendungen","ru":"Отправки"},"source":"Olymp-Logistic-KZ/tests.html","en":{"title":"Track & trace per SSCC","finding":"Items have no scan events (loaded / unloaded / received); validation sees only the trip status.","change":"","acceptance":"Scan log at the hub, in the vehicle and at the branch; item vs trip mismatch → alarm."},"de":{"title":"Track & Trace je SSCC","finding":"Packstücke haben keine Scan-Ereignisse (verladen / entladen / angenommen); die Validierung sieht nur den Tourstatus.","change":"","acceptance":"Scan-Protokoll im Hub, im Fahrzeug und in der Niederlassung; Abweichung Packstück/Tour → Alarm."},"ru":{"title":"Track & trace по каждому SSCC","finding":"У места нет событий сканирования: погружено / выгружено / принято; валидация видит только статус рейса.","change":"","acceptance":"Журнал сканов на хабе, в машине и в филиале; расхождение места и рейса → тревога."}},{"id":"FR-02","type":"FR","date":"2026-10-02","date_approx":true,"priority":"medium","status":"implemented","group":{"en":"Concept v2→v3 · change requests round 1","de":"Konzept v2→v3 · Änderungsanträge Runde 1","ru":"Концепт v2→v3 · запросы на доработку, раунд 1"},"module":{"en":"Search","de":"Suche","ru":"Поиск"},"source":"Olymp-Logistic-KZ/tests.html","en":{"title":"Archive of delivered shipments","finding":"Search deliberately excludes delivered trips (R-105) — complaints need a search over history.","change":"","acceptance":"Toggle “Include delivered”, date filter; search by ePOD number."},"de":{"title":"Archiv zugestellter Sendungen","finding":"Die Suche schließt zugestellte Touren (R-105) bewusst aus — für Reklamationen ist eine Suche in der Historie nötig.","change":"","acceptance":"Schalter „Inkl. zugestellter“, Datumsfilter; Suche nach ePOD-Nummer."},"ru":{"title":"Архив доставленных отправок","finding":"Поиск намеренно исключает доставленные рейсы (R-105) — для рекламаций нужен поиск по истории.","change":"","acceptance":"Переключатель «Включая доставленные», фильтр по дате; поиск по номеру ePOD."}},{"id":"FR-01","type":"FR","date":"2026-10-02","date_approx":true,"priority":"high","status":"implemented","group":{"en":"Concept v2→v3 · change requests round 1","de":"Konzept v2→v3 · Änderungsanträge Runde 1","ru":"Концепт v2→v3 · запросы на доработку, раунд 1"},"module":{"en":"Search","de":"Suche","ru":"Поиск"},"source":"Olymp-Logistic-KZ/tests.html","en":{"title":"Barcode scanner in the search field","finding":"Search works on text; in the warehouse and for drivers SSCCs are entered with a scanner (22 article search tests).","change":"","acceptance":"A GS1-128 scan (AI 00) opens the item label in < 1 s; “scanner” mode without a mouse."},"de":{"title":"Barcodescanner im Suchfeld","finding":"Die Suche arbeitet mit Text; im Lager und beim Fahrer werden SSCC per Scanner erfasst (22 Artikelsuchtests).","change":"","acceptance":"Ein GS1-128-Scan (AI 00) öffnet das Packstücketikett in < 1 s; Modus „Scanner“ ohne Maus."},"ru":{"title":"Сканер штрихкода в поле поиска","finding":"Поиск работает по тексту; на складе и у водителя SSCC вводят сканером (22 теста поиска по артикулам).","change":"","acceptance":"Скан GS1-128 (AI 00) открывает этикетку места < 1 с; режим «сканер» без мыши."}}],"labels":{"ui":{"title":{"en":"Change register","de":"Änderungsregister","ru":"Реестр изменений"},"lead":{"en":"All change requests (FR-01 … FR-175) and bugs of the Olymp Logistic concept and platform in one list, newest first. FR-01…70 come from the concept v1–v5.2 (01.–07.10.2026), FR-71…138 were approved on 11.10.2026 and implemented on 11.–12.10.2026, FR-139…175 and bugs B-01…14 were released on 12.10.2026.","de":"Alle Änderungsanträge (FR-01 … FR-175) und Fehler aus Konzept und Plattform Olymp Logistic in einer Liste, neueste zuerst. FR-01…70 stammen aus dem Konzept v1–v5.2 (01.–07.10.2026), FR-71…138 wurden am 11.10.2026 freigegeben und am 11.–12.10.2026 umgesetzt, FR-139…175 und die Fehler B-01…14 wurden am 12.10.2026 zur Umsetzung freigegeben.","ru":"Все запросы на изменение (FR-01 … FR-175) и ошибки концепта и платформы Olymp Logistic в одном списке, новые сверху. FR-01…70 — из концепта v1–v5.2 (01.–07.10.2026), FR-71…138 утверждены 11.10.2026 и реализованы 11.–12.10.2026, FR-139…175 и ошибки B-01…14 переданы в работу 12.10.2026."},"finding":{"en":"Finding","de":"Befund","ru":"Находка"},"merged":{"en":"Merged with","de":"Zusammengeführt mit","ru":"Объединено с"},"change":{"en":"Change","de":"Änderung","ru":"Изменение"},"fix":{"en":"Fix","de":"Korrektur","ru":"Исправление"},"acceptance":{"en":"Acceptance criteria","de":"Abnahmekriterien","ru":"Критерии приёмки"},"note":{"en":"Status note","de":"Statushinweis","ru":"Примечание к статусу"},"depends":{"en":"Depends on","de":"Abhängig von","ru":"Зависит от"},"effort":{"en":"Effort","de":"Aufwand","ru":"Трудоёмкость"},"ref":{"en":"Question catalogue ref.","de":"Fragenkatalog-Ref.","ru":"Ссылка Fragenkatalog"},"module":{"en":"Module","de":"Modul","ru":"Модуль"},"group":{"en":"Group","de":"Gruppe","ru":"Группа"},"date":{"en":"Date","de":"Datum","ru":"Дата"},"approx":{"en":"approx.","de":"ca.","ru":"прибл."},"source":{"en":"Source","de":"Quelle","ru":"Источник"},"implemented":{"en":"Implemented","de":"Umgesetzt","ru":"Реализовано"},"found_by":{"en":"Found by","de":"Gefunden durch","ru":"Кем найдено"},"all":{"en":"All","de":"Alle","ru":"Все"},"status":{"en":"Status","de":"Status","ru":"Статус"},"type":{"en":"Type","de":"Typ","ru":"Тип"},"priority":{"en":"Priority","de":"Priorität","ru":"Приоритет"},"search":{"en":"Search id, title, text…","de":"Suche nach ID, Titel, Text…","ru":"Поиск по id, названию, тексту…"},"shown":{"en":"shown","de":"angezeigt","ru":"показано"},"of":{"en":"of","de":"von","ru":"из"},"expand":{"en":"Expand all","de":"Alle aufklappen","ru":"Развернуть все"},"collapse":{"en":"Collapse all","de":"Alle zuklappen","ru":"Свернуть все"},"print":{"en":"Print","de":"Drucken","ru":"Печать"},"theme":{"en":"Theme","de":"Darstellung","ru":"Тема"},"none":{"en":"No entries match the filters.","de":"Keine Einträge passen zu den Filtern.","ru":"Нет записей по фильтрам."},"back":{"en":"← Preview site","de":"← Vorschau-Site","ru":"← Сайт предпросмотра"},"order":{"en":"Newest first · FR-01 at the end","de":"Neueste zuerst · FR-01 am Ende","ru":"Новые сверху · FR-01 в конце"},"counts":{"en":"Status overview","de":"Statusübersicht","ru":"Сводка по статусам"},"generated":{"en":"Generated from docs/change-register/register.json","de":"Erzeugt aus docs/change-register/register.json","ru":"Сформировано из docs/change-register/register.json"},"fr":{"en":"FRs","de":"FRs","ru":"FR"},"bugs":{"en":"Bugs","de":"Fehler","ru":"Ошибки"}},"status":{"in_progress":{"en":"In progress","de":"In Arbeit","ru":"В работе"},"implemented_partial":{"en":"Implemented – partial","de":"Umgesetzt – teilweise","ru":"Реализовано частично"},"implemented":{"en":"Implemented","de":"Umgesetzt","ru":"Реализовано"},"fixed":{"en":"Fixed","de":"Behoben","ru":"Исправлено"},"planned":{"en":"Planned","de":"Geplant","ru":"Запланировано"},"open_question":{"en":"Open question","de":"Offene Frage","ru":"Открытый вопрос"},"closed":{"en":"Closed","de":"Geschlossen","ru":"Закрыто"}},"priority":{"critical":{"en":"Critical","de":"Kritisch","ru":"Критичный"},"high":{"en":"High","de":"Hoch","ru":"Высокий"},"medium":{"en":"Medium","de":"Mittel","ru":"Средний"},"low":{"en":"Low","de":"Niedrig","ru":"Низкий"},"none":{"en":"not rated","de":"ohne Einstufung","ru":"без оценки"}},"type":{"FR":{"en":"Change request","de":"Änderungsantrag","ru":"Запрос на изменение"},"bug":{"en":"Bug","de":"Fehler","ru":"Ошибка"}}},"title":{"en":"Olymp Logistic Platform – Change register","de":"Olymp Logistic Platform – Änderungsregister","ru":"Olymp Logistic Platform – Реестр изменений"}}</script>
<script>
(function () {
  var D = JSON.parse(document.getElementById('data').textContent), E = D.entries, LB = D.labels;
  var LANGS = ['en', 'de', 'ru'], st = { lang: 'en', q: '', status: '', type: '', prio: '' };
  function store(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
  function read(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  var hash0 = location.hash, h = new URLSearchParams(hash0.slice(1));
  var nl = (navigator.language || 'en').slice(0, 2);
  st.lang = LANGS.indexOf(h.get('lang')) >= 0 ? h.get('lang') : (LANGS.indexOf(read('cr-lang')) >= 0 ? read('cr-lang') : (LANGS.indexOf(nl) >= 0 ? nl : 'en'));
  ['q', 'status', 'type', 'prio'].forEach(function (k) { if (h.get(k)) st[k] = h.get(k); });
  function u(k) { return LB.ui[k][st.lang]; }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function rich(s) { return esc(s).replace(/&lt;br&gt;/g, '<br>').replace(/`([^`]+)`/g, '<code>$1</code>'); }
  function prioKey(e) { return e.priority || 'none'; }
  function date(e) { var p = e.date.split('-'), s = p[2] + '.' + p[1] + '.' + p[0]; return e.date_approx ? u('approx') + ' ' + s : s; }
  function hay(e) { var t = e[st.lang]; return (e.id + ' ' + t.title + ' ' + (t.finding || '') + ' ' + (t.merged || '') + ' ' + (t.change || '') + ' ' + (t.acceptance || '') + ' ' + e.group[st.lang] + ' ' + (e.module ? e.module[st.lang] : '') + ' ' + (e.depends || '')).toLowerCase(); }
  function opts(sel, items, cur) { sel.innerHTML = items.map(function (o) { return '<option value="' + o[0] + '"' + (o[0] === cur ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join(''); }
  function card(e) {
    var t = e[st.lang], b = [];
    if (e.status_note) b.push('<div class="note"><h3>' + u('note') + '</h3><p>' + rich(e.status_note[st.lang]) + '</p></div>');
    if (t.finding && t.finding !== t.title) b.push('<div><h3>' + u('finding') + '</h3><p>' + rich(t.finding) + '</p></div>');
    if (t.merged) b.push('<div><h3>' + u('merged') + '</h3><p>' + rich(t.merged) + '</p></div>');
    if (t.change) b.push('<div><h3>' + u(e.type === 'bug' ? 'fix' : 'change') + '</h3><p>' + rich(t.change) + '</p></div>');
    if (t.acceptance) b.push('<div><h3>' + u('acceptance') + '</h3><p>' + rich(t.acceptance) + '</p></div>');
    var f = [];
    f.push('<span>' + u('group') + ': ' + esc(e.group[st.lang]) + '</span>');
    if (e.module) f.push('<span>' + u('module') + ': ' + esc(e.module[st.lang]) + '</span>');
    if (e.ref) f.push('<span>' + u('ref') + ': ' + esc(e.ref) + '</span>');
    if (e.depends) f.push('<span>' + u('depends') + ': ' + rich(e.depends) + '</span>');
    if (e.effort) f.push('<span>' + u('effort') + ': ' + esc(e.effort) + '</span>');
    if (e.found_by) f.push('<span>' + u('found_by') + ': ' + esc(e.found_by[st.lang]) + '</span>');
    f.push('<span>' + u('source') + ': <code>' + esc(e.source) + '</code></span>');
    b.push('<div class="facts">' + f.join('') + '</div>');
    return '<article class="' + e.type + '" id="' + e.id + '"><details><summary>' +
      '<div class="meta"><span class="id">' + e.id + '</span><span class="tag st-' + e.status + '">' + esc(LB.status[e.status][st.lang]) + '</span>' +
      '<span>' + esc(LB.type[e.type][st.lang]) + '</span><span class="pr pr-' + prioKey(e) + '">' + esc(LB.priority[prioKey(e)][st.lang]) + '</span>' +
      '<span>' + date(e) + '</span><span class="chev" aria-hidden="true">▾</span></div>' +
      '<div class="ttl">' + rich(t.title) + '</div></summary><div class="body">' + b.join('') + '</div></details></article>';
  }
  var listEl = document.getElementById('list');
  function render() {
    document.documentElement.lang = st.lang;
    document.title = D.title[st.lang];
    document.getElementById('h1').textContent = u('title');
    document.getElementById('lead').textContent = u('lead');
    document.getElementById('back').textContent = u('back');
    document.getElementById('cnt-h').textContent = u('counts');
    document.getElementById('l-q').textContent = u('search').replace(/…$/, '').split(' ')[0];
    document.getElementById('q').placeholder = u('search');
    document.getElementById('q').value = st.q;
    document.getElementById('l-status').textContent = u('status');
    document.getElementById('l-type').textContent = u('type');
    document.getElementById('l-prio').textContent = u('priority');
    document.getElementById('exp').textContent = u('expand');
    document.getElementById('col').textContent = u('collapse');
    document.getElementById('prn').textContent = u('print');
    document.getElementById('foot').textContent = u('order') + ' · ' + u('generated') + ' · scripts/build_change_register.py';
    var sk = Object.keys(LB.status).filter(function (k) { return E.some(function (e) { return e.status === k; }); });
    opts(document.getElementById('f-status'), [['', u('all')]].concat(sk.map(function (k) { return [k, LB.status[k][st.lang]]; })), st.status);
    opts(document.getElementById('f-type'), [['', u('all')], ['FR', LB.type.FR[st.lang]], ['bug', LB.type.bug[st.lang]]], st.type);
    opts(document.getElementById('f-prio'), [['', u('all')]].concat(['critical', 'high', 'medium', 'low', 'none'].map(function (k) { return [k, LB.priority[k][st.lang]]; })), st.prio);
    document.getElementById('counts').innerHTML = sk.map(function (k) {
      var n = E.filter(function (e) { return e.status === k; }).length;
      return '<button data-s="' + k + '" aria-pressed="' + (st.status === k) + '"><span class="tag st-' + k + '">' + esc(LB.status[k][st.lang]) + '</span><b>' + n + '</b></button>';
    }).join('');
    document.querySelectorAll('#langs button').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.l === st.lang); });
    listEl.innerHTML = E.map(card).join('');
    filter();
  }
  function filter() {
    var q = st.q.trim().toLowerCase(), n = 0;
    E.forEach(function (e) {
      var ok = (!st.status || e.status === st.status) && (!st.type || e.type === st.type) && (!st.prio || prioKey(e) === st.prio) && (!q || hay(e).indexOf(q) >= 0);
      document.getElementById(e.id).hidden = !ok; if (ok) n++;
    });
    document.getElementById('shown').textContent = n + ' ' + u('of') + ' ' + E.length + ' ' + u('shown');
    var old = listEl.querySelector('.empty'); if (old) old.remove();
    if (!n) listEl.insertAdjacentHTML('beforeend', '<div class="empty">' + u('none') + '</div>');
    document.querySelectorAll('#counts button').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.s === st.status); });
    var p = new URLSearchParams(); p.set('lang', st.lang);
    ['q', 'status', 'type', 'prio'].forEach(function (k) { if (st[k]) p.set(k, st[k]); });
    history.replaceState(null, '', '#' + p.toString());
  }
  document.getElementById('langs').addEventListener('click', function (ev) { var l = ev.target.dataset && ev.target.dataset.l; if (l) { st.lang = l; store('cr-lang', l); render(); } });
  document.getElementById('q').addEventListener('input', function (ev) { st.q = ev.target.value; filter(); });
  document.getElementById('f-status').addEventListener('change', function (ev) { st.status = ev.target.value; filter(); });
  document.getElementById('f-type').addEventListener('change', function (ev) { st.type = ev.target.value; filter(); });
  document.getElementById('f-prio').addEventListener('change', function (ev) { st.prio = ev.target.value; filter(); });
  document.getElementById('counts').addEventListener('click', function (ev) { var b = ev.target.closest('button'); if (!b) return; st.status = st.status === b.dataset.s ? '' : b.dataset.s; document.getElementById('f-status').value = st.status; filter(); });
  function all(open) { listEl.querySelectorAll('details').forEach(function (d) { d.open = open; }); }
  document.getElementById('exp').onclick = function () { all(true); };
  document.getElementById('col').onclick = function () { all(false); };
  document.getElementById('prn').onclick = function () { window.print(); };
  window.addEventListener('beforeprint', function () { all(true); });
  function theme(t) { if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t);
    document.querySelectorAll('#themes button').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.t === t); }); }
  var th = read('cr-theme') || 'auto'; theme(th);
  document.getElementById('themes').addEventListener('click', function (ev) { var t = ev.target.dataset && ev.target.dataset.t; if (t) { theme(t); store('cr-theme', t === 'auto' ? null : t); } });
  document.querySelectorAll('#themes button').forEach(function (b) { b.title = b.dataset.t; b.setAttribute('aria-label', b.dataset.t); });
  render();
  if (/^#(FR|B|BUG)-\d+$/.test(hash0)) { var a = document.getElementById(hash0.slice(1)); if (a) { a.querySelector('details').open = true; a.scrollIntoView(); } }
})();
</script>
