echnung für jede Tour und jedes Fahrzeug","finding":"Die Ladeberechnung existiert nur im Browser und ist auf R-106 mit V02 fixiert: `loadCalc` (shared.ts:43-50), das Standardprofil (trucks.ts:74-76), die Kapazitätsprüfung nur für R-106 (dispatch.ts:50,88-89), `LOAD_TRIP` (load.py:117), und `dispatch.assign` zielt immer auf R-106 und nur Astana-Aufträge (dispatch.py:87-99, dispatch.ts:96). Das serverseitige `load.plan` speichert einen Fahrzeugtyp ohne Passprüfung (load.py:206-258), und `_attach_orders` prüft nur Gesamt-kg und Paletten, ohne Kammern, m³ und Achslasten (operations.py:367-372).","change":"`loadCalc` und `vehicleMatch` nach `app/loadcalc.py` portieren, parametrisiert durch die Aufträge der Tour und ein Fahrzeugprofil (trucks.json + neue Vehicle-Felder: Zonen, Palettenplätze je Kammer, Thermocontainer-Plätze, Achsmodell). Nutzung in `assign_orders`, `load.plan` und im Freigabe-Gate. `GET /api/trips/{id}/load`, das der Bildschirm darstellt.","acceptance":"(1) Ein Golden-Test für R-106/V02 reproduziert die v5.2-Werte (Balken, Achslasten, Warnungen). (2) Zuordnung eines Auftrags, der Zone 1 überlädt → 409. (3) `load.plan` mit nicht passendem Typ → 409, außer erzwungen mit Begründung. (4) Funktioniert für jede DB-Tour."},"ru":{"title":"Серверный расчёт загрузки для любого рейса и ТС","finding":"Расчёт загрузки существует только в браузере и привязан к R-106 на V02: `loadCalc` (shared.ts:43-50), профиль по умолчанию (trucks.ts:74-76), проверка вместимости только для R-106 (dispatch.ts:50,88-89), `LOAD_TRIP` (load.py:117), а `dispatch.assign` всегда целит в R-106 и только заказы Астаны (dispatch.py:87-99, dispatch.ts:96). Серверный `load.plan` сохраняет тип ТС без проверки размещения (load.py:206-258), а `_attach_orders` проверяет только общий вес и паллеты, игнорируя камеры, м³ и нагрузки на оси (operations.py:367-372).","change":"Перенести `loadCalc` и `vehicleMatch` в `app/loadcalc.py` с параметрами — заказы рейса и профиль ТС (trucks.json + новые поля Vehicle: зоны, паллетоместа по камерам, места термоконтейнеров, модель осей). Использовать в `assign_orders`, `load.plan` и контроле выпуска. Добавить `GET /api/trips/{id}/load`, который отображает экран.","acceptance":"(1) Эталонный тест для R-106/V02 воспроизводит значения v5.2 (полосы, нагрузки на оси, предупреждения). (2) Назначение заказа, перегружающего зону 1 → 409. (3) `load.plan` с неподходящим типом → 409, если не форсировано с причиной. (4) Работает для любого рейса БД."}},{"id":"FR-98","type":"FR","date":"2026-10-11","priority":"high","status":"implemented","group":{"en":"Trip flow, dispatch & Go/No-Go release","de":"Tourablauf, Disposition & Go/No-Go-Freigabe","ru":"Процесс рейса, диспетчеризация и выпуск Go/No-Go"},"depends":"FR-73, FR-107","effort":"M","source":"docs/CHANGE-REQUESTS.md","en":{"title":"Complete the missing state transitions","finding":"`OrderStatus.loaded` is never set: loading maps to `planned` (models.py:65, operations.py:318-323). `StopStatus.arrived` is never set and there is no arrival endpoint (models.py:81). There is no partial, refused or returned delivery. A trip in transit can only go to delivered (operations.py:314), so an accident, breakdown with transfer, or total temperature loss cannot be modelled.","change":"Order statuses: loaded (all packages scanned at loading), partially_delivered, refused, returned, handed_over. Add a stop `arrive` endpoint with `arrived_at` (dwell time, warehouse window 9–17). Add trip `aborted` from in_transit, with a reason and a mandatory alarm/deviation link. Remaining orders return to `new` or transfer to a rescue trip. One transition table is shared by the API and v5.","acceptance":"A parametrised transition-matrix test covers every allowed and forbidden pair (409). Arrival time is stored and shown. An aborted trip returns its undelivered orders to `new` with a webhook."},"de":{"title":"Fehlende Statusübergänge vervollständigen","finding":"`OrderStatus.loaded` wird nie gesetzt: Beladung wird auf `planned` abgebildet (models.py:65, operations.py:318-323). `StopStatus.arrived` wird nie gesetzt, und es gibt keinen Ankunfts-Endpunkt (models.py:81). Es gibt keine Teil-, verweigerte oder Rückzustellung. Eine Tour unterwegs kann nur zu delivered wechseln (operations.py:314), sodass Unfall, Panne mit Umladung oder totaler Temperaturverlust nicht abbildbar sind.","change":"Auftragsstatus: loaded (alle Packstücke bei Beladung gescannt), partially_delivered, refused, returned, handed_over. Stopp-Endpunkt `arrive` mit `arrived_at` (Standzeit, Lagerfenster 9–17). Tourstatus `aborted` aus in_transit mit Grund und Pflichtverknüpfung zu Alarm/Abweichung. Restaufträge gehen zurück auf `new` oder auf eine Ersatztour. Eine gemeinsame Übergangstabelle für API und v5.","acceptance":"Ein parametrisierter Test der Übergangsmatrix deckt jedes erlaubte und verbotene Paar ab (409). Die Ankunftszeit wird gespeichert und angezeigt. Eine abgebrochene Tour setzt ihre nicht zugestellten Aufträge mit Webhook auf `new` zurück."},"ru":{"title":"Дополнить недостающие переходы статусов","finding":"`OrderStatus.loaded` никогда не устанавливается: погрузка отображается в `planned` (models.py:65, operations.py:318-323). `StopStatus.arrived` никогда не устанавливается, эндпоинта прибытия нет (models.py:81). Нет частичной доставки, отказа и возврата. Рейс в пути может перейти только в delivered (operations.py:314), поэтому ДТП, поломку с перегрузкой или полную потерю температуры смоделировать нельзя.","change":"Статусы заказа: loaded (все места отсканированы при погрузке), partially_delivered, refused, returned, handed_over. Эндпоинт точки `arrive` с `arrived_at` (время простоя, окно склада 9–17). Статус рейса `aborted` из in_transit с причиной и обязательной ссылкой на тревогу/отклонение. Оставшиеся заказы возвращаются в `new` или переходят на спасательный рейс. Одна таблица переходов для API и v5.","acceptance":"Параметризованный тест матрицы переходов покрывает каждую разрешённую и запрещённую пару (409). Время прибытия сохраняется и отображается. Прерванный рейс возвращает недоставленные заказы в `new` с вебхуком."}},{"id":"FR-97","type":"FR","date":"2026-10-11","priority":"medium","status":"implemented","group":{"en":"Trip flow, dispatch & Go/No-Go release","de":"Tourablauf, Disposition & Go/No-Go-Freigabe","ru":"Процесс рейса, диспетчеризация и выпуск Go/No-Go"},"depends":"FR-96","effort":"M","source":"docs/CHANGE-REQUESTS.md","en":{"title":"Departure exceptions and one booking horizon","finding":"Slots are listed for 14 days (booking.py:57,65), but bookings are accepted up to 21 days (booking.py:104). Holidays or cancelled departures cannot be expressed, so the portal and partner API sell departures that will not run. `confirm()` does not re-check that the line is still active or still serves the destination (booking.py:140-142).","change":"Add a `schedule_exceptions` table (date, cancelled/extra, reason) used by `slots()` and `create_booking`. Use one horizon constant in both. `confirm()` re-validates line, class and destination. Cancelling a departure notifies its bookings via webhook and lists them on the desk.","acceptance":"(1) A booking for a cancelled date → 409. (2) Listing and creation accept the same date range. (3) A test cancels a departure that has bookings → one `booking.departure_cancelled` webhook per booking."},"de":{"title":"Abfahrtsausnahmen und ein einheitlicher Buchungshorizont","finding":"Slots werden für 14 Tage angezeigt (booking.py:57,65), Buchungen aber bis 21 Tage angenommen (booking.py:104). Feiertage oder ausgefallene Abfahrten sind nicht abbildbar, sodass Portal und Partner-API Abfahrten verkaufen, die nicht stattfinden. `confirm()` prüft nicht erneut, ob die Linie noch aktiv ist und das Ziel noch bedient (booking.py:140-142).","change":"Tabelle `schedule_exceptions` (Datum, ausgefallen/zusätzlich, Grund), genutzt von `slots()` und `create_booking`. Eine Horizontkonstante für beide. `confirm()` validiert Linie, Klasse und Ziel erneut. Der Ausfall einer Abfahrt benachrichtigt deren Buchungen per Webhook und listet sie am Desk.","acceptance":"(1) Buchung für ein ausgefallenes Datum → 409. (2) Anzeige und Anlage akzeptieren denselben Datumsbereich. (3) Ein Test storniert eine Abfahrt mit Buchungen → je Buchung ein Webhook `booking.departure_cancelled`."},"ru":{"title":"Исключения по отправлениям и единый горизонт бронирования","finding":"Слоты показываются на 14 дней (booking.py:57,65), а бронирования принимаются до 21 дня (booking.py:104). Праздники и отменённые отправления выразить нельзя, поэтому портал и партнёрский API продают отправления, которые не состоятся. `confirm()` не перепроверяет, активна ли линия и обслуживает ли она ещё пункт назначения (booking.py:140-142).","change":"Таблица `schedule_exceptions` (дата, отменено/дополнительно, причина), используемая `slots()` и `create_booking`. Одна константа горизонта для обоих. `confirm()` повторно проверяет линию, класс и пункт назначения. Отмена отправления уведомляет его бронирования вебхуком и выводит их на стойке.","acceptance":"(1) Бронирование на отменённую дату → 409. (2) Список и создание принимают одинаковый диапазон дат. (3) Тест отменяет отправление с бронированиями → по одному вебхуку `booking.departure_cancelled` на бронирование."}},{"id":"FR-96","type":"FR","date":"2026-10-11","priority":"high","status":"implemented","group":{"en":"Trip flow, dispatch & Go/No-Go release","de":"Tourablauf, Disposition & Go/No-Go-Freigabe","ru":"Процесс рейса, диспетчеризация и выпуск Go/No-Go"},"depends":"FR-93, FR-94","effort":"M","source":"docs/CHANGE-REQUESTS.md","en":{"title":"Carry the booked departure into the order and plan trips per departure","finding":"`confirm()` creates an order without line or departure date (booking.py:143-145), and `Order` has no field for them (models.py:231-249), so dispatch cannot see which departure the customer booked. Line capacity (`Schedule.pallets_capacity`, models.py:433) is independent of the vehicle actually assigned, and weight is never checked against the line.","change":"Add `Order.schedule_id`, `departure_date` and `booking_id`. In Dispatch, add \"Create trip for departure\": it pre-fills the hub, all confirmed orders of that line and date, and the planned departure from the schedule time. Add `Schedule.capacity_kg`, checked in `create_booking`. Warn when booked pallets exceed the assigned vehicle's pallets.","acceptance":"(1) A confirmed booking's order has the departure. (2) `GET /api/orders?schedule_id=&departure_date=` returns those orders. (3) One click creates a trip with exactly those orders. (4) A booking over the line's kg limit → 409."},"de":{"title":"Gebuchte Abfahrt in den Auftrag übernehmen und Touren je Abfahrt planen","finding":"`confirm()` legt einen Auftrag ohne Linie oder Abfahrtsdatum an (booking.py:143-145), und `Order` hat dafür kein Feld (models.py:231-249), sodass die Disposition nicht sieht, welche Abfahrt der Kunde gebucht hat. Die Linienkapazität (`Schedule.pallets_capacity`, models.py:433) ist unabhängig vom tatsächlich zugeordneten Fahrzeug, und das Gewicht wird nie gegen die Linie geprüft.","change":"`Order.schedule_id`, `departure_date` und `booking_id` ergänzen. In der Disposition „Tour für Abfahrt anlegen“: füllt Hub, alle bestätigten Aufträge dieser Linie und dieses Datums und die geplante Abfahrt aus der Fahrplanzeit vor. `Schedule.capacity_kg` ergänzen, geprüft in `create_booking`. Warnung, wenn gebuchte Paletten die Paletten des zugeordneten Fahrzeugs übersteigen.","acceptance":"(1) Der Auftrag einer bestätigten Buchung trägt die Abfahrt. (2) `GET /api/orders?schedule_id=&departure_date=` liefert diese Aufträge. (3) Ein Klick legt eine Tour mit genau diesen Aufträgen an. (4) Eine Buchung über dem kg-Limit der Linie → 409."},"ru":{"title":"Переносить забронированный рейс по графику в заказ и планировать рейсы по отправлениям","finding":"`confirm()` создаёт заказ без линии и даты отправления (booking.py:143-145), а у `Order` нет для них поля (models.py:231-249), поэтому диспетчер не видит, какое отправление забронировал клиент. Мощность линии (`Schedule.pallets_capacity`, models.py:433) не зависит от фактически назначенного ТС, а вес никогда не проверяется по линии.","change":"Добавить `Order.schedule_id`, `departure_date` и `booking_id`. В «Диспетчере» — «Создать рейс на отправление»: подставляет хаб, все подтверждённые заказы этой линии и даты и плановый выезд по времени графика. Добавить `Schedule.capacity_kg` с проверкой в `create_booking`. Предупреждение, если забронированные паллеты превышают паллеты назначенного ТС.","acceptance":"(1) Заказ подтверждённого бронирования содержит отправление. (2) `GET /api/orders?schedule_id=&departure_date=` возвращает эти заказы. (3) Один клик создаёт рейс ровно с этими заказами. (4) Бронирование сверх лимита кг линии → 409."}},{"id":"FR-95","type":"FR","date":"2026-10-11","priority":"high","status":"implemented","group":{"en":"Trip flow, dispatch & Go/No-Go release","de":"Tourablauf, Disposition & Go/No-Go-Freigabe","ru":"Процесс рейса, диспетчеризация и выпуск Go/No-Go"},"depends":"FR-96","effort":"S","source":"docs/CHANGE-REQUESTS.md","en":{"title":"Make order cancellation consistent with the stop and the booking","finding":"`cancel_order` sets `trip_id=None` but leaves the `TripStop` (operations.py:254-266). The trip can then never close, because every stop must be delivered (operations.py:429-430,476). The linked booking stays `confirmed` and still counts as booked capacity (booking.py:30,50-54). The customer gets no webhook. Dispatch has no endpoint to cancel a confirmed booking.","change":"On cancel: remove the stop if no other order for that site remains on the trip; set the linked booking to `cancelled` with a reason (new transition confirmed→cancelled, desk endpoint `POST /api/bookings/{n}/cancel`); emit `booking.cancelled` and `shipment.cancelled`.","acceptance":"(1) After cancelling a planned order, its stop is gone and the trip can be delivered. (2) The line's free capacity rises by the order's pallets. (3) One webhook per event is in the outbox."},"de":{"title":"Auftragsstornierung konsistent mit Stopp und Buchung machen","finding":"`cancel_order` setzt `trip_id=None`, lässt aber den `TripStop` bestehen (operations.py:254-266). Die Tour kann dann nie abgeschlossen werden, weil jeder Stopp zugestellt sein muss (operations.py:429-430,476). Die verknüpfte Buchung bleibt `confirmed` und zählt weiter als gebuchte Kapazität (booking.py:30,50-54). Der Kunde erhält keinen Webhook. Die Disposition hat keinen Endpunkt, um eine bestätigte Buchung zu stornieren.","change":"Beim Stornieren: Stopp entfernen, wenn kein anderer Auftrag für diesen Ort auf der Tour bleibt; verknüpfte Buchung mit Grund auf `cancelled` setzen (neuer Übergang confirmed→cancelled, Desk-Endpunkt `POST /api/bookings/{n}/cancel`); `booking.cancelled` und `shipment.cancelled` senden.","acceptance":"(1) Nach Stornierung eines geplanten Auftrags ist sein Stopp entfernt und die Tour kann zugestellt werden. (2) Die freie Kapazität der Linie steigt um die Paletten des Auftrags. (3) Je Ereignis liegt genau ein Webhook im Outbox."},"ru":{"title":"Согласованная отмена заказа с точкой и бронированием","finding":"`cancel_order` устанавливает `trip_id=None`, но оставляет `TripStop` (operations.py:254-266). Рейс после этого нельзя закрыть, потому что каждая точка должна быть доставлена (operations.py:429-430,476). Связанное бронирование остаётся `confirmed` и продолжает занимать мощность (booking.py:30,50-54). Клиент не получает вебхук. У диспетчерской нет эндпоинта для отмены подтверждённого бронирования.","change":"При отмене: удалять точку, если по этому адресу в рейсе не осталось других заказов; переводить связанное бронирование в `cancelled` с причиной (новый переход confirmed→cancelled, эндпоинт стойки `POST /api/bookings/{n}/cancel`); отправлять `booking.cancelled` и `shipment.cancelled`.","acceptance":"(1) После отмены запланированного заказа его точка удалена, рейс можно доставить. (2) Свободная мощность линии растёт на паллеты заказа. (3) В outbox по одному вебхуку на событие."}},{"id":"FR-94","type":"FR","date":"2026-10-11","priority":"high","status":"implemented","group":{"en":"Trip flow, dispatch & Go/No-Go release","de":"Tourablauf, Disposition & Go/No-Go-Freigabe","ru":"Процесс рейса, диспетчеризация и выпуск Go/No-Go"},"depends":"FR-71, FR-93","effort":"M","source":"docs/CHANGE-REQUESTS.md","en":{"title":"Edit, replan and unassign on existing trips","finding":"After creation, trips cannot be changed: the router has only create, assign, status and deliver (operations.py:382-484). There is no way to change vehicle, driver or times, remove an order, or reorder stops. The v5 replan works only for R-106 and only to day index 4 (dispatch.py:16,67-84), and the result is a hard-coded display string `'10.10 · 06:00'` (shared.ts:280-284).","change":"Add `PATCH /api/trips/{id}` (vehicle, driver, planned_departure, eta, note) in planning/loading, re-running capacity and A06 checks. Add `DELETE /api/trips/{id}/orders/{oid}` (order → new; the stop is removed if no other order for that site remains). Add `PUT /api/trips/{id}/stops` to resequence. Generalise `dispatch.replan`: any trip, a new departure datetime, a reason (weather/road/vehicle/customer), writes `Trip.planned_departure`/`eta`. Emit `shipment.status_changed` / eta change.","acceptance":"(1) Replanning a DB trip changes `planned_departure` in the DB, and Dispatcher and the tracking ETA show the new time. (2) Unassigning the last order of a site removes its stop. (3) Every edit is audited. (4) Edits are refused once in_transit (409)."},"de":{"title":"Bestehende Touren bearbeiten, umplanen und Zuordnungen lösen","finding":"Nach dem Anlegen können Touren nicht geändert werden: der Router kennt nur create, assign, status und deliver (operations.py:382-484). Fahrzeug, Fahrer oder Zeiten lassen sich nicht ändern, kein Auftrag entfernen, keine Stopps umsortieren. Die v5-Umplanung funktioniert nur für R-106 und nur bis Tagesindex 4 (dispatch.py:16,67-84), und das Ergebnis ist ein fest codierter Anzeigetext `'10.10 · 06:00'` (shared.ts:280-284).","change":"`PATCH /api/trips/{id}` (Fahrzeug, Fahrer, planned_departure, eta, Notiz) in planning/loading, mit erneuter Kapazitäts- und A06-Prüfung. `DELETE /api/trips/{id}/orders/{oid}` (Auftrag → neu; der Stopp entfällt, wenn kein anderer Auftrag für diesen Ort bleibt). `PUT /api/trips/{id}/stops` zum Umsortieren. `dispatch.replan` verallgemeinern: beliebige Tour, neuer Abfahrtszeitpunkt, Grund (Wetter/Straße/Fahrzeug/Kunde), schreibt `Trip.planned_departure`/`eta`. `shipment.status_changed` / ETA-Änderung senden.","acceptance":"(1) Umplanen einer DB-Tour ändert `planned_departure` in der DB, Disponent und Tracking-ETA zeigen die neue Zeit. (2) Lösen des letzten Auftrags eines Ortes entfernt dessen Stopp. (3) Jede Änderung wird auditiert. (4) Änderungen werden ab in_transit abgelehnt (409)."},"ru":{"title":"Редактирование, перепланирование и снятие назначений в существующих рейсах","finding":"После создания рейс нельзя изменить: в маршрутизаторе есть только create, assign, status и deliver (operations.py:382-484). Нельзя сменить ТС, водителя или время, убрать заказ или переставить точки. Перепланирование v5 работает только для R-106 и только до индекса дня 4 (dispatch.py:16,67-84), а результат — жёстко заданная строка `'10.10 · 06:00'` (shared.ts:280-284).","change":"Добавить `PATCH /api/trips/{id}` (ТС, водитель, planned_departure, eta, примечание) в статусах planning/loading с повторной проверкой вместимости и A06. Добавить `DELETE /api/trips/{id}/orders/{oid}` (заказ → новый; точка удаляется, если по этому адресу не осталось других заказов). Добавить `PUT /api/trips/{id}/stops` для изменения порядка. Обобщить `dispatch.replan`: любой рейс, новая дата и время выезда, причина (погода/дорога/ТС/клиент), запись `Trip.planned_departure`/`eta`. Отправлять `shipment.status_changed` / изменение ETA.","acceptance":"(1) Перепланирование рейса БД меняет `planned_departure` в БД, «Диспетчер» и ETA в трекинге показывают новое время. (2) Снятие последнего заказа по адресу удаляет его точку. (3) Каждое изменение аудируется. (4) После in_transit изменения отклоняются (409)."}},{"id":"FR-93","type":"FR","date":"2026-10-11","priority":"high","status":"implemented","group":{"en":"Trip flow, dispatch & Go/No-Go release","de":"Tourablauf, Disposition & Go/No-Go-Freigabe","ru":"Процесс рейса, диспетчеризация и выпуск Go/No-Go"},"depends":"FR-73, FR-94","effort":"M","source":"docs/CHANGE-REQUESTS.md","en":{"title":"Server-side resource validation and double-booking check","finding":"`create_trip` checks only that vehicle and driver belong to the hub (operations.py:387-391). The UI filters out vehicles not `active` and inactive drivers (Operations.tsx:83,91), but the API does not, so a crafted request is accepted. Neither side prevents the same vehicle or driver being on two overlapping trips, or an ADR order going to a driver without a valid ADR certificate.","change":"In create, assign and the new PATCH (A07), reject: `vehicle.status ≠ active`; driver inactive or licence expiring before the ETA; ADR orders when `adr_until` is before the ETA; overlap of [planned_departure, eta] with another non-cancelled, non-delivered trip of the same vehicle or driver. Errors return 409 with a reason code.","acceptance":"API tests return 409 for: maintenance vehicle, inactive driver, expired licence, ADR mismatch, overlapping vehicle, overlapping driver. The UI shows the server message."},"de":{"title":"Serverseitige Ressourcenprüfung und Doppelbuchungsprüfung","finding":"`create_trip` prüft nur, dass Fahrzeug und Fahrer zum Hub gehören (operations.py:387-391). Die UI blendet nicht `active` Fahrzeuge und inaktive Fahrer aus (Operations.tsx:83,91), die API jedoch nicht, sodass eine manipulierte Anfrage angenommen wird. Keine Seite verhindert, dass dasselbe Fahrzeug oder derselbe Fahrer auf zwei überlappenden Touren ist oder ein ADR-Auftrag an einen Fahrer ohne gültige ADR-Bescheinigung geht.","change":"In create, assign und dem neuen PATCH (A07) abweisen: `vehicle.status ≠ active`; Fahrer inaktiv oder Führerschein läuft vor der ETA ab; ADR-Aufträge, wenn `adr_until` vor der ETA liegt; Überlappung von [planned_departure, eta] mit einer anderen nicht stornierten, nicht zugestellten Tour desselben Fahrzeugs oder Fahrers. Fehler liefern 409 mit Grundcode.","acceptance":"API-Tests liefern 409 für: Fahrzeug in Wartung, inaktiver Fahrer, abgelaufener Führerschein, ADR-Konflikt, überlappendes Fahrzeug, überlappender Fahrer. Die UI zeigt die Servermeldung."},"ru":{"title":"Серверная проверка ресурсов и двойного назначения","finding":"`create_trip` проверяет только принадлежность ТС и водителя хабу (operations.py:387-391). UI скрывает ТС не в статусе `active` и неактивных водителей (Operations.tsx:83,91), а API — нет, поэтому подделанный запрос принимается. Ни одна сторона не мешает поставить одно ТС или одного водителя на два пересекающихся рейса или отдать заказ ДОПОГ водителю без действующего свидетельства ДОПОГ.","change":"В create, assign и новом PATCH (A07) отклонять: `vehicle.status ≠ active`; водитель неактивен или права истекают до ETA; заказы ДОПОГ, если `adr_until` раньше ETA; пересечение [planned_departure, eta] с другим неотменённым и недоставленным рейсом того же ТС или водителя. Ошибки возвращают 409 с кодом причины.","acceptance":"API-тесты возвращают 409 для: ТС на ТО, неактивный водитель, истёкшие права, несоответствие ДОПОГ, пересечение по ТС, пересечение по водителю. UI показывает сообщение сервера."}},{"id":"FR-92","type":"FR","date":"2026-10-11","priority":"critical","status":"implemented","group":{"en":"Trip flow, dispatch & Go/No-Go release","de":"Tourablauf, Disposition & Go/No-Go-Freigabe","ru":"Процесс рейса, диспетчеризация и выпуск Go/No-Go"},"depends":"FR-71, FR-73","effort":"M","source":"docs/CHANGE-REQUESTS.md","en":{"title":"Replace hard-coded and text-based release gates with data checks","finding":"Several gates do not check real data: \"Driver qualified\" is always `True` (docs.py:138); \"Suitable for temperature class\" only checks `veh.thermo`, not the orders' classes (docs.py:137); every document of a trip not in `plan` counts as ready (docs.py:128); logger calibration is a regex on localised text (docs.py:33,132); ADR and reconciliation are evaluated only for R-106 (docs.py:98,141,143). Document status lives in `doc[\"docs\"]/[\"docSt\"]` (docs.py:123-129,185-209), which duplicates the `state_document` table (INTEGRATIONS.md \"State documents\").","change":"Gates computed from the DB: (a) driver active, `license_until` and `adr_until` on or after the trip ETA date, medcheck document present; (b) every order class contained in `vehicle.temp_classes`; (c) the logger calibration date stored as a date column; (d) ADR and reconciliation evaluated for every trip; (e) \"documents complete\" read from `state_document` rows (TTN, trip sheet, ESF/SNT where a third party is involved). Remove the v5 `docSt` duplicate.","acceptance":"One failing fixture per gate (expired licence, frozen order on an isothermal vehicle, expired logger date, ADR order with a non-ADR driver, missing TTN) → `docs.release` returns 409 naming exactly that gate. All gates green → 200."},"de":{"title":"Fest codierte und textbasierte Freigabe-Gates durch Datenprüfungen ersetzen","finding":"Mehrere Gates prüfen keine echten Daten: „Fahrer qualifiziert“ ist immer `True` (docs.py:138); „Geeignet für Temperaturklasse“ prüft nur `veh.thermo`, nicht die Klassen der Aufträge (docs.py:137); jedes Dokument einer Tour, das nicht in `plan` steht, gilt als fertig (docs.py:128); die Logger-Kalibrierung ist ein Regex auf lokalisiertem Text (docs.py:33,132); ADR und Abgleich werden nur für R-106 bewertet (docs.py:98,141,143). Der Dokumentstatus liegt in `doc[\"docs\"]/[\"docSt\"]` (docs.py:123-129,185-209) und dupliziert die Tabelle `state_document` (INTEGRATIONS.md „State documents“).","change":"Gates aus der DB berechnen: (a) Fahrer aktiv, `license_until` und `adr_until` am oder nach dem ETA-Datum der Tour, Medizincheck-Dokument vorhanden; (b) jede Auftragsklasse in `vehicle.temp_classes` enthalten; (c) Logger-Kalibrierdatum als Datumsspalte gespeichert; (d) ADR und Abgleich für jede Tour bewertet; (e) „Dokumente vollständig“ aus Zeilen von `state_document` gelesen (TTN, Fahrtenblatt, ESF/SNT bei Beteiligung Dritter). Das v5-Duplikat `docSt` entfernen.","acceptance":"Je Gate eine fehlschlagende Fixture (abgelaufener Führerschein, TK-Auftrag auf Isotherm-Fahrzeug, abgelaufenes Logger-Datum, ADR-Auftrag mit Fahrer ohne ADR, fehlende TTN) → `docs.release` liefert 409 und nennt genau dieses Gate. Alle Gates grün → 200."},"ru":{"title":"Заменить жёстко заданные и текстовые контроли выпуска проверками данных","finding":"Ряд контролей не проверяет реальные данные: «Водитель допущен» всегда `True` (docs.py:138); «Подходит для температурного класса» проверяет только `veh.thermo`, а не классы заказов (docs.py:137); любой документ рейса не в `plan` считается готовым (docs.py:128); калибровка логгера — регулярное выражение по локализованному тексту (docs.py:33,132); ДОПОГ и сверка оцениваются только для R-106 (docs.py:98,141,143). Статус документов хранится в `doc[\"docs\"]/[\"docSt\"]` (docs.py:123-129,185-209) и дублирует таблицу `state_document` (INTEGRATIONS.md «State documents»).","change":"Контроли вычисляются из БД: (a) водитель активен, `license_until` и `adr_until` не раньше даты ETA рейса, есть документ медосмотра; (b) каждый класс заказа входит в `vehicle.temp_classes`; (c) дата калибровки логгера хранится в колонке даты; (d) ДОПОГ и сверка оцениваются для каждого рейса; (e) «документы комплектны» читается из строк `state_document` (ТТН, путевой лист, ЭСФ/СНТ при участии третьей стороны). Удалить дубликат v5 `docSt`.","acceptance":"По одной проваливающейся фикстуре на контроль (истёкшие права, заказ заморозки на изотермическом ТС, истёкшая дата логгера, заказ ДОПОГ с водителем без ДОПОГ, нет ТТН) → `docs.release` возвращает 409 с указанием именно этого контроля. Все контроли зелёные → 200."}},{"id":"FR-91","type":"FR","date":"2026-10-11","priority":"critical","status":"implemented","group":{"en":"Trip flow, dispatch & Go/No-Go release","de":"Tourablauf, Disposition & Go/No-Go-Freigabe","ru":"Процесс рейса, диспетчеризация и выпуск Go/No-Go"},"depends":"FR-71, FR-92","effort":"M","source":"docs/CHANGE-REQUESTS.md","en":{"title":"Enforce Go/No-Go release on the real departure transition","finding":"`set_trip_status` lets a trip go `loading → in_transit` once a vehicle and driver are set (operations.py:421-432). The Go/No-Go release only writes `doc[\"released\"]` (docs.py:212-222), works only for reference trips, and cannot be revoked if a gate later turns red (for example a new critical alarm).","change":"Transition to `in_transit` requires a valid release, and the server re-evaluates all gates at transition time. Add an override permission (`trips:override_release`) that needs a reason of at least 10 characters and is audited with the list of failed gates. Add a `docs.revoke` action, triggered automatically when a gate turns critical before departure.","acceptance":"(1) in_transit without release → 409 naming the failed gates. (2) With release → 200. (3) Override without the permission → 403; with the permission → 200 plus an audit entry `trip.release_override` containing the gates. (4) A new critical alarm on a released, not-yet-departed trip resets the release."},"de":{"title":"Go/No-Go-Freigabe beim echten Abfahrtsübergang erzwingen","finding":"`set_trip_status` lässt eine Tour von `loading → in_transit` wechseln, sobald Fahrzeug und Fahrer gesetzt sind (operations.py:421-432). Die Go/No-Go-Freigabe schreibt nur `doc[\"released\"]` (docs.py:212-222), funktioniert nur für Referenztouren und kann nicht widerrufen werden, wenn ein Gate später rot wird (z. B. neuer kritischer Alarm).","change":"Der Übergang zu `in_transit` erfordert eine gültige Freigabe, und der Server bewertet alle Gates im Moment des Übergangs neu. Übersteuerungsrecht (`trips:override_release`) mit Begründung von mindestens 10 Zeichen, auditiert mit der Liste der fehlgeschlagenen Gates. Aktion `docs.revoke`, automatisch ausgelöst, wenn ein Gate vor Abfahrt kritisch wird.","acceptance":"(1) in_transit ohne Freigabe → 409 mit Nennung der fehlgeschlagenen Gates. (2) Mit Freigabe → 200. (3) Übersteuerung ohne Recht → 403; mit Recht → 200 plus Audit-Eintrag `trip.release_override` mit den Gates. (4) Ein neuer kritischer Alarm auf einer freigegebenen, noch nicht abgefahrenen Tour setzt die Freigabe zurück."},"ru":{"title":"Обязательный выпуск Go/No-Go при реальном переходе к отправлению","finding":"`set_trip_status` переводит рейс `loading → in_transit`, как только заданы ТС и водитель (operations.py:421-432). Выпуск Go/No-Go лишь записывает `doc[\"released\"]` (docs.py:212-222), работает только для справочных рейсов и не может быть отозван, если контроль позже становится красным (например, новая критическая тревога).","change":"Переход в `in_transit` требует действующего выпуска, а сервер заново оценивает все контроли в момент перехода. Право переопределения (`trips:override_release`) с причиной не короче 10 символов, с аудитом списка непройденных контролей. Действие `docs.revoke`, срабатывающее автоматически, если контроль становится критическим до отправления.","acceptance":"(1) in_transit без выпуска → 409 с перечнем непройденных контролей. (2) С выпуском → 200. (3) Переопределение без права → 403; с правом → 200 плюс запись аудита `trip.release_override` с контролями. (4) Новая критическая тревога по выпущенному, но не отправленному рейсу сбрасывает выпуск."}},{"id":"FR-90","type":"FR","date":"2026-10-11","priority":"critical","status":"implemented","group":{"en":"Security & privacy","de":"Sicherheit & Datenschutz","ru":"Безопасность и защита данных"},"depends":"FR-109, FR-122, FR-127; – (base for )","effort":"M","source":"docs/CHANGE-REQUESTS.md","en":{"title":"Persistent idempotency for external events","finding":"De-duplication only searches the capped `doc[\"inbox\"]` list: it checks at `be/v5/modules/inbox.py:123`, and the list is capped at INBOX_MAX=200 at `:46`/`:127`. Once 200 newer events have arrived, re-delivered refs are accepted again. Sources of re-delivery: Wialon's 1-minute overlap (`be/integrations/worker.py:216`), webhook retries, and the goszakup poll, which returns the same open tenders every day (up to 10 × 50, `goszakup.py:32`, `worker.py:247-258`). Each re-accepted ref creates duplicate fines, service tickets, incidents and CRM leads.","change":"Add a table `external_event(source, ref, inbox_id, received_at)` with a UNIQUE constraint on (source, ref). `apply_external_event` inserts into it in the same transaction as the document update, and 409 comes from the constraint. `coverage.raise_alarms` (`coverage.py:259`) and `inbox.demo` use the same check. Retention is at least 13 months, so that yearly tenders and fines stay de-duplicated.","acceptance":"(1) Ingest 250 distinct events, then re-send event #1: response 409, and no new fine, ticket or lead row. (2) Two parallel calls with the same ref: exactly one 202. (3) A goszakup run twice on the same data creates 0 new leads."},"de":{"title":"Persistente Idempotenz für externe Ereignisse","finding":"Die Deduplizierung durchsucht nur die gekappte Liste `doc[\"inbox\"]`: geprüft wird in `be/v5/modules/inbox.py:123`, die Liste ist bei INBOX_MAX=200 gekappt (`:46`/`:127`). Sind 200 neuere Ereignisse eingetroffen, werden erneut zugestellte Refs wieder angenommen. Quellen erneuter Zustellung: die 1-Minuten-Überlappung von Wialon (`be/integrations/worker.py:216`), Webhook-Wiederholungen und der goszakup-Abruf, der täglich dieselben offenen Ausschreibungen liefert (bis 10 × 50, `goszakup.py:32`, `worker.py:247-258`). Jede wieder angenommene Ref erzeugt doppelte Bußgelder, Werkstatttickets, Vorfälle und CRM-Leads.","change":"Tabelle `external_event(source, ref, inbox_id, received_at)` mit UNIQUE-Constraint auf (source, ref). `apply_external_event` fügt in derselben Transaktion wie die Dokumentänderung ein, 409 kommt vom Constraint. `coverage.raise_alarms` (`coverage.py:259`) und `inbox.demo` nutzen dieselbe Prüfung. Aufbewahrung mindestens 13 Monate, damit jährliche Ausschreibungen und Bußgelder dedupliziert bleiben.","acceptance":"(1) 250 verschiedene Ereignisse einspielen, dann Ereignis Nr. 1 erneut senden: Antwort 409, keine neue Bußgeld-, Ticket- oder Lead-Zeile. (2) Zwei parallele Aufrufe mit derselben Ref: genau ein 202. (3) Ein zweimaliger goszakup-Lauf auf denselben Daten erzeugt 0 neue Leads."},"ru":{"title":"Постоянная идемпотентность внешних событий","finding":"Дедупликация ищет только в обрезанном списке `doc[\"inbox\"]`: проверка в `be/v5/modules/inbox.py:123`, список ограничен INBOX_MAX=200 (`:46`/`:127`). После 200 более новых событий повторно доставленные ref снова принимаются. Источники повторной доставки: 1-минутное перекрытие Wialon (`be/integrations/worker.py:216`), повторы вебхуков и опрос goszakup, который каждый день возвращает те же открытые тендеры (до 10 × 50, `goszakup.py:32`, `worker.py:247-258`). Каждый повторно принятый ref создаёт дубли штрафов, сервисных заявок, инцидентов и лидов CRM.","change":"Таблица `external_event(source, ref, inbox_id, received_at)` с ограничением UNIQUE на (source, ref). `apply_external_event` вставляет в неё в той же транзакции, что и обновление документа, 409 даёт ограничение. `coverage.raise_alarms` (`coverage.py:259`) и `inbox.demo` используют ту же проверку. Хранение не менее 13 месяцев, чтобы ежегодные тендеры и штрафы оставались без дублей.","acceptance":"(1) Принять 250 разных событий, затем повторить событие № 1: ответ 409, новых строк штрафов, заявок или лидов нет. (2) Два параллельных вызова с одинаковым ref: ровно один 202. (3) Двойной прогон goszakup на тех же данных создаёт 0 новых лидов."}},{"id":"FR-89","type":"FR","date":"2026-10-11","priority":"medium","status":"implemented","group":{"en":"Security & privacy","de":"Sicherheit & Datenschutz","ru":"Безопасность и защита данных"},"depends":"FR-75, FR-81; `security/crypto.py`","effort":"M","source":"docs/CHANGE-REQUESTS.md","en":{"title":"Keep personal names out of `v5_doc` (or encrypt them) and support erasure","finding":"The operations document stores personal data in plain JSON, outside `security/crypto.py`: signer display names (`cApBy[].name`, `costs.py:52`, also partners and baseline approvals), consignee names in ePOD events and texts (\"подпись Г. Абдрахмановой\", `driver.py:57`), and names in ops-log texts. They also go into backups and history (C06). There is no erasure path, while CRM has \"anonymise\" (SECURITY.md §9a).","change":"Store only `user_id` / `person_ref` in the document and resolve display names at read time through a permission-checked lookup. Consignee signatures (ePOD) go to an encrypted `epod` table bound to the row id. Add a `python -m app.cli erase-person <ref>` that pseudonymises history and archive entries and is audited. Add a CI lint that rejects new `ctx.display_name` writes into the document.","acceptance":"grep over a production-mode `/state` finds no staff or consignee names (test). The erase command replaces a person's name in document, history and archive with \"удалено\" and writes `pii.erase` to the audit log. The ePOD signature is visible only with `pii:read` and audited."},"de":{"title":"Personennamen aus `v5_doc` heraushalten (oder verschlüsseln) und Löschung unterstützen","finding":"Das Betriebsdokument speichert personenbezogene Daten als Klartext-JSON außerhalb von `security/crypto.py`: Anzeigenamen von Unterzeichnern (`cApBy[].name`, `costs.py:52`, auch Partner- und Ausgangsdaten-Freigaben), Empfängernamen in ePOD-Ereignissen und -Texten („подпись Г. Абдрахмановой“, `driver.py:57`) und Namen in Texten des Betriebsprotokolls. Sie gelangen auch in Backups und Historie (C06). Es gibt keinen Löschpfad, während das CRM „anonymisieren“ kennt (SECURITY.md §9a).","change":"Im Dokument nur `user_id` / `person_ref` speichern und Anzeigenamen beim Lesen über einen berechtigungsgeprüften Lookup auflösen. Empfängerunterschriften (ePOD) in eine verschlüsselte, an die Zeilen-ID gebundene Tabelle `epod`. `python -m app.cli erase-person <ref>` ergänzen, das Historien- und Archiveinträge pseudonymisiert und auditiert wird. CI-Lint, der neue Schreibvorgänge von `ctx.display_name` ins Dokument abweist.","acceptance":"grep über ein `/state` im Produktivmodus findet keine Mitarbeiter- oder Empfängernamen (Test). Der Löschbefehl ersetzt den Namen einer Person in Dokument, Historie und Archiv durch „удалено“ und schreibt `pii.erase` ins Audit-Log. Die ePOD-Unterschrift ist nur mit `pii:read` sichtbar und wird auditiert."},"ru":{"title":"Имена людей — вне `v5_doc` (или шифровать) и поддержка удаления","finding":"Операционный документ хранит персональные данные открытым JSON вне `security/crypto.py`: отображаемые имена подписантов (`cApBy[].name`, `costs.py:52`, а также согласования партнёров и исходных данных), имена получателей в событиях и текстах ePOD («подпись Г. Абдрахмановой», `driver.py:57`) и имена в текстах журнала операций. Они попадают и в резервные копии и историю (C06). Пути удаления нет, тогда как в CRM есть «анонимизировать» (SECURITY.md §9a).","change":"Хранить в документе только `user_id` / `person_ref`, а отображаемые имена получать при чтении через поиск с проверкой прав. Подписи получателей (ePOD) — в зашифрованную таблицу `epod`, привязанную к id строки. Добавить `python -m app.cli erase-person <ref>`, псевдонимизирующий записи истории и архива, с аудитом. Добавить CI-проверку, отклоняющую новые записи `ctx.display_name` в документ.","acceptance":"grep по `/state` в продуктивном режиме не находит имён сотрудников или получателей (тест). Команда удаления заменяет имя человека в документе, истории и архиве на «удалено» и пишет `pii.erase` в журнал аудита. Подпись ePOD видна только с `pii:read` и аудируется."}},{"id":"FR-88","type":"FR","date":"2026-10-11","priority":"medium","status":"implemented","group":{"en":"Security & privacy","de":"Sicherheit & Datenschutz","ru":"Безопасность и защита данных"},"depends":"FR-130","effort":"S","source":"docs/CHANGE-REQUESTS.md","en":{"title":"Implement the documented pruning of `inbound_nonce`","finding":"`integrations/models.py:7` and `integrations/inbound.py:10` state that nonces are \"kept 24 h / pruned after 1 day\", but no code deletes from `inbound_nonce` (only insert and lookup in `routers/integrations.py:64-73`). The table grows without limit, and the existence check under an advisory lock slows down.","change":"Add a worker task `prune-nonces` (hourly): `DELETE FROM inbound_nonce WHERE created_at < now() - interval '25 hours'`. Keep 25 h so it always covers the ±5 min window plus the ATI scheme. Add an index on `(source, created_at)`.","acceptance":"pytest: a nonce of 26 h is removed, one of 1 h is kept, and replay inside 5 min is still rejected. The worker heartbeat (C12) shows the task."},"de":{"title":"Dokumentiertes Bereinigen von `inbound_nonce` umsetzen","finding":"`integrations/models.py:7` und `integrations/inbound.py:10` besagen, Nonces würden „24 h aufbewahrt / nach 1 Tag bereinigt“, aber kein Code löscht aus `inbound_nonce` (nur Einfügen und Nachschlagen in `routers/integrations.py:64-73`). Die Tabelle wächst unbegrenzt, und die Existenzprüfung unter Advisory-Lock wird langsamer.","change":"Worker-Task `prune-nonces` (stündlich): `DELETE FROM inbound_nonce WHERE created_at < now() - interval '25 hours'`. 25 h behalten, damit stets das ±5-min-Fenster plus das ATI-Schema abgedeckt ist. Index auf `(source, created_at)`.","acceptance":"pytest: eine Nonce von 26 h wird entfernt, eine von 1 h bleibt, und ein Replay innerhalb von 5 min wird weiterhin abgewiesen. Der Worker-Heartbeat (C12) zeigt den Task."},"ru":{"title":"Реализовать задокументированную очистку `inbound_nonce`","finding":"`integrations/models.py:7` и `integrations/inbound.py:10` утверждают, что nonce «хранятся 24 ч / удаляются через 1 день», но никакой код не удаляет из `inbound_nonce` (только вставка и поиск в `routers/integrations.py:64-73`). Таблица растёт без ограничений, а проверка существования под advisory-блокировкой замедляется.","change":"Задача воркера `prune-nonces` (ежечасно): `DELETE FROM inbound_nonce WHERE created_at < now() - interval '25 hours'`. Хранить 25 ч, чтобы всегда покрывать окно ±5 мин плюс схему ATI. Индекс на `(source, created_at)`.","acceptance":"pytest: nonce возрастом 26 ч удаляется, 1 ч — сохраняется, повтор в пределах 5 мин по-прежнему отклоняется. Heartbeat воркера (C12) показывает задачу."}},{"id":"FR-87","type":"FR","date":"2026-10-11","priority":"medium","status":"implemented","group":{"en":"Security & privacy","de":"Sicherheit & Datenschutz","ru":"Безопасность и защита данных"},"depends":"FR-130; `audit.py`","effort":"S","source":"docs/CHANGE-REQUESTS.md","en":{"title":"Rate-aggregated auditing of rejected inbound requests","finding":"Every rejected unauthenticated request on `/api/v1/inbound/{source}` is written to the append-only, hash-chained audit log (`routers/integrations.py:57-58`). Each write takes the global advisory lock (`audit.py:63`). With 240 req/min per IP allowed (SECURITY.md §9a), one attacker can add ≈345k undeletable rows per day per IP and contend the lock that every user action needs.","change":"Count rejections in a `security_counters(source, ip_hash, reason, window_start, n)` table. Write one audit entry per (source, reason, 10-min window) with the count, plus the first rejection per IP. Alert above a threshold (C12). Move the IP throttle check before signature verification so it rejects before any DB write.","acceptance":"1,000 bad-signature requests within 10 min add ≤ 3 audit rows (pytest). Valid events are still audited 1:1. p95 of `/api/v5/act` stays < 300 ms during a 240 req/min rejection flood (load test)."},"de":{"title":"Aggregiertes Audit abgewiesener eingehender Anfragen","finding":"Jede abgewiesene nicht authentifizierte Anfrage an `/api/v1/inbound/{source}` wird in das nur anfügbare, hash-verkettete Audit-Log geschrieben (`routers/integrations.py:57-58`). Jeder Schreibvorgang nimmt den globalen Advisory-Lock (`audit.py:63`). Bei erlaubten 240 Anfragen/min je IP (SECURITY.md §9a) kann ein Angreifer ≈345 000 unlöschbare Zeilen pro Tag und IP erzeugen und um den Lock konkurrieren, den jede Nutzeraktion braucht.","change":"Abweisungen in einer Tabelle `security_counters(source, ip_hash, reason, window_start, n)` zählen. Einen Audit-Eintrag je (Quelle, Grund, 10-min-Fenster) mit Zähler schreiben, plus die erste Abweisung je IP. Alarm oberhalb eines Schwellwerts (C12). IP-Drosselung vor die Signaturprüfung verlegen, damit vor jedem DB-Schreibvorgang abgewiesen wird.","acceptance":"1 000 Anfragen mit falscher Signatur in 10 min erzeugen ≤ 3 Audit-Zeilen (pytest). Gültige Ereignisse werden weiterhin 1:1 auditiert. p95 von `/api/v5/act` bleibt während einer Abweisungsflut von 240 Anfragen/min < 300 ms (Lasttest)."},"ru":{"title":"Агрегированный аудит отклонённых входящих запросов","finding":"Каждый отклонённый неаутентифицированный запрос на `/api/v1/inbound/{source}` пишется в журнал аудита только на добавление с хеш-цепочкой (`routers/integrations.py:57-58`). Каждая запись берёт глобальную advisory-блокировку (`audit.py:63`). При разрешённых 240 запросах/мин с IP (SECURITY.md §9a) один злоумышленник может добавить ≈345 тыс. неудаляемых строк в сутки с IP и конкурировать за блокировку, нужную каждому действию пользователя.","change":"Считать отказы в таблице `security_counters(source, ip_hash, reason, window_start, n)`. Писать одну запись аудита на (источник, причина, окно 10 мин) со счётчиком плюс первый отказ по каждому IP. Оповещение выше порога (C12). Перенести проверку ограничения по IP перед проверкой подписи, чтобы отказ происходил до любой записи в БД.","acceptance":"1 000 запросов с неверной подписью за 10 мин добавляют ≤ 3 строк аудита (pytest). Валидные события по-прежнему аудируются 1:1. p95 `/api/v5/act` остаётся < 300 мс при потоке отказов 240 запросов/мин (нагрузочный тест)."}},{"id":"FR-86","type":"FR","date":"2026-10-11","priority":"high","status":"implemented","group":{"en":"Security & privacy","de":"Sicherheit & Datenschutz","ru":"Безопасность и защита данных"},"depends":"`security/crypto.py`","effort":"M","source":"docs/CHANGE-REQUESTS.md","en":{"title":"Implement `data_key` rotation and re-encryption job","finding":"`docs/DEPLOYMENT.md` §7 says data-key rotation \"requires a re-encryption job (planned for v0.2)\". v0.2.0 ships without it, although the key-version byte exists (`security/crypto.py`, format `\\x01‖nonce‖ct`). SECURITY.md §9.5 requires yearly rotation or rotation after a suspected leak, so the incident runbook (§6, \"re-encrypt personal data with a new key\") cannot be executed.","change":"Add multi-key support (`OLYMP_DATA_KEYS_DIR` with `data_key_v1`, `data_key_v2`; encrypt with the newest, decrypt by version byte). Add `python -m app.cli reencrypt --batch 500` (idempotent, resumable, audited with counts only). Same pattern for `index_key` (rebuild blind indexes). Add a runbook section with steps and verification.","acceptance":"After a test rotation all `drivers`, `leads` and `customers` ciphertexts carry version 2, and decryption works with only `v2` present. The job can be interrupted and resumed. The audit log has `keys.reencrypt` with counts and no PD."},"de":{"title":"Rotation des `data_key` und Neuverschlüsselungs-Job umsetzen","finding":"`docs/DEPLOYMENT.md` §7 sagt, die Rotation des Datenschlüssels „requires a re-encryption job (planned for v0.2)“. v0.2.0 wird ohne ihn ausgeliefert, obwohl das Schlüsselversions-Byte existiert (`security/crypto.py`, Format `\\x01‖nonce‖ct`). SECURITY.md §9.5 verlangt jährliche Rotation oder Rotation nach Verdacht auf ein Leck, sodass das Incident-Runbook (§6, „personenbezogene Daten mit neuem Schlüssel neu verschlüsseln“) nicht ausführbar ist.","change":"Mehrschlüsselbetrieb (`OLYMP_DATA_KEYS_DIR` mit `data_key_v1`, `data_key_v2`; Verschlüsselung mit dem neuesten, Entschlüsselung nach Versions-Byte). `python -m app.cli reencrypt --batch 500` (idempotent, fortsetzbar, Audit nur mit Zählern). Gleiches Muster für `index_key` (Blind-Indizes neu aufbauen). Runbook-Abschnitt mit Schritten und Prüfung.","acceptance":"Nach einer Testrotation tragen alle Chiffrate in `drivers`, `leads` und `customers` Version 2, und die Entschlüsselung funktioniert mit nur `v2`. Der Job ist unterbrechbar und fortsetzbar. Das Audit-Log enthält `keys.reencrypt` mit Zählern und ohne personenbezogene Daten."},"ru":{"title":"Реализовать ротацию `data_key` и задание перешифрования","finding":"`docs/DEPLOYMENT.md` §7 гласит, что ротация ключа данных «requires a re-encryption job (planned for v0.2)». v0.2.0 вышла без него, хотя байт версии ключа существует (`security/crypto.py`, формат `\\x01‖nonce‖ct`). SECURITY.md §9.5 требует ежегодной ротации или ротации при подозрении на утечку, поэтому регламент инцидентов (§6, «перешифровать персональные данные новым ключом») невыполним.","change":"Поддержка нескольких ключей (`OLYMP_DATA_KEYS_DIR` с `data_key_v1`, `data_key_v2`; шифрование новейшим, расшифровка по байту версии). `python -m app.cli reencrypt --batch 500` (идемпотентно, с возобновлением, аудит только счётчиками). Та же схема для `index_key` (перестроение слепых индексов). Раздел регламента с шагами и проверкой.","acceptance":"После тестовой ротации все шифротексты в `drivers`, `leads` и `customers` имеют версию 2, а расшифровка работает только с `v2`. Задание можно прервать и продолжить. В журнале аудита есть `keys.reencrypt` со счётчиками и без ПДн."}},{"id":"FR-85","type":"FR","date":"2026-10-11","priority":"high","status":"implemented_partial","status_note":{"en":"Server-side 2-signature gate implemented as the `costs.execute` action (product-owner decision).","de":"Serverseitiges 2-Unterschriften-Gate als Aktion `costs.execute` umgesetzt (Entscheidung des Product Owners).","ru":"Серверный контроль двух подписей реализован как действие `costs.execute` (решение владельца продукта)."},"group":{"en":"Security & privacy","de":"Sicherheit & Datenschutz","ru":"Безопасность и защита данных"},"depends":"FR-78, FR-83, FR-125, FR-137","effort":"M","source":"docs/CHANGE-REQUESTS.md","en":{"title":"Business roles for approvals; bind signature slots to the approver role","finding":"`approvals:sign`, `costs:approve` and `fines:write` belong only to `admin` (`rbac.py:263-286`), and admins must be global with `users:admin` (SECURITY.md §10). Four-eyes approvals therefore need two full administrators, and finance or quality managers have no role. The slot \"head of logistics\" vs \"financial controller\" (`CAPR`) is not bound to the signer: any `costs:approve` holder can sign either slot (`costs.py:42-52`).","change":"Add roles `manager` (approvals:sign, costs:approve, costs:read), `finance` (fines:write, costs:approve, costs:read) and `quality` (quality:write, temperature:read, alarms:read). Add `users.functions` (`head_logistics`, `fin_controller`, `qa_manager`). `costs.sign` / `baseline.exSign` check `ctx.principal.has_function(CAPR_FN[i])`. Update `help/roles.ts` (see C21).","acceptance":"pytest: `finance` can sign slot 1 but gets 403 on slot 0. `manager` cannot manage users. The role × perm matrix test (C21) is updated. Admin can still do everything except `driver:app` (C03).<br>(1) A hand-over for such a transport with 1/2 signatures returns 409. (2) With 2/2 from two different users it succeeds. (3) A diesel-price change marks old approvals as `stale`.","merged":"Server-side gate for the 2-signature rule — Whether a decision needs 2 signatures (gap > 50 %) is computed only in the browser, from the what-if diesel price and with hard-coded exceptions OW-6/OW-7 (`fe/v5/engine/costs.ts:63-66`). The server explicitly does not gate (`be/v5/modules/costs.py:16-17`). A signature does not block or release anything in dispatch or hand-over."},"de":{"title":"Fachrollen für Freigaben; Unterschriftsfelder an die Freigeberrolle binden","finding":"`approvals:sign`, `costs:approve` und `fines:write` gehören nur `admin` (`rbac.py:263-286`), und Admins müssen global mit `users:admin` sein (SECURITY.md §10). Vier-Augen-Freigaben brauchen daher zwei volle Administratoren, und Finanz- oder Qualitätsverantwortliche haben keine Rolle. Das Feld „Leiter Logistik“ vs. „Finanzcontroller“ (`CAPR`) ist nicht an den Unterzeichner gebunden: jeder Inhaber von `costs:approve` kann beide Felder unterschreiben (`costs.py:42-52`).","change":"Rollen `manager` (approvals:sign, costs:approve, costs:read), `finance` (fines:write, costs:approve, costs:read) und `quality` (quality:write, temperature:read, alarms:read) ergänzen. `users.functions` (`head_logistics`, `fin_controller`, `qa_manager`) ergänzen. `costs.sign` / `baseline.exSign` prüfen `ctx.principal.has_function(CAPR_FN[i])`. `help/roles.ts` aktualisieren (siehe C21).","acceptance":"pytest: `finance` kann Feld 1 unterschreiben, erhält bei Feld 0 aber 403. `manager` kann keine Nutzer verwalten. Der Matrix-Test Rolle × Berechtigung (C21) ist aktualisiert. Admin kann weiterhin alles außer `driver:app` (C03).<br>(1) Eine Übergabe für einen solchen Transport mit 1/2 Unterschriften liefert 409. (2) Mit 2/2 von zwei verschiedenen Nutzern gelingt sie. (3) Eine Dieselpreisänderung markiert alte Freigaben als `stale`.","merged":"Serverseitiges Gate für die 2-Unterschriften-Regel — Ob eine Entscheidung 2 Unterschriften braucht (Abweichung > 50 %), wird nur im Browser berechnet, aus dem What-if-Dieselpreis und mit fest codierten Ausnahmen OW-6/OW-7 (`fe/v5/engine/costs.ts:63-66`). Der Server prüft ausdrücklich nicht (`be/v5/modules/costs.py:16-17`). Eine Unterschrift sperrt oder gibt in Disposition oder Übergabe nichts frei."},"ru":{"title":"Бизнес-роли для согласований; привязка слотов подписи к роли согласующего","finding":"`approvals:sign`, `costs:approve` и `fines:write` есть только у `admin` (`rbac.py:263-286`), а администраторы должны быть глобальными с `users:admin` (SECURITY.md §10). Поэтому согласование «четыре глаза» требует двух полных администраторов, а у финансового менеджера и менеджера по качеству нет роли. Слот «руководитель логистики» vs «финансовый контролёр» (`CAPR`) не привязан к подписанту: любой держатель `costs:approve` может подписать любой слот (`costs.py:42-52`).","change":"Добавить роли `manager` (approvals:sign, costs:approve, costs:read), `finance` (fines:write, costs:approve, costs:read) и `quality` (quality:write, temperature:read, alarms:read). Добавить `users.functions` (`head_logistics`, `fin_controller`, `qa_manager`). `costs.sign` / `baseline.exSign` проверяют `ctx.principal.has_function(CAPR_FN[i])`. Обновить `help/roles.ts` (см. C21).","acceptance":"pytest: `finance` может подписать слот 1, но получает 403 на слот 0. `manager` не может управлять пользователями. Тест матрицы роль × право (C21) обновлён. Администратор по-прежнему может всё, кроме `driver:app` (C03).<br>(1) Передача по такой перевозке с 1/2 подписями возвращает 409. (2) С 2/2 от двух разных пользователей — успешно. (3) Изменение цены дизеля помечает старые согласования как `stale`.","merged":"Серверный контроль правила двух подписей — Нужны ли решению 2 подписи (отклонение > 50 %), вычисляется только в браузере, из what-if цены дизеля и с жёстко заданными исключениями OW-6/OW-7 (`fe/v5/engine/costs.ts:63-66`). Сервер явно не проверяет (`be/v5/modules/costs.py:16-17`). Подпись ничего не блокирует и не разрешает в диспетчеризации или передаче."}},{"id":"FR-84","type":"FR","date":"2026-10-11","priority":"critical","status":"implemented","group":{"en":"Security & privacy","de":"Sicherheit & Datenschutz","ru":"Безопасность и защита данных"},"depends":"`integrations/wialon.py`, `models.TemperatureReading`","effort":"M","source":"docs/CHANGE-REQUESTS.md","en":{"title":"No simulated telemetry or alarm-simulation buttons in production","finding":"`tick()` generates reefer temperatures with `Math.random()` every 2 s for every build (`V5.tsx:37-57`, `V5.tsx:97-102`, no `DEMO` guard). Thermo, Overview and Quality show these values. `<SimButtons/>` (\"Симуляция тревог\") is rendered in the production sidebar (`Layout.tsx:61`). A GDP cold-chain operator could act on, or document, fictitious temperatures.","change":"Gate `tick` and `SimButtons` behind `DEMO || settings.training_mode` (server flag in `/api/v5/state`). In production, fill `ui.live` from `temperature_readings` (Wialon sync, `integrations/worker.py:90`) through `GET /api/v5/telemetry?since=`. Show the age of each reading and a \"no data\" state instead of the seed. Every simulated value carries a visible \"SIMULATION\" badge.","acceptance":"The production build (`npm run build`) contains no reachable `Math.random` telemetry path (unit test on `V5Provider` with `DEMO=false`). The sidebar has no `[data-sims]` element in prod mode. Thermo shows the last real reading with its timestamp, or \"нет данных\". The UI suite still passes against the demo."},"de":{"title":"Keine simulierte Telemetrie und keine Alarm-Simulationsknöpfe im Produktivbetrieb","finding":"`tick()` erzeugt in jedem Build alle 2 s Kühlaggregattemperaturen mit `Math.random()` (`V5.tsx:37-57`, `V5.tsx:97-102`, kein `DEMO`-Schutz). Thermo, Übersicht und Qualität zeigen diese Werte. `<SimButtons/>` („Симуляция тревог“) wird in der produktiven Seitenleiste gerendert (`Layout.tsx:61`). Ein GDP-Kühlkettenbetreiber könnte auf fiktive Temperaturen reagieren oder sie dokumentieren.","change":"`tick` und `SimButtons` hinter `DEMO || settings.training_mode` stellen (Server-Flag in `/api/v5/state`). Im Produktivbetrieb `ui.live` aus `temperature_readings` (Wialon-Sync, `integrations/worker.py:90`) über `GET /api/v5/telemetry?since=` füllen. Alter jedes Messwerts und einen Zustand „keine Daten“ statt des Seeds anzeigen. Jeder simulierte Wert trägt ein sichtbares Abzeichen „SIMULATION“.","acceptance":"Der Produktiv-Build (`npm run build`) enthält keinen erreichbaren `Math.random`-Telemetriepfad (Unit-Test auf `V5Provider` mit `DEMO=false`). Die Seitenleiste hat im Prod-Modus kein `[data-sims]`-Element. Thermo zeigt den letzten echten Messwert mit Zeitstempel oder „нет данных“. Die UI-Suite läuft gegen das Demo weiterhin grün."},"ru":{"title":"Никакой симулированной телеметрии и кнопок симуляции тревог в продуктиве","finding":"`tick()` в любой сборке каждые 2 с генерирует температуры рефагрегатов через `Math.random()` (`V5.tsx:37-57`, `V5.tsx:97-102`, без защиты `DEMO`). «Термостатус», «Обзор» и «Качество» показывают эти значения. `<SimButtons/>` («Симуляция тревог») отображается в боковой панели продуктива (`Layout.tsx:61`). Оператор холодовой цепи по GDP может действовать по вымышленным температурам или документировать их.","change":"Включать `tick` и `SimButtons` только при `DEMO || settings.training_mode` (серверный флаг в `/api/v5/state`). В продуктиве заполнять `ui.live` из `temperature_readings` (синхронизация Wialon, `integrations/worker.py:90`) через `GET /api/v5/telemetry?since=`. Показывать возраст каждого показания и состояние «нет данных» вместо начальных данных. Каждое симулированное значение несёт видимую метку «СИМУЛЯЦИЯ».","acceptance":"Продуктивная сборка (`npm run build`) не содержит достижимого пути телеметрии через `Math.random` (юнит-тест `V5Provider` с `DEMO=false`). В продуктивном режиме в боковой панели нет элемента `[data-sims]`. «Термостатус» показывает последнее реальное показание с меткой времени или «нет данных». UI-набор на демо по-прежнему проходит."}},{"id":"FR-83","type":"FR","date":"2026-10-11","priority":"critical","status":"implemented","group":{"en":"Security & privacy","de":"Sicherheit & Datenschutz","ru":"Безопасность и защита данных"},"depends":"FR-71; –","effort":"L/M","source":"docs/CHANGE-REQUESTS.md","en":{"title":"Bind the driver app to the driver's own trip","finding":"Every driver-app action is hard-wired to `TRIP, VEH, HUB = \"R-103\", \"V01\", \"ast\"` (`be/v5/modules/driver.py:29`, `:113-116`), so any account with `driver:app` acts on R-103. `Driver.user_id` exists but is unused (`be/models.py:216`). The SMS stub logic also only accepts V01/R-103 (`be/v5/modules/coverage.py:276`). Already listed in ROADMAP v0.3 but not scheduled.","change":"Resolve the trip from `Driver.user_id` → active Trip (status loading or in_transit) and its stops. All payloads carry a trip, stop or line id, which is validated against that trip. Per-trip state replaces the global keys `drvStep`, `dScan`, `dChk` and the others.","acceptance":"(1) Driver A cannot read or act on driver B's trip (403 or 404, test). (2) Two drivers on two trips run checklist, ePOD and fuel independently. (3) An OL1 SMS with an `e=` id for any trip and vehicle completes that driver's event.<br>pytest: driver B gets 403 on `driver.signPl` for driver A's trip. Admin gets 403 on every `driver.*` action. A driver without an assignment gets 403. The demo mirror (`frontend/src/demo/v5/driver.ts`) passes the same tests.","merged":"Bind driver-app actions to the signed-in driver's own trip; remove `driver:app` from admin — The driver module is hard-wired to one trip, `TRIP, VEH, HUB = \"R-103\", \"V01\", \"ast\"` (`driver.py:29`). Any driver account in hub `ast` (or one without a hub, see `router.py:43-48`) can sign trip sheet ПЛ-0412, complete ePOD or close the shift for R-103. `_ALL = set(Perm) - {Perm.portal}` (`rbac.py:263`) gives admins `driver:app`, which contradicts \"drivers only\" in `docs/V5-PORT.md:152-153`."},"de":{"title":"Fahrer-App an die eigene Tour des Fahrers binden","finding":"Jede Aktion der Fahrer-App ist fest auf `TRIP, VEH, HUB = \"R-103\", \"V01\", \"ast\"` verdrahtet (`be/v5/modules/driver.py:29`, `:113-116`), sodass jedes Konto mit `driver:app` auf R-103 handelt. `Driver.user_id` existiert, wird aber nicht genutzt (`be/models.py:216`). Auch die SMS-Stub-Logik akzeptiert nur V01/R-103 (`be/v5/modules/coverage.py:276`). Bereits in ROADMAP v0.3 gelistet, aber nicht eingeplant.","change":"Die Tour aus `Driver.user_id` → aktive Tour (Status loading oder in_transit) und deren Stopps auflösen. Alle Payloads tragen eine Tour-, Stopp- oder Positions-ID, die gegen diese Tour validiert wird. Tourbezogener Zustand ersetzt die globalen Schlüssel `drvStep`, `dScan`, `dChk` und weitere.","acceptance":"(1) Fahrer A kann die Tour von Fahrer B weder lesen noch bearbeiten (403 oder 404, Test). (2) Zwei Fahrer auf zwei Touren führen Checkliste, ePOD und Tankung unabhängig aus. (3) Eine OL1-SMS mit `e=`-ID für beliebige Tour und Fahrzeug schließt das Ereignis dieses Fahrers ab.<br>pytest: Fahrer B erhält 403 bei `driver.signPl` für die Tour von Fahrer A. Admin erhält 403 bei jeder `driver.*`-Aktion. Ein Fahrer ohne Zuordnung erhält 403. Der Demo-Spiegel (`frontend/src/demo/v5/driver.ts`) besteht dieselben Tests.","merged":"Fahrer-App-Aktionen an die eigene Tour des angemeldeten Fahrers binden; `driver:app` beim Admin entfernen — Das Fahrermodul ist fest auf eine Tour verdrahtet, `TRIP, VEH, HUB = \"R-103\", \"V01\", \"ast\"` (`driver.py:29`). Jedes Fahrerkonto im Hub `ast` (oder ohne Hub, siehe `router.py:43-48`) kann das Fahrtenblatt ПЛ-0412 unterschreiben, den ePOD abschließen oder die Schicht für R-103 beenden. `_ALL = set(Perm) - {Perm.portal}` (`rbac.py:263`) gibt Admins `driver:app`, was „nur Fahrer“ in `docs/V5-PORT.md:152-153` widerspricht."},"ru":{"title":"Привязать приложение водителя к собственному рейсу водителя","finding":"Каждое действие приложения водителя жёстко привязано к `TRIP, VEH, HUB = \"R-103\", \"V01\", \"ast\"` (`be/v5/modules/driver.py:29`, `:113-116`), поэтому любая учётная запись с `driver:app` действует по R-103. `Driver.user_id` существует, но не используется (`be/models.py:216`). Заглушка SMS тоже принимает только V01/R-103 (`be/v5/modules/coverage.py:276`). Уже внесено в ROADMAP v0.3, но не запланировано.","change":"Определять рейс по `Driver.user_id` → активный рейс (статус loading или in_transit) и его точки. Все данные действий несут id рейса, точки или строки, который проверяется по этому рейсу. Состояние по рейсу заменяет глобальные ключи `drvStep`, `dScan`, `dChk` и другие.","acceptance":"(1) Водитель A не может читать рейс водителя B или действовать по нему (403 или 404, тест). (2) Два водителя на двух рейсах независимо проходят чек-лист, ePOD и заправку. (3) SMS OL1 с id `e=` для любого рейса и ТС завершает событие этого водителя.<br>pytest: водитель B получает 403 на `driver.signPl` по рейсу водителя A. Администратор получает 403 на любое действие `driver.*`. Водитель без назначения получает 403. Демо-зеркало (`frontend/src/demo/v5/driver.ts`) проходит те же тесты.","merged":"Привязать действия приложения водителя к рейсу вошедшего водителя; убрать `driver:app` у администратора — Модуль водителя жёстко привязан к одному рейсу, `TRIP, VEH, HUB = \"R-103\", \"V01\", \"ast\"` (`driver.py:29`). Любая учётная запись водителя в хабе `ast` (или без хаба, см. `router.py:43-48`) может подписать путевой лист ПЛ-0412, завершить ePOD или закрыть смену по R-103. `_ALL = set(Perm) - {Perm.portal}` (`rbac.py:263`) даёт администраторам `driver:app`, что противоречит «только водители» в `docs/V5-PORT.md:152-153`."}},{"id":"FR-82","type":"FR","date":"2026-10-11","priority":"critical","status":"implemented","group":{"en":"Security & privacy","de":"Sicherheit & Datenschutz","ru":"Безопасность и защита данных"},"depends":"FR-71, FR-78, FR-81, FR-83; `security/crypto.py`","effort":"M","source":"docs/CHANGE-REQUESTS.md","en":{"title":"Partner contacts and HR data out of the reference payload","finding":"Partner contact names and mobile numbers are stored in plain text in the repository's reference JSON (`PARTNERS[].contacts`). They are served unfiltered to every staff role, including drivers, through `GET /api/v5/ref` (`be/v5/router.py:71-73`). `GET /api/v5/state` returns the whole document (fines with attributed drivers, staff assignments, all hubs) to every staff role (`router.py:76-81`). This conflicts with CLAUDE.md rule 3 (phone encrypted, bound to table, column and row id) and with hub scoping.","change":"Move contacts to `partner_contact` with `phone_enc`/`mobile_enc` (crypto context `partner_contact.<col>:<id>`), masked display, and an audited reveal (`partners:write`). `/ref` and `/state` are filtered by permission and hub: drivers get only their own trip slice (B05), and fines/HR keys require `fines:write`/`drivers:write`.","acceptance":"(1) Grep: no phone pattern `+7` in reference JSON. (2) A driver-role `/state` contains no `fineInbox`/`fineSt` and no other trips. (3) Each contact reveal writes an audit entry with no number in its details.<br>A driver's `/ref` contains no `FINES`, `STAFF`, `PCOST` or partner `tel`. An auditor gets `FINES` but no `tel`. Every phone disclosure via the new endpoint writes `pii.read` to the audit log. Test: a regex for `\\+7[ (]` finds nothing in the `/ref` of the viewer, driver and warehouse roles.","merged":"Permission-filtered `/api/v5/ref`; personal data out of the static JSON — `GET /api/v5/ref` returns the whole `mock-v5.<lang>.json` to any staff role (`router.py:71-73`, `ref.py:182-191`). That includes full driver names (`DRV`, `STAFF`), traffic fines attributed to named drivers (`FINES[].note` \"в смену Е. Тулегенова\"), partner contact phones (`\"tel\": \"+7 (7172) …\"`), cost model (`PCOST`, `CP`) and ePOD signer names. ROADMAP itself marks this as an open point (\"permission-filtered /api/v5/ref\", `docs/ROADMAP.md` v0.2→v0.3)."},"de":{"title":"Partnerkontakte und Personaldaten aus der Referenz-Payload entfernen","finding":"Namen und Mobilnummern von Partnerkontakten liegen im Klartext im Referenz-JSON des Repositorys (`PARTNERS[].contacts`). Sie werden ungefiltert an jede Mitarbeiterrolle, auch Fahrer, über `GET /api/v5/ref` ausgeliefert (`be/v5/router.py:71-73`). `GET /api/v5/state` liefert jeder Mitarbeiterrolle das ganze Dokument (Bußgelder mit zugeordneten Fahrern, Personaleinsätze, alle Hubs) (`router.py:76-81`). Das widerspricht CLAUDE.md-Regel 3 (Telefon verschlüsselt, gebunden an Tabelle, Spalte und Zeilen-ID) und der Hub-Eingrenzung.","change":"Kontakte nach `partner_contact` mit `phone_enc`/`mobile_enc` verlagern (Krypto-Kontext `partner_contact.<col>:<id>`), maskierte Anzeige und auditiertes Aufdecken (`partners:write`). `/ref` und `/state` werden nach Berechtigung und Hub gefiltert: Fahrer erhalten nur den Ausschnitt ihrer eigenen Tour (B05), Bußgeld-/Personalschlüssel erfordern `fines:write`/`drivers:write`.","acceptance":"(1) Grep: kein Telefonmuster `+7` im Referenz-JSON. (2) Ein `/state` der Fahrerrolle enthält kein `fineInbox`/`fineSt` und keine fremden Touren. (3) Jedes Aufdecken eines Kontakts schreibt einen Audit-Eintrag ohne Nummer in den Details.<br>Das `/ref` eines Fahrers enthält kein `FINES`, `STAFF`, `PCOST` und kein Partner-`tel`. Ein Auditor erhält `FINES`, aber kein `tel`. Jede Telefonoffenlegung über den neuen Endpunkt schreibt `pii.read` ins Audit-Log. Test: ein Regex für `\\+7[ (]` findet nichts im `/ref` der Rollen Betrachter, Fahrer und Lager.","merged":"Berechtigungsgefiltertes `/api/v5/ref`; personenbezogene Daten raus aus dem statischen JSON — `GET /api/v5/ref` liefert jeder Mitarbeiterrolle das ganze `mock-v5.<lang>.json` (`router.py:71-73`, `ref.py:182-191`). Darin enthalten: volle Fahrernamen (`DRV`, `STAFF`), benannten Fahrern zugeordnete Verkehrsbußgelder (`FINES[].note` „в смену Е. Тулегенова“), Telefonnummern von Partnerkontakten (`\"tel\": \"+7 (7172) …\"`), das Kostenmodell (`PCOST`, `CP`) und ePOD-Unterzeichnernamen. Die ROADMAP selbst führt dies als offenen Punkt („permission-filtered /api/v5/ref“, `docs/ROADMAP.md` v0.2→v0.3)."},"ru":{"title":"Контакты партнёров и кадровые данные — вне справочной выдачи","finding":"Имена и мобильные номера контактов партнёров хранятся открытым текстом в справочном JSON репозитория (`PARTNERS[].contacts`). Они без фильтра отдаются любой роли сотрудника, включая водителей, через `GET /api/v5/ref` (`be/v5/router.py:71-73`). `GET /api/v5/state` возвращает весь документ (штрафы с привязанными водителями, назначения персонала, все хабы) любой роли сотрудника (`router.py:76-81`). Это противоречит правилу 3 CLAUDE.md (телефон зашифрован, привязан к таблице, колонке и id строки) и ограничению по хабу.","change":"Перенести контакты в `partner_contact` с `phone_enc`/`mobile_enc` (криптоконтекст `partner_contact.<col>:<id>`), маскированный показ и раскрытие с аудитом (`partners:write`). `/ref` и `/state` фильтруются по правам и хабу: водитель получает только срез своего рейса (B05), ключи штрафов и кадров требуют `fines:write`/`drivers:write`.","acceptance":"(1) Grep: в справочном JSON нет телефонного шаблона `+7`. (2) `/state` роли водителя не содержит `fineInbox`/`fineSt` и чужих рейсов. (3) Каждое раскрытие контакта пишет запись аудита без номера в деталях.<br>`/ref` водителя не содержит `FINES`, `STAFF`, `PCOST` и `tel` партнёров. Аудитор получает `FINES`, но не `tel`. Каждое раскрытие телефона через новый эндпоинт пишет `pii.read` в журнал аудита. Тест: регулярное выражение `\\+7[ (]` ничего не находит в `/ref` ролей наблюдателя, водителя и склада.","merged":"`/api/v5/ref` с фильтром по правам; персональные данные — вне статического JSON — `GET /api/v5/ref` отдаёт весь `mock-v5.<lang>.json` любой роли сотрудника (`router.py:71-73`, `ref.py:182-191`). Там полные имена водителей (`DRV`, `STAFF`), штрафы ГИБДД, привязанные к водителям по имени (`FINES[].note` «в смену Е. Тулегенова»), телефоны контактов партнёров (`\"tel\": \"+7 (7172) …\"`), модель затрат (`PCOST`, `CP`) и имена подписантов ePOD. ROADMAP сам отмечает это как открытый пункт («permission-filtered /api/v5/ref», `docs/ROADMAP.md` v0.2→v0.3)."}},{"id":"FR-81","type":"FR","date":"2026-10-11","priority":"critical","status":"implemented","group":{"en":"Security & privacy","de":"Sicherheit & Datenschutz","ru":"Безопасность и защита данных"},"depends":"FR-82; `registry.py` (`Ctx.hub`)","effort":"M","source":"docs/CHANGE-REQUESTS.md","en":{"title":"Server-side hub and role projection of `/api/v5/state` and `/act` responses","finding":"`GET /api/v5/state` returns the complete operations document to every staff role (`backend/app/v5/router.py:76-81`), and `/act` returns it again (`router.py:114`). Hub scoping for reads exists only in the browser (`frontend/src/v5/engine/core.ts:100-102`, `hubOk`), so an Astana dispatcher, a driver or a viewer receives Almaty incidents, fines, cost approvals and SMS logs in the JSON.","change":"Add `project(doc, principal, hub)` in `v5/router.py`: drop slices the role may not read (e.g. `cAp/cApBy` without `costs:read`, `fineSt/fineInbox` without `fines:write`/`overview:read`, `smsOut` without `trips:write`) and filter hub-bound entries (`inbox`, `inc`, `tickets`, `covContact`, `drvEv`) by `ctx.hub`. Apply it to `/state`, `/act` and the `reset` response. Each module declares its own projection next to its `@initial` slice.","acceptance":"pytest: an `ast` dispatcher's `/state` contains no `alm` inbox, incident or ticket entry. A driver's `/state` has no `cAp`, `fineSt` or `smsOut` keys. A viewer's `/act` returns 403 and no document. A snapshot test lists the keys each role sees."},"de":{"title":"Serverseitige Hub- und Rollenprojektion der Antworten von `/api/v5/state` und `/act`","finding":"`GET /api/v5/state` liefert jeder Mitarbeiterrolle das vollständige Betriebsdokument (`backend/app/v5/router.py:76-81`), und `/act` liefert es erneut (`router.py:114`). Die Hub-Eingrenzung beim Lesen existiert nur im Browser (`frontend/src/v5/engine/core.ts:100-102`, `hubOk`), sodass ein Astana-Disponent, ein Fahrer oder ein Betrachter Almaty-Vorfälle, Bußgelder, Kostenfreigaben und SMS-Protokolle im JSON erhält.","change":"`project(doc, principal, hub)` in `v5/router.py` ergänzen: Teilbereiche entfernen, die die Rolle nicht lesen darf (z. B. `cAp/cApBy` ohne `costs:read`, `fineSt/fineInbox` ohne `fines:write`/`overview:read`, `smsOut` ohne `trips:write`) und hubgebundene Einträge (`inbox`, `inc`, `tickets`, `covContact`, `drvEv`) nach `ctx.hub` filtern. Anwenden auf `/state`, `/act` und die `reset`-Antwort. Jedes Modul deklariert seine Projektion neben seinem `@initial`-Teilbereich.","acceptance":"pytest: Das `/state` eines `ast`-Disponenten enthält keinen `alm`-Inbox-, Vorfall- oder Ticket-Eintrag. Das `/state` eines Fahrers hat keine Schlüssel `cAp`, `fineSt` oder `smsOut`. `/act` eines Betrachters liefert 403 und kein Dokument. Ein Snapshot-Test listet die Schlüssel, die jede Rolle sieht."},"ru":{"title":"Серверная проекция ответов `/api/v5/state` и `/act` по хабу и роли","finding":"`GET /api/v5/state` возвращает полный операционный документ любой роли сотрудника (`backend/app/v5/router.py:76-81`), а `/act` возвращает его снова (`router.py:114`). Ограничение чтения по хабу есть только в браузере (`frontend/src/v5/engine/core.ts:100-102`, `hubOk`), поэтому диспетчер Астаны, водитель или наблюдатель получают в JSON инциденты, штрафы, согласования затрат и журналы SMS Алматы.","change":"Добавить `project(doc, principal, hub)` в `v5/router.py`: удалять разделы, которые роль не вправе читать (напр. `cAp/cApBy` без `costs:read`, `fineSt/fineInbox` без `fines:write`/`overview:read`, `smsOut` без `trips:write`), и фильтровать привязанные к хабу записи (`inbox`, `inc`, `tickets`, `covContact`, `drvEv`) по `ctx.hub`. Применять к `/state`, `/act` и ответу `reset`. Каждый модуль объявляет свою проекцию рядом со своим разделом `@initial`.","acceptance":"pytest: `/state` диспетчера `ast` не содержит входящих, инцидентов и заявок `alm`. `/state` водителя не содержит ключей `cAp`, `fineSt` и `smsOut`. `/act` наблюдателя возвращает 403 без документа. Snapshot-тест перечисляет ключи, видимые каждой роли."}},{"id":"FR-80","type":"FR","date":"2026-10-11","priority":"medium","status":"implemented","group":{"en":"One source of truth & architecture","de":"Eine Datenquelle & Architektur","ru":"Единый источник данных и архитектура"},"depends":"FR-72","effort":"S","source":"docs/CHANGE-REQUESTS.md","en":{"title":"Race-free document numbers","finding":"Order, trip and booking numbers come from `COUNT(*)` (operations.py:220-226, booking.py:83-87). Two parallel creates compute the same candidate, and the second request fails with an IntegrityError (HTTP 500).","change":"Use PostgreSQL sequences per document type (optionally per year), e.g. `ORD-26-000123`, `BK-26-000045`.","acceptance":"20 parallel `POST /api/orders` and 20 parallel bookings all return 201 with distinct numbers."},"de":{"title":"Kollisionsfreie Belegnummern","finding":"Auftrags-, Tour- und Buchungsnummern stammen aus `COUNT(*)` (operations.py:220-226, booking.py:83-87). Zwei parallele Anlagen berechnen denselben Kandidaten, und die zweite Anfrage scheitert mit IntegrityError (HTTP 500).","change":"PostgreSQL-Sequenzen je Belegart (optional je Jahr), z. B. `ORD-26-000123`, `BK-26-000045`.","acceptance":"20 parallele `POST /api/orders` und 20 parallele Buchungen liefern alle 201 mit unterschiedlichen Nummern."},"ru":{"title":"Номера документов без гонок","finding":"Номера заказов, рейсов и бронирований берутся из `COUNT(*)` (operations.py:220-226, booking.py:83-87). Два параллельных создания вычисляют одинаковый номер, и второй запрос падает с IntegrityError (HTTP 500).","change":"Последовательности PostgreSQL по типу документа (опционально по году), напр. `ORD-26-000123`, `BK-26-000045`.","acceptance":"20 параллельных `POST /api/orders` и 20 параллельных бронирований возвращают 201 с разными номерами."}},{"id":"FR-79","type":"FR","date":"2026-10-11","priority":"medium","status":"implemented","group":{"en":"One source of truth & architecture","de":"Eine Datenquelle & Architektur","ru":"Единый источник данных и архитектура"},"depends":"FR-73, FR-95","effort":"S","source":"docs/CHANGE-REQUESTS.md","en":{"title":"Seed through service rules, plus a consistency check","finding":"The seed breaks the platform's own rules. Frozen order З-2295 is planned on isothermal V02 (seed.py:157-160 vs operations.py:363-364). All 10 reference orders are planned on R-106 while v5 ticks 6 (load.py:118). R-103 (hub AST) has a stop in Almaty, which belongs to hub ALA (seed.py:152; forbidden by operations.py:359-360). The driver-app account is linked to D2 (seed.py:239), but R-103's driver is D3 (seed.py:152), so `driver.v01` cannot see the trip the driver app simulates.","change":"Seed through the service functions (`create_trip`/`_attach_orders`/`confirm`). Add `python -m app.cli check-consistency`: class vs vehicle, cross-hub stops, orders without stops, stops without orders, v5 document vs DB. Run it in CI after the seed.","acceptance":"(1) The seed passes all API validations. (2) `check-consistency` reports 0 issues after a fresh seed and lists each injected inconsistency in a test fixture."},"de":{"title":"Seed über Service-Regeln plus Konsistenzprüfung","finding":"Der Seed verletzt die eigenen Regeln der Plattform. Der TK-Auftrag З-2295 ist auf dem Isotherm-Fahrzeug V02 geplant (seed.py:157-160 vs. operations.py:363-364). Alle 10 Referenzaufträge sind auf R-106 geplant, während v5 6 anhakt (load.py:118). R-103 (Hub AST) hat einen Stopp in Almaty, das zum Hub ALA gehört (seed.py:152; verboten durch operations.py:359-360). Das Fahrer-App-Konto ist mit D2 verknüpft (seed.py:239), der Fahrer von R-103 ist aber D3 (seed.py:152), sodass `driver.v01` die von der Fahrer-App simulierte Tour nicht sieht.","change":"Seed über die Service-Funktionen (`create_trip`/`_attach_orders`/`confirm`). `python -m app.cli check-consistency` ergänzen: Klasse vs. Fahrzeug, hubübergreifende Stopps, Aufträge ohne Stopp
