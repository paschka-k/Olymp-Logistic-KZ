и (12.10.2026)","module":"","title":"Логотипы производителей на экране 04","change":"Логотипы, предоставленные заказчиком (Roche, Abbott, QIAGEN, Sysmex, bioMérieux, Beckman Coulter), у правого края карточки в фиксированном поле 515:380, без рамки; также на этикетке места; переопределение в справочниках через загрузку (PNG/WebP ≤ 300 КБ, проверка типа, зашифрованное хранилище объектов, аудит)","finding":"Карточки производителей показывали только бейдж с инициалами"},{"id":"FR-71","type":"FR","date":"2026-10-11","status":"implemented","group":"Единый источник данных и архитектура","module":"","title":"Экраны операций v5 — из реальных рейсов и заказов БД","change":"Добавить серверный слой представления (`app/v5/live.py`), который строит структуры TRIPS/ORD/VM/DRV/LINES из строк БД (с фильтром по хабу, ключ — номер рейса/заказа в БД), и отдавать его через `GET /api/v5/ops`. Движки используют его вместо справочных ключей. Справочный JSON отдаётся только при `OLYMP_ENV` = demo или `OLYMP_ALLOW_DEMO=1`. Действия v5 находят рейсы и заказы в БД.","finding":"Движки v5 читают только справочные данные (`R.TRIPS`, `R.ORD`, `R.VEH`, `R.LINES`: dispatch.ts:18, shared.ts:50-53, search.ts:28). Ни один движок не вызывает `/api/trips` или `/api/orders`, а каждое действие v5 ищет id в `ctx.R[\"TRIPS\"]`/`ctx.R[\"ORD\"]` (dispatch.py:24-30, docs.py:86-92, load.py:126-132). Поэтому «Обзор», «Диспетчер», «Загрузка», «Отправки», «Документы», «Термостатус» и «Безопасность» даже в продуктиве показывают вымышленный сценарий 06.10.2026, а стартовая страница после входа — `/s/overview` (App.tsx:50)."},{"id":"FR-72","type":"FR","date":"2026-10-11","status":"implemented","group":"Единый источник данных и архитектура","module":"","title":"Устранить совпадение номеров рейсов БД и справочника","change":"Отдельное пространство номеров для рейсов БД: по последовательности `R-<yy>-<nnnn>` или настраиваемый префикс. В демо-сборке справочные рейсы получают префикс `DEMO-`. События входящих несут id рейса в БД, маршрутизатор сначала ищет рейсы БД.","finding":"Рейсы БД нумеруются `R-101…` (operations.py:393) — тот же диапазон, что у справочных рейсов R-102…R-106. Воркер записывает реляционный `trip.number` в события входящих (worker.py:199-200), а маршрутизация входящих сопоставляет их с `R[\"TRIPS\"]` (inbox.py `_route_doc`, ~стр. 332). Реальный рейс БД «R-106» унаследовал бы жёстко заданный список загрузки, окно перепланирования и особые правила Go/No-Go (load.py:117, dispatch.py:16, docs.py:98)."},{"id":"FR-73","type":"FR","date":"2026-10-11","status":"implemented","group":"Единый источник данных и архитектура","module":"","title":"Строки заказа, места и SSCC — отдельные таблицы","change":"Добавить таблицы `order_lines` (артикул, производитель, серия, срок годности, количество, температурный класс) и `packages` (уникальный SSCC, order_line_id, статус собрано/погружено/передано/доставлено/отсутствует, scanned_at, scanned_by). Добавить `Order.m3`, `adr_un`, `third_party`. SSCC генерируется на сервере (префикс компании GS1 из настроек + серийный номер + контрольная цифра mod 10). Эндпоинты сканирования при погрузке и выгрузке (с аудитом).","finding":"У `Order` (models.py:231-249) нет объёма, количества мест, SSCC, ДОПОГ/UN, признака стороннего груза, производителя, срока годности и артикула. Логика v5 для загрузки, отправок и документов зависит именно от этих полей (`o.m3`, `o.adr`, `o.third`, `PKG`, `LINES`: shared.ts:53-80, docs.py:47-68, ship.ts:17-58). Поэтому сверка SSCC, документы ДОПОГ и этикетки для реальных заказов работать не могут."},{"id":"FR-74","type":"FR","date":"2026-10-11","status":"implemented","group":"Единый источник данных и архитектура","module":"","title":"Перенести операционное состояние v5 из одного JSON-документа в таблицы","change":"Перенести ключи каждого модуля в таблицы с id из БД (trip_release, trip_document, load_plan, сканы мест, инциденты, передачи) с блокировкой на уровне строк. `/state` возвращает только хабы пользователя. Пагинация offset/total для рейсов и заказов. Серверный эндпоинт поиска (№ заказа, серия, SSCC; ввод со сканера GS1).","finding":"Всё состояние v5 — одна JSON-строка (router.py:31,53-63). Каждое действие блокирует эту строку для всех хабов (router.py:100), а полный документ возвращается после каждого действия (router.py:114) и через `/state` всем сотрудникам без фильтра по хабу (router.py:76-81). Лимиты рассчитаны на демо, а не на автопарк: 50 дополнительных инцидентов, затем 409 «Too many open incidents» (security.py:45-48). Списки молча обрезаются: `/api/trips` — лимит 100 без смещения (operations.py:329-343), «Диспетчер» загружает 200 открытых заказов (Operations.tsx:21), а поиск перебирает все `LINES` в клиенте (search.ts:28)."},{"id":"FR-75","type":"FR","date":"2026-10-11","status":"implemented","group":"Единый источник данных и архитектура","module":"","title":"Версионная история документа и архивные таблицы вместо молчаливого обрезания списков","change":"Добавить `v5_doc_history(version, ts, actor, action, patch JSONB)`, записываемую в той же транзакции, что и каждый `/act` и `apply_external_event`. Архивные таблицы `v5_archive_<kind>(id, hub, day, payload JSONB)`, куда обрезанные записи переносятся, а не удаляются. Ключ дня (`opsDay`) и ночное задание перехода дня, архивирующее закрытые рейсы. `GET /api/v5/history?entity=&from=` (аудитор).","finding":"Растущие списки молча обрезаются: журнал операций 8 (`registry.py:18, 80`), входящие 200, штрафы 100, заявки 100 (`inbox.py:47-53`), события водителя 200 (`driver.py:36`), SMS 100 (`coverage.py` `LOG_MAX/OUT_MAX`). Вытесненные штрафы, сервисные заявки и события ePOD (финансовые и GDP-доказательства) остаются потом только как детали аудита ≤ 80 символов (`registry.py:84`). Нет предыдущего состояния `v5_doc`, нет многодневной работы и нет «показать 05.10»."},{"id":"FR-76","type":"FR","date":"2026-10-11","status":"implemented","group":"Единый источник данных и архитектура","module":"","title":"Заменить фиксированную дату сценария серверной рабочей датой","change":"Сервер передаёт `business_date` и `now` в `/api/v5/state`: в продуктиве — реальную дату РК, дату сценария — только в демо. Все движки и модули используют её. Нет данных прогноза → контроль жёлтый («нет данных»), а не зелёный. Метки времени документов и событий берутся из сохранённого серверного времени.","finding":"Фронтенд фиксирует `TODAY = 06.10.2026` (core.ts:60-62); от неё считаются сроки прав, калибровки и сборов, а список соответствия в бэкенде использует реальную дату (resources.py:413) — значения расходятся. Погода содержит 7 справочных дней с 06.10, а `wx_risk` пропускает индексы ≥ 7 (docs.py:76-78, dispatch.py:41-44), поэтому погодный контроль без данных молча зелёный. Дата документа `06.10.2026` (docs.ts:101) и время track & trace `05.10 18:20 … 08.10 06:00` (ship.ts:36-58) заданы жёстко. Журнал операций использует часы клиента (registry.py:66-68,77-78)."},{"id":"FR-77","type":"FR","date":"2026-10-11","status":"implemented","group":"Единый источник данных и архитектура","module":"","title":"Настоящие миграции БД (Alembic) вместо `create_all`","change":"Внедрить Alembic с базовой ревизией, равной текущей схеме. Сервис `migrate` выполняет `alembic upgrade head`, затем права и триггеры. CI проверяет `alembic check` (модели vs миграции) и выполняет upgrade и downgrade на пустой БД.","finding":"`init-db` выполняет `Base.metadata.create_all(engine)` (`backend/app/cli.py:54`). Он создаёт недостающие таблицы, но никогда не изменяет существующие (новые колонки, типы, переход JSON→JSONB из C05, индексы). `DEPLOYMENT.md` §5 обещает «migrate runs automatically» при `git pull && up --build` — для изменённых таблиц это неверно."},{"id":"FR-78","type":"FR","date":"2026-10-11","status":"implemented","group":"Единый источник данных и архитектура","module":"","title":"Справочные мастер-данные — редактируемые и версионные","change":"Таблицы БД + экраны администрирования (CRUD) с аудитом: ТС (расширить `Vehicle`: ОГПО, КАСКО, техосмотр, калибровка логгера, допуск ДОПОГ), партнёры (+ контакты, B14), календарь персонала, параметры затрат с `valid_from` (история сохраняется для отчётов по затратам). Изменение уровня или тарифа — с согласованием «четыре глаза». `/api/v5/ref` читает из БД, справочный JSON — только начальные данные.","finding":"Операционные мастер-данные доступны только для чтения в `be/v5/reference/mock-v5.*.json`: PARTNERS (уровень, SLA, мощность, тарифы, окончание договора, страхование), FEES (сроки ОГПО, КАСКО и техосмотра ТС), STAFF/LIC/TACHO, CP (дизель, МРП, оклады), COWN, BLEX, CAPR. Константы сценария: `NOW_YM` (`partners.py:29`), `TODAY` (`staff.py:16`). У автопарка вообще нет действий (`be/v5/modules/fleet.py:10-12`). Входящие проверяют ТС только по справочному `VM`, поэтому реальные коды ТС отклоняются с `err=\"veh\"` (`inbox.py:219-221`, `:283`)."},{"id":"FR-79","type":"FR","date":"2026-10-11","status":"implemented","group":"Единый источник данных и архитектура","module":"","title":"Начальные данные — через сервисные правила, плюс проверка согласованности","change":"Заполнять начальные данные через сервисные функции (`create_trip`/`_attach_orders`/`confirm`). Добавить `python -m app.cli check-consistency`: класс vs ТС, точки чужого хаба, заказы без точек, точки без заказов, документ v5 vs БД. Запускать в CI после заполнения.","finding":"Начальные данные нарушают собственные правила платформы. Заказ заморозки З-2295 запланирован на изотермическое V02 (seed.py:157-160 vs operations.py:363-364). Все 10 справочных заказов запланированы на R-106, а v5 отмечает 6 (load.py:118). У R-103 (хаб AST) есть точка в Алматы, относящаяся к хабу ALA (seed.py:152; запрещено operations.py:359-360). Учётная запись приложения водителя связана с D2 (seed.py:239), а водитель R-103 — D3 (seed.py:152), поэтому `driver.v01` не видит рейс, который симулирует приложение водителя."},{"id":"FR-80","type":"FR","date":"2026-10-11","status":"implemented","group":"Единый источник данных и архитектура","module":"","title":"Номера документов без гонок","change":"Последовательности PostgreSQL по типу документа (опционально по году), напр. `ORD-26-000123`, `BK-26-000045`.","finding":"Номера заказов, рейсов и бронирований берутся из `COUNT(*)` (operations.py:220-226, booking.py:83-87). Два параллельных создания вычисляют одинаковый номер, и второй запрос падает с IntegrityError (HTTP 500)."},{"id":"FR-81","type":"FR","date":"2026-10-11","status":"implemented","group":"Безопасность и защита данных","module":"","title":"Серверная проекция ответов `/api/v5/state` и `/act` по хабу и роли","change":"Добавить `project(doc, principal, hub)` в `v5/router.py`: удалять разделы, которые роль не вправе читать (напр. `cAp/cApBy` без `costs:read`, `fineSt/fineInbox` без `fines:write`/`overview:read`, `smsOut` без `trips:write`), и фильтровать привязанные к хабу записи (`inbox`, `inc`, `tickets`, `covContact`, `drvEv`) по `ctx.hub`. Применять к `/state`, `/act` и ответу `reset`. Каждый модуль объявляет свою проекцию рядом со своим разделом `@initial`.","finding":"`GET /api/v5/state` возвращает полный операционный документ любой роли сотрудника (`backend/app/v5/router.py:76-81`), а `/act` возвращает его снова (`router.py:114`). Ограничение чтения по хабу есть только в браузере (`frontend/src/v5/engine/core.ts:100-102`, `hubOk`), поэтому диспетчер Астаны, водитель или наблюдатель получают в JSON инциденты, штрафы, согласования затрат и журналы SMS Алматы."},{"id":"FR-82","type":"FR","date":"2026-10-11","status":"implemented","group":"Безопасность и защита данных","module":"","title":"Контакты партнёров и кадровые данные — вне справочной выдачи","change":"Перенести контакты в `partner_contact` с `phone_enc`/`mobile_enc` (криптоконтекст `partner_contact.<col>:<id>`), маскированный показ и раскрытие с аудитом (`partners:write`). `/ref` и `/state` фильтруются по правам и хабу: водитель получает только срез своего рейса (B05), ключи штрафов и кадров требуют `fines:write`/`drivers:write`.","finding":"Имена и мобильные номера контактов партнёров хранятся открытым текстом в справочном JSON репозитория (`PARTNERS[].contacts`). Они без фильтра отдаются любой роли сотрудника, включая водителей, через `GET /api/v5/ref` (`be/v5/router.py:71-73`). `GET /api/v5/state` возвращает весь документ (штрафы с привязанными водителями, назначения персонала, все хабы) любой роли сотрудника (`router.py:76-81`). Это противоречит правилу 3 CLAUDE.md (телефон зашифрован, привязан к таблице, колонке и id строки) и ограничению по хабу."},{"id":"FR-83","type":"FR","date":"2026-10-11","status":"implemented","group":"Безопасность и защита данных","module":"","title":"Привязать приложение водителя к собственному рейсу водителя","change":"Определять рейс по `Driver.user_id` → активный рейс (статус loading или in_transit) и его точки. Все данные действий несут id рейса, точки или строки, который проверяется по этому рейсу. Состояние по рейсу заменяет глобальные ключи `drvStep`, `dScan`, `dChk` и другие.","finding":"Каждое действие приложения водителя жёстко привязано к `TRIP, VEH, HUB = \"R-103\", \"V01\", \"ast\"` (`be/v5/modules/driver.py:29`, `:113-116`), поэтому любая учётная запись с `driver:app` действует по R-103. `Driver.user_id` существует, но не используется (`be/models.py:216`). Заглушка SMS тоже принимает только V01/R-103 (`be/v5/modules/coverage.py:276`). Уже внесено в ROADMAP v0.3, но не запланировано."},{"id":"FR-84","type":"FR","date":"2026-10-11","status":"implemented","group":"Безопасность и защита данных","module":"","title":"Никакой симулированной телеметрии и кнопок симуляции тревог в продуктиве","change":"Включать `tick` и `SimButtons` только при `DEMO || settings.training_mode` (серверный флаг в `/api/v5/state`). В продуктиве заполнять `ui.live` из `temperature_readings` (синхронизация Wialon, `integrations/worker.py:90`) через `GET /api/v5/telemetry?since=`. Показывать возраст каждого показания и состояние «нет данных» вместо начальных данных. Каждое симулированное значение несёт видимую метку «СИМУЛЯЦИЯ».","finding":"`tick()` в любой сборке каждые 2 с генерирует температуры рефагрегатов через `Math.random()` (`V5.tsx:37-57`, `V5.tsx:97-102`, без защиты `DEMO`). «Термостатус», «Обзор» и «Качество» показывают эти значения. `<SimButtons/>` («Симуляция тревог») отображается в боковой панели продуктива (`Layout.tsx:61`). Оператор холодовой цепи по GDP может действовать по вымышленным температурам или документировать их."},{"id":"FR-85","type":"FR","date":"2026-10-11","status":"implemented","group":"Безопасность и защита данных","module":"","title":"Бизнес-роли для согласований; привязка слотов подписи к роли согласующего","change":"Добавить роли `manager` (approvals:sign, costs:approve, costs:read), `finance` (fines:write, costs:approve, costs:read) и `quality` (quality:write, temperature:read, alarms:read). Добавить `users.functions` (`head_logistics`, `fin_controller`, `qa_manager`). `costs.sign` / `baseline.exSign` проверяют `ctx.principal.has_function(CAPR_FN[i])`. Обновить `help/roles.ts` (см. C21).","finding":"`approvals:sign`, `costs:approve` и `fines:write` есть только у `admin` (`rbac.py:263-286`), а администраторы должны быть глобальными с `users:admin` (SECURITY.md §10). Поэтому согласование «четыре глаза» требует двух полных администраторов, а у финансового менеджера и менеджера по качеству нет роли. Слот «руководитель логистики» vs «финансовый контролёр» (`CAPR`) не привязан к подписанту: любой держатель `costs:approve` может подписать любой слот (`costs.py:42-52`)."},{"id":"FR-86","type":"FR","date":"2026-10-11","status":"implemented","group":"Безопасность и защита данных","module":"","title":"Реализовать ротацию `data_key` и задание перешифрования","change":"Поддержка нескольких ключей (`OLYMP_DATA_KEYS_DIR` с `data_key_v1`, `data_key_v2`; шифрование новейшим, расшифровка по байту версии). `python -m app.cli reencrypt --batch 500` (идемпотентно, с возобновлением, аудит только счётчиками). Та же схема для `index_key` (перестроение слепых индексов). Раздел регламента с шагами и проверкой.","finding":"`docs/DEPLOYMENT.md` §7 гласит, что ротация ключа данных «requires a re-encryption job (planned for v0.2)». v0.2.0 вышла без него, хотя байт версии ключа существует (`security/crypto.py`, формат `\\x01‖nonce‖ct`). SECURITY.md §9.5 требует ежегодной ротации или ротации при подозрении на утечку, поэтому регламент инцидентов (§6, «перешифровать персональные данные новым ключом») невыполним."},{"id":"FR-87","type":"FR","date":"2026-10-11","status":"implemented","group":"Безопасность и защита данных","module":"","title":"Агрегированный аудит отклонённых входящих запросов","change":"Считать отказы в таблице `security_counters(source, ip_hash, reason, window_start, n)`. Писать одну запись аудита на (источник, причина, окно 10 мин) со счётчиком плюс первый отказ по каждому IP. Оповещение выше порога (C12). Перенести проверку ограничения по IP перед проверкой подписи, чтобы отказ происходил до любой записи в БД.","finding":"Каждый отклонённый неаутентифицированный запрос на `/api/v1/inbound/{source}` пишется в журнал аудита только на добавление с хеш-цепочкой (`routers/integrations.py:57-58`). Каждая запись берёт глобальную advisory-блокировку (`audit.py:63`). При разрешённых 240 запросах/мин с IP (SECURITY.md §9a) один злоумышленник может добавить ≈345 тыс. неудаляемых строк в сутки с IP и конкурировать за блокировку, нужную каждому действию пользователя."},{"id":"FR-88","type":"FR","date":"2026-10-11","status":"implemented","group":"Безопасность и защита данных","module":"","title":"Реализовать задокументированную очистку `inbound_nonce`","change":"Задача воркера `prune-nonces` (ежечасно): `DELETE FROM inbound_nonce WHERE created_at < now() - interval '25 hours'`. Хранить 25 ч, чтобы всегда покрывать окно ±5 мин плюс схему ATI. Индекс на `(source, created_at)`.","finding":"`integrations/models.py:7` и `integrations/inbound.py:10` утверждают, что nonce «хранятся 24 ч / удаляются через 1 день», но никакой код не удаляет из `inbound_nonce` (только вставка и поиск в `routers/integrations.py:64-73`). Таблица растёт без ограничений, а проверка существования под advisory-блокировкой замедляется."},{"id":"FR-89","type":"FR","date":"2026-10-11","status":"implemented","group":"Безопасность и защита данных","module":"","title":"Имена людей — вне `v5_doc` (или шифровать) и поддержка удаления","change":"Хранить в документе только `user_id` / `person_ref`, а отображаемые имена получать при чтении через поиск с проверкой прав. Подписи получателей (ePOD) — в зашифрованную таблицу `epod`, привязанную к id строки. Добавить `python -m app.cli erase-person <ref>`, псевдонимизирующий записи истории и архива, с аудитом. Добавить CI-проверку, отклоняющую новые записи `ctx.display_name` в документ.","finding":"Операционный документ хранит персональные данные открытым JSON вне `security/crypto.py`: отображаемые имена подписантов (`cApBy[].name`, `costs.py:52`, а также согласования партнёров и исходных данных), имена получателей в событиях и текстах ePOD («подпись Г. Абдрахмановой», `driver.py:57`) и имена в текстах журнала операций. Они попадают и в резервные копии и историю (C06). Пути удаления нет, тогда как в CRM есть «анонимизировать» (SECURITY.md §9a)."},{"id":"FR-90","type":"FR","date":"2026-10-11","status":"implemented","group":"Безопасность и защита данных","module":"","title":"Постоянная идемпотентность внешних событий","change":"Таблица `external_event(source, ref, inbox_id, received_at)` с ограничением UNIQUE на (source, ref). `apply_external_event` вставляет в неё в той же транзакции, что и обновление документа, 409 даёт ограничение. `coverage.raise_alarms` (`coverage.py:259`) и `inbox.demo` используют ту же проверку. Хранение не менее 13 месяцев, чтобы ежегодные тендеры и штрафы оставались без дублей.","finding":"Дедупликация ищет только в обрезанном списке `doc[\"inbox\"]`: проверка в `be/v5/modules/inbox.py:123`, список ограничен INBOX_MAX=200 (`:46`/`:127`). После 200 более новых событий повторно доставленные ref снова принимаются. Источники повторной доставки: 1-минутное перекрытие Wialon (`be/integrations/worker.py:216`), повторы вебхуков и опрос goszakup, который каждый день возвращает те же открытые тендеры (до 10 × 50, `goszakup.py:32`, `worker.py:247-258`). Каждый повторно принятый ref создаёт дубли штрафов, сервисных заявок, инцидентов и лидов CRM."},{"id":"FR-91","type":"FR","date":"2026-10-11","status":"implemented","group":"Процесс рейса, диспетчеризация и выпуск Go/No-Go","module":"","title":"Обязательный выпуск Go/No-Go при реальном переходе к отправлению","change":"Переход в `in_transit` требует действующего выпуска, а сервер заново оценивает все контроли в момент перехода. Право переопределения (`trips:override_release`) с причиной не короче 10 символов, с аудитом списка непройденных контролей. Действие `docs.revoke`, срабатывающее автоматически, если контроль становится критическим до отправления.","finding":"`set_trip_status` переводит рейс `loading → in_transit`, как только заданы ТС и водитель (operations.py:421-432). Выпуск Go/No-Go лишь записывает `doc[\"released\"]` (docs.py:212-222), работает только для справочных рейсов и не может быть отозван, если контроль позже становится красным (например, новая критическая тревога)."},{"id":"FR-92","type":"FR","date":"2026-10-11","status":"implemented","group":"Процесс рейса, диспетчеризация и выпуск Go/No-Go","module":"","title":"Заменить жёстко заданные и текстовые контроли выпуска проверками данных","change":"Контроли вычисляются из БД: (a) водитель активен, `license_until` и `adr_until` не раньше даты ETA рейса, есть документ медосмотра; (b) каждый класс заказа входит в `vehicle.temp_classes`; (c) дата калибровки логгера хранится в колонке даты; (d) ДОПОГ и сверка оцениваются для каждого рейса; (e) «документы комплектны» читается из строк `state_document` (ТТН, путевой лист, ЭСФ/СНТ при участии третьей стороны). Удалить дубликат v5 `docSt`.","finding":"Ряд контролей не проверяет реальные данные: «Водитель допущен» всегда `True` (docs.py:138); «Подходит для температурного класса» проверяет только `veh.thermo`, а не классы заказов (docs.py:137); любой документ рейса не в `plan` считается готовым (docs.py:128); калибровка логгера — регулярное выражение по локализованному тексту (docs.py:33,132); ДОПОГ и сверка оцениваются только для R-106 (docs.py:98,141,143). Статус документов хранится в `doc[\"docs\"]/[\"docSt\"]` (docs.py:123-129,185-209) и дублирует таблицу `state_document` (INTEGRATIONS.md «State documents»)."},{"id":"FR-93","type":"FR","date":"2026-10-11","status":"implemented","group":"Процесс рейса, диспетчеризация и выпуск Go/No-Go","module":"","title":"Серверная проверка ресурсов и двойного назначения","change":"В create, assign и новом PATCH (A07) отклонять: `vehicle.status ≠ active`; водитель неактивен или права истекают до ETA; заказы ДОПОГ, если `adr_until` раньше ETA; пересечение [planned_departure, eta] с другим неотменённым и недоставленным рейсом того же ТС или водителя. Ошибки возвращают 409 с кодом причины.","finding":"`create_trip` проверяет только принадлежность ТС и водителя хабу (operations.py:387-391). UI скрывает ТС не в статусе `active` и неактивных водителей (Operations.tsx:83,91), а API — нет, поэтому подделанный запрос принимается. Ни одна сторона не мешает поставить одно ТС или одного водителя на два пересекающихся рейса или отдать заказ ДОПОГ водителю без действующего свидетельства ДОПОГ."},{"id":"FR-94","type":"FR","date":"2026-10-11","status":"implemented","group":"Процесс рейса, диспетчеризация и выпуск Go/No-Go","module":"","title":"Редактирование, перепланирование и снятие назначений в существующих рейсах","change":"Добавить `PATCH /api/trips/{id}` (ТС, водитель, planned_departure, eta, примечание) в статусах planning/loading с повторной проверкой вместимости и A06. Добавить `DELETE /api/trips/{id}/orders/{oid}` (заказ → новый; точка удаляется, если по этому адресу не осталось других заказов). Добавить `PUT /api/trips/{id}/stops` для изменения порядка. Обобщить `dispatch.replan`: любой рейс, новая дата и время выезда, причина (погода/дорога/ТС/клиент), запись `Trip.planned_departure`/`eta`. Отправлять `shipment.status_changed` / изменение ETA.","finding":"После создания рейс нельзя изменить: в маршрутизаторе есть только create, assign, status и deliver (operations.py:382-484). Нельзя сменить ТС, водителя или время, убрать заказ или переставить точки. Перепланирование v5 работает только для R-106 и только до индекса дня 4 (dispatch.py:16,67-84), а результат — жёстко заданная строка `'10.10 · 06:00'` (shared.ts:280-284)."},{"id":"FR-95","type":"FR","date":"2026-10-11","status":"implemented","group":"Процесс рейса, диспетчеризация и выпуск Go/No-Go","module":"","title":"Согласованная отмена заказа с точкой и бронированием","change":"При отмене: удалять точку, если по этому адресу в рейсе не осталось других заказов; переводить связанное бронирование в `cancelled` с причиной (новый переход confirmed→cancelled, эндпоинт стойки `POST /api/bookings/{n}/cancel`); отправлять `booking.cancelled` и `shipment.cancelled`.","finding":"`cancel_order` устанавливает `trip_id=None`, но оставляет `TripStop` (operations.py:254-266). Рейс после этого нельзя закрыть, потому что каждая точка должна быть доставлена (operations.py:429-430,476). Связанное бронирование остаётся `confirmed` и продолжает занимать мощность (booking.py:30,50-54). Клиент не получает вебхук. У диспетчерской нет эндпоинта для отмены подтверждённого бронирования."},{"id":"FR-96","type":"FR","date":"2026-10-11","status":"implemented","group":"Процесс рейса, диспетчеризация и выпуск Go/No-Go","module":"","title":"Переносить забронированный рейс по графику в заказ и планировать рейсы по отправлениям","change":"Добавить `Order.schedule_id`, `departure_date` и `booking_id`. В «Диспетчере» — «Создать рейс на отправление»: подставляет хаб, все подтверждённые заказы этой линии и даты и плановый выезд по времени графика. Добавить `Schedule.capacity_kg` с проверкой в `create_booking`. Предупреждение, если забронированные паллеты превышают паллеты назначенного ТС.","finding":"`confirm()` создаёт заказ без линии и даты отправления (booking.py:143-145), а у `Order` нет для них поля (models.py:231-249), поэтому диспетчер не видит, какое отправление забронировал клиент. Мощность линии (`Schedule.pallets_capacity`, models.py:433) не зависит от фактически назначенного ТС, а вес никогда не проверяется по линии."},{"id":"FR-97","type":"FR","date":"2026-10-11","status":"implemented","group":"Процесс рейса, диспетчеризация и выпуск Go/No-Go","module":"","title":"Исключения по отправлениям и единый горизонт бронирования","change":"Таблица `schedule_exceptions` (дата, отменено/дополнительно, причина), используемая `slots()` и `create_booking`. Одна константа горизонта для обоих. `confirm()` повторно проверяет линию, класс и пункт назначения. Отмена отправления уведомляет его бронирования вебхуком и выводит их на стойке.","finding":"Слоты показываются на 14 дней (booking.py:57,65), а бронирования принимаются до 21 дня (booking.py:104). Праздники и отменённые отправления выразить нельзя, поэтому портал и партнёрский API продают отправления, которые не состоятся. `confirm()` не перепроверяет, активна ли линия и обслуживает ли она ещё пункт назначения (booking.py:140-142)."},{"id":"FR-98","type":"FR","date":"2026-10-11","status":"implemented","group":"Процесс рейса, диспетчеризация и выпуск Go/No-Go","module":"","title":"Дополнить недостающие переходы статусов","change":"Статусы заказа: loaded (все места отсканированы при погрузке), partially_delivered, refused, returned, handed_over. Эндпоинт точки `arrive` с `arrived_at` (время простоя, окно склада 9–17). Статус рейса `aborted` из in_transit с причиной и обязательной ссылкой на тревогу/отклонение. Оставшиеся заказы возвращаются в `new` или переходят на спасательный рейс. Одна таблица переходов для API и v5.","finding":"`OrderStatus.loaded` никогда не устанавливается: погрузка отображается в `planned` (models.py:65, operations.py:318-323). `StopStatus.arrived` никогда не устанавливается, эндпоинта прибытия нет (models.py:81). Нет частичной доставки, отказа и возврата. Рейс в пути может перейти только в delivered (operations.py:314), поэтому ДТП, поломку с перегрузкой или полную потерю температуры смоделировать нельзя."},{"id":"FR-99","type":"FR","date":"2026-10-11","status":"implemented","group":"Процесс рейса, диспетчеризация и выпуск Go/No-Go","module":"","title":"Серверный расчёт загрузки для любого рейса и ТС","change":"Перенести `loadCalc` и `vehicleMatch` в `app/loadcalc.py` с параметрами — заказы рейса и профиль ТС (trucks.json + новые поля Vehicle: зоны, паллетоместа по камерам, места термоконтейнеров, модель осей). Использовать в `assign_orders`, `load.plan` и контроле выпуска. Добавить `GET /api/trips/{id}/load`, который отображает экран.","finding":"Расчёт загрузки существует только в браузере и привязан к R-106 на V02: `loadCalc` (shared.ts:43-50), профиль по умолчанию (trucks.ts:74-76), проверка вместимости только для R-106 (dispatch.ts:50,88-89), `LOAD_TRIP` (load.py:117), а `dispatch.assign` всегда целит в R-106 и только заказы Астаны (dispatch.py:87-99, dispatch.ts:96). Серверный `load.plan` сохраняет тип ТС без проверки размещения (load.py:206-258), а `_attach_orders` проверяет только общий вес и паллеты, игнорируя камеры, м³ и нагрузки на оси (operations.py:367-372)."},{"id":"FR-100","type":"FR","date":"2026-10-11","status":"implemented","group":"Процесс рейса, диспетчеризация и выпуск Go/No-Go","module":"","title":"Исправить «рейсы сегодня» и счётчики тревог","change":"Фильтровать рейсы по пересечению `planned_departure`/`eta` с сегодняшним днём по времени РК. Считать тревоги по уровню через SQL `COUNT … GROUP BY`. Список из 20 строк оставить только для отображения.","finding":"`trips_today` считает все когда-либо созданные неотменённые рейсы (operations.py:132-136,150). `open_alarms` и `critical_alarms` считаются по списку, ограниченному 20 строками (operations.py:140-142,153-154), поэтому KPI никогда не превышает 20, а число критичных неполное."},{"id":"FR-101","type":"FR","date":"2026-10-11","status":"implemented","group":"Холодовая цепь, тревоги и качество","module":"","title":"Единое хранилище тревог и инцидентов","change":"Сделать `Alarm` единственным хранилищем: добавить источник, ключ дедупликации, уровень 1–3, эскалацию, поля инцидента и категорию закрытия. «Безопасность» v5 и список тревог «Обзора» читают `/api/alarms`; действия с инцидентами v5 обновляют ту же строку. Риски погоды/загрузки/дорог показывать как «риски» отдельно от тревог. Симуляцию телеметрии запускать только в демо.","finding":"Существуют две независимые системы тревог. Одна — реляционная таблица `Alarm` (models.py:296-309; /alarms; классический «Обзор»). Другая — список v5, вычисляемый в браузере из симулированной телеметрии, справочной погоды и `extraInc` (shared.ts:227-258; такт симуляции V5.tsx:97-101, работающий и в продуктиве). Тревога Wialon создаёт и строку `Alarm`, и инцидент v5 (worker.py:203-207), которые подтверждаются и закрываются раздельно (resources.py:379-394 vs security.py:73-88)."},{"id":"FR-102","type":"FR","date":"2026-10-11","status":"implemented","group":"Холодовая цепь, тревоги и качество","module":"","title":"Привязка датчиков к камерам и оценка тревог для всех источников показаний","change":"Привязка `vehicle_sensors` (датчик телематики → камера/температурный класс). Общая `evaluate_reading()` для ручного ввода, воркера и импорта термохрона: одна открытая тревога на ТС+камеру, обновляемая максимальным отклонением и длительностью, с гистерезисом перед автозакрытием. Загрузка термохрона сохраняет показания с `source=thermochron`. «Термостатус» читает последнее показание по каждой камере из БД.","finding":"Импорт воркера сохраняет показания, но никогда не поднимает тревоги (worker.py:104-116); это делает только ручной ввод (resources.py:289-302), причём на каждое показание вне диапазона создаётся новая тревога без дедупликации. Воркер относит единственный датчик к самому холодному классу (worker.py:107-108), поэтому +5 °C из камеры 2–8 °C у V01 сохраняется как показание `frozen` вне диапазона. Импорт термохрона — лишь флаг (thermo.py:17-34) и не сохраняет показания. Экран «Термостатус» v5 показывает симулированные значения (shared.ts:214-224)."},{"id":"FR-103","type":"FR","date":"2026-10-11","status":"implemented","group":"Холодовая цепь, тревоги и качество","module":"","title":"Карантин качества для заказов, затронутых отклонением","change":"Таблица `deviation`, создаваемая из температурной тревоги, с затронутыми заказами = заказы этого ТС и камеры в окне отклонения; устанавливает `Order.quality_hold`. Доставка заказа в карантине отклоняется (409) или фиксируется как «доставлено в карантин». Решение ОК снимает карантин (выпуск) или ставит refused/returned (блокировка). Вебхук `shipment.temperature_excursion` (без сырых персональных данных).","finding":"Тревоги ссылаются только на рейс и ТС (models.py:303-304), но не на затронутые заказы. Решение ОК о выпуске/блокировке применяется только к статическим id отклонений (quality.py:78,96-118) и ничего не меняет в операциях. `deliver_stop` не проверяет карантин качества (operations.py:461-477). Клиент видит только последнее показание (partner_api.py `shipment_dict`)."},{"id":"FR-104","type":"FR","date":"2026-10-11","status":"implemented","group":"Холодовая цепь, тревоги и качество","module":"","title":"Единая служба эскалации для каждого события уровня 3","change":"Хук на `push_incident` для lvl ≥ 3 в таблицу outbox. Доставка: подписанный вебхук партнёра, SMS на номер дежурного (SMSC), e-mail. Таймер эскалации: нет подтверждения за 5 мин (настраивается) → следующий уровень (руководитель СБ, затем генеральный директор). Каждый шаг аудируется. Без персональных данных в сообщениях.","finding":"Партнёру по безопасности эскалируются только события безопасности Wialon (`be/integrations/worker.py:194-215`). События, которые лишь создают инцидент в UI: SOS по SMS (`coverage.py:322-323`), SOS из приложения водителя (`driver.py:343-348`), ДТП по SMS (`coverage.py:329-330`) и потеря связи с холодовым грузом уровня 3 (`coverage.py:229`). Метка `esc=\"guard\"` (`inbox.py:317`) ничего не запускает. Ночью, когда никто не смотрит на экран, никто не оповещается."},{"id":"FR-105","type":"FR","date":"2026-10-11","status":"implemented","group":"Холодовая цепь, тревоги и качество","module":"","title":"SOS от реального водителя/ТС; явный хаб; обязательное описание закрытия","change":"SOS использует активный рейс, ТС и последнюю позицию GPS/OL1 вошедшего водителя. У инцидентов явный `hub_id`. Закрытие/устранение требует категорию и ≥ 10 символов текста. Инциденты уровня 3 должны быть подтверждены до закрытия.","finding":"Паника/SOS всегда создаёт «V01 · A. Nurlanov · km 168» (security.py:26,60-66), кто бы ни нажал. Хаб инцидента разбирается из префикса текста (security.py:29-33), поэтому инциденты без ТС доступны пользователям любого хаба. Закрытие инцидента (security.py:73-88) и устранение тревоги (resources.py:342-343,391) не требуют текста решения."},{"id":"FR-106","type":"FR","date":"2026-10-11","status":"implemented","group":"Холодовая цепь, тревоги и качество","module":"","title":"Реальный импорт прогноза вместо метки времени обновления","change":"Задача воркера `forecast` (только воркер интеграций; только координаты городов, без персональных данных; хост — в список разрешённых исходящих), сохраняет по городу/дню: мин/макс, ветер, явления, уровень по `WX_RULES`. `wxRisk` и контроль читают таблицу. Прогноз старше 6 ч → предупреждение об устаревании, контроль становится жёлтым.","finding":"`weather.refresh` только ставит время (weather.py:58-65), а `WX` — статический справочник. От него зависят риск в «Диспетчере», список тревог и контроль Go/No-Go (dispatch.py:37-46, docs.py:71-83,144)."},{"id":"FR-107","type":"FR","date":"2026-10-11","status":"implemented","group":"Доставка, приложение водителя, покрытие связи и SMS","module":"","title":"Связать ePOD приложения водителя с доставкой точки и статусом заказа","change":"Таблица `epod`: id точки, имя получателя (зашифровано, контекст привязан к строке), id объектов подписи/фото, отсканированные vs ожидаемые места, исключения по местам (dmg/short/ref), arrived_at/left_at, температура камеры при передаче. Приложение водителя работает с собственным рейсом вошедшего водителя в БД (`Driver.user_id`). Завершение ePOD выполняет логику `deliver_stop`, отмечает документ `epod` готовым, а исключения запускают A12/A15.","finding":"Модуль приложения водителя жёстко привязан к R-103/V01 (driver.py:27). Завершение сценария точки (`driver.step` достигает 4) лишь добавляет событие (driver.py:181-195). Реляционная точка остаётся в ожидании, заказы не переводятся в «доставлено», трекинг и вебхуки не срабатывают. Документ `epod` всегда «wait» (docs.py:121,127). `deliver_stop` сохраняет только метку времени: без получателя, подписи, количества мест и температуры камеры (operations.py:461-484)."},{"id":"FR-108","type":"FR","date":"2026-10-11","status":"implemented","group":"Доставка, приложение водителя, покрытие связи и SMS","module":"","title":"ePOD с юридически значимыми доказательствами","change":"Запись ePOD по каждой точке: время фиксации на устройстве + время получения сервером, GPS, ФИО и должность получателя, изображение подписи и фото (в локальном объектном хранилище, SHA-256 в записи и журнале аудита), отсканированные vs ожидаемые SSCC, исключения, результат термохрона. SMS `ST` устанавливает `pod_status=preliminary_sms`, который становится `final` только после полной синхронизации. ePOD партнёра загружается учётной записью портала партнёра или помечается «внесено от имени» с причиной и сканом.","finding":"ePOD — это счётчик: шаги «фото» и «подпись» лишь увеличивают `drvStep` (`be/v5/modules/driver.py:181-197`). Имя подписанта — статическая строка (`fe/v5/engine/driver.ts:22`). Офлайн-события из очереди получают **серверное** время при синхронизации (`driver.py:125`). SMS `ST` создаёт пустую заглушку `epod` (`be/v5/modules/coverage.py:283-287`). Шаг «Загрузить ePOD» в портале партнёра нажимают наши же сотрудники с `partners:write` (`be/v5/modules/partners.py:225-234`). В споре по GDP или с клиентом это не выдержит проверки."},{"id":"FR-109","type":"FR","date":"2026-10-11","status":"implemented","group":"Доставка, приложение водителя, покрытие связи и SMS","module":"","title":"Контроль всех ТС по телематике, а не только по приложению","change":"Воркер каждую минуту пишет время последнего сообщения Wialon и позицию по каждому объекту в `covContact[veh]` (поле `tm`). Последний контакт = самый свежий из приложения, телематики и SMS. Монитор перебирает все ТС рейсов в loading или in_transit. «Нет связи с отправления» считается от фактического времени выезда.","finding":"`covContact` обновляется только приложением водителя (только V01, `be/v5/modules/driver.py:128`, `:339`) и SMS OL1 (`coverage.py:307-311`). `sync_temperatures` и `poll_wialon_alarms` его не затрагивают (`be/integrations/worker.py:90-124`, `:154-219`). `evaluate` пропускает ТС без метки `data` (`coverage.py:215-217`). Поэтому ТС, на котором приложение ни разу не открывали или трекер замолчал, никогда не поднимает тревогу потери связи."},{"id":"FR-110","type":"FR","date":"2026-10-11","status":"implemented","group":"Доставка, приложение водителя, покрытие связи и SMS","module":"","title":"Статус доставки и таймаут подтверждения для SMS диспетчера","change":"Добавить callback статуса SMSC (подписанный, тот же входящий путь) → `delivered`/`undeliverable`. Срок подтверждения по коду: STOP 10 мин, CHKT 15 мин, WAIT, CALL и PARK 30 мин. По таймауту: входящее уровня 2 + задача «позвонить водителю» + опциональная повторная отправка (с учётом лимита 3 SMS / 10 мин).","finding":"Указание проходит только `queued → sent` (`be/v5/modules/coverage.py:409-411`). `AK` лишь сохраняет `ack` (`:335-339`). Неподтверждённое указание STOP или CHKT не порождает тревогу. Отчёты о доставке SMSC запланированы (ROADMAP), но не реализованы."},{"id":"FR-111","type":"FR","date":"2026-10-11","status":"implemented","group":"Доставка, приложение водителя, покрытие связи и SMS","module":"","title":"Определять реальные зоны без связи по пропускам телематики","change":"Сохранять каждый пропуск телематики или приложения > 10 мин (начальная/конечная позиция, оператор, ТС, участок). Ежемесячное задание предлагает смену класса по участку (нужно ≥ N проездов). Аналитик принимает предложение, что устанавливает `conf: verified, source: own telematics`. Карта показывает модель vs измерения.","finding":"Все 23 участка имеют `conf: estimated` (`be/v5/reference/coverage.json`, исследование §1.2). Ожидаемое окно, подавляющее тревоги уровня 2, зависит от этих оценок (`be/v5/modules/coverage.py:225`). Вышки ТТК на республиканских трассах должны появиться до конца 2026 г. (исследование F5), поэтому модель быстро устареет. ROADMAP содержит «изучить реальные зоны без связи», но пропуски сегодня нигде не сохраняются."},{"id":"FR-112","type":"FR","date":"2026-10-11","status":"implemented","group":"Доставка, приложение водителя, покрытие связи и SMS","module":"","title":"ETA по каждой точке и лента событий в трекинге","change":"Добавить `TripStop.eta_planned`/`eta_current` (обновляются перепланированием, прибытиями и воркером маршрутов 2GIS). Трекинг возвращает ETA собственной точки заказа плюс ленту событий без персональных данных (забронирован, запланирован, погружен, выехал, прибыл, доставлен, передан, категория задержки) и признак соблюдения температуры (только да/нет). Вебхук `shipment.eta_changed` при сдвиге ETA более чем на 60 мин.","finding":"Трекинг показывает ETA рейса (последней точки) для каждого заказа многоточечного рейса (public.py:229). ETA не пересчитывается после доставленных точек, задержек или перепланирования. Истории событий нет. После отмены рейса заказ молча возвращается в `new` (operations.py:436-437)."},{"id":"FR-113","type":"FR","date":"2026-10-11","status":"implemented","group":"Доставка, приложение водителя, покрытие связи и SMS","module":"","title":"Отражать передачу партнёру в заказах, точках и трекинге","change":"Передача переводит выбранные заказы/места в `handed_over` (id партнёра, время). Точка собственного рейса отмечается `handed_over` и считается выполненной. Загрузка ePOD партнёром переводит заказ в «доставлено»; публичное событие трекинга «передано перевозчику-партнёру» без персональных данных партнёра.","finding":"`partners.handover` и шаги портала партнёра меняют только документ v5 (partners.py:145-235). Реляционный заказ остаётся на собственном рейсе как `in_transit`, его точка по-прежнему мешает закрыть рейс, а трекинг и вебхуки продолжают показывать наше ТС."},{"id":"FR-114","type":"FR","date":"2026-10-11","status":"implemented","group":"Соответствие требованиям и государственные документы","module":"","title":"Обязательный предрейсовый медосмотр до 01.01.2027","change":"С настраиваемой даты (по умолчанию 2027-01-01) для ТС > 3,5 т: `driver.signSheet` и выпуск Go/No-Go требуют медосмотр с admitted=true и checked_at ≤ 8 ч до выезда (значение уточнить). Путевой лист заполняется из чек-листа и одометра приложения. Хаб интеграций показывает панель сроков с обратным отсчётом до 01.01.2027 и 01.06.2027 и долей рейсов с полными данными путевого листа и ТТН.","finding":"`medcheck` — необязательный ручной государственный документ (`be/routers/integrations.py:365-372`). Путевой лист формируется с возможно пустым `pretrip_medical_check` (`be/integrations/esutd.py:86`), и ничто не блокирует выпуск. Подпись путевого листа в приложении водителя требует только чек-лист (`driver.py:167-178`). В данных путевого листа `pretrip_technical_check` и `odometer_start`/`end` пусты (`esutd.py:85-87`), хотя приложение фиксирует чек-лист и показания одометра (`driver.py:51-55`, `:98-100`)."},{"id":"FR-115","type":"FR","date":"2026-10-11","status":"implemented","group":"Соответствие требованиям и государственные документы","module":"","title":"Данные об опасных грузах и сухом льде по каждой отправке","change":"Добавить `un_number`, `lq` (bool), `dry_ice_kg` и `adr_class` в Order и Booking (портал + API v1 + спецификация). Заполнять из них `dangerous_goods` в ТТН. Проверки передачи, срочного подбора и ТС читают данные заказа. Сверх лимитов LQ: требуются водитель и ТС с допуском ДОПОГ и тахограф (B12).","finding":"В данных ТТН всегда `dangerous_goods: None` (`be/integrations/esutd.py:67`). В API бронирования нет полей опасных грузов (`be/routers/partner_api.py:97-106`). Проверки ДОПОГ при передаче и срочном назначении используют флаги справочных строк (`partners.py:102`, `staff.py:45`). Исследование требует номер ООН, признак LQ и кг сухого льда по каждой отправке (UN 1845, ДОПОГ 5.5.3)."},{"id":"FR-116","type":"FR","date":"2026-10-11","status":"implemented","group":"Соответствие требованиям и государственные документы","module":"","title":"Формировать ЭСФ из доставленного заказа и учитывать входящие счета партнёров","change":"При финальном ePOD (B06) создавать черновик ЭСФ из `Booking.price_net`/`vat` и `Customer.bin` через `esf.invoice_xml`. Использовать одно хранилище (`state_document`) и для экрана документов v5. Тревога по сроку выписки. Реестр входящих (БИН поставщика, № ЭСФ, сумма), связанный с id HO-/SR- и передаваемый в учёт фактических затрат (B18).","finding":"Государственный документ `esf` содержит только `{order, vat_rate:16}`, без суммы, покупателя и даты оборота (`be/routers/integrations.py:380-382`). Экран документов v5 симулирует «отправлено в ИС ЭСФ» в собственном хранилище документов (`be/v5/modules/docs.py:186-195`), то есть существуют два мира ЭСФ. Нет контроля срока выписки ЭСФ после даты оборота (законный срок, уточнить). Стоимость передачи партнёру `n × rate` (`partners.py:182`) и стоимость сервиса никогда не учитываются как входящий счёт."},{"id":"FR-117","type":"FR","date":"2026-10-11","status":"implemented","group":"Соответствие требованиям и государственные документы","module":"","title":"GDP-доказательства для плеч партнёров","change":"GDP-квалификация партнёра (привязка ТС, дата аудита, срок) как мастер-данные. При передаче на обоих концах фиксировать id логгера, температуру и номер пломбы. ePOD партнёра требует считывания логгера или загрузки данных. Отсутствие записи или отклонение автоматически открывает отклонение в «Качестве».","finding":"Проверка передачи — булевы `gdp`/`cold` по партнёру (`partners.py:111-116`). Нет сертификата квалификации и срока его действия, нет записи температуры на плече партнёра, нет считывания логгера при передаче и при доставке партнёром. Портал партнёра — 3 шага нажатий (`partners.py:221-234`). GDP (приказ МЗ ҚР ДСМ-15/2021, Решение ЕЭК № 80) требует непрерывных записей и квалифицированных ТС на каждом плече."},{"id":"FR-118","type":"FR","date":"2026-10-11","status":"implemented","group":"Ресурсы, персонал, партнёры и планирование","module":"","title":"Сервисные заявки определяют доступность ТС и мощность слотов","change":"Календарь доступности ТС (открыта сервисная заявка → недоступно до ETA или закрытия). Сообщения о поломке и дефекте из приложения создают черновик сервисной заявки. Графику назначаются ТС, мощность = min(график, сумма паллет/кг доступных ТС). Если отправление с бронированиями теряет ТС: тревога диспетчеру + вебхук `booking.at_risk` клиенту API.","finding":"`partners.call` меняет только `vehSt` в документе v5 (`be/v5/modules/partners.py:254`). Статус платформы `Vehicle.status` (`be/models.py:204`) остаётся активным. Слоты бронирования используют статическую `Schedule.pallets_capacity`, не связанную ни с одним ТС (`be/booking.py:72`, `:106`, `be/models.py:433`), поэтому клиенты могут бронировать отправления сломанной машины. Поломка в приложении водителя и дефект, заявленный в конце смены, создают только события (`driver.py:295-322`), хотя docstring обещает сервисную заявку (`:312`)."},{"id":"FR-119","type":"FR","date":"2026-10-11","status":"implemented","group":"Ресурсы, персонал, партнёры и планирование","module":"","title":"Рассчитывать 7-дневный план мощностей по реальным данным","change":"`GET /api/v5/plan?days=7` считает спрос по бронированиям и заказам на дату отправления (паллеты, кг, температурный класс). Предложение — из календаря ТС (B10) и доступности водителей (B12). Погодный риск — из активных `roadMsg`. День с дефицитом предлагает действия: запрос передачи партнёрам, внешний перевозчик с проверкой стоимости (B19), решение по экспрессу (B20). Сценарии what-if остаются на клиенте поверх реальной базы.","finding":"Спрос, доступность ТС и водителей — жёстко заданные массивы (`fe/v5/engine/planning.ts:13`, `:19`, `:20`). Рекомендации — фиксированные тексты с датами концепта (`:31-34`). У модуля бэкенда нет ни состояния, ни действий (`be/v5/modules/planning.py:10-12`). Экран не реагирует на реальное бронирование, заявку или больничный."},{"id":"FR-120","type":"FR","date":"2026-10-11","status":"implemented","group":"Ресурсы, персонал, партнёры и планирование","module":"","title":"Учёт рабочего времени водителей и срочное назначение по данным","change":"Вести учёт времени по началу и концу смены в приложении плюс активности водителя в Wialon, где доступно. Правила: суточное вождение, 4,5 ч непрерывно, ежедневный отдых, еженедельный отдых — по приказу МИИР о режиме труда и отдыха (adilet V1500014095, пороги уточнить; для опасных грузов нужен тахограф). Срочный подбор использует учёт времени, календарь ТС, документы БД и действующий медосмотр (B15) и создаёт рейс `U-<n>` с аудитом. Везде использовать серверную дату.","finding":"Время вождения берётся из статического `TACHO`. Единственное правило — «9 ч − отъезжено ≥ 6 ч» (`be/v5/modules/staff.py:42-43`). Нет правил непрерывного вождения, ежедневного и еженедельного отдыха. Часы в конце смены — фиксированный текст «9,0 ч» (`driver.py:98-100`). Дата сценария фиксирована (`staff.py:16`, `TODAY = 06.10.2026`). Занятые ТС заданы жёстко (`staff.py:52`, `fe/v5/engine/staff.ts:23`). Срочный рейс всегда «U-01», а назначение не создаёт рейс (`staff.py:69-83`). Сроки прав и ДОПОГ берутся из справочника, а не из `Driver.license_until`/`adr_until` (`be/models.py:222-223`)."},{"id":"FR-121","type":"FR","date":"2026-10-11","status":"implemented","group":"Ресурсы, персонал, партнёры и планирование","module":"","title":"Измеряемый SLA партнёров, суточная мощность и контролируемое продление договоров","change":"Ежемесячный SLA, рассчитанный по передачам и заявкам (своевременный ePOD, ETA vs прибытие на место из `wsSt`), с предложениями смены уровня на согласование «четыре глаза». Учёт мощности по партнёру и дню. Продление требует загруженного договора (хеш) + второго согласующего + даты действия страховки. `wsCalls` по каждой заявке. ETA по серверному времени. Id передач из последовательности.","finding":"SLA — статическая справочная строка, понижающая уровень только через разбор текста (`be/v5/modules/partners.py:46-56`). `capUsed` («сегодня») никогда не сбрасывается и не уменьшается (`:187`). Продление договора — +1 год одним пользователем, без документа договора (`:280-294`). Сервис можно вызвать лишь один раз за всё время (`wsCalls`, `:247-248`). В ETA заявки жёстко задана дата «06.10» (`:251`). Id передачи выводится из `len(hos)` (`:180`) вопреки правилу V5-PORT.md."},{"id":"FR-122","type":"FR","date":"2026-10-11","status":"implemented","group":"Ресурсы, персонал, партнёры и планирование","module":"","title":"Привязка штрафа к водителю на момент нарушения","change":"Привязывать по истории назначения ТС на дату и время нарушения. Источники: фактический выезд и прибытие рейса, путевой лист (водитель + ТС), а также карта водителя Wialon или iButton, если есть. Если ничего не совпадает — статус `unattributed`. Показывать доказательство (рейс, путевой лист, временное окно).","finding":"Входящие штрафы привязываются к водителю **текущего** рейса ТС. Если его нет, код берёт **первого водителя из справочного списка** (`be/v5/modules/inbox.py:245-253`). Сегмент журнала использования затем принудительно ставится на весь день `[0,1440]` (`:263`). Поэтому штраф с камеры, пришедший через 3–10 дней, попадает не тому человеку. UI сообщает пользователю «водитель определён автоматически» (`be/v5/modules/reports.py:58-59`, `fe/v5/engine/reports.ts:21`)."},{"id":"FR-123","type":"FR","date":"2026-10-11","status":"implemented","group":"Ресурсы, персонал, партнёры и планирование","module":"","title":"Учёт штрафов с процессом возмещения","change":"Создать учёт штрафов. Статусы: unpaid → paid_by_company(сумма, дата, признак 50 %) → recharge_requested → acknowledged_by_driver (приложение водителя) или disputed → deducted(расчётный период, строка выгрузки) или written_off (затраты компании). Оплаченная компанией сумма попадает в учёт фактических затрат (B18). Удержания соблюдают законный предел удержаний (Трудовой кодекс РК, статью уточнить).","finding":"`reports.fine` → `deduct` сохраняет лишь метку «удержание из зарплаты согласовано» (`be/v5/modules/reports.py:65`, `:70-83`). Нет подтверждения водителя, суммы и периода для зарплаты, нет записи о том, кто платит первым. «Затраты» полностью исключают штрафы («ответственность водителя», `fe/v5/engine/costs.ts:98`), хотя компания оплачивает их как владелец ТС (БИН)."},{"id":"FR-124","type":"FR","date":"2026-10-11","status":"implemented","group":"Ресурсы, персонал, партнёры и планирование","module":"","title":"Реальный канал сообщений водителям и бухгалтерии","change":"Таблица `notification` (получатель — пользователь или роль, канал in_app/e-mail/SMS, объект ссылки, срок, read_at, ack_at). Приложение водителя читает свои сообщения и подтверждает через `driver.ack(id)`. Задание планировщика создаёт напоминания за 2 дня и в день срока для штрафов, продлений договоров (B21) и истечения документов (B12, B15). Просроченное эскалируется руководителю роли.","finding":"`reports.notify` лишь пишет строку журнала и всплывающее «отправлено (приложение водителя)» (`be/v5/modules/reports.py:86-97`). Сообщения приложения водителя — фиксированные id m1–m3 (`be/v5/modules/driver.py:33`). Экран штрафов заявляет «напоминание отправлено водителю и бухгалтерии» для каждого штрафа, у которого скидка 50 % заканчивается через ≤ 7 дней, но ничего не отправляется (`fe/v5/engine/reports.ts:54`). Единственное исходящее уведомление в бэкенде — письмо о лиде (`be/routers/public.py:126`)."},{"id":"FR-125","type":"FR","date":"2026-10-11","status":"implemented","group":"Финансы, коммерция и партнёрский API","module":"","title":"Учёт фактических затрат рядом с моделью «снизу вверх»","change":"Таблица `cost_entry` (дата, ТС или рейс, категория топливо/платная дорога/сервис/передача/штраф/прочее, сумма, ссылка на источник, ссылка на документ). Источники: заправка водителем (литры, цена, одометр, хеш фото чека), закрытие сервисной заявки (фактическая стоимость обязательна), передача/входящая ЭСФ (B17), штрафы (B03), импорт CSV-выписки по платным дорогам. Показывать план vs факт по ТС/месяцу и л/100 км по одометру приложения.","finding":"«Затраты» — чистая модель. Фактический расход топлива `x.act` берётся из справочника, а заправка в приложении — лишь заметка (`fe/v5/engine/costs.ts:120`). Платные дороги «не в модели» (`:36`). Штрафы исключены (`:98`). Затраты на передачу (`partners.py:182`) и на заявки (справочная строка «80 000–150 000 ₸») на экран не попадают. Сравнение с аутсорсингом использует константу `CP.outs`."},{"id":"FR-126","type":"FR","date":"2026-10-11","status":"implemented","group":"Финансы, коммерция и партнёрский API","module":"","title":"Срок, уведомление и последствия для согласования экспресса","change":"Добавить `due_at` (отсечка экспресс-слота). Уведомлять 3 роли (B04) с напоминанием за 30 мин до срока. В момент срока открытые запросы автоматически отклоняются в пользу регулярного рейса (аудит «system: timeout»). 3/3 создаёт экспресс-заказ (или запрос передачи партнёру), связанный с id EX.","finding":"`baseline.exSign`/`exReject` лишь сохраняют подписи (`be/v5/modules/baseline.py:52-90`). Нет срока, нет сообщения трём подписантам (генеральный директор, аналитика, закупки) и нет автоматического итога к отсечке. Одобрение 3/3 не создаёт ни экспресс-заказа, ни рейса. Отказ лишь показывает экономию во всплывающем сообщении."},{"id":"FR-127","type":"FR","date":"2026-10-11","status":"implemented","group":"Финансы, коммерция и партнёрский API","module":"","title":"Структурированные тендерные лиды, задачи и подключение выигранных клиентов","change":"Поля лида `bin`, `deadline`, `tender_no`, `source_ref`. Автоматически создавать задачу «подготовить заявку» со сроком «срок−3 дня» и исполнителем по хабу. Ручной тендер или лид во входящих создаёт лид. При конвертации: сопоставление по БИН, затем мастер создания пользователя портала клиента и/или ApiClient со скоупами и вебхуком. `partners.task` создаёт задачу CRM с ответственным и сроком.","finding":"`end_date` и `customer_bin` из goszakup есть только в данных события и тексте сообщения лида (`be/integrations/worker.py:249-254`). В модели Lead нет БИН, срока и номера тендера (`be/models.py:364-386`). Ручное `inbox.add` вида лид или тендер **не** создаёт лид CRM (`inbox.py:359`). `convert_lead` создаёт клиента без БИН и без проверки дублей (`be/routers/crm.py:199`). Пробелы по партнёрам, найденные `partners.task` (`partners.py:314-332`), — флаг, а не задача CRM."},{"id":"FR-128","type":"FR","date":"2026-10-11","status":"implemented","group":"Финансы, коммерция и партнёрский API","module":"","title":"Строгая идемпотентность, данные GDP и эндпоинты жизненного цикла","change":"Сохранять хеш запроса. Тот же ref + другой хеш → 409 `idempotency_conflict`. Новые эндпоинты: `GET /shipments/{n}/temperature` (ряд, мин/макс, отклонения), `/pod` (метаданные финального ePOD + хеш), `/documents` (номера и статус ЭСФ/ТТН), `POST /bookings/{n}/cancel` до отсечки (вебхук `booking.cancelled`). Проверка мощности по кг на отправление.","finding":"Повторный `external_ref` с **другим** телом молча возвращает старое бронирование (`be/routers/partner_api.py:119-121`). Эндпоинт отправки возвращает только последнее показание температуры (`:155-159`), без ряда, отклонений, ePOD и номеров документов, хотя они нужны клиентам с GDP. Эндпоинтов отмены и изменения нет. Мощность бронирования проверяется только по паллетам, не по `weight_kg` (`be/booking.py:72`, `:106`)."},{"id":"FR-129","type":"FR","date":"2026-10-11","status":"implemented","group":"Эксплуатация, UX, i18n, тестирование и производительность","module":"","title":"Надёжное резервное копирование: pipefail, отдельный ключ MAC, расписание, внешняя копия, оповещение о сбое","change":"Использовать `set -o pipefail` (поддерживается busybox ash) или проверять `pg_dump` через `PIPESTATUS`/FIFO. `pg_dump -Fc` с `--file` плюс проверка `pg_restore --list`. Отдельный `backup_mac_key`. Расписание 02:30 Asia/Almaty через crond. Файл статуса `last_ok.json`, читаемый эндпоинтом здоровья (C12). Опциональная цель rsync/sftp внутри РК. Автоматический ежемесячный тест восстановления во временный контейнер.","finding":"`pg_dump | gzip | openssl` выполняется под `sh` с `set -eu`, но без `pipefail` (`backup.sh:13-14`). Сбойный `pg_dump` даёт обрезанный файл, который записывается в журнал как «backup ok». Один и тот же `backup_key` используется для шифрования и MAC (`backup.sh:15, 18`). Цикл спит 86 400 с от старта контейнера (`backup.sh:23`), поэтому время дрейфует и копирование не ночное. Внешняя копия делается вручную (`DEPLOYMENT.md` §4). Ничто не оповещает о сбое, а чек-лист READY проверяет лишь наличие файла (`CLAUDE.md` §4)."},{"id":"FR-130","type":"FR","date":"2026-10-11","status":"implemented","group":"Эксплуатация, UX, i18n, тестирование и производительность","module":"","title":"Расписание воркера по задачам, heartbeat, глубокая проверка здоровья и оповещения","change":"Дать каждой задаче свой интервал и таймаут (напр. coverage 60 с, alarms 30 с, goszakup 6 ч) через пул потоков или отдельный процесс на критичную задачу. Таблица `worker_heartbeat(task, last_ok, last_error, duration)`. `GET /api/health/deep` (внутренняя сеть или администратор) проверяет БД, heartbeat, возраст резервной копии и экспорт головы аудита. `/metrics` в формате Prometheus во внутренней сети и правила оповещений (воркер устарел > 5 мин, резервная копия > 26 ч, доля 5xx, неудачные входы).","finding":"Воркер выполняет все 7 задач последовательно в одном цикле с `time.sleep(60)` (`integrations/worker.py:334-359`). Медленный коннектор (HTTP-таймаут к goszakup, 2GIS или Wialon) задерживает `coverage-monitor` и эскалацию SOS для всех. У контейнера интеграций `healthcheck: { disable: true }` (`deploy/docker-compose.yml:117`), а у `api` нет healthcheck. Мониторинг — только «docker compose logs» (`DEPLOYMENT.md` §6): ни метрик, ни оповещений."},{"id":"FR-131","type":"FR","date":"2026-10-11","status":"implemented","group":"Эксплуатация, UX, i18n, тестирование и производительность","module":"","title":"Доставлять изменения документа открытым клиентам (push или опрос)","change":"Добавить `GET /api/v5/version` (лёгкий, возвращает `{version}`), опрашиваемый каждые 5 с, пока вкладка видима; при изменении загружать `/state` (или дельту, C05). Этап 2: SSE-эндпоинт `/api/v5/events` через nginx (`proxy_buffering off`, аутентификация по cookie сессии, фильтр по хабу по C01). Показывать «обновлено чч:мм:сс» и баннер о новых тревогах уровня ≥ 2.","finding":"`/api/v5/state` загружается один раз при монтировании (`V5.tsx:77-95`) и обновляется только после собственного `act`. Изменения других диспетчеров, воркера (монитор покрытия, тревоги Wialon) или входящих вебхуков (SOS, статус сервиса) видны только после ручной перезагрузки. Индикатор «Онлайн · обновление каждые 2 с» (`Shell.tsx:48`) говорит об обратном."},{"id":"FR-132","type":"FR","date":"2026-10-11","status":"implemented","group":"Эксплуатация, UX, i18n, тестирование и производительность","module":"","title":"Единая модель навигации: убрать дублирующиеся пункты меню и исправить нумерацию экранов","change":"Встроить старые функции во вкладки экранов v5 (Автопарк → `/s/fleet` вкладка «Записи/Документы»; показания температуры → `/s/thermo` вкладка «Журнал»; планирование рейсов → `/s/dispatch`) или однозначно переименовать («Журнал температур», «Реестр ТС»). В группе 2 оставить только реальные страницы администрирования и учёта. Одна таблица нумерации (`SCREENS.code`) для навигации, справки и документов FR. Перенаправить старые маршруты.","finding":"Боковая панель показывает 17 экранов v5, а затем группу «Учёт и администрирование» с одноимёнными пунктами: «Диспетчер» (`i18n.tsx:14`, `Layout.tsx:14`), «Термостатус» (`i18n.tsx:17`, `Layout.tsx:17`) и «Автопарк» (`i18n.tsx:19`, `Layout.tsx:22`). Они ведут на другие старые страницы (`/dispatch`, `/temperature`, `/fleet`), а «Сводка по рейсам» дублирует «Обзор». Коды концепта в `NAV` повторяют 04 (ship, thermo) и 10 (partners, staff) и пропускают 14, а Shell перенумеровывает по индексу (`Shell.tsx:26, 85`), поэтому коды в документах концепта и FR не совпадают с UI."},{"id":"FR-133","type":"FR","date":"2026-10-11","status":"implemented","group":"Эксплуатация, UX, i18n, тестирование и производительность","module":"","title":"Выдвижное меню на ширине телефона и тесты вьюпорта/перекрытий в UI-наборе","change":"Выдвижное меню-«гамбургер» (`<nav>` вне экрана, `aria-expanded`) ниже 900 px и нижняя панель с 4 самыми используемыми экранами по роли. Добавить `suite-layout.js`: для каждого из 17 экранов при 390×844, 1024×768 и 1500×1000 проверять отсутствие горизонтальной прокрутки страницы (`scrollWidth <= innerWidth`) и неперекрытие рамок `section`/`aside` (`[data-disp-drv]` vs `.v5-ops-aside`).","finding":"Ниже 900 px боковая панель становится статичной, и все ≈40 кнопок навигации (17 v5, 5 кнопок симуляции, ~20 пунктов учёта, справка) переносятся над содержимым (`index.css:162-165`). Диспетчер на телефоне на каждом экране пролистывает всё меню. UI-набор работает только при 1500×1000 (`scripts/ui_suite.py:38`, `tools/run-ui-tests.cjs:7`). Липкая панель рейса, перекрывавшая «Ленту приложения водителя» в «Диспетчере», найдена вручную и исправлена только удалением `position: sticky` (diff `v5/v5.css` для `.v5-ops-aside`), без теста."},{"id":"FR-134","type":"FR","date":"2026-10-11","status":"implemented","group":"Эксплуатация, UX, i18n, тестирование и производительность","module":"","title":"Навигация ссылками, ссылка «к содержимому», статусы не только цветом","change":"Рендерить `<a href=\"/s/<key>\" data-nav>` с теми же классами. Адаптировать перенесённый селектор `nav button` → `nav [data-nav]` с пометкой `// port:` (разрешено правилами V5-PORT). Добавить ссылку перехода к `main` и область `aria-live` для всплывающих сообщений (уже `role=status`, сохранить). Перед каждой меткой — символ или текст уровня (●/▲/■ + «крит.»). Медиазапрос reduced-motion для пульсации «онлайн».","finding":"Пункты навигации v5 — `<button onClick={go(...)}>` без `href` (`Layout.tsx:52-59`): нет «открыть в новой вкладке», нет семантики ссылки для экранных дикторов. Нет ссылки перехода к содержимому и обработки `prefers-reduced-motion` (`index.css`, `v5.css`). Метки-светофоры передают смысл только встроенным цветом oklch (`<Tag l>`, DOM-контракт в `V5-PORT.md`)."},{"id":"FR-135","type":"FR","date":"2026-10-11","status":"implemented","group":"Эксплуатация, UX, i18n, тестирование и производительность","module":"","title":"Справочник городов/пунктов с id; казахский интерфейс; транслитерация внешних текстов","change":"Добавить справочник `locations` (id `KZ-AST`, названия ru/kk/de/en, код КАТО, координаты, хаб). Заменить ключи-названия в WX, BLC, BLR и LINES на id; входящие принимают `city_id` или резолвер (псевдонимы RU/KK/латиница). Помощник `translit(ru→Latin, BGN/PCGN)` для внешнего свободного текста на DE/EN, оригинал при наведении. `kk` как 4-й язык интерфейса (начать с навигации, «Обзора» и «Водителя», с откатом на RU).","finding":"Города связываются по отображаемым строкам. `WX` использует локализованное название как ключ (`mock-v5.de.json`, ключи `WX` «Astana», «Karaganda»), `CITY_RU` выводится по индексу (`ref.py:190`), внешние события должны называть города по-русски (`inbox.py:13`), а исходные данные хранят пары `[\"Астана\",\"Astana\"]` (`BLR.route`, `BLC`). `title/text` входящих от коннекторов сохраняются как получены (RU), поэтому экраны DE/EN показывают кириллицу вопреки DOM-правилу «нет кириллицы на DE/EN» (`V5-PORT.md:182`). Казахский есть только в приложении водителя (`i18n.tsx:4` LANGS = ru/de/en, `DV`)."},{"id":"FR-136","type":"FR","date":"2026-10-11","status":"implemented","group":"Эксплуатация, UX, i18n, тестирование и производительность","module":"","title":"Набор 494 в CI против реального бэкенда; паритет демо-зеркала","change":"(1) Задание CI: `docker compose -f deploy/demo/docker-compose.yml up`, создать пользователей по ролям и запустить `suite.dc.js` и `suite-ext.js` против реального API (входы по скрипту с секретом TOTP из тестовой фикстуры). (2) Тест паритета: общая JSON-фикстура (действие, данные, роль) прогоняется через Python-обработчик и TS-зеркало, документы и статусы сравниваются. (3) Запускать набор на PR. (4) Сбрасывать состояние по группам модулей (`/api/v5/reset` вне продуктива), чтобы избежать каскадов.","finding":"494 сценария выполняются только на браузерном демо (`.github/workflows/pages.yml` «Run ported UI suite»), где `DEMO_SINGLE_USER = true` отключает правила «четыре глаза» (`frontend/src/demo/v5/costs.ts:8`, `baseline.ts:31`, `partners.ts:67`). 46 серверных действий заново реализованы на TS (`frontend/src/demo/v5/*.ts`) без проверки паритета. `ci.yml` (push/PR) не запускает ни набор, ни `oxlint`, а `pages.yml` работает только на `main`, поэтому PR не защищены UI-набором. Упорядоченные тесты с состоянием (`V5-PORT.md:198`) дают каскад падений."},{"id":"FR-137","type":"FR","date":"2026-10-11","status":"implemented","group":"Эксплуатация, UX, i18n, тестирование и производительность","module":"","title":"Генерировать права экранов и справки из бэкенда; полный тест роль × действие","change":"Расширить `scripts/dump_v5_meta.py`, чтобы он выводил `ROLE_PERMS`, соответствие экран→право и действие→право. Фронтенд импортирует метаданные для навигации, справки и Guard. Параметризованный pytest по всем ролям × 46+ действиям (ожидаемые 200/403 из декларативной таблицы) и по всем ролям × 17 экранам. Явно определить набор экранов водителя (только «Водитель», «Покрытие»).","finding":"Права хранятся в четырёх местах: `rbac.py:265-286`, `frontend/src/v5/screens/index.ts:23-40` (права экранов), `frontend/src/help/screens.ts` (`perm:` по экрану) и `help/roles.ts:1-2` («mirror of rbac.py … keep in sync»). Ролевая логика концепта видна только в отдельных тестах модулей (`tests/test_v5_*.py`). Водитель может открыть «Диспетчер», «Загрузку», «Документы», «Погоду» и «Партнёров», потому что им нужен только `trips:read` (`screens/index.ts:25-34`), который есть у роли водителя (`rbac.py:279`)."},{"id":"FR-138","type":"FR","date":"2026-10-11","status":"implemented_partial","group":"Эксплуатация, UX, i18n, тестирование и производительность","module":"","title":"Изолировать 2-секундный такт «онлайн» от дерева приложения; разделение экранов на чанки; бюджет бандла","change":"Перенести `live`, `t` и `door` в отдельный `LiveContext` (подписаны только «Термостатус», «Обзор» и «Водитель»). Мемоизировать `alertsAll` и `navBadges` по `doc`. Останавливать такт при `document.hidden`. `React.lazy` для каждого экрана, а также справки и каталога интеграций. Бюджет в CI (`vite build` → ошибка, если начальный JS превышает 400 КБ gzip или любой чанк — 250 КБ).","finding":"Каждые 2 с `setUiState(tick)` заменяет `ui` (`V5.tsx:100`), что пересоздаёт `E` (`V5.tsx:132-135`). Всё дерево перерисовывается, включая боковую панель (`useV5Nav` пересчитывает `loadCalc` + `alertsAll` + `navBadges`, `Shell.tsx:20-27`) и заголовок (`alertsAll`, `searchLines`, `Shell.tsx:63-65`), даже на скрытой вкладке. Продуктивный JS — один чанк 972 КБ (`frontend/dist/assets/index-COiDXqTD.js`), вырос с ~640 КБ. Лениво загружается только DemoBar (`main.tsx:15`); 721 строка `integrationsCatalog.ts` и ~1 500 строк справки загружаются всегда."},{"id":"BUG-32","type":"bug","date":"2026-10-12","status":"fixed","group":"Сообщённые ошибки (платформа)","module":"","title":"Экспресс-отправку с согласованием тремя лицами не найти (только на экране 17 «Исходные данные»)","change":"Опция экспресса в бронировании клиента + вход из «Диспетчера» + статья справки; 3 функции согласования","finding":"Экспресс-отправку с согласованием тремя лицами не найти (только на экране 17 «Исходные данные»)"},{"id":"BUG-31","type":"bug","date":"2026-10-12","status":"fixed","group":"Сообщённые ошибки (платформа)","module":"","title":"История браузера показывает только «Olymp Logistic»/«Справка и инструкции» — раздел не распознать","change":"Заголовок документа по экрану/вкладке/записи (`<Раздел> · <Экран> · Olymp Logistic`), назад/вперёд восстанавливает раздел и вкладку","finding":"История браузера показывает только «Olymp Logistic»/«Справка и инструкции» — раздел не распознать"},{"id":"BUG-30","type":"bug","date":"2026-10-12","status":"fixed","group":"Сообщённые ошибки (платформа)","module":"","title":"Страхование груза показывает только ₸","change":"Объявленная стоимость и премия также в EUR и USD по дневному курсу НБК, с датой курса","finding":"Страхование груза показывает только ₸"},{"id":"BUG-29","type":"bug","date":"2026-10-12","status":"fixed","group":"Сообщённые ошибки (платформа)","module":"","title":"В разделе «Паллеты / температура» нет веса","change":"Вес (кг) обязателен рядом с паллетами, используется для цены, вместимости, проверки осей","finding":"В разделе «Паллеты / температура» нет веса"},{"id":"BUG-28","type":"bug","date":"2026-10-12","status":"fixed","group":"Сообщённые ошибки (платформа)","module":"", /* Help framework: articles are registered with helpAdd({key, group, screen, tab, title, sub, purpose, who, see[], howto[{t,steps[]}], rules[], fr, related[]}),

const HELP = { groups: [], articles: [], glossary: [], faq: [] };

const helpAdd = a => { HELP.articles.push(a); return a; };
const tx = v => (Array.isArray(v) ? v[LI] || (LI === 3 && v[0] ? v[0] : '') : v == null ? '' : v);   // T-quads are arrays only in help data
const HQ = (...a) => a;   // helper to write a text quad in help data: HQ(ru, de, en, kk)

helpGroup('portals', T('Порталы и приложение водителя', 'Portale und Fahrer-App', 'Portals and driver app', 'Порталдар және жүргізуші қосымшасы'));
helpGroup('ref', T('Справочник', 'Nachschlagen', 'Reference', 'Анықтамалық'));
S.help = { key: 'start', q: '' };
const helpKeyFor = () => { const r = S.route, t = (S.tab[r] || ''); const ks = HELP.articles.map(a => a.key); return ks.includes(r + '/' + t) ? r + '/' + t : ks.includes(r) ? r : 'start'; };
const hText = a => [tx(a.title), tx(a.sub), tx(a.purpose), tx(a.who), (a.see || []).map(tx).join(' '), (a.rules || []).map(tx).join(' ')].join(' ').toLowerCase();
const hl = (s, q) => (q ? esc(s).replace(new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'), '<mark>$1</mark>') : esc(s));
function rolesTable() {

}

  const q = S.help.q.trim(), sec = (h, body) => (body ? `<h4>${esc(h)}</h4>${body}</div>`.replace('</div>', '') : '');

  const rel = (a.related || []).map(k => HELP.articles.find(x => x.key === k)).filter(Boolean);
  return `<div class="card card-body help-art"><h2>${hl(tx(a.title), q)}</h2>${a.sub ? `<div class="note">${hl(tx(a.sub), q)}</div>` : ''}
${a.screen && canSee(a.screen) ? `<p><a class="lnk" data-act="helpOpen" data-s="${a.screen}" data-t="${a.tab || ''}">▸ ${esc(T('Открыть экран', 'Bildschirm öffnen', 'Open the screen', 'Экранды ашу'))}</a></p>` : ''}
<p>${hl(tx(a.purpose), q)}</p>${a.who ? `<h4>${esc(T('Кто работает', 'Wer arbeitet damit', 'Who uses it', 'Кім жұмыс істейді'))}</h4><p>${hl(tx(a.who), q)}</p>` : ''}
${a.see ? `<h4>${esc(T('Что видно', 'Was man sieht', 'What you see', 'Не көрінеді'))}</h4>${ul(a.see)}` : ''}
${(a.howto || []).map(h => `<h4>${esc(T('Как сделать: ', 'So geht es: ', 'How to: ', 'Қалай: '))}${hl(tx(h.t), q)}</h4><div class="howto">${ul(h.steps, true)}</div>`).join('')}
${a.rules ? `<h4>${esc(T('Правила', 'Regeln', 'Rules', 'Ережелер'))}</h4>${ul(a.rules)}` : ''}
${a.special === 'roles' ? `<h4>${esc(T('Матрица ролей', 'Rollenmatrix', 'Roles matrix', 'Рөлдер матрицасы'))}</h4>${rolesTable()}` : ''}

${a.special === 'faq' ? HELP.faq.map(g => `<h4>${hl(tx(g[0]), q)}</h4><p>${hl(tx(g[1]), q)}</p>`).join('') : ''}
${a.fr ? `<p class="note">FR: ${esc(a.fr)}</p>` : ''}${rel.length ? `<h4>${esc(T('См. также', 'Siehe auch', 'See also', 'Сондай-ақ қараңыз'))}</h4><p>${rel.map(x => `<a class="lnk" data-act="helpGo" data-k="${x.key}">${esc(tx(x.title))}</a>`).join(' · ')}</p>` : ''}${LI === 3 && !a.title[3] ? `<p class="note">${esc('KK: ' + 'мәтін орыс тілінде / текст на русском')}</p>` : ''}</div>`;
}
