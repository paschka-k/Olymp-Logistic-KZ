ung für jede Tour und jedes Fahrzeug","change":"`loadCalc` und `vehicleMatch` nach `app/loadcalc.py` portieren, parametrisiert durch die Aufträge der Tour und ein Fahrzeugprofil (trucks.json + neue Vehicle-Felder: Zonen, Palettenplätze je Kammer, Thermocontainer-Plätze, Achsmodell). Nutzung in `assign_orders`, `load.plan` und im Freigabe-Gate. `GET /api/trips/{id}/load`, das der Bildschirm darstellt.","finding":"Die Ladeberechnung existiert nur im Browser und ist auf R-106 mit V02 fixiert: `loadCalc` (shared.ts:43-50), das Standardprofil (trucks.ts:74-76), die Kapazitätsprüfung nur für R-106 (dispatch.ts:50,88-89), `LOAD_TRIP` (load.py:117), und `dispatch.assign` zielt immer auf R-106 und nur Astana-Aufträge (dispatch.py:87-99, dispatch.ts:96). Das serverseitige `load.plan` speichert einen Fahrzeugtyp ohne Passprüfung (load.py:206-258), und `_attach_orders` prüft nur Gesamt-kg und Paletten, ohne Kammern, m³ und Achslasten (operations.py:367-372)."},{"id":"FR-100","type":"FR","date":"2026-10-11","status":"implemented","group":"Tourablauf, Disposition & Go/No-Go-Freigabe","module":"","title":"„Touren heute“ und Alarmzähler korrigieren","change":"Touren nach `planned_departure`/`eta` mit Überschneidung zum heutigen Tag in KZ-Zeit filtern. Alarme je Schweregrad per SQL `COUNT … GROUP BY` zählen. Die 20-Zeilen-Liste nur zur Anzeige behalten.","finding":"`trips_today` zählt jede jemals angelegte, nicht stornierte Tour (operations.py:132-136,150). `open_alarms` und `critical_alarms` werden aus einer auf 20 Zeilen begrenzten Liste gezählt (operations.py:140-142,153-154), sodass der KPI nie 20 übersteigt und die kritische Anzahl unvollständig ist."},{"id":"FR-101","type":"FR","date":"2026-10-11","status":"implemented","group":"Kühlkette, Alarme & Qualität","module":"","title":"Ein gemeinsamer Speicher für Alarme und Vorfälle","change":"`Alarm` zum einzigen Speicher machen: Quelle, Dedup-Schlüssel, Stufe 1–3, Eskalation, Vorfallfelder und Abschlusskategorie ergänzen. v5-Sicherheit und die Alarmliste der Übersicht lesen `/api/alarms`; v5-Vorfallaktionen aktualisieren dieselbe Zeile. Wetter-/Lade-/Straßenrisiken als „Risiken“ getrennt von Alarmen zeigen. Die Telemetriesimulation nur im Demo ausführen.","finding":"Es gibt zwei unabhängige Alarmsysteme. Das eine ist die relationale Tabelle `Alarm` (models.py:296-309; /alarms; klassische Übersicht). Das andere ist die v5-Liste, im Browser aus simulierter Telemetrie, Referenzwetter und `extraInc` berechnet (shared.ts:227-258; Simulations-Tick V5.tsx:97-101, der auch im Produktivbetrieb läuft). Ein Wialon-Alarm erzeugt sowohl eine `Alarm`-Zeile als auch einen v5-Vorfall (worker.py:203-207), die getrennt quittiert und geschlossen werden (resources.py:379-394 vs. security.py:73-88)."},{"id":"FR-102","type":"FR","date":"2026-10-11","status":"implemented","group":"Kühlkette, Alarme & Qualität","module":"","title":"Sensorzuordnung je Kammer und Alarmauswertung für alle Messquellen","change":"Zuordnung `vehicle_sensors` (Telematiksensor → Kammer/Temperaturklasse). Gemeinsame `evaluate_reading()` für manuelle Eingabe, Worker und Thermochron-Import: ein offener Alarm je Fahrzeug+Kammer, aktualisiert mit maximaler Abweichung und Dauer, mit Hysterese vor dem automatischen Schließen. Thermochron-Upload speichert Messwerte mit `source=thermochron`. Thermo liest den letzten Messwert je Kammer aus der DB.","finding":"Der Worker-Import speichert Messwerte, löst aber nie Alarme aus (worker.py:104-116); das tut nur die manuelle Eingabe (resources.py:289-302), und sie erzeugt für jeden Wert außerhalb des Bereichs einen neuen Alarm ohne Deduplizierung. Der Worker ordnet den einzigen Sensor der kältesten Klasse zu (worker.py:107-108), sodass ein Wert von +5 °C aus der 2–8-°C-Kammer von V01 als `frozen`-Wert außerhalb des Bereichs gespeichert wird. Ein Thermochron-Import ist nur ein Flag (thermo.py:17-34) und speichert keine Messwerte. Der v5-Thermobildschirm zeigt simulierte Werte (shared.ts:214-224)."},{"id":"FR-103","type":"FR","date":"2026-10-11","status":"implemented","group":"Kühlkette, Alarme & Qualität","module":"","title":"Qualitätssperre für von einer Abweichung betroffene Aufträge","change":"Tabelle `deviation`, erzeugt aus einem Temperaturalarm, mit betroffenen Aufträgen = Aufträge dieses Fahrzeugs und dieser Kammer im Abweichungsfenster; setzt `Order.quality_hold`. Die Zustellung eines gesperrten Auftrags wird abgewiesen (409) oder als „in Quarantäne zugestellt“ erfasst. Die QS-Entscheidung hebt die Sperre auf (Freigabe) oder setzt refused/returned (Sperre). Webhook `shipment.temperature_excursion` (ohne personenbezogene Rohdaten).","finding":"Alarme verweisen nur auf Tour und Fahrzeug (models.py:303-304), nie auf die betroffenen Aufträge. Die QS-Entscheidung Freigabe/Sperre gilt nur für statische Abweichungs-IDs (quality.py:78,96-118) und ändert operativ nichts. `deliver_stop` prüft keine Qualitätssperre (operations.py:461-477). Der Kunde sieht nur den letzten Messwert (partner_api.py `shipment_dict`)."},{"id":"FR-104","type":"FR","date":"2026-10-11","status":"implemented","group":"Kühlkette, Alarme & Qualität","module":"","title":"Ein Eskalationsdienst für jedes Ereignis der Stufe 3","change":"Hook auf `push_incident` für lvl ≥ 3 in eine Outbox-Tabelle. Zustellung: signierter Partner-Webhook, SMS an die Bereitschaftsnummer (SMSC), E-Mail. Eskalationstimer: keine Quittung innerhalb von 5 min (konfigurierbar) → nächste Stufe (Leiter Sicherheit, dann Geschäftsführer). Jeder Schritt wird auditiert. Keine personenbezogenen Daten in den Payloads.","finding":"Nur Wialon-Sicherheitsereignisse werden an den Sicherheitspartner eskaliert (`be/integrations/worker.py:194-215`). Ereignisse, die nur einen Vorfall in der UI erzeugen: SOS per SMS (`coverage.py:322-323`), SOS aus der Fahrer-App (`driver.py:343-348`), Unfall per SMS (`coverage.py:329-330`) und Kontaktverlust bei Kühlgut Stufe 3 (`coverage.py:229`). Das Label `esc=\"guard\"` (`inbox.py:317`) löst nichts aus. Nachts, wenn niemand auf den Bildschirm schaut, wird niemand alarmiert."},{"id":"FR-105","type":"FR","date":"2026-10-11","status":"implemented","group":"Kühlkette, Alarme & Qualität","module":"","title":"SOS vom echten Fahrer/Fahrzeug; expliziter Hub; Pflicht-Abschlussvermerk","change":"SOS nutzt die aktive Tour, das Fahrzeug und die letzte GPS/OL1-Position des angemeldeten Fahrers. Vorfälle erhalten eine explizite `hub_id`. Schließen/Auflösen erfordert eine Kategorie plus ≥ 10 Zeichen Text. Vorfälle der Stufe 3 müssen vor dem Schließen quittiert sein.","finding":"Panik/SOS erzeugt immer „V01 · A. Nurlanov · km 168“ (security.py:26,60-66), egal wer auslöst. Der Hub des Vorfalls wird aus dem Textpräfix geparst (security.py:29-33), sodass Vorfälle ohne Fahrzeug von Nutzern jedes Hubs bearbeitet werden können. Das Schließen eines Vorfalls (security.py:73-88) und das Auflösen eines Alarms (resources.py:342-343,391) brauchen keinen Abschlusstext."},{"id":"FR-106","type":"FR","date":"2026-10-11","status":"implemented","group":"Kühlkette, Alarme & Qualität","module":"","title":"Echter Prognoseimport statt eines Aktualisierungszeitstempels","change":"Worker-Task `forecast` (nur Integrations-Worker; nur Stadtkoordinaten, keine personenbezogenen Daten; Host in die Egress-Allowlist aufnehmen), speichert je Stadt/Tag: Min/Max, Wind, Wetterlage, Stufe nach `WX_RULES`. `wxRisk` und das Gate lesen die Tabelle. Prognose älter als 6 h → Aktualitätswarnung, das Gate wird gelb.","finding":"`weather.refresh` setzt nur den Zeitstempel (weather.py:58-65), während `WX` eine statische Referenz ist. Disponentenrisiko, Alarmliste und Go/No-Go-Gate hängen alle davon ab (dispatch.py:37-46, docs.py:71-83,144)."},{"id":"FR-107","type":"FR","date":"2026-10-11","status":"implemented","group":"Zustellung, Fahrer-App, Netzabdeckung & SMS","module":"","title":"ePOD der Fahrer-App mit Stoppzustellung und Auftragsstatus verbinden","change":"Tabelle `epod`: Stopp-ID, Empfängername (verschlüsselt, zeilengebundener Kontext), Objekt-IDs von Unterschrift/Foto, gescannte vs. erwartete Packstücke, Ausnahmen je Packstück (dmg/short/ref), arrived_at/left_at, Kammertemperatur bei Übergabe. Die Fahrer-App arbeitet auf der eigenen DB-Tour des angemeldeten Fahrers (`Driver.user_id`). Der Abschluss des ePOD führt die Logik von `deliver_stop` aus, markiert das `epod`-Dokument als fertig, und Ausnahmen lösen A12/A15 aus.","finding":"Das Fahrer-App-Modul ist fest auf R-103/V01 verdrahtet (driver.py:27). Das Abschließen des Stoppablaufs (`driver.step` erreicht 4) hängt nur ein Ereignis an (driver.py:181-195). Der relationale Stopp bleibt offen, Aufträge werden nicht auf zugestellt gesetzt, Tracking und Webhooks lösen nicht aus. Das Dokument `epod` ist immer „wait“ (docs.py:121,127). `deliver_stop` speichert nur einen Zeitstempel: keinen Empfänger, keine Unterschrift, keine Packstückzahl, keine Kammertemperatur (operations.py:461-484)."},{"id":"FR-108","type":"FR","date":"2026-10-11","status":"implemented","group":"Zustellung, Fahrer-App, Netzabdeckung & SMS","module":"","title":"ePOD mit rechtlich verwertbaren Nachweisen","change":"ePOD-Datensatz je Stopp: Erfassungszeit am Gerät + Empfangszeit am Server, GPS, Name und Funktion des Empfängers, Unterschriftsbild und Foto (im lokalen Objektspeicher, SHA-256 im Datensatz und im Audit-Log), gescannte vs. erwartete SSCC, Ausnahmen, Thermochron-Ergebnis. SMS `ST` setzt `pod_status=preliminary_sms`, das erst nach vollständigem Sync `final` wird. Ein Partner-ePOD wird über ein Partnerportal-Konto hochgeladen oder als „im Auftrag erfasst“ mit Grund und Scan markiert.","finding":"Der ePOD ist ein Zähler: die Schritte „Foto“ und „Unterschrift“ erhöhen nur `drvStep` (`be/v5/modules/driver.py:181-197`). Der Name des Unterzeichners ist ein statischer Text (`fe/v5/engine/driver.ts:22`). Offline gepufferte Ereignisse erhalten beim Sync die **Server**zeit (`driver.py:125`). Eine SMS `ST` erzeugt einen leeren `epod`-Platzhalter (`be/v5/modules/coverage.py:283-287`). Den Schritt „ePOD hochladen“ im Partnerportal klicken eigene Mitarbeiter mit `partners:write` (`be/v5/modules/partners.py:225-234`). Das hielte in einem GDP- oder Kundenstreit nicht stand."},{"id":"FR-109","type":"FR","date":"2026-10-11","status":"implemented","group":"Zustellung, Fahrer-App, Netzabdeckung & SMS","module":"","title":"Alle Fahrzeuge über Telematik überwachen, nicht nur über die App","change":"Der Worker schreibt minütlich die letzte Wialon-Nachrichtenzeit und Position je Einheit in `covContact[veh]` (Feld `tm`). Letzter Kontakt = das Neueste aus App, Telematik und SMS. Der Monitor durchläuft jedes Fahrzeug einer Tour in loading oder in_transit. „Kein Kontakt seit Abfahrt“ zählt ab der tatsächlichen Abfahrtszeit.","finding":"`covContact` wird nur von der Fahrer-App (nur V01, `be/v5/modules/driver.py:128`, `:339`) und von OL1-SMS (`coverage.py:307-311`) aktualisiert. `sync_temperatures` und `poll_wialon_alarms` berühren es nie (`be/integrations/worker.py:90-124`, `:154-219`). `evaluate` überspringt Fahrzeuge ohne `data`-Zeitstempel (`coverage.py:215-217`). Ein Fahrzeug, dessen App nie geöffnet wurde oder dessen Tracker verstummt ist, löst daher nie einen Kontaktalarm aus."},{"id":"FR-110","type":"FR","date":"2026-10-11","status":"implemented","group":"Zustellung, Fahrer-App, Netzabdeckung & SMS","module":"","title":"Zustellstatus und Quittungs-Timeout für Disponenten-SMS","change":"SMSC-Status-Callback ergänzen (signiert, derselbe eingehende Pfad) → `delivered`/`undeliverable`. Quittungsfrist je Code: STOP 10 min, CHKT 15 min, WAIT, CALL und PARK 30 min. Bei Timeout: Inbox Stufe 2 + Aufgabe „Fahrer anrufen“ + optional erneutes Senden (unter Beachtung des Limits 3 SMS / 10 min).","finding":"Eine Anweisung ist nur `queued → sent` (`be/v5/modules/coverage.py:409-411`). Ein `AK` speichert nur `ack` (`:335-339`). Eine nie quittierte STOP- oder CHKT-Anweisung erzeugt keinen Alarm. SMSC-Zustellberichte sind geplant (ROADMAP), aber nicht umgesetzt."},{"id":"FR-111","type":"FR","date":"2026-10-11","status":"implemented","group":"Zustellung, Fahrer-App, Netzabdeckung & SMS","module":"","title":"Reale Funklöcher aus Telematiklücken lernen","change":"Jede Telematik- oder App-Lücke > 10 min speichern (Start-/Endposition, Netzbetreiber, Fahrzeug, Abschnitt). Ein monatlicher Job schlägt Klassenänderungen je Abschnitt vor (braucht ≥ N Durchfahrten). Ein Analyst übernimmt sie, was `conf: verified, source: own telematics` setzt. Die Karte zeigt Modell vs. Messung.","finding":"Alle 23 Streckenabschnitte sind `conf: estimated` (`be/v5/reference/coverage.json`, Recherche §1.2). Das erwartete Fenster, das Alarme der Stufe 2 unterdrückt, hängt von diesen Schätzungen ab (`be/v5/modules/coverage.py:225`). TTC-Masten sollen bis Ende 2026 an republikanischen Straßen stehen (Recherche F5), das Modell veraltet also schnell. Die ROADMAP nennt „reale Funklöcher lernen“, doch heute speichert nichts Lücken."},{"id":"FR-112","type":"FR","date":"2026-10-11","status":"implemented","group":"Zustellung, Fahrer-App, Netzabdeckung & SMS","module":"","title":"ETA je Stopp und Ereignis-Zeitleiste im Tracking","change":"`TripStop.eta_planned`/`eta_current` ergänzen (aktualisiert durch Umplanung, Ankünfte und den 2GIS-Routen-Worker). Das Tracking liefert die ETA des eigenen Stopps des Auftrags plus eine Zeitleiste nicht personenbezogener Ereignisse (gebucht, geplant, verladen, abgefahren, angekommen, zugestellt, übergeben, Verspätungskategorie) und ein Temperatur-Konformitätsflag (nur ja/nein). Webhook `shipment.eta_changed`, wenn sich die ETA um mehr als 60 min verschiebt.","finding":"Das Tracking zeigt für jeden Auftrag einer Mehrstopp-Tour die ETA der Tour (des letzten Stopps) (public.py:229). Die ETA wird nach zugestellten Stopps, Verspätungen oder Umplanung nie neu berechnet. Es gibt keine Ereignishistorie. Nach Stornierung einer Tour fällt der Auftrag stillschweigend auf `new` zurück (operations.py:436-437)."},{"id":"FR-113","type":"FR","date":"2026-10-11","status":"implemented","group":"Zustellung, Fahrer-App, Netzabdeckung & SMS","module":"","title":"Partnerübergabe in Aufträgen, Stopps und Tracking abbilden","change":"Die Übergabe setzt die gewählten Aufträge/Packstücke auf `handed_over` (Partner-ID, Zeit). Der Stopp der eigenen Tour wird als `handed_over` markiert und gilt als erledigt. Der ePOD-Upload des Partners setzt den Auftrag auf zugestellt; das öffentliche Tracking-Ereignis „an Partnerfrachtführer übergeben“ enthält keine personenbezogenen Partnerdaten.","finding":"`partners.handover` und die Schritte des Partnerportals ändern nur das v5-Dokument (partners.py:145-235). Der relationale Auftrag bleibt auf der eigenen Tour als `in_transit`, sein Stopp blockiert weiter den Tourabschluss, und Tracking und Webhooks zeigen weiter unser Fahrzeug."},{"id":"FR-114","type":"FR","date":"2026-10-11","status":"implemented","group":"Compliance & Staatsdokumente","module":"","title":"Vorfahrt-Medizincheck vor dem 01.01.2027 erzwingen","change":"Ab einem konfigurierbaren Datum (Standard 2027-01-01) für Fahrzeuge > 3,5 t: `driver.signSheet` und die Go/No-Go-Freigabe verlangen einen Medizincheck mit admitted=true und checked_at ≤ 8 h vor Abfahrt (Wert zu verifizieren). Das Fahrtenblatt wird aus Checkliste und Kilometerständen der App befüllt. Der Integrations-Hub zeigt ein Fristenpanel mit Countdown zum 01.01.2027 und 01.06.2027 und dem Anteil der Touren mit vollständigen Fahrtenblatt- und TTN-Daten.","finding":"`medcheck` ist ein optionales manuelles Staatsdokument (`be/routers/integrations.py:365-372`). Das Fahrtenblatt wird mit möglicherweise leerem `pretrip_medical_check` erzeugt (`be/integrations/esutd.py:86`), und nichts sperrt die Freigabe. Die Unterschrift unter das Fahrtenblatt in der Fahrer-App braucht nur die Checkliste (`driver.py:167-178`). Die Fahrtenblatt-Payload lässt `pretrip_technical_check` und `odometer_start`/`end` leer (`esutd.py:85-87`), obwohl die App Checkliste und Kilometerstände erfasst (`driver.py:51-55`, `:98-100`)."},{"id":"FR-115","type":"FR","date":"2026-10-11","status":"implemented","group":"Compliance & Staatsdokumente","module":"","title":"Gefahrgut- und Trockeneisdaten je Sendung","change":"`un_number`, `lq` (bool), `dry_ice_kg` und `adr_class` zu Order und Booking hinzufügen (Portal + API v1 + Spezifikation). `dangerous_goods` der TTN daraus befüllen. Übergabe-, Eilauswahl- und Fahrzeugprüfungen lesen die Auftragsdaten. Über den LQ-Grenzen: ADR-Fahrer und -Fahrzeug sowie Fahrtschreiber erforderlich (B12).","finding":"Die TTN-Payload hat immer `dangerous_goods: None` (`be/integrations/esutd.py:67`). Die Buchungs-API hat keine Gefahrgutfelder (`be/routers/partner_api.py:97-106`). ADR-Prüfungen bei Übergabe und Eilzuordnung nutzen Flags der Referenzpositionen (`partners.py:102`, `staff.py:45`). Die Recherche verlangt UN-Nummer, LQ-Kennzeichen und kg Trockeneis je Sendung (UN 1845, ADR 5.5.3)."},{"id":"FR-116","type":"FR","date":"2026-10-11","status":"implemented","group":"Compliance & Staatsdokumente","module":"","title":"ESF aus dem zugestellten Auftrag erzeugen und eingehende Partnerrechnungen erfassen","change":"Bei finalem ePOD (B06) einen ESF-Entwurf aus `Booking.price_net`/`vat` und `Customer.bin` über `esf.invoice_xml` erzeugen. Einen Speicher (`state_document`) auch für den v5-Dokumentenbildschirm nutzen. Alarm für die Ausstellungsfrist. Eingangsregister (Lieferanten-BIN, ESF-Nr., Betrag), verknüpft mit der HO-/SR-ID und in das Ist-Kosten-Ledger eingespeist (B18).","finding":"Das Staatsdokument `esf` enthält nur `{order, vat_rate:16}`, ohne Betrag, Käufer oder Umsatzdatum (`be/routers/integrations.py:380-382`). Der v5-Dokumentenbildschirm simuliert „an IS ESF gesendet“ in einem eigenen Dokumentspeicher (`be/v5/modules/docs.py:186-195`), es gibt also zwei ESF-Welten. Es gibt keine Fristprüfung für die Ausstellung einer ESF nach dem Umsatzdatum (gesetzliche Frist, zu verifizieren). Übergabekosten an Partner `n × rate` (`partners.py:182`) und Werkstattkosten werden nie als Eingangsrechnung erfasst."},{"id":"FR-117","type":"FR","date":"2026-10-11","status":"implemented","group":"Compliance & Staatsdokumente","module":"","title":"GDP-Nachweise für Partnerstrecken","change":"GDP-Qualifizierung von Partnern (Fahrzeugzuordnung, Auditdatum, Ablauf) als Stammdaten. Bei Übergabe an beiden Enden Logger-ID und Temperatur sowie Plombennummer erfassen. Der Partner-ePOD erfordert ein Logger-Auslesen oder einen Daten-Upload. Fehlende Aufzeichnung oder Abweichung öffnet automatisch eine Abweichung in Qualität.","finding":"Die Übergabeprüfung ist das Boolesche `gdp`/`cold` je Partner (`partners.py:111-116`). Es gibt kein Qualifizierungszertifikat und kein Ablaufdatum, keine Temperaturaufzeichnung für die Partnerstrecke und kein Auslesen des Loggers bei Übergabe oder bei Zustellung durch den Partner. Das Partnerportal hat 3 Klickschritte (`partners.py:221-234`). GDP (MoH ҚР ДСМ-15/2021, EEC-Entscheidung 80) verlangt lückenlose Aufzeichnungen und qualifizierte Fahrzeuge je Strecke."},{"id":"FR-118","type":"FR","date":"2026-10-11","status":"implemented","group":"Ressourcen, Personal, Partner & Planung","module":"","title":"Werkstatttickets steuern Fahrzeugverfügbarkeit und Slotkapazität","change":"Verfügbarkeitskalender für Fahrzeuge (offenes Werkstattticket → nicht verfügbar bis ETA oder Abschluss). Panne- und Mangelmeldungen aus der App erzeugen einen Werkstattticket-Entwurf. Der Fahrplan erhält zugeordnete Fahrzeuge, Kapazität = min(Fahrplan, Summe verfügbarer Fahrzeugpaletten/-kg). Verliert eine Abfahrt mit Buchungen ihr Fahrzeug: Disponentenalarm + Webhook `booking.at_risk` an den API-Kunden.","finding":"`partners.call` setzt nur `vehSt` im v5-Dokument (`be/v5/modules/partners.py:254`). Der Plattformstatus `Vehicle.status` (`be/models.py:204`) bleibt aktiv. Buchungsslots nutzen die statische `Schedule.pallets_capacity`, die mit keinem Fahrzeug verknüpft ist (`be/booking.py:72`, `:106`, `be/models.py:433`), sodass Kunden weiterhin Abfahrten eines defekten Lkw buchen können. Eine Panne in der Fahrer-App und ein bei Schichtende gemeldeter Mangel erzeugen nur Ereignisse (`driver.py:295-322`), obwohl der Docstring einen Werkstattauftrag verspricht (`:312`)."},{"id":"FR-119","type":"FR","date":"2026-10-11","status":"implemented","group":"Ressourcen, Personal, Partner & Planung","module":"","title":"7-Tage-Kapazitätsplan aus echten Daten berechnen","change":"`GET /api/v5/plan?days=7` berechnet den Bedarf aus Buchungen und Aufträgen je Abfahrtsdatum (Paletten, kg, Temperaturklasse). Das Angebot kommt aus dem Fahrzeugkalender (B10) und der Fahrerverfügbarkeit (B12). Das Wetterrisiko kommt aus aktiven `roadMsg`. Ein Fehlmengentag bietet Maßnahmen: Übergabeanfrage an Partner, externer Frachtführer mit Kostenprüfung (B19), Express-Entscheidung (B20). What-if-Szenarien bleiben clientseitig auf der realen Basis.","finding":"Bedarf, Fahrzeug- und Fahrerverfügbarkeit sind fest codierte Arrays (`fe/v5/engine/planning.ts:13`, `:19`, `:20`). Die Empfehlungen sind feste Texte mit Konzeptdaten (`:31-34`). Das Backend-Modul hat weder Zustand noch Aktionen (`be/v5/modules/planning.py:10-12`). Der Bildschirm kann auf keine echte Buchung, kein Ticket und keine Krankmeldung reagieren."},{"id":"FR-120","type":"FR","date":"2026-10-11","status":"implemented","group":"Ressourcen, Personal, Partner & Planung","module":"","title":"Lenkzeitkonto der Fahrer und datenbasierte Eilzuordnung","change":"Zeitkonto aus Schichtbeginn und -ende in der App plus Wialon-Fahreraktivität, sofern verfügbar. Regeln: Tageslenkzeit, 4,5 h ununterbrochen, Tagesruhe, Wochenruhe gemäß Arbeits-/Ruhezeitverordnung des MID (adilet V1500014095, Schwellen zu verifizieren; Fahrtschreiber für Gefahrgut erforderlich). Die Eilauswahl nutzt Zeitkonto, Fahrzeugkalender, DB-Dokumente und gültigen Medizincheck (B15) und legt eine Tour `U-<n>` mit Audit an. Überall das Serverdatum verwenden.","finding":"Die Lenkzeit stammt aus dem statischen `TACHO`. Die einzige Regel ist „9 h − gefahren ≥ 6 h“ (`be/v5/modules/staff.py:42-43`). Es gibt keine Regeln für ununterbrochenes Fahren, Tages- oder Wochenruhe. Die Stunden bei Schichtende sind der feste Text „9,0 h“ (`driver.py:98-100`). Das Szenariodatum ist fix (`staff.py:16`, `TODAY = 06.10.2026`). Belegte Fahrzeuge sind fest codiert (`staff.py:52`, `fe/v5/engine/staff.ts:23`). Die Eiltour ist immer „U-01“, und die Zuordnung legt keine Tour an (`staff.py:69-83`). Gültigkeit von Führerschein und ADR stammt aus der Referenz, nicht aus `Driver.license_until`/`adr_until` (`be/models.py:222-223`)."},{"id":"FR-121","type":"FR","date":"2026-10-11","status":"implemented","group":"Ressourcen, Personal, Partner & Planung","module":"","title":"Gemessenes Partner-SLA, Tageskapazität und kontrollierte Vertragsverlängerungen","change":"Monatliches SLA aus Übergaben und Tickets berechnet (pünktlicher ePOD, ETA vs. Ankunft vor Ort aus `wsSt`), mit Stufenvorschlägen zur Vier-Augen-Freigabe. Kapazitätskonto je Partner und Tag. Verlängerung erfordert hochgeladenen Vertrag (Hash) + zweiten Freigeber + Gültigkeitsdatum der Versicherung. `wsCalls` je Ticket. ETA aus der Serverzeit. Übergabe-IDs aus einer Sequenz.","finding":"Das SLA ist ein statischer Referenztext, der die Stufe nur per Textparsing herabsetzt (`be/v5/modules/partners.py:46-56`). `capUsed` („heute“) wird nie zurückgesetzt oder reduziert (`:187`). Die Vertragsverlängerung ist +1 Jahr durch einen einzelnen Nutzer, ohne Vertragsdokument (`:280-294`). Eine Werkstatt kann nur ein einziges Mal gerufen werden (`wsCalls`, `:247-248`). Die Ticket-ETA hat das fest codierte Datum „06.10“ (`:251`). Die Übergabe-ID wird aus `len(hos)` abgeleitet (`:180`), entgegen der Regel in V5-PORT.md."},{"id":"FR-122","type":"FR","date":"2026-10-11","status":"implemented","group":"Ressourcen, Personal, Partner & Planung","module":"","title":"Bußgelder dem Fahrer zum Tatzeitpunkt zuordnen","change":"Zuordnung aus der Historie der Fahrzeugzuordnung zu Tatdatum und -uhrzeit. Quellen: tatsächliche Abfahrt und Ankunft der Tour, Fahrtenblatt (Fahrer + Fahrzeug) sowie, falls vorhanden, Wialon-Fahrerkarte oder iButton. Passt nichts, Status `unattributed`. Den Nachweis anzeigen (Tour, Fahrtenblatt, Zeitfenster).","finding":"Eingehende Bußgelder werden dem Fahrer der **aktuellen** Tour des Fahrzeugs zugeordnet. Gibt es keine, fällt der Code auf den **ersten Fahrer der Referenzliste** zurück (`be/v5/modules/inbox.py:245-253`). Das Segment des Nutzungsprotokolls wird dann auf den ganzen Tag `[0,1440]` gesetzt (`:263`). Ein Blitzerbescheid, der 3–10 Tage später eintrifft, landet daher bei der falschen Person. Die UI meldet dem Nutzer „Fahrer automatisch ermittelt“ (`be/v5/modules/reports.py:58-59`, `fe/v5/engine/reports.ts:21`)."},{"id":"FR-123","type":"FR","date":"2026-10-11","status":"implemented","group":"Ressourcen, Personal, Partner & Planung","module":"","title":"Bußgeldkonto mit Weiterbelastungsprozess","change":"Bußgeldkonto anlegen. Statusablauf: unpaid → paid_by_company(Betrag, Datum, 50-%-Flag) → recharge_requested → acknowledged_by_driver (Fahrer-App) oder disputed → deducted(Abrechnungszeitraum, Exportzeile) oder written_off (Unternehmenskosten). Der vom Unternehmen gezahlte Betrag geht ins Ist-Kosten-Ledger (B18). Abzüge beachten die gesetzliche Abzugsobergrenze (Arbeitsgesetzbuch RK, Artikel zu verifizieren).","finding":"`reports.fine` → `deduct` speichert nur das Label „Lohnabzug vereinbart“ (`be/v5/modules/reports.py:65`, `:70-83`). Es gibt keine Bestätigung des Fahrers, keinen Betrag oder Zeitraum für die Lohnabrechnung und keinen Nachweis, wer zuerst zahlt. Die Kosten schließen Bußgelder ganz aus („Fahrerhaftung“, `fe/v5/engine/costs.ts:98`), obwohl das Unternehmen sie als Fahrzeughalter (BIN) zahlt."},{"id":"FR-124","type":"FR","date":"2026-10-11","status":"implemented","group":"Ressourcen, Personal, Partner & Planung","module":"","title":"Echter Nachrichtenkanal zu Fahrern und Buchhaltung","change":"Tabelle `notification` (Empfänger Nutzer oder Rolle, Kanal in_app/E-Mail/SMS, Bezugsobjekt, Fälligkeit, read_at, ack_at). Die Fahrer-App liest ihre eigenen Nachrichten und quittiert mit `driver.ack(id)`. Ein Scheduler-Job erzeugt Erinnerungen bei Fälligkeit−2 T und Fälligkeit−0 T für Bußgelder, Vertragsverlängerungen (B21) und Dokumentabläufe (B12, B15). Überfällige Punkte eskalieren an den Rollenverantwortlichen.","finding":"`reports.notify` schreibt nur eine Protokollzeile und einen Toast „gesendet (Fahrer-App)“ (`be/v5/modules/reports.py:86-97`). Die Nachrichten der Fahrer-App sind die festen IDs m1–m3 (`be/v5/modules/driver.py:33`). Der Bußgeldbildschirm behauptet „Erinnerung an Fahrer und Buchhaltung gesendet“ für jedes Bußgeld, dessen 50-%-Rabatt in ≤ 7 Tagen endet, aber nichts wird gesendet (`fe/v5/engine/reports.ts:54`). Die einzige ausgehende Benachrichtigung im Backend ist die Lead-E-Mail (`be/routers/public.py:126`)."},{"id":"FR-125","type":"FR","date":"2026-10-11","status":"implemented","group":"Finanzen, Vertrieb & Partner-API","module":"","title":"Ist-Kosten-Ledger neben dem Bottom-up-Modell","change":"Tabelle `cost_entry` (Datum, Fahrzeug oder Tour, Kategorie Kraftstoff/Maut/Werkstatt/Übergabe/Bußgeld/Sonstiges, Betrag, Quell-Ref, Beleg-Ref). Zuflüsse: Fahrer-Tankung (Liter, Preis, Kilometerstand, Hash des Belegfotos), Abschluss eines Werkstatttickets (Ist-Kosten Pflicht), Übergabe/Eingangs-ESF (B17), Bußgelder (B03), CSV-Import der Mautabrechnung. Plan vs. Ist je Fahrzeug/Monat und l/100 km aus dem App-Kilometerstand anzeigen.","finding":"Затраты ist reines Modell. Ist-Kraftstoff `x.act` stammt aus der Referenz, und die Tankung in der App ist nur eine Notiz (`fe/v5/engine/costs.ts:120`). Maut ist „nicht im Modell“ (`:36`). Bußgelder sind ausgeschlossen (`:98`). Übergabekosten (`partners.py:182`) und Ticketkosten (Referenztext „80 000–150 000 ₸“) erreichen den Bildschirm nie. Der Outsourcing-Vergleich nutzt die Konstante `CP.outs`."},{"id":"FR-126","type":"FR","date":"2026-10-11","status":"implemented","group":"Finanzen, Vertrieb & Partner-API","module":"","title":"Frist, Benachrichtigung und Wirkung für Express-Freigaben","change":"`due_at` (Annahmeschluss des Express-Slots) ergänzen. Die 3 Rollen benachrichtigen (B04), mit Erinnerungen bei Fälligkeit−30 min. Zum Fälligkeitszeitpunkt werden offene Anträge automatisch auf eine Regeltour abgelehnt (auditiert als „system: timeout“). 3/3 erzeugt einen Express-Auftrag (oder eine Partner-Übergabeanfrage), verknüpft mit der EX-ID.","finding":"`baseline.exSign`/`exReject` speichern nur Unterschriften (`be/v5/modules/baseline.py:52-90`). Es gibt keine Fälligkeit, keine Nachricht an die drei Unterzeichner (Geschäftsführer, Analytik, Einkauf) und kein automatisches Ergebnis zum Annahmeschluss. Eine Freigabe 3/3 erzeugt weder Express-Auftrag noch Tour. Eine Ablehnung zeigt die Einsparung nur als Toast."},{"id":"FR-127","type":"FR","date":"2026-10-11","status":"implemented","group":"Finanzen, Vertrieb & Partner-API","module":"","title":"Strukturierte Ausschreibungs-Leads, Aufgaben und Onboarding gewonnener Kunden","change":"Lead-Felder `bin`, `deadline`, `tender_no`, `source_ref`. Automatisch eine Aufgabe „Angebot vorbereiten“ mit Fälligkeit Frist−3 Tage und Bearbeiter je Hub anlegen. Eine manuelle Ausschreibung oder ein manueller Lead in der Inbox erzeugt einen Lead. Bei Konvertierung: Abgleich über BIN, dann Assistent zum Anlegen eines Kundenportal-Nutzers und/oder ApiClient mit Scopes und Webhook. `partners.task` erzeugt eine CRM-Aufgabe mit Verantwortlichem und Fälligkeit.","finding":"`end_date` und `customer_bin` aus goszakup existieren nur in den Ereignisdaten und im Nachrichtentext des Leads (`be/integrations/worker.py:249-254`). Das Lead-Modell hat weder BIN noch Frist noch Ausschreibungsnummer (`be/models.py:364-386`). Ein manuelles `inbox.add` der Art Lead oder Ausschreibung erzeugt **keinen** CRM-Lead (`inbox.py:359`). `convert_lead` legt einen Kunden ohne BIN und ohne Dublettenprüfung an (`be/routers/crm.py:199`). Von `partners.task` gefundene Partnerlücken (`partners.py:314-332`) sind ein Flag, keine CRM-Aufgabe."},{"id":"FR-128","type":"FR","date":"2026-10-11","status":"implemented","group":"Finanzen, Vertrieb & Partner-API","module":"","title":"Strikte Idempotenz, GDP-Daten und Lebenszyklus-Endpunkte","change":"Request-Hash speichern. Gleiche Ref + anderer Hash → 409 `idempotency_conflict`. Neue Endpunkte: `GET /shipments/{n}/temperature` (Verlauf, Min/Max, Abweichungen), `/pod` (Metadaten des finalen ePOD + Hash), `/documents` (ESF-/TTN-Nummern und Status), `POST /bookings/{n}/cancel` vor Annahmeschluss (Webhook `booking.cancelled`). kg-Kapazitätsprüfung je Abfahrt.","finding":"Eine wiederholte `external_ref` mit **anderem** Body liefert stillschweigend die alte Buchung (`be/routers/partner_api.py:119-121`). Der Sendungs-Endpunkt liefert nur den letzten Temperaturwert (`:155-159`), ohne Verlauf, Abweichungen, ePOD oder Belegnummern, obwohl GDP-Kunden sie brauchen. Es gibt keinen Storno- oder Änderungs-Endpunkt. Die Buchungskapazität prüft nur Paletten, nicht `weight_kg` (`be/booking.py:72`, `:106`)."},{"id":"FR-129","type":"FR","date":"2026-10-11","status":"implemented","group":"Betrieb, UX, i18n, Tests & Performance","module":"","title":"Zuverlässiger Backup-Job: pipefail, separater MAC-Schlüssel, Zeitplan, externe Kopie, Fehleralarm","change":"`set -o pipefail` nutzen (busybox ash unterstützt es) oder `pg_dump` über `PIPESTATUS`/eine FIFO prüfen. `pg_dump -Fc` mit `--file` plus Plausibilitätsprüfung `pg_restore --list`. Separater `backup_mac_key`. Zeitplan 02:30 Asia/Almaty per crond. Statusdatei `last_ok.json`, die der Health-Endpunkt liest (C12). Optionales rsync/sftp-Ziel innerhalb KZ. Automatisierter monatlicher Wiederherstellungstest in einen Wegwerf-Container.","finding":"`pg_dump | gzip | openssl` läuft unter `sh` mit `set -eu`, aber ohne `pipefail` (`backup.sh:13-14`). Ein fehlschlagender `pg_dump` erzeugt eine abgeschnittene Datei, die als „backup ok“ protokolliert wird. Derselbe `backup_key` verschlüsselt und berechnet den MAC (`backup.sh:15, 18`). Die Schleife schläft 86 400 s ab Containerstart (`backup.sh:23`), die Uhrzeit driftet also und ist nicht nächtlich. Die externe Kopie ist manuell (`DEPLOYMENT.md` §4). Nichts alarmiert bei Fehlern, und die READY-Checkliste prüft nur, ob eine Datei existiert (`CLAUDE.md` §4)."},{"id":"FR-130","type":"FR","date":"2026-10-11","status":"implemented","group":"Betrieb, UX, i18n, Tests & Performance","module":"","title":"Worker-Zeitplanung je Task, Heartbeats, tiefer Health-Check und Alarmierung","change":"Jedem Task ein eigenes Intervall und Timeout geben (z. B. coverage 60 s, alarms 30 s, goszakup 6 h) über einen Thread-Pool oder einen Prozess je kritischem Task. Tabelle `worker_heartbeat(task, last_ok, last_error, duration)`. `GET /api/health/deep` (internes Netz oder Admin) prüft DB, Heartbeats, Backup-Alter und Export des Audit-Kopfes. `/metrics` im Prometheus-Format im internen Netz und Alarmregeln (Worker veraltet > 5 min, Backup > 26 h, 5xx-Rate, Login-Fehlschläge).","finding":"Der Worker führt alle 7 Tasks nacheinander in einer Schleife mit `time.sleep(60)` aus (`integrations/worker.py:334-359`). Ein langsamer Konnektor (HTTP-Timeout zu goszakup, 2GIS oder Wialon) verzögert `coverage-monitor` und die SOS-Eskalation für alle. Der Integrations-Container hat `healthcheck: { disable: true }` (`deploy/docker-compose.yml:117`), und `api` hat keinen Healthcheck. Überwachung ist nur „docker compose logs“ (`DEPLOYMENT.md` §6): keine Metriken, keine Alarme."},{"id":"FR-131","type":"FR","date":"2026-10-11","status":"implemented","group":"Betrieb, UX, i18n, Tests & Performance","module":"","title":"Dokumentänderungen an offene Clients pushen oder pollen","change":"`GET /api/v5/version` (günstig, liefert `{version}`), alle 5 s gepollt, solange sichtbar; bei Änderung `/state` (oder ein Delta, C05) laden. Phase 2: SSE-Endpunkt `/api/v5/events` über nginx (`proxy_buffering off`, Auth per Session-Cookie, hub-gefiltert nach C01). „aktualisiert hh:mm:ss“ und ein Banner für neue Alarme ab Stufe 2 anzeigen.","finding":"`/api/v5/state` wird einmal beim Mount geladen (`V5.tsx:77-95`) und nur nach dem eigenen `act` aktualisiert. Änderungen anderer Disponenten, des Workers (Coverage-Monitor, Wialon-Alarme) oder eingehender Webhooks (SOS, Werkstattstatus) erscheinen erst nach manuellem Neuladen. Die Live-Anzeige „Онлайн · обновление каждые 2 с“ (`Shell.tsx:48`) suggeriert das Gegenteil."},{"id":"FR-132","type":"FR","date":"2026-10-11","status":"implemented","group":"Betrieb, UX, i18n, Tests & Performance","module":"","title":"Ein Navigationsmodell: doppelte Menüpunkte entfernen und Bildschirmnummerierung korrigieren","change":"Die Altfunktionen als Tabs in die v5-Bildschirme übernehmen (Fuhrpark → `/s/fleet` Tab „Записи/Документы“; Temperaturmesswerte → `/s/thermo` Tab „Журнал“; Tourenplanung → `/s/dispatch`) oder eindeutig umbenennen („Журнал температур“, „Реестр ТС“). In Gruppe 2 nur echte Admin- und Registerseiten belassen. Eine Nummerierungstabelle (`SCREENS.code`) für Navigation, Hilfe und FR-Dokumente. Alte Routen umleiten.","finding":"Die Seitenleiste zeigt die 17 v5-Bildschirme und danach die Gruppe «Учёт и администрирование» mit gleichnamigen Einträgen: «Диспетчер» (`i18n.tsx:14`, `Layout.tsx:14`), «Термостатус» (`i18n.tsx:17`, `Layout.tsx:17`) und «Автопарк» (`i18n.tsx:19`, `Layout.tsx:22`). Sie führen zu anderen Altseiten (`/dispatch`, `/temperature`, `/fleet`), und „Сводка по рейсам“ dupliziert die Übersicht. Die Konzeptcodes in `NAV` wiederholen 04 (ship, thermo) und 10 (partners, staff) und überspringen 14, während die Shell nach Index neu nummeriert (`Shell.tsx:26, 85`), sodass Codes in Konzept- und FR-Dokumenten nicht zur UI passen."},{"id":"FR-133","type":"FR","date":"2026-10-11","status":"implemented","group":"Betrieb, UX, i18n, Tests & Performance","module":"","title":"Navigationsschublade für Smartphone-Breite und Viewport-/Überlappungstests in der UI-Suite","change":"Hamburger-Schublade (`<nav>` off-canvas, `aria-expanded`) unter 900 px und eine untere Leiste für die 4 meistgenutzten Bildschirme je Rolle. `suite-layout.js` ergänzen: für jeden der 17 Bildschirme bei 390×844, 1024×768 und 1500×1000 prüfen, dass kein horizontales Seitenscrollen auftritt (`scrollWidth <= innerWidth`) und sich die Begrenzungsrahmen von `section`/`aside` nicht überlappen (`[data-disp-drv]` vs. `.v5-ops-aside`).","finding":"Unter 900 px wird die Seitenleiste statisch, und alle ≈40 Navigationsknöpfe (17 v5, 5 Simulationsknöpfe, ~20 Registereinträge, Hilfe) umbrechen über dem Inhalt (`index.css:162-165`). Ein Disponent am Telefon scrollt auf jedem Bildschirm am ganzen Menü vorbei. Die UI-Suite läuft nur bei 1500×1000 (`scripts/ui_suite.py:38`, `tools/run-ui-tests.cjs:7`). Das klebende Tourpanel, das „Лента приложения водителя“ im Disponenten verdeckte, wurde manuell gefunden und nur durch Entfernen von `position: sticky` behoben (`v5/v5.css`-Diff an `.v5-ops-aside`), ohne Test."},{"id":"FR-134","type":"FR","date":"2026-10-11","status":"implemented","group":"Betrieb, UX, i18n, Tests & Performance","module":"","title":"Navigation als Links, Skip-Link, Statushinweise nicht nur über Farbe","change":"`<a href=\"/s/<key>\" data-nav>` mit denselben Klassen rendern. Den portierten Selektor `nav button` → `nav [data-nav]` mit `// port:`-Markierung anpassen (nach V5-PORT-Regeln erlaubt). Skip-Link zu `main` und eine `aria-live`-Region für Toasts (bereits `role=status`, beibehalten). Jedem Tag ein Stufenzeichen oder Text voranstellen (●/▲/■ + „крит.“). Reduced-Motion-Media-Query für den Live-Puls.","finding":"Die v5-Navigationspunkte sind `<button onClick={go(...)}>` ohne `href` (`Layout.tsx:52-59`): kein „in neuem Tab öffnen“, keine Link-Semantik für Screenreader. Es gibt keinen Skip-to-content-Link und keine Behandlung von `prefers-reduced-motion` (`index.css`, `v5.css`). Ampel-Tags tragen ihre Bedeutung über Inline-oklch-Farbe (`<Tag l>`, DOM-Vertrag in `V5-PORT.md`)."},{"id":"FR-135","type":"FR","date":"2026-10-11","status":"implemented","group":"Betrieb, UX, i18n, Tests & Performance","module":"","title":"Orts-/Standortstamm mit IDs; kasachische UI; Transliteration externer Texte","change":"Stamm `locations` ergänzen (ID `KZ-AST`, Namen ru/kk/de/en, KATO-Code, Koordinaten, Hub). Namensschlüssel in WX, BLC, BLR und LINES durch IDs ersetzen; die Inbox akzeptiert `city_id` oder einen Resolver (RU/KK/lateinische Aliasse). Helfer `translit(ru→Latin, BGN/PCGN)` für externen Freitext auf DE/EN, Original per Hover. `kk` als 4. UI-Sprache (Beginn mit Navigation, Übersicht und Fahrer, Fallback auf RU).","finding":"Städte werden über Anzeigetexte verknüpft. `WX` ist nach lokalisiertem Namen geschlüsselt (`mock-v5.de.json`, `WX`-Schlüssel „Astana“, „Karaganda“), `CITY_RU` wird per Index abgeleitet (`ref.py:190`), externe Ereignisse müssen Städte auf Russisch nennen (`inbox.py:13`), und die Ausgangsdaten speichern Paare `[\"Астана\",\"Astana\"]` (`BLR.route`, `BLC`). `title/text` aus Konnektoren werden in der Inbox wie empfangen (RU) gespeichert, sodass DE/EN-Bildschirme Kyrillisch zeigen – gegen die DOM-Regel „kein Kyrillisch auf DE/EN“ (`V5-PORT.md:182`). Kasachisch gibt es nur in der Fahrer-App (`i18n.tsx:4` LANGS = ru/de/en, `DV`)."},{"id":"FR-136","type":"FR","date":"2026-10-11","status":"implemented","group":"Betrieb, UX, i18n, Tests & Performance","module":"","title":"494er-Suite in der CI gegen das echte Backend; Parität des Demo-Spiegels","change":"(1) CI-Job: `docker compose -f deploy/demo/docker-compose.yml up`, Nutzer je Rolle anlegen und `suite.dc.js` und `suite-ext.js` gegen die echte API ausführen (Logins skriptgesteuert mit TOTP-Secret aus einer Test-Fixture). (2) Paritätstest: eine gemeinsame JSON-Fixture aus (Aktion, Payload, Rolle) läuft durch den Python-Handler und den TS-Spiegel, Dokumente und Status werden verglichen. (3) Suite auf PRs ausführen. (4) Zustand je Modulgruppe zurücksetzen (`/api/v5/reset` außerhalb von Prod), um Kaskaden zu vermeiden.","finding":"Die 494 Szenarien laufen nur gegen das Browser-Demo (`.github/workflows/pages.yml` „Run ported UI suite“), wo `DEMO_SINGLE_USER = true` die Vier-Augen-Regeln abschaltet (`frontend/src/demo/v5/costs.ts:8`, `baseline.ts:31`, `partners.ts:67`). Die 46 Serveraktionen sind in TS nachimplementiert (`frontend/src/demo/v5/*.ts`) ohne Paritätsprüfung. `ci.yml` (Push/PR) führt weder die Suite noch `oxlint` aus, und `pages.yml` läuft nur auf `main`, sodass PRs nicht durch die UI-Suite abgesichert sind. Geordnete zustandsbehaftete Tests (`V5-PORT.md:198`) lassen Fehler kaskadieren."},{"id":"FR-137","type":"FR","date":"2026-10-11","status":"implemented","group":"Betrieb, UX, i18n, Tests & Performance","module":"","title":"Bildschirm- und Hilfeberechtigungen aus dem Backend generieren; vollständiger Test Rolle × Aktion","change":"`scripts/dump_v5_meta.py` erweitern, sodass es `ROLE_PERMS`, die Zuordnung Bildschirm→Recht und Aktion→Recht ausgibt. Das Frontend importiert die Metadaten für Navigation, Hilfe und Guard. Parametrisierter pytest über alle Rollen × 46+ Aktionen (erwartet 200/403 aus einer deklarativen Tabelle) und über alle Rollen × 17 Bildschirme. Bildschirmumfang des Fahrers ausdrücklich festlegen (nur Fahrer, Abdeckung).","finding":"Berechtigungen werden an vier Stellen gepflegt: `rbac.py:265-286`, `frontend/src/v5/screens/index.ts:23-40` (Bildschirmrechte), `frontend/src/help/screens.ts` (`perm:` je Bildschirm) und `help/roles.ts:1-2` („mirror of rbac.py … keep in sync“). Die Rollenlogik des Konzepts ist nur in einzelnen Modultests sichtbar (`tests/test_v5_*.py`). Ein Fahrer kann Disponent, Beladung, Dokumente, Wetter und Partner öffnen, weil diese nur `trips:read` brauchen (`screens/index.ts:25-34`), das die Fahrerrolle besitzt (`rbac.py:279`)."},{"id":"FR-138","type":"FR","date":"2026-10-11","status":"implemented_partial","group":"Betrieb, UX, i18n, Tests & Performance","module":"","title":"2-s-Live-Tick vom App-Baum isolieren; Bildschirme per Code-Splitting; Bundle-Budget","change":"`live`, `t` und `door` in einen eigenen `LiveContext` verlagern (nur Thermo, Übersicht und Fahrer abonnieren). `alertsAll` und `navBadges` auf `doc` memoisieren. Tick bei `document.hidden` pausieren. `React.lazy` je Bildschirm plus Hilfe und Integrationskatalog. CI-Budget (`vite build` → Fehler, wenn das initiale JS 400 KB gzip oder ein Chunk 250 KB übersteigt).","finding":"Alle 2 s ersetzt `setUiState(tick)` das `ui` (`V5.tsx:100`), was `E` neu erzeugt (`V5.tsx:132-135`). Der ganze Baum rendert neu, einschließlich Seitenleiste (`useV5Nav` berechnet `loadCalc` + `alertsAll` + `navBadges` neu, `Shell.tsx:20-27`) und Kopfzeile (`alertsAll`, `searchLines`, `Shell.tsx:63-65`), auch bei verborgenem Tab. Das Produktiv-JS ist ein einziger Chunk von 972 KB (`frontend/dist/assets/index-COiDXqTD.js`), gestiegen von ~640 KB. Nur DemoBar ist lazy (`main.tsx:15`); die 721 Zeilen `integrationsCatalog.ts` und ~1 500 Zeilen Hilfe werden immer geladen."},{"id":"BUG-32","type":"bug","date":"2026-10-12","status":"fixed","group":"Gemeldete Fehler (Plattform)","module":"","title":"Express-Sendung mit 3-Personen-Freigabe nicht auffindbar (nur auf Bildschirm 17 „Ausgangsdaten“)","change":"Express-Option in der Kundenbuchung + Einstieg im Disponenten + Hilfeartikel; 3 Freigabefunktionen","finding":"Express-Sendung mit 3-Personen-Freigabe nicht auffindbar (nur auf Bildschirm 17 „Ausgangsdaten“)"},{"id":"BUG-31","type":"bug","date":"2026-10-12","status":"fixed","group":"Gemeldete Fehler (Plattform)","module":"","title":"Browserverlauf zeigt nur „Olymp Logistic“/„Hilfe und Anleitungen“ – der Bereich ist nicht erkennbar","change":"Dokumenttitel je Bildschirm/Tab/Datensatz (`<Bereich> · <Bildschirm> · Olymp Logistic`), Zurück/Vor stellt Bereich und Tab wieder her","finding":"Browserverlauf zeigt nur „Olymp Logistic“/„Hilfe und Anleitungen“ – der Bereich ist nicht erkennbar"},{"id":"BUG-30","type":"bug","date":"2026-10-12","status":"fixed","group":"Gemeldete Fehler (Plattform)","module":"","title":"Transportversicherung zeigt nur ₸","change":"Deklarierter Wert und Prämie zusätzlich in EUR und USD zum Tageskurs der NBK, mit Kursdatum","finding":"Transportversicherung zeigt nur ₸"},{"id":"BUG-29","type":"bug","date":"2026-10-12","status":"fixed","group":"Gemeldete Fehler (Plattform)","module":"","title":"Bereich Paletten / Temperatur hat kein Gewicht","change":"Gewicht (kg) Pflichtfeld neben Paletten, genutzt für Preis, Kapazität, Achsprüfung","finding":"Bereich Paletten / Temperatur hat kein Gewicht"},{"id":"BUG-28","type":"bug","date":"2026-10-12","status":"fixed","group":"Gemeldete Fehler (Plattform)","module":"","title":"„Keine Linie verbindet Abholung und Ziel“ wird Kunden angezeigt","change":"Nie ablehnen: Route über einen Hub (Umschlag), +1–2 Arbeitstage als Info anzeigen","finding":"„Keine Linie verbindet Abholung und Ziel“ wird Kunden angezeigt"},{"id":"BUG-27","type":"bug","date":"2026-10-12","status":"fixed","group":"Gemeldete Fehler (Plattform)","module":"","title":"Abhol-/Ziellisten im Portal bieten „KDL Olymp · Hub/Niederlassung“ an; externe Kunden versenden von/zu eigenen Standorten","change":"Städtelisten ohne KDL Olymp; Straßenadresse Pflicht und gegen das Straßenverzeichnis der Stadt validiert","finding":"Abhol-/Ziellisten im Portal bieten „KDL Olymp · Hub/Niederlassung“ an; externe Kunden versenden von/zu eigenen Standorten"},{"id":"BUG-26","type":"bug","date":"2026-10-11","status":"fixed","group":"Gemeldete Fehler (Plattform)","module":"","title":"Orte auf EN/DE-Seiten (Portal) auf Russisch","change":"Behoben in Welle 1 (Anzeigeübersetzung) und FR-135 (Standortstamm)","finding":"Orte auf EN/DE-Seiten (Portal) auf Russisch"},{"id":"BUG-25","type":"bug","date":"2026-10-11","status":"fixed","group":"Gemeldete Fehler (Plattform)","module":"","title":"Abholung und Ziel fehlen / dieselbe Stadt doppelt („Almaty · KDL Olymp · Almaty“)","change":"Behoben in Buchung v2 (getrennte Abholung und Ziel) – ersetzt durch BUG-27","finding":"Abholung und Ziel fehlen / dieselbe Stadt doppelt („Almaty · KDL Olymp · Almaty“)"},{"id":"BUG-24","type":"bug","date":"2026-10-11","status":"fixed","group":"Gemeldete Fehler (Plattform)","module":"","title":"GitHub Pages 404 für das private Plattform-Repo","change":"Vorschau unter Olymp-Logistic-KZ/platform/ veröffentlicht","finding":"GitHub Pages 404 für das private Plattform-Repo"},{"id":"BUG-23","type":"bug","date":"2026-10-11","status":"fixed","group":"Gemeldete Fehler (Plattform)","module":"","title":"Spalten der Fuhrparktabelle brechen bei ≈1080 px auf einen Buchstaben je Zeile zusammen","change":"GridTable-Mindestbreiten + eigener Scrollbereich; Layout-Suite","finding":"Spalten der Fuhrparktabelle brechen bei ≈1080 px auf einen Buchstaben je Zeile zusammen"},{"id":"BUG-22","type":"bug","date":"2026-10-11","status":"fixed","group":"Gemeldete Fehler (Plattform)","module":"","title":"Ladebild/Kacheln nicht synchron mit markierten Aufträgen (übergebene Aufträge blieben markiert)","change":"Ein Zustand in loadSim.ts; gesperrte Zeilen für übergebene Aufträge","finding":"Ladebild/Kacheln nicht synchron mit markierten Aufträgen (übergebene Aufträge blieben markiert)"},{"id":"BUG-21","type":"bug","date":"2026-10-11","status":"fixed","group":"Gemeldete Fehler (Plattform)","module":"","title":"Beladung & Gewicht: Überladungen (Achse, Gesamt, Höhe) nicht immer sichtbar","change":"Überladungsbalken/-tags mit genauer Überschreitung, Höhe in der Seitenansicht","finding":"Beladung & Gewicht: Überladungen (Achse, Gesamt, Höhe) nicht immer sichtbar"},{"id":"BUG-20","type":"bug","date":"2026-10-10","status":"fixed","group":"Gemeldete Fehler (Plattform)","module":"","title":"Disponent: Tourpanel verdeckt beim Scrollen den „Feed der Fahrer-App“","change":"sticky entfernt + Regressionstest","finding":"Disponent: Tourpanel verd   const REG = {"as_of":"2026-10-12","n":223,"entries":[{"id":"BUG-37","type":"bug","date":"2026-10-16","status":"fixed","group":"Gemeldete Fehler (Plattform)","module":"","title":"Online-Demo: eine in einem zweiten Tab gebuchte Sendung fehlt in «Buchungen» des ersten Tabs","change":"Die Demodaten tragen eine Revision; vor jeder Anfrage übernimmt ein Tab die neueren Datensätze des anderen Tabs (eigenes Konto und Betriebszustand bleiben), offene Listen und der Zähler laden neu, wenn ein anderer Tab speichert. Echte Plattform: die offene Buchungsliste lädt zusätzlich neu, sobald der Zähler (Abfrage alle 60 s) eine neue Anfrage sieht","finding":"Kundenportal und Disposition in zwei Browser-Tabs: BK-26-000002 aus dem Portal-Tab erschien weder in der Liste noch im Zähler der Disposition; das nächste Speichern des Dispositions-Tabs konnte sie sogar überschreiben (jeder Tab hatte seine eigene Kopie der Demodaten, nur die 17 Betriebsbildschirme wurden abgeglichen)"},{"id":"BUG-36","type":"bug","date":"2026-10-16","status":"fixed","group":"Gemeldete Fehler (Plattform)","module":"","title":"Übersicht: ein älterer kritischer Alarm konnte aus der Alarmliste fallen","change":"Die Liste enthält die 20 schwersten offenen Alarme, innerhalb einer Stufe die neuesten zuerst","finding":"/api/overview listete die 20 neuesten offenen Alarme; bei 20 neueren Warnungen wurde ein offener kritischer Alarm nicht mehr angezeigt (die Kennzahl zählte ihn weiter)"},{"id":"BUG-35","type":"bug","date":"2026-10-15","status":"fixed","group":"Gemeldete Fehler (Plattform)","module":"","title":"Goldene Status-Chips im Kökzhol-Design unter WCAG-Kontrast","change":"Kökzhol-Regel: helles Gold als Hintergrund, dunkelgoldene Schrift, goldener Rand; der CI-a11y-Job prüft jetzt beide Designs (RU und EN)","finding":"Chips «Unterwegs», «Risiko», «eingereicht» nutzen das Kökzhol-Gold als Hintergrund mit dunkler Schrift: Kontrast unter 4,5 : 1 (axe serious) auf Fahrten, Aufträgen, Alarmen, Versicherung, Buchung"},{"id":"BUG-34","type":"bug","date":"2026-10-15","status":"fixed","group":"Gemeldete Fehler (Plattform)","module":"","title":"Eingang: Connector-Meldungen auf EN / DE als transliteriertes Russisch (und Russisch beim Überfahren)","change":"Connector-Meldungen liefern ihren Text als Meldungsbausteine (title_m / text_m – wie ein Connector, der den Text aus einer Vorlage erzeugt): übersetzt in DE / EN / KK, der russische Text bleibt das gespeicherte Original. Die Demo-Testmeldungen (Sperrung, Unwetter, Sergek, Werkstatt, Sicherheitszentrale, Ausschreibung) nutzen das auf dem Server und in der Browser-Demo; der Vorfalltext nutzt den übersetzten Titel. Echter Freitext einer Person wird weiter transliteriert, der Tooltip heißt «Originaltext (Russisch, nicht übersetzt)»","finding":"«Shtormovoe preduprezhdenie: Atyrau, veter 23–28 m/s…», «Okhrannyy tsentr: dver gruzovogo otseka…» – für englische / deutsche Leser unverständlich; der Tooltip zeigte das russische Original ohne Erklärung; der Vorfalltext auf 07 Sicherheit war ebenfalls transliteriert"},{"id":"FR-190","type":"FR","date":"2026-10-15","status":"implemented","group":"Angeforderte Funktionen (15.10.2026)","module":"","title":"Zähler „Buchungen“ im Menü für neue Anfragen + Hilfeartikel","change":"Der Menüpunkt „Buchungen“ (Stammdaten und Verwaltung) zeigt die Zahl der Buchungen im Status „angefragt“ (Stil v5-badge) aus GET /api/bookings/count (hub-bezogen, bookings:manage) – aktualisiert beim Seitenwechsel, nach jeder Entscheidung und alle 60 s, pausiert bei verborgenem Tab; Demo-Spiegel. Neuer Hilfeartikel „Buchungen — Kundenanfrage bestätigen, ablehnen oder stornieren“ (RU/DE/EN, KK-Titel): wo Anfragen erscheinen, Filter Angefragt, Aktionen, Berechtigung, was der Kunde erhält; verlinkt über die Hilfe-Schaltfläche der Seite Buchungen und den Hilfe-Index","finding":"Neue Kundenanfragen waren nur sichtbar, wenn jemand den Buchungstisch öffnete; keine Hilfe beschrieb, wo sie erscheinen und wie man entscheidet"},{"id":"FR-189","type":"FR","date":"2026-10-15","status":"implemented","group":"Angeforderte Funktionen (15.10.2026)","module":"","title":"BIN-/IIN-Prüfung und Datenübernahme (Prüfziffer offline, optionale KGD-Onlineprüfung)","change":"Optionales BIN-/IIN-Feld für Zahler und CRM-Kunde: Prüfziffer offline (Gewichte 1…11, Ersatz 3…11, 1, 2), Ziffer 5 = BIN (juristische Person) oder IIN (Einzelunternehmer); eine IIN ist personenbezogen – verschlüsselt (booking_payers / customer_tins, Kontext Tabelle:Spalte:Zeilen-ID), maskiert, nie protokolliert (Audit nur mit Schlüssel-Hash). POST /api/bin/check (crm:write) und /api/portal/bin/check (Portal, 20 Prüfungen / 10 min). Onlineprüfung: Konnektor integrations/kgd_tin.py (KGD-MF-RK-API-Dienste, konfigurierbare Basis-URL + API-Schlüsseldatei, dokumentierte Antwortabbildung, standardmäßig aus) über den Worker-Task tin-checks; Ergebnisse in tin_checks mit checked_at + Quelle zwischengespeichert; die Oberfläche zeigt „vom KGD geprüft am …“ oder „nicht online geprüft (offline)“ und funktioniert ohne Internet; der registrierte Name kann in das Firmenfeld übernommen werden (Bestätigung durch den Nutzer; im Portal nie für eine IIN). Sensus API, Uchet.kz, Kompra.kz, Adata.kz nur als deaktivierte Anbieteroptionen im Integrationsregister (externe kommerzielle Dienste – Datenresidenz zuerst prüfen)","finding":"Firmennummern wurden nur auf 12 Ziffern geprüft; eine IIN eines Einzelunternehmers (personenbezogen) konnte im Klartext gespeichert werden; keine Registerprüfung"},{"id":"FR-188","type":"FR","date":"2026-10-15","status":"open_question","group":"Angeforderte Funktionen (15.10.2026)","module":"","title":"WhatsApp-/Telegram-Benachrichtigungen – rechtliche Entscheidung zu Auslandsübermittlung und Kundeneinwilligung nötig","change":"Nicht umgesetzt: beide Dienste verarbeiten die Nachricht (Empfängernummer, Buchungsdaten) auf Servern außerhalb Kasachstans – Konflikt mit CLAUDE.md Regel 5 und der Lokalisierungspflicht (Gesetz 94-V Art. 12). Stattdessen E-Mail (SMTP-Relay) und SMS (KZ-Gateway) (FR-187)","finding":"Kunden wünschen Buchungsnachrichten per WhatsApp oder Telegram"},{"id":"FR-187","type":"FR","date":"2026-10-15","status":"implemented","group":"Angeforderte Funktionen (15.10.2026)","module":"","title":"Buchungsbestätigung per E-Mail / SMS","change":"Der Kunde wählt die Kanäle im Buchungsformular (E-Mail standardmäßig an, SMS auf Wunsch, Empfängeradresse / Mobilnummer verschlüsselt in booking_notify). Nach der Anfrage und bei Bestätigung / Ablehnung / Stornierung (Tisch oder Portal) wird eine Zusammenfassung in der Outbox booking_messages eingereiht – Buchungsnummer, Städte der Strecke, Abfahrtsdatum, Paletten, Preis und Status, keine IIN und keine weiteren personenbezogenen Daten – und vom Worker-Task booking-messages über die vorhandenen SMTP-Relay-Einstellungen und das KZ-SMS-Gateway zugestellt (kein Netzaufruf in der API; fehlende Konfiguration → übersprungen, Transportfehler wiederholt; Audit ohne Adressen). Demo: Vorschau „Nachricht gesendet (Demo)“","finding":"Nach einer Buchungsanfrage erhielt der Kunde keine Bestätigung außerhalb des Portals; Statusänderungen durch Mitarbeitende waren nur unter „Meine Buchungen“ sichtbar"},{"id":"FR-186","type":"FR","date":"2026-10-15","status":"implemented","group":"Angeforderte Funktionen (15.10.2026)","module":"","title":"Buchende / zahlende Partei (Agent, Makler, Spediteur) mit eigener Rechnung","change":"Optionaler Abschnitt „Gebucht und bezahlt durch Dritte“ im Buchungsportal: Firma, BIN / IIN (FR-189), Rolle (Agent / Makler / Spediteur / sonstige), Ansprechpartner, E-Mail, Telefon, Rechnungsadresse, eigene Referenz / Bestell-Nr.; Rechnungsempfänger = Zahler. Gespeichert in booking_payers (Alembic 0016p_booking_party): Ansprechpartner, E-Mail, Telefon und eine IIN verschlüsselt (Kontext Tabelle:Spalte:Zeilen-ID), maskiert in „Meine Buchungen“ und am Buchungstisch, nie in Logs / Audit-Details (Audit: nur Rolle). Angebots- / Vertragsmuster und der ESF-Entwurf der Buchung nutzen den Zahler als Käufer; Kundenisolations-Suite erweitert (Zahler von A für B unsichtbar)","finding":"Agenten, Makler und Speditionen buchen und zahlen im Auftrag des Versenders, die Buchung hatte dafür keinen Platz; die Rechnung ging immer an den Versender"},{"id":"FR-185","type":"FR","date":"2026-10-15","status":"implemented","group":"Angeforderte Funktionen (15.10.2026)","module":"","title":"Gewichtsplausibilität einer Buchung (Warnungen, nie blockierend)","change":"Nicht blockierende Warnungen mit Empfehlung (RU/DE/EN/KK) neben den Gewichts- / Packstückfeldern, im Preisschritt und vor der Bestätigung: Summe der Packstückgewichte ≠ Bruttogewicht (Toleranz = größerer Wert aus ±2 % und 10 kg), mehr nicht stapelbare Packstücke als Palettenplätze (Packstücke je Palette aus der Grundfläche), Grundfläche größer als eine Palette, Gewicht je Palette über max_kg_per_pallet (über die Packstückgewichte) oder ungewöhnlich hoch / unplausibel niedrig – „Gewicht jeder Palette oder die Summe prüfen“. Alle Schwellen sind Planwerte in den Stammdaten Art routing (FR-174-Eintrag weight_plausibility). Der Server liefert dieselben Prüfungen als warnings[] im Angebot (Portal und Partner-API) und bei jeder Buchung (Buchungstisch zeigt „⚠ Gewicht prüfen“); die harten Grenzen bleiben. TS-Spiegel bookingChecks.ts mit gemeinsamer Paritäts-Fixture","finding":"Beispiel des Product Owners: Bruttogewicht 905 kg, 1 Palette, Packstückzeilen 206 + 505 + 300 = 1.011 kg auf 3 Packstücken – keine Warnung erschien"},{"id":"FR-180","type":"FR","date":"2026-10-13","status":"implemented","group":"Angeforderte Funktionen (13.10.2026)","module":"","title":"Eine Kennzeichnung für Fehler: BUG-xx (kein B-xx mehr)","change":"Plattformfehler B-01…14 → BUG-19…32 umnummeriert in Register, Change-Request-Dokumenten, Code-Kommentaren, Testnamen, Hilfetexten und der Partner-API-Referenz; die Konzeptnummerierung läuft weiter","finding":"Konzeptfehler waren BUG-01…18 nummeriert, Plattformfehler B-01…14 – zwei Kennzeichnungen im selben Register"},{"id":"FR-179","type":"FR","date":"2026-10-13","status":"implemented","group":"Angeforderte Funktionen (13.10.2026)","module":"","title":"Navigationssymbole: Duotone (Olymp-Design) und Kacheln (Kökzhol-Design)","change":"Ein eigener 24-px-Symbolsatz für die 17 Bildschirme und alle Verwaltungsseiten (eigener Chunk, keine Textknoten); Olymp: Kontur + getönte Fläche, goldene Hub-Punkte; Kökzhol: weiße Glyphe auf gruppenfarbiger Kachel (Betrieb · Überwachung · Dokumente · Ressourcen · Finanzen), Nummern ausgeblendet; dazu lesbare Alarm-Simulationsknöpfe in der Kökzhol-Seitenleiste","finding":"Die Seitenleiste hatte nur Nummern und Text; fünf Symbolstile wurden vorgeschlagen, der Eigentümer wählte C · Duotone mit Olymp-Palette und D · Kachel mit Kökzhol-Palette"},{"id":"BUG-33","type":"bug","date":"2026-10-13","status":"fixed","group":"Gemeldete Fehler (Plattform)","module":"","title":"Alarm-Simulationsknöpfe im Kökzhol-Design unsichtbar","change":"Kökzhol-Regel für .v5-sims-Knöpfe: transluzenter Hintergrund, heller Text, sichtbarer Rand; aktiver Zustand in Markenfarbe; Live-Badge in Gold","finding":"Die Simulationsknöpfe der Seitenleiste behielten die Farben des hellen Themas auf der dunklen Leiste: dunkler Text auf dunklem Grund"},{"id":"FR-178","type":"FR","date":"2026-10-13","status":"implemented","group":"Angeforderte Funktionen (13.10.2026)","module":"","title":"Design-Umschalter: aktuelles Design ↔ Kökzhol-Markendesign","change":"Umschalter im Fuß der Seitenleiste und auf der Anmeldeseite; Kökzhol-Theme als CSS-Tokens über den Plattform-Variablen, selbst gehostete Schriften, Zeichen + Wortmarke + Claim, Favicon; Browser-Einstellung, ?brand=-Override; Standard = aktuelles Design","finding":"Die Plattform hatte ein festes Erscheinungsbild; das Kökzhol-Brand-Briefing (Tokens, Manrope/IBM Plex Mono, Shanyrak-Ö-Zeichen, dunkle Seitenleiste, eine Aktionsfarbe) sollte live vergleichbar sein"},{"id":"FR-177","type":"FR","date":"2026-10-12","status":"implemented","group":"Angeforderte Funktionen (12.10.2026)","module":"","title":"Versionsnummer und Build-Datum/-Zeit in der Versionsanzeige","change":"Eine VERSION-Quelle (Web-App, API, Startseite); jeder Preview-Upload erhöht die Patch-Version; Build-Datum und -Zeit (UTC+5) unter der Version und auf der Startseite","finding":"Links unten stand nur „0.2.0 · demo“; nicht erkennbar, welcher Upload läuft"},{"id":"FR-176","type":"FR","date":"2026-10-12","status":"implemented","group":"Angeforderte Funktionen (12.10.2026)","module":"","title":"Herstellerlogos auf Bildschirm 04","change":"Vom Auftraggeber gelieferte Logos (Roche, Abbott, QIAGEN, Sysmex, bioMérieux, Beckman Coulter) am rechten Rand jeder Karte in einer festen 515:380-Box, eingepasst, ohne Rahmen; auch auf dem Packstücketikett; Stammdaten-Override per Upload (PNG/WebP ≤ 300 KB, Typprüfung, verschlüsselter Objektspeicher, auditiert)","finding":"Herstellerkarten zeigten nur das Kürzel"},{"id":"FR-71","type":"FR","date":"2026-10-11","status":"implemented","group":"Eine Datenquelle & Architektur","module":"","title":"v5-Betriebsbildschirme aus echten DB-Touren/-Aufträgen speisen","change":"Server-View-Schicht (`app/v5/live.py`) ergänzen, die die Strukturen TRIPS/ORD/VM/DRV/LINES aus DB-Zeilen aufbaut (hub-gefiltert, Schlüssel = DB-Tour-/Auftragsnummer) und über `GET /api/v5/ops` ausliefert. Die Engines nutzen diese statt der Referenzschlüssel. Referenz-JSON wird nur ausgeliefert, wenn `OLYMP_ENV` = demo oder `OLYMP_ALLOW_DEMO=1`. v5-Aktionen lösen Touren und Aufträge in der DB auf.","finding":"Die v5-Engines lesen nur Referenzdaten (`R.TRIPS`, `R.ORD`, `R.VEH`, `R.LINES`: dispatch.ts:18, shared.ts:50-53, search.ts:28). Keine Engine ruft `/api/trips` oder `/api/orders` auf, und jede v5-Aktion sucht IDs in `ctx.R[\"TRIPS\"]`/`ctx.R[\"ORD\"]` (dispatch.py:24-30, docs.py:86-92, load.py:126-132). Übersicht, Disponent, Beladung, Sendungen, Dokumente, Thermo und Sicherheit zeigen daher auch im Produktivbetrieb das fiktive Szenario vom 06.10.2026, und die Startseite nach dem Login ist `/s/overview` (App.tsx:50)."},{"id":"FR-72","type":"FR","date":"2026-10-11","status":"implemented","group":"Eine Datenquelle & Architektur","module":"","title":"Kollision der Tournummern zwischen DB und Referenz beseitigen","change":"Eigenen Namensraum für DB-Touren verwenden: sequenzbasiert `R-<yy>-<nnnn>` oder konfigurierbares Präfix. Referenztouren im Demo-Build mit `DEMO-` präfixieren. Inbox-Ereignisse tragen die DB-Tour-ID, und der Router löst zuerst DB-Touren auf.","finding":"DB-Touren werden `R-101…` nummeriert (operations.py:393) – derselbe Bereich wie die Referenztouren R-102…R-106. Der Worker schreibt die relationale `trip.number` in Inbox-Ereignisse (worker.py:199-200), und das Inbox-Routing löst sie gegen `R[\"TRIPS\"]` auf (inbox.py `_route_doc`, ~Z. 332). Eine echte DB-Tour „R-106“ würde die fest codierte Ladeliste, das Umplanungsfenster und die Go/No-Go-Sonderregeln erben (load.py:117, dispatch.py:16, docs.py:98)."},{"id":"FR-73","type":"FR","date":"2026-10-11","status":"implemented","group":"Eine Datenquelle & Architektur","module":"","title":"Auftragspositionen, Packstücke und SSCC als eigene Tabellen","change":"Tabellen `order_lines` (Artikel, Hersteller, Charge, Verfall, Menge, Temperaturklasse) und `packages` (SSCC eindeutig, order_line_id, Status kommissioniert/verladen/übergeben/zugestellt/fehlend, scanned_at, scanned_by) anlegen. `Order.m3`, `adr_un`, `third_party` ergänzen. SSCC serverseitig erzeugen (GS1-Basisnummer aus den Einstellungen + laufende Nummer + Prüfziffer mod 10). Scan-Endpunkte für Be- und Entladung (auditiert).","finding":"`Order` (models.py:231-249) hat kein Volumen, keine Packstückzahl, keine SSCC, kein ADR/UN, kein Fremd-Flag, keinen Hersteller, kein Verfallsdatum und keinen Artikel. Die v5-Logik für Beladung, Sendungen und Dokumente hängt genau von diesen Feldern ab (`o.m3`, `o.adr`, `o.third`, `PKG`, `LINES`: shared.ts:53-80, docs.py:47-68, ship.ts:17-58). Daher können SSCC-Abgleich, ADR-Dokumente und Etiketten für echte Aufträge nicht funktionieren."},{"id":"FR-74","type":"FR","date":"2026-10-11","status":"implemented","group":"Eine Datenquelle & Architektur","module":"","title":"Betriebszustand v5 aus einem JSON-Dokument in Tabellen verlagern","change":"Die Schlüssel jedes Moduls in Tabellen mit DB-IDs überführen (trip_release, trip_document, load_plan, Packstück-Scans, Vorfälle, Übergaben) mit Zeilensperren. `/state` liefert nur die Hubs des Nutzers. Offset-/Total-Paginierung für Touren und Aufträge. Serverseitiger Such-Endpunkt (Auftragsnr., Charge, SSCC; GS1-Scannereingabe).","finding":"Der gesamte v5-Zustand ist eine JSON-Zeile (router.py:31,53-63). Jede Aktion sperrt diese Zeile hubübergreifend (router.py:100), und das vollständige Dokument wird nach jeder Aktion (router.py:114) sowie über `/state` an alle Mitarbeiter ohne Hubfilter zurückgegeben (router.py:76-81). Die Obergrenzen passen zu einem Demo, nicht zu einer Flotte: 50 zusätzliche Vorfälle, danach 409 „Too many open incidents“ (security.py:45-48). Listen werden stillschweigend abgeschnitten: `/api/trips` Limit 100 ohne Offset (operations.py:329-343), der Disponent lädt 200 offene Aufträge (Operations.tsx:21), und die Suche durchläuft alle `LINES` im Client (search.ts:28)."},{"id":"FR-75","type":"FR","date":"2026-10-11","status":"implemented","group":"Eine Datenquelle & Architektur","module":"","title":"Versionierte Dokumenthistorie und Archivtabellen statt stiller Listenkürzung","change":"`v5_doc_history(version, ts, actor, action, patch JSONB)` ergänzen, in derselben Transaktion wie jedes `/act` und `apply_external_event` geschrieben. Archivtabellen `v5_archive_<kind>(id, hub, day, payload JSONB)`, in die gekappte Einträge verschoben statt gelöscht werden. Tagesschlüssel (`opsDay`) und nächtlicher Roll-over-Job, der abgeschlossene Touren archiviert. `GET /api/v5/history?entity=&from=` (Auditor).","finding":"Wachsende Listen werden stillschweigend gekürzt: Betriebsprotokoll 8 (`registry.py:18, 80`), Inbox 200, Bußgelder 100, Tickets 100 (`inbox.py:47-53`), Fahrerereignisse 200 (`driver.py:36`), SMS 100 (`coverage.py` `LOG_MAX/OUT_MAX`). Verdrängte Bußgelder, Werkstatttickets und ePOD-Ereignisse (Finanz- und GDP-Nachweise) existieren danach nur noch als Audit-Details mit ≤ 80 Zeichen (`registry.py:84`). Es gibt keinen früheren Zustand von `v5_doc`, keinen mehrtägigen Betrieb und kein „05.10 anzeigen“."},{"id":"FR-76","type":"FR","date":"2026-10-11","status":"implemented","group":"Eine Datenquelle & Architektur","module":"","title":"Festes Szenariodatum durch ein Server-Geschäftsdatum ersetzen","change":"Der Server liefert `business_date` und `now` in `/api/v5/state`: im Produktivbetrieb das reale KZ-Datum, nur im Demo das Szenariodatum. Alle Engines und Module nutzen es. Fehlende Prognosedaten → Gate gelb („keine Daten“), nicht grün. Dokument- und Ereigniszeitstempel stammen aus gespeicherten Serverzeiten.","finding":"Das Frontend fixiert `TODAY = 06.10.2026` (core.ts:60-62); es steuert die Countdowns für Führerschein, Kalibrierung und Gebühren, während die Compliance-Liste im Backend das reale Datum nutzt (resources.py:413) – beide widersprechen sich. Das Wetter hat 7 Referenztage ab 06.10, und `wx_risk` überspringt Indizes ≥ 7 (docs.py:76-78, dispatch.py:41-44), sodass das Wetter-Gate ohne Daten stillschweigend grün ist. Dokumentdatum `06.10.2026` (docs.ts:101) und Track-&-Trace-Zeiten `05.10 18:20 … 08.10 06:00` (ship.ts:36-58) sind fest codiert. Das Betriebsprotokoll nutzt die Client-Uhr (registry.py:66-68,77-78)."},{"id":"FR-77","type":"FR","date":"2026-10-11","status":"implemented","group":"Eine Datenquelle & Architektur","module":"","title":"Echte Datenbankmigrationen (Alembic) statt `create_all`","change":"Alembic mit einer Basisrevision gleich dem aktuellen Schema einführen. Der Dienst `migrate` führt `alembic upgrade head` und danach Grants und Trigger aus. CI prüft `alembic check` (Modelle vs. Migrationen) und führt Upgrade und Downgrade auf einer leeren DB aus.","finding":"`init-db` führt `Base.metadata.create_all(engine)` aus (`backend/app/cli.py:54`). Es legt fehlende Tabellen an, ändert bestehende aber nie (neue Spalten, Typen, der JSON→JSONB-Wechsel aus C05, Indizes). `DEPLOYMENT.md` §5 verspricht „migrate runs automatically“ bei `git pull && up --build` – für geänderte Tabellen falsch."},{"id":"FR-78","type":"FR","date":"2026-10-11","status":"implemented","group":"Eine Datenquelle & Architektur","module":"","title":"Referenz-Stammdaten bearbeitbar und versioniert machen","change":"DB-Tabellen + Admin-CRUD-Masken mit Audit: Fahrzeuge (`Vehicle` erweitern: OGPO, Kasko, HU, Logger-Kalibrierung, ADR-Zulassung), Partner (+ Kontakte, B14), Personalkalender, Kostenparameter mit `valid_from` (Historie bleibt für Kostenberichte erhalten). Stufen- oder Tarifänderungen brauchen eine Vier-Augen-Freigabe. `/api/v5/ref` liest aus der DB, das Referenz-JSON dient nur noch als Seed.","finding":"Betriebliche Stammdaten sind schreibgeschützt in `be/v5/reference/mock-v5.*.json`: PARTNERS (Stufe, SLA, Kapazität, Tarife, Vertragsende, Versicherung), FEES (Fristen für Kfz-Haftpflicht OGPO, Kasko und HU), STAFF/LIC/TACHO, CP (Diesel, MRP, Gehälter), COWN, BLEX, CAPR. Szenariokonstanten: `NOW_YM` (`partners.py:29`), `TODAY` (`staff.py:16`). Der Fuhrpark hat überhaupt keine Aktionen (`be/v5/modules/fleet.py:10-12`). Die Inbox validiert Fahrzeuge nur gegen das Referenz-`VM`, sodass echte Fahrzeugcodes mit `err=\"veh\"` abgewiesen werden (`inbox.py:219-221`, `:283`)."},{"id":"FR-79","type":"FR","date":"2026-10-11","status":"implemented","group":"Eine Datenquelle & Architektur","module":"","title":"Seed über Service-Regeln plus Konsistenzprüfung","change":"Seed über die Service-Funktionen (`create_trip`/`_attach_orders`/`confirm`). `python -m app.cli check-consistency` ergänzen: Klasse vs. Fahrzeug, hubübergreifende Stopps, Aufträge ohne Stopps, Stopps ohne Aufträge, v5-Dokument vs. DB. In der CI nach dem Seed ausführen.","finding":"Der Seed verletzt die eigenen Regeln der Plattform. Der TK-Auftrag З-2295 ist auf dem Isotherm-Fahrzeug V02 geplant (seed.py:157-160 vs. operations.py:363-364). Alle 10 Referenzaufträge sind auf R-106 geplant, während v5 6 anhakt (load.py:118). R-103 (Hub AST) hat einen Stopp in Almaty, das zum Hub ALA gehört (seed.py:152; verboten durch operations.py:359-360). Das Fahrer-App-Konto ist mit D2 verknüpft (seed.py:239), der Fahrer von R-103 ist aber D3 (seed.py:152), sodass `driver.v01` die von der Fahrer-App simulierte Tour nicht sieht."},{"id":"FR-80","type":"FR","date":"2026-10-11","status":"implemented","group":"Eine Datenquelle & Architektur","module":"","title":"Kollisionsfreie Belegnummern","change":"PostgreSQL-Sequenzen je Belegart (optional je Jahr), z. B. `ORD-26-000123`, `BK-26-000045`.","finding":"Auftrags-, Tour- und Buchungsnummern stammen aus `COUNT(*)` (operations.py:220-226, booking.py:83-87). Zwei parallele Anlagen berechnen denselben Kandidaten, und die zweite Anfrage scheitert mit IntegrityError (HTTP 500)."},{"id":"FR-81","type":"FR","date":"2026-10-11","status":"implemented","group":"Sicherheit & Datenschutz","module":"","title":"Serverseitige Hub- und Rollenprojektion der Antworten von `/api/v5/state` und `/act`","change":"`project(doc, principal, hub)` in `v5/router.py` ergänzen: Teilbereiche entfernen, die die Rolle nicht lesen darf (z. B. `cAp/cApBy` ohne `costs:read`, `fineSt/fineInbox` ohne `fines:write`/`overview:read`, `smsOut` ohne `trips:write`) und hubgebundene Einträge (`inbox`, `inc`, `tickets`, `covContact`, `drvEv`) nach `ctx.hub` filtern. Anwenden auf `/state`, `/act` und die `reset`-Antwort. Jedes Modul deklariert seine Projektion neben seinem `@initial`-Teilbereich.","finding":"`GET /api/v5/state` liefert jeder Mitarbeiterrolle das vollständige Betriebsdokument (`backend/app/v5/router.py:76-81`), und `/act` liefert es erneut (`router.py:114`). Die Hub-Eingrenzung beim Lesen existiert nur im Browser (`frontend/src/v5/engine/core.ts:100-102`, `hubOk`), sodass ein Astana-Disponent, ein Fahrer oder ein Betrachter Almaty-Vorfälle, Bußgelder, Kostenfreigaben und SMS-Protokolle im JSON erhält."},{"id":"FR-82","type":"FR","date":"2026-10-11","status":"implemented","group":"Sicherheit & Datenschutz","module":"","title":"Partnerkontakte und Personaldaten aus der Referenz-Payload entfernen","change":"Kontakte nach `partner_contact` mit `phone_enc`/`mobile_enc` verlagern (Krypto-Kontext `partner_contact.<col>:<id>`), maskierte Anzeige und auditiertes Aufdecken (`partners:write`). `/ref` und `/state` werden nach Berechtigung und Hub gefiltert: Fahrer erhalten nur den Ausschnitt ihrer eigenen Tour (B05), Bußgeld-/Personalschlüssel erfordern `fines:write`/`drivers:write`.","finding":"Namen und Mobilnummern von Partnerkontakten liegen im Klartext im Referenz-JSON des Repositorys (`PARTNERS[].contacts`). Sie werden ungefiltert an jede Mitarbeiterrolle, auch Fahrer, über `GET /api/v5/ref` ausgeliefert (`be/v5/router.py:71-73`). `GET /api/v5/state` liefert jeder Mitarbeiterrolle das ganze Dokument (Bußgelder mit zugeordneten Fahrern, Personaleinsätze, alle Hubs) (`router.py:76-81`). Das widerspricht CLAUDE.md-Regel 3 (Telefon verschlüsselt, gebunden an Tabelle, Spalte und Zeilen-ID) und der Hub-Eingrenzung."},{"id":"FR-83","type":"FR","date":"2026-10-11","status":"implemented","group":"Sicherheit & Datenschutz","module":"","title":"Fahrer-App an die eigene Tour des Fahrers binden","change":"Die Tour aus `Driver.user_id` → aktive Tour (Status loading oder in_transit) und deren Stopps auflösen. Alle Payloads tragen eine Tour-, Stopp- oder Positions-ID, die gegen diese Tour validiert wird. Tourbezogener Zustand ersetzt die globalen Schlüssel `drvStep`, `dScan`, `dChk` und weitere.","finding":"Jede Aktion der Fahrer-App ist fest auf `TRIP, VEH, HUB = \"R-103\", \"V01\", \"ast\"` verdrahtet (`be/v5/modules/driver.py:29`, `:113-116`), sodass jedes Konto mit `driver:app` auf R-103 handelt. `Driver.user_id` existiert, wird aber nicht genutzt (`be/models.py:216`). Auch die SMS-Stub-Logik akzeptiert nur V01/R-103 (`be/v5/modules/coverage.py:276`). Bereits in ROADMAP v0.3 gelistet, aber nicht eingeplant."},{"id":"FR-84","type":"FR","date":"2026-10-11","status":"implemented","group":"Sicherheit & Datenschutz","module":"","title":"Keine simulierte Telemetrie und keine Alarm-Simulationsknöpfe im Produktivbetrieb","change":"`tick` und `SimButtons` hinter `DEMO || settings.training_mode` stellen (Server-Flag in `/api/v5/state`). Im Produktivbetrieb `ui.live` aus `temperature_readings` (Wialon-Sync, `integrations/worker.py:90`) über `GET /api/v5/telemetry?since=` füllen. Alter jedes Messwerts und einen Zustand „keine Daten“ statt des Seeds anzeigen. Jeder simulierte Wert trägt ein sichtbares Abzeichen „SIMULATION“.","finding":"`tick()` erzeugt in jedem Build alle 2 s Kühlaggregattemperaturen mit `Math.random()` (`V5.tsx:37-57`, `V5.tsx:97-102`, kein `DEMO`-Schutz). Thermo, Übersicht und Qualität zeigen diese Werte. `<SimButtons/>` („Симуляция тревог“) wird in der produktiven Seitenleiste gerendert (`Layout.tsx:61`). Ein GDP-Kühlkettenbetreiber könnte auf fiktive Temperaturen reagieren oder sie dokumentieren."},{"id":"FR-85","type":"FR","date":"2026-10-11","status":"implemented","group":"Sicherheit & Datenschutz","module":"","title":"Fachrollen für Freigaben; Unterschriftsfelder an die Freigeberrolle binden","change":"Rollen `manager` (approvals:sign, costs:approve, costs:read), `finance` (fines:write, costs:approve, costs:read) und `quality` (quality:write, temperature:read, alarms:read) ergänzen. `users.functions` (`head_logistics`, `fin_controller`, `qa_manager`) ergänzen. `costs.sign` / `baseline.exSign` prüfen `ctx.principal.has_function(CAPR_FN[i])`. `help/roles.ts` aktualisieren (siehe C21).","finding":"`approvals:sign`, `costs:approve` und `fines:write` gehören nur `admin` (`rbac.py:263-286`), und Admins müssen global mit `users:admin` sein (SECURITY.md §10). Vier-Augen-Freigaben brauchen daher zwei volle Administratoren, und Finanz- oder Qualitätsverantwortliche haben keine Rolle. Das Feld „Leiter Logistik“ vs. „Finanzcontroller“ (`CAPR`) ist nicht an den Unterzeichner gebunden: jeder Inhaber von `costs:approve` kann beide Felder unterschreiben (`costs.py:42-52`)."},{"id":"FR-86","type":"FR","date":"2026-10-11","status":"implemented","group":"Sicherheit & Datenschutz","module":"","title":"Rotation des `data_key` und Neuverschlüsselungs-Job umsetzen","change":"Mehrschlüsselbetrieb (`OLYMP_DATA_KEYS_DIR` mit `data_key_v1`, `data_key_v2`; Verschlüsselung mit dem neuesten, Entschlüsselung nach Versions-Byte). `python -m app.cli reencrypt --batch 500` (idempotent, fortsetzbar, Audit nur mit Zählern). Gleiches Muster für `index_key` (Blind-Indizes neu aufbauen). Runbook-Abschnitt mit Schritten und Prüfung.","finding":"`docs/DEPLOYMENT.md` §7 sagt, die Rotation des Datenschlüssels „requires a re-encryption job (planned for v0.2)“. v0.2.0 wird ohne ihn ausgeliefert, obwohl das Schlüsselversions-Byte existiert (`security/crypto.py`, Format `\\x01‖nonce‖ct`). SECURITY.md §9.5 verlangt jährliche Rotation oder Rotation nach Verdacht auf ein Leck, sodass das Incident-Runbook (§6, „personenbezogene Daten mit neuem Schlüssel neu verschlüsseln“) nicht ausführbar ist."},{"id":"FR-87","type":"FR","date":"2026-10-11","status":"implemented","group":"Sicherheit & Datenschutz","module":"","title":"Aggregiertes Audit abgewiesener eingehender Anfragen","change":"Abweisungen in einer Tabelle `security_counters(source, ip_hash, reason, window_start, n)` zählen. Einen Audit-Eintrag je (Quelle, Grund, 10-min-Fenster) mit Zähler schreiben, plus die erste Abweisung je IP. Alarm oberhalb eines Schwellwerts (C12). IP-Drosselung vor die Signaturprüfung verlegen, damit vor jedem DB-Schreibvorgang abgewiesen wird.","finding":"Jede abgewiesene nicht authentifizierte Anfrage an `/api/v1/inbound/{source}` wird in das nur anfügbare, hash-verkettete Audit-Log geschrieben (`routers/integrations.py:57-58`). Jeder Schreibvorgang nimmt den globalen Advisory-Lock (`audit.py:63`). Bei erlaubten 240 Anfragen/min je IP (SECURITY.md §9a) kann ein Angreifer ≈345 000 unlöschbare Zeilen pro Tag und IP erzeugen und um den Lock konkurrieren, den jede Nutzeraktion braucht."},{"id":"FR-88","type":"FR","date":"2026-10-11","status":"implemented","group":"Sicherheit & Datenschutz","module":"","title":"Dokumentiertes Bereinigen von `inbound_nonce` umsetzen","change":"Worker-Task `prune-nonces` (stündlich): `DELETE FROM inbound_nonce WHERE created_at < now() - interval '25 hours'`. 25 h behalten, damit stets das ±5-min-Fenster plus das ATI-Schema abgedeckt ist. Index auf `(source, created_at)`.","finding":"`integrations/models.py:7` und `integrations/inbound.py:10` besagen, Nonces würden „24 h aufbewahrt / nach 1 Tag bereinigt“, aber kein Code löscht aus `inbound_nonce` (nur Einfügen und Nachschlagen in `routers/integrations.py:64-73`). Die Tabelle wächst unbegrenzt, und die Existenzprüfung unter Advisory-Lock wird langsamer."},{"id":"FR-89","type":"FR","date":"2026-10-11","status":"implemented","group":"Sicherheit & Datenschutz","module":"","title":"Personennamen aus `v5_doc` heraushalten (oder verschlüsseln) und Löschung unterstützen","change":"Im Dokument nur `user_id` / `person_ref` speichern und Anzeigenamen beim Lesen über einen berechtigungsgeprüften Lookup auflösen. Empfängerunterschriften (ePOD) in eine verschlüsselte, an die Zeilen-ID gebundene Tabelle `epod`. `python -m app.cli erase-person <ref>` ergänzen, das Historien- und Archiveinträge pseudonymisiert und auditiert wird. CI-Lint, der neue Schreibvorgänge von `ctx.display_name` ins Dokument abweist.","finding":"Das Betriebsdokument speichert personenbezogene Daten als Klartext-JSON außerhalb von `security/crypto.py`: Anzeigenamen von Unterzeichnern (`cApBy[].name`, `costs.py:52`, auch Partner- und Ausgangsdaten-Freiga
