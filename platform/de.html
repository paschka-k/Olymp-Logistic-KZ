<!doctype html><html lang="de" data-design="olymp"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Olymp Logistic KZ · Platform v6 (de)</title><style>
/* ==========================================================================
   part-D-tokens.css  -  FleetFlow-style design tokens (light theme)
   Source: pixel measurements of 2026-10-18_SampleStructure_Aufzeichnung.mp4
   [M] = measured from frames (video colours drift +-6 per channel; saturated
         colours are ~5% darker than their Tailwind equivalents)
   [I] = inferred (Tailwind-like scale, thin text colours, sizes)
   All lengths are CSS px at design scale 1:1. The video shows the app at
   ~0.76x (1296 recorded px = ~1705 CSS px), so values = video px / 0.76,
   snapped to a 4px grid.  [I]
   ========================================================================== */
:root {
  /* ---- surfaces ---- */
  --bg-page:        #f9fafb;  /* [M #faf9fc] content area behind cards, table header */
  --bg-surface:     #ffffff;  /* [M] sidebar, top bar, cards, drawer, table rows */
  --bg-subtle:      #f3f4f6;  /* [M #f3f3f5] grey button, count badges, 'Data source' chip */
  --bg-selected:    #eff6ff;  /* [M #eff5ff] selected table row, blue alert */
  --bg-hover:       #f9fafb;  /* [M #f7f9fb] hovered table row */
  --border:         #f3f4f6;  /* [M #f3f3f3] sidebar/topbar/card hairlines */
  --border-input:   #e5e7eb;  /* [M ~#e5e5e9] input/select border, progress track, dashed drop zone */

  /* ---- text ---- */
  --text-strong:    #111827;  /* [M #0b0b0e] KPI value, page title */
  --text:           #374151;  /* [I] table body, nav inactive */
  --text-muted:     #6b7280;  /* [I] KPI label, sub-lines, table header caps */
  --text-faint:     #9ca3af;  /* [I] placeholder, 'Not assigned', captions */
  --link:           #2f66c8;  /* [I] Load ID links (thin text looks lighter than it is) */

  /* ---- brand / primary ---- */
  --primary:        #3b82f6;  /* [M #4381ed] active nav pill, primary button, tab, pagination */
  --primary-hover:  #2563eb;  /* [I] */
  --primary-tint:   #dbeafe;  /* [M #dbe9fb] icon badge bg, 'Assigned' chip bg */
  --primary-ring:   #93c5fd;  /* [I] focused select/input ring */
  --on-primary:     #ffffff;

  /* ---- solid accents (icon badges, dots, bars, small buttons) ---- */
  --blue:    #3b82f6;  /* [M #4581eb] */
  --green:   #33d965;  /* [M #33d965] progress fill, icon badge, Accept btn, map 'on time' dot */
  --yellow:  #e1b917;  /* [M #e1b917] icon badge, Override btn, progress warn, delayed dot */
  --red:     #df3149;  /* [M #df3149] icon badge, PDF btn, critical dot */
  --purple:  #9f45ed;  /* [M #9f45ed] icon badge */
  --orange:  #f97316;  /* [I] orange icon badge (fuel KPI measured #d59471 inside pastel) */
  --grey:    #6f737d;  /* [M] Dismiss button */

  /* ---- solid action buttons (large, Quick Actions / header CTAs) ---- */
  --btn-blue:       #4381ed;  /* [M] */
  --btn-green:      #1fcd83;  /* [M] 'Auto-Assign', 'Schedule Maintenance', 'Compliance Report', 'Assign Driver' */
  --btn-purple:     #8d1de5;  /* [M] 'Generate Invoice' */
  --btn-orange:     #dd4d11;  /* [M] 'Plan Route' */
  --btn-red:        #df3147;  /* [M] 'Export PDF' */
  --btn-grey-bg:    #f3f4f6;  /* [M #f3f3f5] 'Import Loads', 'Export Data', 'View History' */
  --btn-grey-text:  #4b5563;  /* [I] */

  /* ---- pastel tints: [bg-from (50) , bg-to (100)] for KPI gradient tiles, [text-strong 900], [label 600] ---- */
  --tint-blue-50:   #eff6ff; --tint-blue-100:   #dbeafe;  /* [M #eaf2fb -> #dce9fa] */
  --tint-green-50:  #f0fdf4; --tint-green-100:  #dcfce7;  /* [M #ecfdf3 -> #e0fee9] */
  --tint-yellow-50: #fefce8; --tint-yellow-100: #fef9c3;  /* [M #fcfcde -> #fcfac9] */
  --tint-red-50:    #fef2f2; --tint-red-100:    #ffe4e6;  /* [M #fcebec -> #f9dfe3] */
  --tint-purple-50: #faf5ff; --tint-purple-100: #f3e8ff;  /* [M #f6effd -> #f0e6fb] */
  --tint-orange-100:#ffedd5;                              /* [M #fbebd7] */
  --tint-gray-100:  #f3f4f6;                              /* [M] */
  --on-blue:   #1e3a8a;  --label-blue:   #3b6fd1;         /* [M value #262e63] */
  --on-green:  #14532d;  --label-green:  #2a9d52;         /* [M value #265333] */
  --on-yellow: #713f12;  --label-yellow: #a16207;         /* [I] */
  --on-red:    #7f1d1d;  --label-red:    #c0394d;         /* [I] */
  --on-purple: #581c87;  --label-purple: #7e3fbf;         /* [M value #42195b] */

  /* ---- status chips: bg [M] / text [I = 800 shade] ---- */
  --chip-green-bg:  #dcfce7;  --chip-green-fg:  #166534;  /* In Transit, Available, Active, On Time, Approved/Paid, Valid, Low(prio) */
  --chip-blue-bg:   #dbeafe;  --chip-blue-fg:   #1e40af;  /* Assigned, Submitted */
  --chip-yellow-bg: #fef9c3;  --chip-yellow-fg: #854d0e;  /* Loading, In Use, Pending, On Trip, Maintenance(wh), Delayed, Medium(prio), Review soon */
  --chip-purple-bg: #f3e8ff;  --chip-purple-fg: #6b21a8;  /* Delivered */
  --chip-red-bg:    #ffe4e6;  --chip-red-fg:    #be123c;  /* Critical, Maintenance(fleet), Overdue, Rejected, High(prio), Blocked */
  --chip-gray-bg:   #f3f4f6;  --chip-gray-fg:   #4b5563;  /* Unassigned, Off Duty, Pending Upload, counts */

  /* ---- health / risk dots ---- */
  --dot-good:  #6de38f;  /* [M #5fe587 fleet / #6de38f HOS] */
  --dot-warn:  #e9cb59;  /* [M] */
  --dot-bad:   #dd4359;  /* [M HOS red; fleet 'critical' is pale #f3c1c9] */
  --dot-bad-soft: #f3c1c9; /* [M] */

  /* ---- progress / utilisation thresholds (Warehouses) ---- */
  --bar-track: #e5e7eb;  /* [M #e5e5e9] */
  --bar-ok:    #35d567;  /* [M] <~75 % */
  --bar-warn:  #dfbb17;  /* [M] ~85-90 % (87.3 %) */
  --bar-crit:  #d1374b;  /* [M] >~90 % (94.8 %) */
  --bar-low:   #4583e7;  /* [M] <50 % (45.2 %, maintenance site) */

  /* ---- map ---- */
  --map-land:   #e5e3df;  /* [M] Google-Maps-like standard tiles */
  --map-park:   #cfe7bf;  /* [M] */
  --map-water:  #80d1e4;  /* [M] */
  --map-road:   #ffffff;  /* [M] minor roads; motorway #e8d576 [M], routes in Routes page: yellow #f2c94c [I] */
  --mk-blue:    #2f61dd; --mk-green: #25b753; --mk-orange: #d95117;
  --mk-red:     #c9172f; --mk-purple: #891fdf; --mk-teal: #1ba183;   /* [M] round markers, white icon */
  --mk-status-green: #37d969; --mk-status-yellow: #dfbb17;           /* [M] corner dot, 8px */

  /* ---- chart palette (Reports) ---- */
  --chart-line: #5aa8d0;  --chart-area: #e8f2fb;   /* [M approx] sky line + gradient area */
  --chart-mint: #94dcc4;  --chart-sky: #5cbce4;    /* [M] stacked bars */
  --chart-amber:#f4bc74;  --chart-blue: #4484ec;   /* [M] */
  --chart-grid: #e5e7eb;                           /* [I] */

  /* ---- avatars (initials, customer colour) ---- */
  --av-1:#315fd1; --av-2:#c7152f; --av-3:#d5511d; --av-4:#8921db;
  --av-5:#1fa183; --av-6:#533bd9; --av-7:#23b553; --av-8:#c7116f;  /* [M] */

  /* ---- alert cards (dashboard, [M] bg) + left border (AI page, [M]) ---- */
  --alert-red-bg:#fef2f2;    --alert-red-fg:#9b1c31;    --alert-red-bd:#970f25;
  --alert-orange-bg:#fff7ed; --alert-orange-fg:#9a3412;
  --alert-blue-bg:#eff6ff;   --alert-blue-fg:#1e3a8a;
  --alert-yellow-bg:#fefce8; --alert-yellow-fg:#854d0e;
  --banner-from:#fef3c7; --banner-to:#fcd9a8; --banner-bd:#d3a739;   /* [M #fdf3c9 -> #fbdbb1], AI disclaimer strip */

  /* ---- radii ---- */
  --r-card:   12px;  /* [M ~9 video px] cards, KPI tiles, drawer sections */
  --r-btn:    10px;  /* [M] buttons, top-bar selects */
  --r-input:  999px; /* [M] filter pill selects, search box, nav pill is 14px */
  --r-nav:    14px;  /* [M] sidebar active pill (28 px high in video -> near full pill) */
  --r-chip:   999px; /* [M] status & priority chips, count badges */
  --r-icon:   12px;  /* [M] KPI icon badge (rounded square); Fleet-style tinted tiles use circle 999px */
  --r-badge:  6px;   /* [I] small PDF/CSV buttons */

  /* ---- shadows ---- */
  --sh-card:  0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);   /* [M subtle 2-3px darker edge] */
  --sh-hover: 0 10px 15px -3px rgba(0,0,0,.10), 0 4px 6px -4px rgba(0,0,0,.06); /* [M] warehouse card hover/selected */
  --sh-pop:   0 4px 12px rgba(0,0,0,.12);                             /* [M] map legend / stat strip */
  --sh-drawer: -8px 0 24px rgba(0,0,0,.08);                           /* [I] left shadow, no scrim */

  /* ---- layout (CSS px @1x) ---- */
  --sidebar-w:  256px;  /* [M 194 video px] */
  --topbar-h:   80px;   /* [M 60 video px] */
  --page-pad:   24px;   /* [M 18 video px] */
  --gap:        24px;   /* [M 19 video px] KPI/card gap */
  --drawer-w:   384px;  /* [M 280 video px] standard detail drawer */
  --drawer-w-xl:840px;  /* [M 641 video px] Reports 'detailed view' */
  --nav-h:      37px;   /* [M 28 video px] */  --nav-pitch: 41px;
  --row-h:      70px;   /* [M orders 53 vp] fleet 74, billing 78, drivers 90 */
  --kpi-h:      125px;  /* [M dashboard tiles 95 vp]; tinted tiles 85 [M 64 vp] */

  /* ---- type ---- */
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;  /* [I] */
  --fs-title: 24px; --fw-title: 700;   /* page title [M cap-height 13 vp] */
  --fs-card:  18px; --fw-card: 600;    /* card title 'Live Operations' */
  --fs-kpi:   30px; --fw-kpi: 700;     /* [M] */
  --fs-body:  14px;                    /* table cells, nav, buttons */
  --fs-small: 12px;                    /* captions, chips, KPI sublines */
  --fs-th:    12px; --fw-th: 500; --ls-th: .05em;  /* TABLE HEADER CAPS */
}

/* ==========================================================================
   Olymp Logistic KZ additions (spec v1.0 §6) - cold chain, ESF, zones
   ========================================================================== */
:root {
  /* temperature status */
  --temp-ok:     #35d567;  --temp-ok-bg:     #dcfce7;
  --temp-warn:   #dfbb17;  --temp-warn-bg:   #fef9c3;
  --temp-breach: #d1374b;  --temp-breach-bg: #ffe4e6;
  /* temperature zones (muted so status colours stay dominant) */
  --zone-frozen:  #60a5fa;  --zone-frozen-bg:  #eff6ff;   /* -18 C */
  --zone-chilled: #2dd4bf;  --zone-chilled-bg: #f0fdfa;   /* 0..+4 C */
  --zone-pharma:  #a78bfa;  --zone-pharma-bg:  #f5f3ff;   /* +2..+8 C */
  --zone-ambient: #a8a29e;  --zone-ambient-bg: #f5f5f4;   /* +15..+25 C */
  /* ESF / ESUTD document state chips reuse chip-* pairs: issued=blue, confirmed=green, rejected=red, draft=gray */
  --step-done: #23cb85; --step-current: #4581eb; --step-failed: #c71531; --step-todo: #e7e7e9;
  --risk-high-bg:#fbdfe1;   --risk-high-bd:#970f25;
  --risk-mid-bg:#fdf3c9;    --risk-mid-bd:#d0a02c;
  --risk-low-bg:#dfffe7;    --risk-low-bd:#33a25b;
  --drawer-w-report: var(--drawer-w-xl);
}

/* ============================ base ============================ */
* { box-sizing: border-box; }
body { margin:0; font-family:var(--font); font-size:var(--fs-body); color:var(--text); background:var(--bg-page); }

/* ============================ shell ============================ */
.app { display:grid; grid-template-columns:var(--sidebar-w) 1fr; min-height:100vh; }
.sidebar { position:sticky; top:0; height:100vh; background:var(--bg-surface); border-right:1px solid var(--border); padding:16px; }
.topbar  { position:sticky; top:0; z-index:20; height:var(--topbar-h); background:var(--bg-surface);
           border-bottom:1px solid var(--border); display:flex; align-items:center; gap:16px; padding:0 var(--page-pad); }
.page-head { position:sticky; top:var(--topbar-h); z-index:10; background:var(--bg-surface); border-bottom:1px solid var(--border); padding:16px var(--page-pad); }
.page-title { font-size:var(--fs-title); font-weight:var(--fw-title); color:var(--text-strong); margin:0; }
.content { padding:var(--page-pad); display:flex; flex-direction:column; gap:var(--gap); }

/* ============================ nav ============================ */
.nav-item { display:flex; align-items:center; gap:12px; height:var(--nav-h); padding:0 12px; margin-bottom:4px;
            border-radius:var(--r-nav); color:var(--text); font-weight:500; cursor:pointer; }
.nav-item:hover  { background:var(--bg-subtle); }
.nav-item.active { background:var(--primary); color:var(--on-primary); }
.nav-item svg { width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.75; }  /* line icons, ~Lucide */


/* ============================ card ============================ */
.card { background:var(--bg-surface); border:1px solid var(--border); border-radius:var(--r-card); box-shadow:var(--sh-card); }
.card-head { padding:20px 24px; border-bottom:1px solid var(--border); font-size:var(--fs-card); font-weight:var(--fw-card); color:var(--text-strong); }
.card-body { padding:24px; }
.card.is-selected, .card:hover.is-hoverable { box-shadow:var(--sh-hover); }

/* ============================ KPI tile ============================ */
.kpi-row  { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:var(--gap); }
.kpi-tile { display:flex; justify-content:space-between; align-items:center; padding:20px 24px;
            background:var(--bg-surface); border:1px solid var(--border); border-radius:var(--r-card); box-shadow:var(--sh-card); }
.kpi-tile .label { font-size:var(--fs-body); color:var(--text-muted); }
.kpi-tile .value { font-size:var(--fs-kpi); font-weight:var(--fw-kpi); color:var(--text-strong); line-height:1.2; }
.kpi-tile .delta { font-size:var(--fs-small); color:#2fa365; }  .kpi-tile .delta.neg { color:#c0394d; }
.kpi-tile .icon  { width:48px; height:48px; border-radius:var(--r-icon); display:grid; place-items:center; background:var(--tint-blue-100); color:#3b6fd1; }
/* tinted variant (Fleet/Drivers/Warehouses/Routes): gradient 50->100, strong coloured value, circle solid icon */
.kpi-tile.tint { padding:16px 24px; border-color:transparent; }
.kpi-tile.tint .icon { width:40px; height:40px; border-radius:50%; color:#fff; }
.kpi-tile.blue   { background:linear-gradient(135deg,var(--tint-blue-50),var(--tint-blue-100)); }   .kpi-tile.blue   .value{color:var(--on-blue)}   .kpi-tile.blue   .label{color:var(--label-blue)}   .kpi-tile.blue   .icon{background:var(--blue)}
.kpi-tile.green  { background:linear-gradient(135deg,var(--tint-green-50),var(--tint-green-100)); } .kpi-tile.green  .value{color:var(--on-green)}  .kpi-tile.green  .label{color:var(--label-green)}  .kpi-tile.green  .icon{background:var(--green)}
.kpi-tile.yellow { background:linear-gradient(135deg,var(--tint-yellow-50),var(--tint-yellow-100));} .kpi-tile.yellow .value{color:var(--on-yellow)} .kpi-tile.yellow .label{color:var(--label-yellow)} .kpi-tile.yellow .icon{background:var(--yellow)}
.kpi-tile.red    { background:linear-gradient(135deg,var(--tint-red-50),var(--tint-red-100)); }     .kpi-tile.red    .value{color:var(--on-red)}    .kpi-tile.red    .label{color:var(--label-red)}    .kpi-tile.red    .icon{background:var(--red)}
.kpi-tile.purple { background:linear-gradient(135deg,var(--tint-purple-50),var(--tint-purple-100));} .kpi-tile.purple .value{color:var(--on-purple)} .kpi-tile.purple .label{color:var(--label-purple)} .kpi-tile.purple .icon{background:var(--purple)}

/* ============================ chip ============================ */
.chip { display:inline-flex; align-items:center; height:22px; padding:0 10px; border-radius:var(--r-chip);
        font-size:var(--fs-small); font-weight:500; background:var(--chip-gray-bg); color:var(--chip-gray-fg); white-space:nowrap; }
.chip.green  { background:var(--chip-green-bg);  color:var(--chip-green-fg); }
.chip.blue   { background:var(--chip-blue-bg);   color:var(--chip-blue-fg); }
.chip.yellow { background:var(--chip-yellow-bg); color:var(--chip-yellow-fg); }
.chip.purple { background:var(--chip-purple-bg); color:var(--chip-purple-fg); }
.chip.red    { background:var(--chip-red-bg);    color:var(--chip-red-fg); }
.chip.gray   { background:var(--chip-gray-bg);   color:var(--chip-gray-fg); }
.dot { width:20px; height:20px; border-radius:50%; display:inline-block; }  /* health / HOS dot: 20px [M 15 vp] */
.dot.good { background:var(--dot-good); } .dot.warn { background:var(--dot-warn); } .dot.bad { background:var(--dot-bad); }

/* ============================ button ============================ */
.btn { display:inline-flex; align-items:center; gap:8px; height:40px; padding:0 16px; border:0; border-radius:var(--r-btn);
       font:500 var(--fs-body)/1 var(--font); cursor:pointer; background:var(--btn-grey-bg); color:var(--btn-grey-text); }
.btn.primary { background:var(--btn-blue);   color:#fff; }  .btn.primary:hover { background:var(--primary-hover); }
.btn.green   { background:var(--btn-green);  color:#fff; }
.btn.purple  { background:var(--btn-purple); color:#fff; }
.btn.orange  { background:var(--btn-orange); color:#fff; }
.btn.red     { background:var(--btn-red);    color:#fff; }
.btn.grey    { background:var(--btn-grey-bg);color:var(--btn-grey-text); }
.btn.dark    { background:var(--grey);       color:#fff; }
.btn.block   { height:72px; justify-content:center; width:100%; }   /* Quick Actions tiles */
.btn.sm      { height:28px; padding:0 10px; font-size:var(--fs-small); border-radius:var(--r-badge); }

/* ============================ inputs / filter row ============================ */
.filters { display:flex; flex-wrap:wrap; align-items:center; gap:16px; }
.filters label { font-size:var(--fs-small); font-weight:500; color:var(--text); }
.select, .search { height:40px; padding:0 16px; border:1px solid var(--border-input); border-radius:var(--r-input);
                   background:var(--bg-surface); font:var(--fs-body) var(--font); color:var(--text); }
.select:focus, .search:focus { outline:2px solid var(--primary); outline-offset:0; border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-ring); }
.clear-all { color:var(--text-muted); background:none; border:0; cursor:pointer; }   /* '× Clear All' */

/* ============================ table ============================ */
.table { width:100%; border-collapse:collapse; background:var(--bg-surface); }
.table th { position:sticky; top:0; background:var(--bg-page); text-align:left; padding:14px 16px; font-size:var(--fs-th);
            font-weight:var(--fw-th); letter-spacing:var(--ls-th); text-transform:uppercase; color:var(--text-muted); }
.table td { padding:12px 16px; border-top:1px solid var(--border); height:var(--row-h); vertical-align:middle; }
.table tr:hover td { background:var(--bg-hover); }
.table tr.is-selected td { background:var(--bg-selected); }
.table .sub { display:block; font-size:var(--fs-small); color:var(--text-faint); }
.table a { color:var(--link); font-weight:500; text-decoration:none; }

/* ============================ drawer ============================ */
.drawer { position:fixed; top:0; right:0; bottom:0; width:var(--drawer-w); background:var(--bg-surface);
          border-left:1px solid var(--border); box-shadow:var(--sh-drawer); z-index:30; overflow:auto;
          transform:translateX(100%); transition:transform .25s ease; }    /* NO scrim in the recording */
.drawer.open { transform:none; }
.drawer.xl { width:var(--drawer-w-xl); }
.drawer-head { display:flex; justify-content:space-between; align-items:center; padding:20px 24px; border-bottom:1px solid var(--border); font-weight:600; font-size:16px; color:var(--text-strong); }
.drawer-tabs { display:flex; gap:24px; padding:0 24px; border-bottom:1px solid var(--border); }
.drawer-tabs .tab { padding:12px 0; color:var(--text-muted); border-bottom:2px solid transparent; }
.drawer-tabs .tab.active { color:var(--primary); border-color:var(--primary); }
.drawer-section { padding:20px 24px; border-bottom:1px solid var(--border); }
.drawer-section h4 { margin:0 0 12px; font-size:16px; font-weight:600; color:var(--text-strong); }

/* ============================ misc ============================ */
.progress { height:8px; border-radius:999px; background:var(--bar-track); overflow:hidden; }
.progress > i { display:block; height:100%; border-radius:999px; background:var(--bar-ok); }
.progress.warn > i { background:var(--bar-warn); } .progress.crit > i { background:var(--bar-crit); } .progress.low > i { background:var(--bar-low); }
.avatar { width:36px; height:36px; border-radius:50%; display:inline-grid; place-items:center; color:#fff; font-size:12px; font-weight:600; }
.badge-count { min-width:18px; height:18px; border-radius:50%; background:var(--red); color:#fff; font-size:10px; display:inline-grid; place-items:center; } /* bell badge [M #e3616d..#df3149] */
.alert-card { border-radius:var(--r-btn); padding:16px; border:1px solid rgba(0,0,0,.04); }
.alert-card.risk { border-left:4px solid var(--alert-red-bd); }
.banner-ai { background:linear-gradient(90deg,var(--banner-from),var(--banner-to)); border-left:4px solid var(--banner-bd); padding:12px 24px; color:#92400e; }

.progress.warn > i { background:var(--bar-warn); } .progress.crit > i { background:var(--bar-crit); } .progress.low > i { background:var(--bar-low); }

.zonebar > i { display:block; height:100%; }
.zonebar .z-frozen{background:var(--zone-frozen)} .zonebar .z-chilled{background:var(--zone-chilled)}

/* hub card (spec 5.7) */

</style></head><body><a class="skip" href="#main-content">Skip to content</a><div id="root"></div><script>
/* v6 core: i18n, helpers, icons, store + dispatch rules, shell, drawer, router. */

const HOOKS = { status: [] };   // screens subscribe here (e.g. hubs create inbound jobs when a load departs)
const hmm = m => { const x = Math.floor(m + 1e-9); return p2(Math.floor(x / 60) % 24) + ':' + p2(x % 60); };

  x: '<path d="M6 6l12 12M18 6L6 18"/>',
  therm: '<path d="M14 14.8V5a2 2 0 00-4 0v9.8a4 4 0 104 0z"/>',
  alert: '<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/>',
  up: '<path d="M7 17L17 7M9 7h8v8"/>',

const ic = (n, s = 16) => `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">${IC[n] || ''}</svg>`;

/* ---------- labels & status vocabulary (one palette everywhere, spec P3) ---------- */
const ST = {
  unassigned: { c: 'gray',   l: T('Не назначен', 'Offen', 'Unassigned', 'Тағайындалмаған') },
  assigned:   { c: 'blue',   l: T('Назначен', 'Zugewiesen', 'Assigned', 'Тағайындалған') },
  loading:    { c: 'yellow', l: T('Погрузка', 'Beladung', 'Loading', 'Тиеу') },
  in_transit: { c: 'green',  l: T('В пути', 'Unterwegs', 'In Transit', 'Жолда') },
  delivered:  { c: 'purple', l: T('Доставлен', 'Geliefert', 'Delivered', 'Жеткізілді') },
  problem:    { c: 'red',    l: T('Проблема', 'Problem', 'Problem', 'Мәселе') },
};
const ORDER = ['unassigned', 'assigned', 'loading', 'in_transit', 'delivered', 'problem'];
const PRI = { high: { c: 'red', l: T('Высокий', 'Hoch', 'High', 'Жоғары') }, medium: { c: 'yellow', l: T('Средний', 'Mittel', 'Medium', 'Орташа') }, low: { c: 'green', l: T('Низкий', 'Niedrig', 'Low', 'Төмен') } };
const ESF = {
  none:      { c: 'gray',   l: T('ЭСФ: нет', 'ESF: keine', 'ESF: none', 'ЭШФ: жоқ') },
  issued:    { c: 'blue',   l: T('ЭСФ: выписана', 'ESF: ausgestellt', 'ESF: issued', 'ЭШФ: жазылды') },
  confirmed: { c: 'green',  l: T('ЭСФ: подтверждена', 'ESF: bestätigt', 'ESF: confirmed', 'ЭШФ: расталды') },
};
const chip = (c, t) => `<span class="chip ${c}">${esc(t)}</span>`;
const stChip = s => chip(ST[s].c, ST[s].l);
const zoneChip = z => `<span class="chip zone-${z}">${ZONES[z].label}</span>`;
const fd = iso => { const d = new Date(iso); return p2(d.getDate()) + '.' + p2(d.getMonth() + 1) + '.' + d.getFullYear(); };
/* document validity: expired / renew soon (<= 30 d) / valid */
const docState = iso => { const days = Math.floor((new Date(iso + 'T23:59:59+05:00') - NOW) / 864e5); return days < 0 ? 'expired' : days <= 30 ? 'soon' : 'valid'; };
const DOCST = { valid: { c: 'green', l: T('Действует', 'Gültig', 'Valid', 'Жарамды') }, soon: { c: 'yellow', l: T('Скоро истекает', 'Läuft bald ab', 'Renew soon', 'Жақында аяқталады') }, expired: { c: 'red', l: T('Просрочен', 'Abgelaufen', 'Expired', 'Мерзімі өтті') } };
const avatar = (ini, n) => `<span class="avatar sm" style="background:var(--av-${n || 1})">${esc(ini)}</span>`;

/* ---------- store ---------- */
const S = {
  loads: [], drivers: [], trucks: [],
  route: 'dashboard', drawer: null, toast: null, tab: {}, role: 'admin', design: 'olymp',
  f: { q: '', status: '', cust: '', zone: '', pri: '', hub: '', drv: '', page: 1 },
  nextId: 1856,
  hubView: 'cards', clock: 14 * 60 + 32, costs: [], views: [], rf: { st: '', hub: '', q: '', flag: '' },
};
const loadOfTruck = id => S.loads.find(l => l.truck === id && isActive(l));
const loadOfDriver = id => S.loads.find(l => l.driver === id && isActive(l));
const truckLoc = t => { const l = loadOfTruck(t.id); return l && (l.status === 'in_transit' || l.status === 'problem') ? { city: HUBS[l.from].city + ' → ' + HUBS[l.to].city, sub: T('в пути', 'unterwegs', 'en route', 'жолда') } : { city: HUBS[t.hub].city, sub: HUBS[t.hub].name }; };
const truckState = t => { const l = loadOfTruck(t.id); if (t.status === 'service') return 'service'; if (t.health === 'red' || (l && tempState(l) === 'breach')) return 'critical'; return t.status === 'busy' ? 'busy' : 'available'; };
const TS = { available: { c: 'green', l: T('Свободен', 'Frei', 'Available', 'Бос') }, busy: { c: 'yellow', l: T('В рейсе', 'Im Einsatz', 'In use', 'Рейсте') }, service: { c: 'red', l: T('Сервис', 'Service', 'Maintenance', 'Сервис') }, critical: { c: 'red', l: T('Критично', 'Kritisch', 'Critical', 'Сыни') } };
const rtoDot = d => (d.status === 'rest' || d.rto < 4) ? 'bad' : d.rto < 6 ? 'warn' : 'good';
const agoTxt = m => m < 60 ? m + ' ' + T('мин назад', 'Min. her', 'min ago', 'мин бұрын') : Math.round(m / 60) + ' ' + T('ч назад', 'Std. her', 'h ago', 'сағ бұрын');
const cust = id => CUSTOMERS.find(c => c.id === id);
/* loads handed to a partner carrier have no own driver / truck: frozen placeholders keep every screen safe */
const NODRV = Object.freeze({ id: null, code: '—', name: '—', ini: '—', rto: 0, status: 'busy', lic: '—', exp: 0, rating: 0, phone: '—', hub: 'AST', onDuty: 0, week: 0, docs: [] });
const NOTRK = Object.freeze({ id: null, plate: '—', make: '—', year: 0, km: 0, model: '—', zones: [], cap: 0, status: 'busy', hub: 'AST', ping: 0, health: 'green', unit: '—', unitH: 0, docs: { osago: '2099-01-01', cargo: '2099-01-01', calib: '2099-01-01', to: '2099-01-01' }, svc: { last: '2026-01-01', lastKm: 0, nextKm: 0 } });
const pname = id => { const p = (S.partners || []).find(x => 'p:' + x.id === id); return p ? p.name : null; };
const drv = id => S.drivers.find(d => d.id === id) || (pname(id) ? Object.freeze(Object.assign({}, NODRV, { name: pname(id) })) : NODRV);
const trk = id => S.trucks.find(t => t.id === id) || (pname(id) ? Object.freeze(Object.assign({}, NOTRK, { plate: id.slice(2), make: T('Партнёр', 'Partner', 'Partner', 'Серіктес') })) : NOTRK);
const load = id => S.loads.find(l => l.id === id);
const hrs = l => Math.round(dist(l.from, l.to) / 65 * 10) / 10;
/* driving time the driver must still have: one shift (max 9 h); longer routes get planned rest stops (norms to be verified, spec Q5) */
const needRto = l => Math.min(hrs(l), typeof CFG !== 'undefined' ? CFG.live.shift : 9);
const tempState = l => { const z = ZONES[l.zone]; if (l.temp < z.lo || l.temp > z.hi) return 'breach'; return (l.temp - z.lo < 0.8 || z.hi - l.temp < 0.8) ? 'warn' : 'ok'; };
const tempChip = l => `<span class="chip temp-${tempState(l)}">${l.temp > 0 ? '+' : ''}${String(l.temp).replace('.', ',')} °C</span>`;
const revenue = l => dist(l.from, l.to) * ZONES[l.zone].rate;
const cost = l => Math.round(revenue(l) * 0.78);
const isActive = l => ['assigned', 'loading', 'in_transit', 'problem'].includes(l.status);

function compat(l, d, t) {
  const why = [];
  if (!t.zones.includes(l.zone)) why.push(T('ТС не подходит по температурной зоне', 'Fahrzeug passt nicht zur Temperaturzone', 'Truck does not support the temperature zone', 'КҚ температура аймағына сәйкес емес'));
  if (t.cap < l.pallets) why.push(T('Недостаточно паллето-мест', 'Zu wenige Palettenplätze', 'Not enough pallet places', 'Паллет орны жеткіліксіз'));
  if (t.status !== 'available') why.push(T('ТС занято или в сервисе', 'Fahrzeug belegt oder im Service', 'Truck busy or in service', 'КҚ бос емес немесе сервисте'));
  if (d.status !== 'available') why.push(T('Водитель недоступен', 'Fahrer nicht verfügbar', 'Driver unavailable', 'Жүргізуші қолжетімсіз'));
  if (d.rto < needRto(l)) why.push(T('Не хватает времени вождения (РТО)', 'Lenkzeit reicht nicht (RTO)', 'Not enough driving time (RTO)', 'Жүргізу уақыты (РТО) жеткіліксіз'));
  if (d.docs && d.docs.some(x => (x.type === 'lic' || x.type === 'med') && docState(x.to) === 'expired')) why.push(T('У водителя просрочены права или медосмотр', 'Führerschein oder Untersuchung des Fahrers abgelaufen', 'Driver licence or medical certificate expired', 'Жүргізушінің куәлігі немесе медтексеруі мерзімі өтті'));
  if (l.zone === 'pharma' && t.docs && docState(t.docs.calib) === 'expired') why.push(T('Поверка датчиков ТС просрочена (GDP, фарма)', 'Kalibrierung der Sensoren abgelaufen (GDP, Pharma)', 'Sensor calibration expired (GDP, pharma)', 'Датчиктер поверкасы мерзімі өтті (GDP, фарма)'));
  return why;
}
function assign(id, did, tid) {
  const l = load(id), d = drv(did), t = trk(tid);
  if (!l || !did || !tid || !d.id || !t.id) return T('Выберите водителя и ТС', 'Fahrer und Fahrzeug wählen', 'Select driver and truck', 'Жүргізуші мен КҚ таңдаңыз');
  const why = compat(l, d, t); if (why.length) return why[0];
  l.driver = did; l.truck = tid; l.status = 'assigned'; d.status = 'busy'; t.status = 'busy';
  l.notes.push({ who: 'System', t: fdt(NOW).slice(-5), text: T('Назначено: ', 'Zugewiesen: ', 'Assigned: ', 'Тағайындалды: ') + d.name + ' / ' + t.plate });
  return null;
}
function autoAssign() {
  let ok = 0, fail = 0;
  const rank = { high: 0, medium: 1, low: 2 };
  S.loads.filter(l => l.status === 'unassigned').sort((a, b) => rank[a.priority] - rank[b.priority] || a.eta.localeCompare(b.eta)).forEach(l => {
    const ts = S.trucks.filter(t => t.zones.includes(l.zone)).sort((a, b) => a.cap - b.cap);
    const ds = S.drivers.slice().sort((a, b) => a.rto - b.rto);
    let done = false;
    for (const t of ts) { for (const d of ds) { if (!compat(l, d, t).length && !assign(l.id, d.id, t.id)) { done = true; break; } } if (done) break; }
    if (done) ok++; else fail++;
  });
  return { ok, fail };
}
const NEXT = { assigned: 'loading', loading: 'in_transit', in_transit: 'delivered' };
function setStatus(id, st) {
  const l = load(id); if (!l) return;
  const was = l.status; l.status = st;
  if (st === 'in_transit' && l.progress === 0) l.progress = 0.05;
  if (st === 'delivered') {
    l.progress = 1; l.pod = 'pending';
    const d = drv(l.driver), t = trk(l.truck); if (d) d.status = 'available'; if (t) t.status = 'available';
  }
  if (st === 'problem') { l.temp = ZONES[l.zone].hi + 1.4; }
  if (was === 'problem' && st === 'in_transit') { l.temp = ZONES[l.zone].mid; }
  l.notes.push({ who: 'System', t: fdt(NOW).slice(-5), text: ST[was].l + ' → ' + ST[st].l });
  HOOKS.status.forEach(f => f(l, was, st));
}
function canMove(l, to) {
  if (to === 'assigned' && l.status === 'unassigned') return T('Сначала назначьте водителя и ТС', 'Erst Fahrer und Fahrzeug zuweisen', 'Assign a driver and truck first', 'Алдымен жүргізуші мен КҚ тағайындаңыз');
  if (NEXT[l.status] === to) return null;
  if (to === 'problem' && ['loading', 'in_transit'].includes(l.status)) return null;
  if (l.status === 'problem' && to === 'in_transit') return null;
  return T('Недопустимый переход статуса', 'Statuswechsel nicht erlaubt', 'Status change not allowed', 'Күй ауысуына рұқсат жоқ');
}
function createLoad(f) {
  if (f.from === f.to) return T('Пункты отправления и назначения совпадают', 'Start und Ziel sind gleich', 'Origin and destination are the same', 'Жөнелту және межелі пункт бірдей');
  if (!(f.pallets >= 1 && f.pallets <= 33)) return T('Паллет: от 1 до 33', 'Paletten: 1 bis 33', 'Pallets: 1 to 33', 'Паллет: 1-ден 33-ке дейін');
  const id = String(S.nextId++).padStart(6, '0');
  const l = mkLoad(id, f.cust, f.from, f.to, f.zone, f.pallets, f.pallets * 330, f.priority, 'unassigned', new Date(NOW.getTime() + hrs({ from: f.from, to: f.to }) * 3600e3 + 6 * 3600e3).toISOString());
  S.loads.unshift(l); return { ok: l.id };
}

/* ---------- navigation (spec 2.1) ---------- */
const NAV = [
  ['dashboard', 'grid', T('Обзор', 'Übersicht', 'Dashboard', 'Шолу'), 2],
  ['orders', 'package', T('Заказы и рейсы', 'Aufträge & Fahrten', 'Orders & Loads', 'Тапсырыстар мен рейстер'), 2],

function render() {

  const keepIn = {};   // keep what the user typed in drawer fields across re-renders (e.g. a toast)
  $$('.drawer input[id], .drawer select[id], .drawer textarea[id]').forEach(e => { keepIn[e.id] = e.type === 'checkbox' ? e.checked : e.value; });
  $('#root').innerHTML = shell();

  const m = $('main'); if (m) m.scrollTop = keep.y;

(function () {

  const rstate = l => l.status === 'problem' || tempState(l) === 'breach' ? 'critical' : tempState(l) === 'warn' ? 'at_risk' : 'on_time';
  const live = () => S.loads.filter(l => (l.status === 'in_transit' || l.status === 'problem') && (!F.rs || rstate(l) === F.rs) && (!F.drv || l.driver === F.drv));

  function map() {
    const W = 600 / zoom, H = 340 / zoom, cx = 330, cy = 180, vb = `${cx - W / 2} ${cy - H / 2} ${W} ${H}`, k = 1 / zoom;

/* Reports (spec 5.10): six identical report-cards (chart + exactly 3 KPIs + PDF/CSV + View Details + AI summary),

(function () {
  const R = { from: '2026-09-01', to: '2026-10-31', hub: '', zone: '', sum: {} };
  const dec = s => (LANG === 'en' ? s : s.replace('.', ','));
  const pc = v => dec(v.toFixed(1)) + ' %';
  const sg = v => (v < 0 ? '−' : '+') + dec(Math.abs(v).toFixed(1)) + ' %';
  const nf = n => Math.round(n).toLocaleString('ru-RU');
  const mio = n => n >= 1e6 ? dec((n / 1e6).toFixed(1)) + ' ' + T('млн', 'Mio.', 'M', 'млн') + ' ₸' : n >= 1e3 ? dec((n / 1e3).toFixed(1)) + ' ' + T('тыс', 'Tsd.', 'K', 'мың') + ' ₸' : nf(n) + ' ₸';
  const dd = iso => { const d = new Date(iso); return p2(d.getDate()) + '.' + p2(d.getMonth() + 1) + '.' + d.getFullYear(); };
  const lane = l => HUBS[l.from].city + ' → ' + HUBS[l.to].city;
  const day = iso => String(iso).slice(0, 10);
  const loadsF = () => S.loads.filter(l => day(l.eta) >= R.from && day(l.eta) <= R.to && (!R.hub || l.from === R.hub || l.to === R.hub) && (!R.zone || l.zone === R.zone));
  const invF = () => S.invoices.filter(i => i.created >= R.from && i.created <= R.to && (!R.zone || i.zone === R.zone) && (!R.hub || (i.load && load(i.load) && (load(i.load).from === R.hub || load(i.load).to === R.hub))));
  const sumLines = (iv, t) => iv.reduce((s, i) => s + i.lines.filter(x => x.type === t).reduce((a, x) => a + x.amount, 0), 0);
  const hist = k => [...k].reduce((s, c) => s + c.charCodeAt(0), 0) % 4 + 1;   // deterministic 30-day history per lane (demo)
  const excMin = l => (l.exc || 0) + (tempState(l) === 'breach' && isActive(l) ? 12 : 0);

  /* ---------- SVG charts ---------- */
  const CO = {};
  function chart(o) {

(function () {

  const esfOf = i => (i.load && load(i.load) ? load(i.load).esf : i.esf);
  const lvl = c => { const t = aiThr(); return c >= t.high ? 'high' : c >= t.medium ? 'medium' : 'low'; };
  const LV = { high: ['green', T('Высокая', 'Hoch', 'High', 'Жоғары')], medium: ['yellow', T('Средняя', 'Mittel', 'Medium', 'Орташа')], low: ['red', T('Низкая', 'Niedrig', 'Low', 'Төмен')] };
  const score = (l, d, t) => Math.max(35, Math.min(99, Math.round(72 + (d.rating - 4.5) * 30 + Math.min(d.rto - needRto(l), 4) * 3 - (t.cap - l.pallets) * 0.4)));

  function driverRecs() {
    const rank = { high: 0, medium: 1, low: 2 }, out = [];
    S.loads.filter(l => l.status === 'unassigned').sort((a, b) => rank[a.priority] - rank[b.priority] || a.eta.localeCompare(b.eta)).forEach(l => {
      let best = null;
      S.drivers.forEach(d => S.trucks.forEach(t => { if (!compat(l, d, t).length) { const s = score(l, d, t); if (!best || s > best.s) best = { d, t, s }; } }));
      out.push(best ? { key: 'dt:' + l.id, l, d: best.d, t: best.t, c: best.s } : { key: 'dt:' + l.id, l, c: 0 });
    });
    return out.filter(r => r.c === 0 || r.c >= aiThr().low).slice(0, 4);
  }
  function excRecs() {
    const out = [];
    S.loads.filter(l => ['loading', 'in_transit', 'problem'].includes(l.status) && tempState(l) !== 'ok').forEach(l => out.push({ key: 'ex:' + l.id, l, sev: tempState(l) === 'breach' ? 'high' : 'mid' }));

    return out.slice(0, 4);

   (190 FR/BUG entries) with filters by type, status, group and date. The build embeds a compact per-language JSON ({"as_of":"2026-10-12","n":223,"entries":[{"id":"BUG-37","type":"bug","date":"2026-10-16","status":"fixed","group":"Gemeldete Fehler (Plattform)","module":"","title":"Online-Demo: eine in einem zweiten Tab gebuchte Sendung fehlt in «Buchungen» des ersten Tabs","change":"Die Demodaten tragen eine Revision; vor jeder Anfrage übernimmt ein Tab die neueren Datensätze des anderen Tabs (eigenes Konto und Betriebszustand bleiben), offene Listen und der Zähler laden neu, wenn ein anderer Tab speichert. Echte Plattform: die offene Buchungsliste lädt zusätzlich neu, sobald der Zähler (Abfrage alle 60 s) eine neue Anfrage sieht","finding":"Kundenportal und Disposition in zwei Browser-Tabs: BK-26-000002 aus dem Portal-Tab erschien weder in der Liste noch im Zähler der Disposition; das nächste Speichern des Dispositions-Tabs konnte sie sogar überschreiben (jeder Tab hatte seine eigene Kopie der Demodaten, nur die 17 Betriebsbildschirme wurden abgeglichen)"},{"id":"BUG-36","type":"bug","date":"2026-10-16","status":"fixed","group":"Gemeldete Fehler (Plattform)","module":"","title":"Übersicht: ein älterer kritischer Alarm konnte aus der Alarmliste fallen","change":"Die Liste enthält die 20 schwersten offenen Alarme, innerhalb einer Stufe die neuesten zuerst","finding":"/api/overview listete die 20 neuesten offenen Alarme; bei 20 neueren Warnungen wurde ein offener kritischer Alarm nicht mehr angezeigt (die Kennzahl zählte ihn weiter)"},{"id":"BUG-35","type":"bug","date":"2026-10-15","status":"fixed","group":"Gemeldete Fehler (Plattform)","module":"","title":"Goldene Status-Chips im Kökzhol-Design unter WCAG-Kontrast","change":"Kökzhol-Regel: helles Gold als Hintergrund, dunkelgoldene Schrift, goldener Rand; der CI-a11y-Job prüft jetzt beide Designs (RU und EN)","finding":"Chips «Unterwegs», «Risiko», «eingereicht» nutzen das Kökzhol-Gold als Hintergrund mit dunkler Schrift: Kontrast unter 4,5 : 1 (axe serious) auf Fahrten, Aufträgen, Alarmen, Versicherung, Buchung"},{"id":"BUG-34","type":"bug","date":"2026-10-15","status":"fixed","group":"Gemeldete Fehler (Plattform)","module":"","title":"Eingang: Connector-Meldungen auf EN / DE als transliteriertes Russisch (und Russisch beim Überfahren)","change":"Connector-Meldungen liefern ihren Text als Meldungsbausteine (title_m / text_m – wie ein Connector, der den Text aus einer Vorlage erzeugt): übersetzt in DE / EN / KK, der russische Text bleibt das gespeicherte Original. Die Demo-Testmeldungen (Sperrung, Unwetter, Sergek, Werkstatt, Sicherheitszentrale, Ausschreibung) nutzen das auf dem Server und in der Browser-Demo; der Vorfalltext nutzt den übersetzten Titel. Echter Freitext einer Person wird weiter transliteriert, der Tooltip heißt «Originaltext (Russisch, nicht übersetzt)»","finding":"«Shtormovoe preduprezhdenie: Atyrau, veter 23–28 m/s…», «Okhrannyy tsentr: dver gruzovogo otseka…» – für englische / deutsche Leser unverständlich; der Tooltip zeigte das russische Original ohne Erklärung; der Vorfalltext auf 07 Sicherheit war ebenfalls transliteriert"},{"id":"FR-190","type":"FR","date":"2026-10-15","status":"implemented","group":"Angeforderte Funktionen (15.10.2026)","module":"","title":"Zähler „Buchungen“ im Menü für neue Anfragen + Hilfeartikel","change":"Der Menüpunkt „Buchungen“ (Stammdaten und Verwaltung) zeigt die Zahl der Buchungen im Status „angefragt“ (Stil v5-badge) aus GET /api/bookings/count (hub-bezogen, bookings:manage) – aktualisiert beim Seitenwechsel, nach jeder Entscheidung und alle 60 s, pausiert bei verborgenem Tab; Demo-Spiegel. Neuer Hilfeartikel „Buchungen — Kundenanfrage bestätigen, ablehnen oder stornieren“ (RU/DE/EN, KK-Titel): wo Anfragen erscheinen, Filter Angefragt, Aktionen, Berechtigung, was der Kunde erhält; verlinkt über die Hilfe-Schaltfläche der Seite Buchungen und den Hilfe-Index","finding":"Neue Kundenanfragen waren nur sichtbar, wenn jemand den Buchungstisch öffnete; keine Hilfe beschrieb, wo sie erscheinen und wie man entscheidet"},{"id":"FR-189","type":"FR","date":"2026-10-15","status":"implemented","group":"Angeforderte Funktionen (15.10.2026)","module":"","title":"BIN-/IIN-Prüfung und Datenübernahme (Prüfziffer offline, optionale KGD-Onlineprüfung)","change":"Optionales BIN-/IIN-Feld für Zahler und CRM-Kunde: Prüfziffer offline (Gewichte 1…11, Ersatz 3…11, 1, 2), Ziffer 5 = BIN (juristische Person) oder IIN (Einzelunternehmer); eine IIN ist personenbezogen – verschlüsselt (booking_payers / customer_tins, Kontext Tabelle:Spalte:Zeilen-ID), maskiert, nie protokolliert (Audit nur mit Schlüssel-Hash). POST /api/bin/check (crm:write) und /api/portal/bin/check (Portal, 20 Prüfungen / 10 min). Onlineprüfung: Konnektor integrations/kgd_tin.py (KGD-MF-RK-API-Dienste, konfigurierbare Basis-URL + API-Schlüsseldatei, dokumentierte Antwortabbildung, standardmäßig aus) über den Worker-Task tin-checks; Ergebnisse in tin_checks mit checked_at + Quelle zwischengespeichert; die Oberfläche zeigt „vom KGD geprüft am …“ oder „nicht online geprüft (offline)“ und funktioniert ohne Internet; der registrierte Name kann in das Firmenfeld übernommen werden (Bestätigung durch den Nutzer; im Portal nie für eine IIN). Sensus API, Uchet.kz, Kompra.kz, Adata.kz nur als deaktivierte Anbieteroptionen im Integrationsregister (externe kommerzielle Dienste – Datenresidenz zuerst prüfen)","finding":"Firmennummern wurden nur auf 12 Ziffern geprüft; eine IIN eines Einzelunternehmers (personenbezogen) konnte im Klartext gespeichert werden; keine Registerprüfung"},{"id":"FR-188","type":"FR","date":"2026-10-15","status":"open_question","group":"Angeforderte Funktionen (15.10.2026)","module":"","title":"WhatsApp-/Telegram-Benachrichtigungen – rechtliche Entscheidung zu Auslandsübermittlung und Kundeneinwilligung nötig","change":"Nicht umgesetzt: beide Dienste verarbeiten die Nachricht (Empfängernummer, Buchungsdaten) auf Servern außerhalb Kasachstans – Konflikt mit CLAUDE.md Regel 5 und der Lokalisierungspflicht (Gesetz 94-V Art. 12). Stattdessen E-Mail (SMTP-Relay) und SMS (KZ-Gateway) (FR-187)","finding":"Kunden wünschen Buchungsnachrichten per WhatsApp oder Telegram"},{"id":"FR-187","type":"FR","date":"2026-10-15","status":"implemented","group":"Angeforderte Funktionen (15.10.2026)","module":"","title":"Buchungsbestätigung per E-Mail / SMS","change":"Der Kunde wählt die Kanäle im Buchungsformular (E-Mail standardmäßig an, SMS auf Wunsch, Empfängeradresse / Mobilnummer verschlüsselt in booking_notify). Nach der Anfrage und bei Bestätigung / Ablehnung / Stornierung (Tisch oder Portal) wird eine Zusammenfassung in der Outbox booking_messages eingereiht – Buchungsnummer, Städte der Strecke, Abfahrtsdatum, Paletten, Preis und Status, keine IIN und keine weiteren personenbezogenen Daten – und vom Worker-Task booking-messages über die vorhandenen SMTP-Relay-Einstellungen und das KZ-SMS-Gateway zugestellt (kein Netzaufruf in der API; fehlende Konfiguration → übersprungen, Transportfehler wiederholt; Audit ohne Adressen). Demo: Vorschau „Nachricht gesendet (Demo)“","finding":"Nach einer Buchungsanfrage erhielt der Kunde keine Bestätigung außerhalb des Portals; Statusänderungen durch Mitarbeitende waren nur unter „Meine Buchungen“ sichtbar"},{"id":"FR-186","type":"FR","date":"2026-10-15","status":"implemented","group":"Angeforderte Funktionen (15.10.2026)","module":"","title":"Buchende / zahlende Partei (Agent, Makler, Spediteur) mit eigener Rechnung","change":"Optionaler Abschnitt „Gebucht und bezahlt durch Dritte“ im Buchungsportal: Firma, BIN / IIN (FR-189), Rolle (Agent / Makler / Spediteur / sonstige), Ansprechpartner, E-Mail, Telefon, Rechnungsadresse, eigene Referenz / Bestell-Nr.; Rechnungsempfänger = Zahler. Gespeichert in booking_payers (Alembic 0016p_booking_party): Ansprechpartner, E-Mail, Telefon und eine IIN verschlüsselt (Kontext Tabelle:Spalte:Zeilen-ID), maskiert in „Meine Buchungen“ und am Buchungstisch, nie in Logs / Audit-Details (Audit: nur Rolle). Angebots- / Vertragsmuster und der ESF-Entwurf der Buchung nutzen den Zahler als Käufer; Kundenisolations-Suite erweitert (Zahler von A für B unsichtbar)","finding":"Agenten, Makler und Speditionen buchen und zahlen im Auftrag des Versenders, die Buchung hatte dafür keinen Platz; die Rechnung ging immer an den Versender"},{"id":"FR-185","type":"FR","date":"2026-10-15","status":"implemented","group":"Angeforderte Funktionen (15.10.2026)","module":"","title":"Gewichtsplausibilität einer Buchung (Warnungen, nie blockierend)","change":"Nicht blockierende Warnungen mit Empfehlung (RU/DE/EN/KK) neben den Gewichts- / Packstückfeldern, im Preisschritt und vor der Bestätigung: Summe der Packstückgewichte ≠ Bruttogewicht (Toleranz = größerer Wert aus ±2 % und 10 kg), mehr nicht stapelbare Packstücke als Palettenplätze (Packstücke je Palette aus der Grundfläche), Grundfläche größer als eine Palette, Gewicht je Palette über max_kg_per_pallet (über die Packstückgewichte) oder ungewöhnlich hoch / unplausibel niedrig – „Gewicht jeder Palette oder die Summe prüfen“. Alle Schwellen sind Planwerte in den Stammdaten Art routing (FR-174-Eintrag weight_plausibility). Der Server liefert dieselben Prüfungen als warnings[] im Angebot (Portal und Partner-API) und bei jeder Buchung (Buchungstisch zeigt „⚠ Gewicht prüfen“); die harten Grenzen bleiben. TS-Spiegel bookingChecks.ts mit gemeinsamer Paritäts-Fixture","finding":"Beispiel des Product Owners: Bruttogewicht 905 kg, 1 Palette, Packstückzeilen 206 + 505 + 300 = 1.011 kg auf 3 Packstücken – keine Warnung erschien"},{"id":"FR-180","type":"FR","date":"2026-10-13","status":"implemented","group":"Angeforderte Funktionen (13.10.2026)","module":"","title":"Eine Kennzeichnung für Fehler: BUG-xx (kein B-xx mehr)","change":"Plattformfehler B-01…14 → BUG-19…32 umnummeriert in Register, Change-Request-Dokumenten, Code-Kommentaren, Testnamen, Hilfetexten und der Partner-API-Referenz; die Konzeptnummerierung läuft weiter","finding":"Konzeptfehler waren BUG-01…18 nummeriert, Plattformfehler B-01…14 – zwei Kennzeichnungen im selben Register"},{"id":"FR-179","type":"FR","date":"2026-10-13","status":"implemented","group":"Angeforderte Funktionen (13.10.2026)","module":"","title":"Navigationssymbole: Duotone (Olymp-Design) und Kacheln (Kökzhol-Design)","change":"Ein eigener 24-px-Symbolsatz für die 17 Bildschirme und alle Verwaltungsseiten (eigener Chunk, keine Textknoten); Olymp: Kontur + getönte Fläche, goldene Hub-Punkte; Kökzhol: weiße Glyphe auf gruppenfarbiger Kachel (Betrieb · Überwachung · Dokumente · Ressourcen · Finanzen), Nummern ausgeblendet; dazu lesbare Alarm-Simulationsknöpfe in der Kökzhol-Seitenleiste","finding":"Die Seitenleiste hatte nur Nummern und Text; fünf Symbolstile wurden vorgeschlagen, der Eigentümer wählte C · Duotone mit Olymp-Palette und D · Kachel mit Kökzhol-Palette"},{"id":"BUG-33","type":"bug","date":"2026-10-13","status":"fixed","group":"Gemeldete Fehler (Plattform)","module":"","title":"Alarm-Simulationsknöpfe im Kökzhol-Design unsichtbar","change":"Kökzhol-Regel für .v5-sims-Knöpfe: transluzenter Hintergrund, heller Text, sichtbarer Rand; aktiver Zustand in Markenfarbe; Live-Badge in Gold","finding":"Die Simulationsknöpfe der Seitenleiste behielten die Farben des hellen Themas auf der dunklen Leiste: dunkler Text auf dunklem Grund"},{"id":"FR-178","type":"FR","date":"2026-10-13","status":"implemented","group":"Angeforderte Funktionen (13.10.2026)","module":"","title":"Design-Umschalter: aktuelles Design ↔ Kökzhol-Markendesign","change":"Umschalter im Fuß der Seitenleiste und auf der Anmeldeseite; Kökzhol-Theme als CSS-Tokens über den Plattform-Variablen, selbst gehostete Schriften, Zeichen + Wortmarke + Claim, Favicon; Browser-Einstellung, ?brand=-Override; Standard = aktuelles Design","finding":"Die Plattform hatte ein festes Erscheinungsbild; das Kökzhol-Brand-Briefing (Tokens, Manrope/IBM Plex Mono, Shanyrak-Ö-Zeichen, dunkle Seitenleiste, eine Aktionsfarbe) sollte live vergleichbar sein"},{"id":"FR-177","type":"FR","date":"2026-10-12","status":"implemented","group":"Angeforderte Funktionen (12.10.2026)","module":"","title":"Versionsnummer und Build-Datum/-Zeit in der Versionsanzeige","change":"Eine VERSION-Quelle (Web-App, API, Startseite); jeder Preview-Upload erhöht die Patch-Version; Build-Datum und -Zeit (UTC+5) unter der Version und auf der Startseite","finding":"Links unten stand nur „0.2.0 · demo“; nicht erkennbar, welcher Upload läuft"},{"id":"FR-176","type":"FR","date":"2026-10-12","status":"implemented","group":"Angeforderte Funktionen (12.10.2026)","module":"","title":"Herstellerlogos auf Bildschirm 04","change":"Vom Auftraggeber gelieferte Logos (Roche, Abbott, QIAGEN, Sysmex, bioMérieux, Beckman Coulter) am rechten Rand jeder Karte in einer festen 515:380-Box, eingepasst, ohne Rahmen; auch auf dem Packstücketikett; Stammdaten-Override per Upload (PNG/WebP ≤ 300 KB, Typprüfung, verschlüsselter Objektspeicher, auditiert)","finding":"Herstellerkarten zeigten nur das Kürzel"},{"id":"FR-71","type":"FR","date":"2026-10-11","status":"implemented","group":"Eine Datenquelle & Architektur","module":"","title":"v5-Betriebsbildschirme aus echten DB-Touren/-Aufträgen speisen","change":"Server-View-Schicht (`app/v5/live.py`) ergänzen, die die Strukturen TRIPS/ORD/VM/DRV/LINES aus DB-Zeilen aufbaut (hub-gefiltert, Schlüssel = DB-Tour-/Auftragsnummer) und über `GET /api/v5/ops` ausliefert. Die Engines nutzen diese statt der Referenzschlüssel. Referenz-JSON wird nur ausgeliefert, wenn `OLYMP_ENV` = demo oder `OLYMP_ALLOW_DEMO=1`. v5-Aktionen lösen Touren und Aufträge in der DB auf.","finding":"Die v5-Engines lesen nur Referenzdaten (`R.TRIPS`, `R.ORD`, `R.VEH`, `R.LINES`: dispatch.ts:18, shared.ts:50-53, search.ts:28). Keine Engine ruft `/api/trips` oder `/api/orders` auf, und jede v5-Aktion sucht IDs in `ctx.R[\"TRIPS\"]`/`ctx.R[\"ORD\"]` (dispatch.py:24-30, docs.py:86-92, load.py:126-132). Übersicht, Disponent, Beladung, Sendungen, Dokumente, Thermo und Sicherheit zeigen daher auch im Produktivbetrieb das fiktive Szenario vom 06.10.2026, und die Startseite nach dem Login ist `/s/overview` (App.tsx:50)."},{"id":"FR-72","type":"FR","date":"2026-10-11","status":"implemented","group":"Eine Datenquelle & Architektur","module":"","title":"Kollision der Tournummern zwischen DB und Referenz beseitigen","change":"Eigenen Namensraum für DB-Touren verwenden: sequenzbasiert `R-<yy>-<nnnn>` oder konfigurierbares Präfix. Referenztouren im Demo-Build mit `DEMO-` präfixieren. Inbox-Ereignisse tragen die DB-Tour-ID, und der Router löst zuerst DB-Touren auf.","finding":"DB-Touren werden `R-101…` nummeriert (operations.py:393) – derselbe Bereich wie die Referenztouren R-102…R-106. Der Worker schreibt die relationale `trip.number` in Inbox-Ereignisse (worker.py:199-200), und das Inbox-Routing löst sie gegen `R[\"TRIPS\"]` auf (inbox.py `_route_doc`, ~Z. 332). Eine echte DB-Tour „R-106“ würde die fest codierte Ladeliste, das Umplanungsfenster und die Go/No-Go-Sonderregeln erben (load.py:117, dispatch.py:16, docs.py:98)."},{"id":"FR-73","type":"FR","date":"2026-10-11","status":"implemented","group":"Eine Datenquelle & Architektur","module":"","title":"Auftragspositionen, Packstücke und SSCC als eigene Tabellen","change":"Tabellen `order_lines` (Artikel, Hersteller, Charge, Verfall, Menge, Temperaturklasse) und `packages` (SSCC eindeutig, order_line_id, Status kommissioniert/verladen/übergeben/zugestellt/fehlend, scanned_at, scanned_by) anlegen. `Order.m3`, `adr_un`, `third_party` ergänzen. SSCC serverseitig erzeugen (GS1-Basisnummer aus den Einstellungen + laufende Nummer + Prüfziffer mod 10). Scan-Endpunkte für Be- und Entladung (auditiert).","finding":"`Order` (models.py:231-249) hat kein Volumen, keine Packstückzahl, keine SSCC, kein ADR/UN, kein Fremd-Flag, keinen Hersteller, kein Verfallsdatum und keinen Artikel. Die v5-Logik für Beladung, Sendungen und Dokumente hängt genau von diesen Feldern ab (`o.m3`, `o.adr`, `o.third`, `PKG`, `LINES`: shared.ts:53-80, docs.py:47-68, ship.ts:17-58). Daher können SSCC-Abgleich, ADR-Dokumente und Etiketten für echte Aufträge nicht funktionieren."},{"id":"FR-74","type":"FR","date":"2026-10-11","status":"implemented","group":"Eine Datenquelle & Architektur","module":"","title":"Betriebszustand v5 aus einem JSON-Dokument in Tabellen verlagern","change":"Die Schlüssel jedes Moduls in Tabellen mit DB-IDs überführen (trip_release, trip_document, load_plan, Packstück-Scans, Vorfälle, Übergaben) mit Zeilensperren. `/state` liefert nur die Hubs des Nutzers. Offset-/Total-Paginierung für Touren und Aufträge. Serverseitiger Such-Endpunkt (Auftragsnr., Charge, SSCC; GS1-Scannereingabe).","finding":"Der gesamte v5-Zustand ist eine JSON-Zeile (router.py:31,53-63). Jede Aktion sperrt diese Zeile hubübergreifend (router.py:100), und das vollständige Dokument wird nach jeder Aktion (router.py:114) sowie über `/state` an alle Mitarbeiter ohne Hubfilter zurückgegeben (router.py:76-81). Die Obergrenzen passen zu einem Demo, nicht zu einer Flotte: 50 zusätzliche Vorfälle, danach 409 „Too many open incidents“ (security.py:45-48). Listen werden stillschweigend abgeschnitten: `/api/trips` Limit 100 ohne Offset (operations.py:329-343), der Disponent lädt 200 offene Aufträge (Operations.tsx:21), und die Suche durchläuft alle `LINES` im Client (search.ts:28)."},{"id":"FR-75","type":"FR","date":"2026-10-11","status":"implemented","group":"Eine Datenquelle & Architektur","module":"","title":"Versionierte Dokumenthistorie und Archivtabellen statt stiller Listenkürzung","change":"`v5_doc_history(version, ts, actor, action, patch JSONB)` ergänzen, in derselben Transaktion wie jedes `/act` und `apply_external_event` geschrieben. Archivtabellen `v5_archive_<kind>(id, hub, day, payload JSONB)`, in die gekappte Einträge verschoben statt gelöscht werden. Tagesschlüssel (`opsDay`) und nächtlicher Roll-over-Job, der abgeschlossene Touren archiviert. `GET /api/v5/history?entity=&from=` (Auditor).","finding":"Wachsende Listen werden stillschweigend gekürzt: Betriebsprotokoll 8 (`registry.py:18, 80`), Inbox 200, Bußgelder 100, Tickets 100 (`inbox.py:47-53`), Fahrerereignisse 200 (`driver.py:36`), SMS 100 (`coverage.py` `LOG_MAX/OUT_MAX`). Verdrängte Bußgelder, Werkstatttickets und ePOD-Ereignisse (Finanz- und GDP-Nachweise) existieren danach nur noch als Audit-Details mit ≤ 80 Zeichen (`registry.py:84`). Es gibt keinen früheren Zustand von `v5_doc`, keinen mehrtägigen Betrieb und kein „05.10 anzeigen“."},{"id":"FR-76","type":"FR","date":"2026-10-11","status":"implemented","group":"Eine Datenquelle & Architektur","module":"","title":"Festes Szenariodatum durch ein Server-Geschäftsdatum ersetzen","change":"Der Server liefert `business_date` und `now` in `/api/v5/state`: im Produktivbetrieb das reale KZ-Datum, nur im Demo das Szenariodatum. Alle Engines und Module nutzen es. Fehlende Prognosedaten → Gate gelb („keine Daten“), nicht grün. Dokument- und Ereigniszeitstempel stammen aus gespeicherten Serverzeiten.","finding":"Das Frontend fixiert `TODAY = 06.10.2026` (core.ts:60-62); es steuert die Countdowns für Führerschein, Kalibrierung und Gebühren, während die Compliance-Liste im Backend das reale Datum nutzt (resources.py:413) – beide widersprechen sich. Das Wetter hat 7 Referenztage ab 06.10, und `wx_risk` überspringt Indizes ≥ 7 (docs.py:76-78, dispatch.py:41-44), sodass das Wetter-Gate ohne Daten stillschweigend grün ist. Dokumentdatum `06.10.2026` (docs.ts:101) und Track-&-Trace-Zeiten `05.10 18:20 … 08.10 06:00` (ship.ts:36-58) sind fest codiert. Das Betriebsprotokoll nutzt die Client-Uhr (registry.py:66-68,77-78)."},{"id":"FR-77","type":"FR","date":"2026-10-11","status":"implemented","group":"Eine Datenquelle & Architektur","module":"","title":"Echte Datenbankmigrationen (Alembic) statt `create_all`","change":"Alembic mit einer Basisrevision gleich dem aktuellen Schema einführen. Der Dienst `migrate` führt `alembic upgrade head` und danach Grants und Trigger aus. CI prüft `alembic check` (Modelle vs. Migrationen) und führt Upgrade und Downgrade auf einer leeren DB aus.","finding":"`init-db` führt `Base.metadata.create_all(engine)` aus (`backend/app/cli.py:54`). Es legt fehlende Tabellen an, ändert bestehende aber nie (neue Spalten, Typen, der JSON→JSONB-Wechsel aus C05, Indizes). `DEPLOYMENT.md` §5 verspricht „migrate runs automatically“ bei `git pull && up --build` – für geänderte Tabellen falsch."},{"id":"FR-78","type":"FR","date":"2026-10-11","status":"implemented","group":"Eine Datenquelle & Architektur","module":"","title":"Referenz-Stammdaten bearbeitbar und versioniert machen","change":"DB-Tabellen + Admin-CRUD-Masken mit Audit: Fahrzeuge (`Vehicle` erweitern: OGPO, Kasko, HU, Logger-Kalibrierung, ADR-Zulassung), Partner (+ Kontakte, B14), Personalkalender, Kostenparameter mit `valid_from` (Historie bleibt für Kostenberichte erhalten). Stufen- oder Tarifänderungen brauchen eine Vier-Augen-Freigabe. `/api/v5/ref` liest aus der DB, das Referenz-JSON dient nur noch als Seed.","finding":"Betriebliche Stammdaten sind schreibgeschützt in `be/v5/reference/mock-v5.*.json`: PARTNERS (Stufe, SLA, Kapazität, Tarife, Vertragsende, Versicherung), FEES (Fristen für Kfz-Haftpflicht OGPO, Kasko und HU), STAFF/LIC/TACHO, CP (Diesel, MRP, Gehälter), COWN, BLEX, CAPR. Szenariokonstanten: `NOW_YM` (`partners.py:29`), `TODAY` (`staff.py:16`). Der Fuhrpark hat überhaupt keine Aktionen (`be/v5/modules/fleet.py:10-12`). Die Inbox validiert Fahrzeuge nur gegen das Referenz-`VM`, sodass echte Fahrzeugcodes mit `err=\"veh\"` abgewiesen werden (`inbox.py:219-221`, `:283`)."},{"id":"FR-79","type":"FR","date":"2026-10-11","status":"implemented","group":"Eine Datenquelle & Architektur","module":"","title":"Seed über Service-Regeln plus Konsistenzprüfung","change":"Seed über die Service-Funktionen (`create_trip`/`_attach_orders`/`confirm`). `python -m app.cli check-consistency` ergänzen: Klasse vs. Fahrzeug, hubübergreifende Stopps, Aufträge ohne Stopps, Stopps ohne Aufträge, v5-Dokument vs. DB. In der CI nach dem Seed ausführen.","finding":"Der Seed verletzt die eigenen Regeln der Plattform. Der TK-Auftrag З-2295 ist auf dem Isotherm-Fahrzeug V02 geplant (seed.py:157-160 vs. operations.py:363-364). Alle 10 Referenzaufträge sind auf R-106 geplant, während v5 6 anhakt (load.py:118). R-103 (Hub AST) hat einen Stopp in Almaty, das zum Hub ALA gehört (seed.py:152; verboten durch operations.py:359-360). Das Fahrer-App-Konto ist mit D2 verknüpft (seed.py:239), der Fahrer von R-103 ist aber D3 (seed.py:152), sodass `driver.v01` die von der Fahrer-App simulierte Tour nicht sieht."},{"id":"FR-80","type":"FR","date":"2026-10-11","status":"implemented","group":"Eine Datenquelle & Architektur","module":"","title":"Kollisionsfreie Belegnummern","change":"PostgreSQL-Sequenzen je Belegart (optional je Jahr), z. B. `ORD-26-000123`, `BK-26-000045`.","finding":"Auftrags-, Tour- und Buchungsnummern stammen aus `COUNT(*)` (operations.py:220-226, booking.py:83-87). Zwei parallele Anlagen berechnen denselben Kandidaten, und die zweite Anfrage scheitert mit IntegrityError (HTTP 500)."},{"id":"FR-81","type":"FR","date":"2026-10-11","status":"implemented","group":"Sicherheit & Datenschutz","module":"","title":"Serverseitige Hub- und Rollenprojektion der Antworten von `/api/v5/state` und `/act`","change":"`project(doc, principal, hub)` in `v5/router.py` ergänzen: Teilbereiche entfernen, die die Rolle nicht lesen darf (z. B. `cAp/cApBy` ohne `costs:read`, `fineSt/fineInbox` ohne `fines:write`/`overview:read`, `smsOut` ohne `trips:write`) und hubgebundene Einträge (`inbox`, `inc`, `tickets`, `covContact`, `drvEv`) nach `ctx.hub` filtern. Anwenden auf `/state`, `/act` und die `reset`-Antwort. Jedes Modul deklariert seine Projektion neben seinem `@initial`-Teilbereich.","finding":"`GET /api/v5/state` liefert jeder Mitarbeiterrolle das vollständige Betriebsdokument (`backend/app/v5/router.py:76-81`), und `/act` liefert es erneut (`router.py:114`). Die Hub-Eingrenzung beim Lesen existiert nur im Browser (`frontend/src/v5/engine/core.ts:100-102`, `hubOk`), sodass ein Astana-Disponent, ein Fahrer oder ein Betrachter Almaty-Vorfälle, Bußgelder, Kostenfreigaben und SMS-Protokolle im JSON erhält."},{"id":"FR-82","type":"FR","date":"2026-10-11","status":"implemented","group":"Sicherheit & Datenschutz","module":"","title":"Partnerkontakte und Personaldaten aus der Referenz-Payload entfernen","change":"Kontakte nach `partner_contact` mit `phone_enc`/`mobile_enc` verlagern (Krypto-Kontext `partner_contact.<col>:<id>`), maskierte Anzeige und auditiertes Aufdecken (`partners:write`). `/ref` und `/state` werden nach Berechtigung und Hub gefiltert: Fahrer erhalten nur den Ausschnitt ihrer eigenen Tour (B05), Bußgeld-/Personalschlüssel erfordern `fines:write`/`drivers:write`.","finding":"Namen und Mobilnummern von Partnerkontakten liegen im Klartext im Referenz-JSON des Repositorys (`PARTNERS[].contacts`). Sie werden ungefiltert an jede Mitarbeiterrolle, auch Fahrer, über `GET /api/v5/ref` ausgeliefert (`be/v5/router.py:71-73`). `GET /api/v5/state` liefert jeder Mitarbeiterrolle das ganze Dokument (Bußgelder mit zugeordneten Fahrern, Personaleinsätze, alle Hubs) (`router.py:76-81`). Das widerspricht CLAUDE.md-Regel 3 (Telefon verschlüsselt, gebunden an Tabelle, Spalte und Zeilen-ID) und der Hub-Eingrenzung."},{"id":"FR-83","type":"FR","date":"2026-10-11","status":"implemented","group":"Sicherheit & Datenschutz","module":"","title":"Fahrer-App an die eigene Tour des Fahrers binden","change":"Die Tour aus `Driver.user_id` → aktive Tour (Status loading oder in_transit) und deren Stopps auflösen. Alle Payloads tragen eine Tour-, Stopp- oder Positions-ID, die gegen diese Tour validiert wird. Tourbezogener Zustand ersetzt die globalen Schlüssel `drvStep`, `dScan`, `dChk` und weitere.","finding":"Jede Aktion der Fahrer-App ist fest auf `TRIP, VEH, HUB = \"R-103\", \"V01\", \"ast\"` verdrahtet (`be/v5/modules/driver.py:29`, `:113-116`), sodass jedes Konto mit `driver:app` auf R-103 handelt. `Driver.user_id` existiert, wird aber nicht genutzt (`be/models.py:216`). Auch die SMS-Stub-Logik akzeptiert nur V01/R-103 (`be/v5/modules/coverage.py:276`). Bereits in ROADMAP v0.3 gelistet, aber nicht eingeplant."},{"id":"FR-84","type":"FR","date":"2026-10-11","status":"implemented","group":"Sicherheit & Datenschutz","module":"","title":"Keine simulierte Telemetrie und keine Alarm-Simulationsknöpfe im Produktivbetrieb","change":"`tick` und `SimButtons` hinter `DEMO || settings.training_mode` stellen (Server-Flag in `/api/v5/state`). Im Produktivbetrieb `ui.live` aus `temperature_readings` (Wialon-Sync, `integrations/worker.py:90`) über `GET /api/v5/telemetry?since=` füllen. Alter jedes Messwerts und einen Zustand „keine Daten“ statt des Seeds anzeigen. Jeder simulierte Wert trägt ein sichtbares Abzeichen „SIMULATION“.","finding":"`tick()` erzeugt in jedem Build alle 2 s Kühlaggregattemperaturen mit `Math.random()` (`V5.tsx:37-57`, `V5.tsx:97-102`, kein `DEMO`-Schutz). Thermo, Übersicht und Qualität zeigen diese Werte. `<SimButtons/>` („Симуляция тревог“) wird in der produktiven Seitenleiste gerendert (`Layout.tsx:61`). Ein GDP-Kühlkettenbetreiber könnte auf fiktive Temperaturen reagieren oder sie dokumentieren."},{"id":"FR-85","type":"FR","date":"2026-10-11","status":"implemented","group":"Sicherheit & Datenschutz","module":"","title":"Fachrollen für Freigaben; Unterschriftsfelder an die Freigeberrolle binden","change":"Rollen `manager` (approvals:sign, costs:approve, costs:read), `finance` (fines:write, costs:approve, costs:read) und `quality` (quality:write, temperature:read, alarms:read) ergänzen. `users.functions` (`head_logistics`, `fin_controller`, `qa_manager`) ergänzen. `costs.sign` / `baseline.exSign` prüfen `ctx.principal.has_function(CAPR_FN[i])`. `help/roles.ts` aktualisieren (siehe C21).","finding":"`approvals:sign`, `costs:approve` und `fines:write` gehören nur `admin` (`rbac.py:263-286`), und Admins müssen global mit `users:admin` sein (SECURITY.md §10). Vier-Augen-Freigaben brauchen daher zwei volle Administratoren, und Finanz- oder Qualitätsverantwortliche haben keine Rolle. Das Feld „Leiter Logistik“ vs. „Finanzcontroller“ (`CAPR`) ist nicht an den Unterzeichner gebunden: jeder Inhaber von `costs:approve` kann beide Felder unterschreiben (`costs.py:42-52`)."},{"id":"FR-86","type":"FR","date":"2026-10-11","status":"implemented","group":"Sicherheit & Datenschutz","module":"","title":"Rotation des `data_key` und Neuverschlüsselungs-Job umsetzen","change":"Mehrschlüsselbetrieb (`OLYMP_DATA_KEYS_DIR` mit `data_key_v1`, `data_key_v2`; Verschlüsselung mit dem neuesten, Entschlüsselung nach Versions-Byte). `python -m app.cli reencrypt --batch 500` (idempotent, fortsetzbar, Audit nur mit Zählern). Gleiches Muster für `index_key` (Blind-Indizes neu aufbauen). Runbook-Abschnitt mit Schritten und Prüfung.","finding":"`docs/DEPLOYMENT.md` §7 sagt, die Rotation des Datenschlüssels „requires a re-encryption job (planned for v0.2)“. v0.2.0 wird ohne ihn ausgeliefert, obwohl das Schlüsselversions-Byte existiert (`security/crypto.py`, Format `\\x01‖nonce‖ct`). SECURITY.md §9.5 verlangt jährliche Rotation oder Rotation nach Verdacht auf ein Leck, sodass das Incident-Runbook (§6, „personenbezogene Daten mit neuem Schlüssel neu verschlüsseln“) nicht ausführbar ist."},{"id":"FR-87","type":"FR","date":"2026-10-11","status":"implemented","group":"Sicherheit & Datenschutz","module":"","title":"Aggregiertes Audit abgewiesener eingehender Anfragen","change":"Abweisungen in einer Tabelle `security_counters(source, ip_hash, reason, window_start, n)` zählen. Einen Audit-Eintrag je (Quelle, Grund, 10-min-Fenster) mit Zähler schreiben, plus die erste Abweisung je IP. Alarm oberhalb eines Schwellwerts (C12). IP-Drosselung vor die Signaturprüfung verlegen, damit vor jedem DB-Schreibvorgang abgewiesen wird.","finding":"Jede abgewiesene nicht authentifizierte Anfrage an `/api/v1/inbound/{source}` wird in das nur anfügbare, hash-verkettete Audit-Log geschrieben (`routers/integrations.py:57-58`). Jeder Schreibvorgang nimmt den globalen Advisory-Lock (`audit.py:63`). Bei erlaubten 240 Anfragen/min je IP (SECURITY.md §9a) kann ein Angreifer ≈345 000 unlöschbare Zeilen pro Tag und IP erzeugen und um den Lock konkurrieren, den jede Nutzeraktion braucht."},{"id":"FR-88","type":"FR","date":"2026-10-11","status":"implemented","group":"Sicherheit & Datenschutz","module":"","title":"Dokumentiertes Bereinigen von `inbound_nonce` umsetzen","change":"Worker-Task `prune-nonces` (stündlich): `DELETE FROM inbound_nonce WHERE created_at < now() - interval '25 hours'`. 25 h behalten, damit stets das ±5-min-Fenster plus das ATI-Schema abgedeckt ist. Index auf `(source, created_at)`.","finding":"`integrations/models.py:7` und `integrations/inbound.py:10` besagen, Nonces würden „24 h aufbewahrt / nach 1 Tag bereinigt“, aber kein Code löscht aus `inbound_nonce` (nur Einfügen und Nachschlagen in `routers/integrations.py:64-73`). Die Tabelle wächst unbegrenzt, und die Existenzprüfung unter Advisory-Lock wird langsamer."},{"id":"FR-89","type":"FR","date":"2026-10-11","status":"implemented","group":"Sicherheit & Datenschutz","module":"","title":"Personennamen aus `v5_doc` heraushalten (oder verschlüsseln) und Löschung unterstützen","change":"Im Dokument nur `user_id` / `person_ref` speichern und Anzeigenamen beim Lesen über einen berechtigungsgeprüften Lookup auflösen. Empfängerunterschriften (ePOD) in eine verschlüsselte, an die Zeilen-ID gebundene Tabelle `epod`. `python -m app.cli erase-person <ref>` ergänzen, das Historien- und Archiveinträge pseudonymisiert und auditiert wird. CI-Lint, der neue Schreibvorgänge von `ctx.display_name` ins Dokument abweist.","finding":"Das Betriebsdokument speichert personenbezogene Daten als Klartext-JSON außerhalb von `security/crypto.py`: Anzeigenamen von Unterzeichnern (`cApBy[].name`, `costs.py:52`, auch Partner- und Ausgangsdaten-Freigaben), Empfängernamen in ePOD-Ereignissen und -Texten („подпись Г. Абдрахмановой“, `driver.py:57`) und Namen in Texten des Betriebsprotokolls. Sie gelangen auch in Backups und Historie (C06). Es gibt keinen Löschpfad, während das CRM „anonymisieren“ kennt (SECURITY.md §9a)."},{"id":"FR-90","type":"FR","date":"2026-10-11","status":"implemented","group":"Sicherheit & Datenschutz","module":"","title":"Persistente Idempotenz für externe Ereignisse","change":"Tabelle `external_event(source, ref, inbox_id, received_at)` mit UNIQUE-Constraint auf (source, ref). `apply_external_event` fügt in derselben Transaktion wie die Dokumentänderung ein, 409 kommt vom Constraint. `coverage.raise_alarms` (`coverage.py:259`) und `inbox.demo` nutzen dieselbe Prüfung. Aufbewahrung mindestens 13 Monate, damit jährliche Ausschreibungen und Bußgelder dedupliziert bleiben.","finding":"Die Deduplizierung durchsucht nur die gekappte Liste `doc[\"inbox\"]`: geprüft wird in `be/v5/modules/inbox.py:123`, die Liste ist bei INBOX_MAX=200 gekappt (`:46`/`:127`). Sind 200 neuere Ereignisse eingetroffen, werden erneut zugestellte Refs wieder angenommen. Quellen erneuter Zustellung: die 1-Minuten-Überlappung von Wialon (`be/integrations/worker.py:216`), Webhook-Wiederholungen und der goszakup-Abruf, der täglich dieselben offenen Ausschreibungen liefert (bis 10 × 50, `goszakup.py:32`, `worker.py:247-258`). Jede wieder angenommene Ref erzeugt doppelte Bußgelder, Werkstatttickets, Vorfälle und CRM-Leads."},{"id":"FR-91","type":"FR","date":"2026-10-11","status":"implemented","group":"Tourablauf, Disposition & Go/No-Go-Freigabe","module":"","title":"Go/No-Go-Freigabe beim echten Abfahrtsübergang erzwingen","change":"Der Übergang zu `in_transit` erfordert eine gültige Freigabe, und der Server bewertet alle Gates im Moment des Übergangs neu. Übersteuerungsrecht (`trips:override_release`) mit Begründung von mindestens 10 Zeichen, auditiert mit der Liste der fehlgeschlagenen Gates. Aktion `docs.revoke`, automatisch ausgelöst, wenn ein Gate vor Abfahrt kritisch wird.","finding":"`set_trip_status` lässt eine Tour von `loading → in_transit` wechseln, sobald Fahrzeug und Fahrer gesetzt sind (operations.py:421-432). Die Go/No-Go-Freigabe schreibt nur `doc[\"released\"]` (docs.py:212-222), funktioniert nur für Referenztouren und kann nicht widerrufen werden, wenn ein Gate später rot wird (z. B. neuer kritischer Alarm)."},{"id":"FR-92","type":"FR","date":"2026-10-11","status":"implemented","group":"Tourablauf, Disposition & Go/No-Go-Freigabe","module":"","title":"Fest codierte und textbasierte Freigabe-Gates durch Datenprüfungen ersetzen","change":"Gates aus der DB berechnen: (a) Fahrer aktiv, `license_until` und `adr_until` am oder nach dem ETA-Datum der Tour, Medizincheck-Dokument vorhanden; (b) jede Auftragsklasse in `vehicle.temp_classes` enthalten; (c) Logger-Kalibrierdatum als Datumsspalte gespeichert; (d) ADR und Abgleich für jede Tour bewertet; (e) „Dokumente vollständig“ aus Zeilen von `state_document` gelesen (TTN, Fahrtenblatt, ESF/SNT bei Beteiligung Dritter). Das v5-Duplikat `docSt` entfernen.","finding":"Mehrere Gates prüfen keine echten Daten: „Fahrer qualifiziert“ ist immer `True` (docs.py:138); „Geeignet für Temperaturklasse“ prüft nur `veh.thermo`, nicht die Klassen der Aufträge (docs.py:137); jedes Dokument einer Tour, das nicht in `plan` steht, gilt als fertig (docs.py:128); die Logger-Kalibrierung ist ein Regex auf lokalisiertem Text (docs.py:33,132); ADR und Abgleich werden nur für R-106 bewertet (docs.py:98,141,143). Der Dokumentstatus liegt in `doc[\"docs\"]/[\"docSt\"]` (docs.py:123-129,185-209) und dupliziert die Tabelle `state_document` (INTEGRATIONS.md „State documents“)."},{"id":"FR-93","type":"FR","date":"2026-10-11","status":"implemented","group":"Tourablauf, Disposition & Go/No-Go-Freigabe","module":"","title":"Serverseitige Ressourcenprüfung und Doppelbuchungsprüfung","change":"In create, assign und dem neuen PATCH (A07) abweisen: `vehicle.status ≠ active`; Fahrer inaktiv oder Führerschein läuft vor der ETA ab; ADR-Aufträge, wenn `adr_until` vor der ETA liegt; Überlappung von [planned_departure, eta] mit einer anderen nicht stornierten, nicht zugestellten Tour desselben Fahrzeugs oder Fahrers. Fehler liefern 409 mit Grundcode.","finding":"`create_trip` prüft nur, dass Fahrzeug und Fahrer zum Hub gehören (operations.py:387-391). Die UI blendet nicht `active` Fahrzeuge und inaktive Fahrer aus (Operations.tsx:83,91), die API jedoch nicht, sodass eine manipulierte Anfrage angenommen wird. Keine Seite verhindert, dass dasselbe Fahrzeug oder derselbe Fahrer auf zwei überlappenden Touren ist oder ein ADR-Auftrag an einen Fahrer ohne gültige ADR-Bescheinigung geht."},{"id":"FR-94","type":"FR","date":"2026-10-11","status":"implemented","group":"Tourablauf, Disposition & Go/No-Go-Freigabe","module":"","title":"Bestehende Touren bearbeiten, umplanen und Zuordnungen lösen","change":"`PATCH /api/trips/{id}` (Fahrzeug, Fahrer, planned_departure, eta, Notiz) in planning/loading, mit erneuter Kapazitäts- und A06-Prüfung. `DELETE /api/trips/{id}/orders/{oid}` (Auftrag → neu; der Stopp entfällt, wenn kein anderer Auftrag für diesen Ort bleibt). `PUT /api/trips/{id}/stops` zum Umsortieren. `dispatch.replan` verallgemeinern: beliebige Tour, neuer Abfahrtszeitpunkt, Grund (Wetter/Straße/Fahrzeug/Kunde), schreibt `Trip.planned_departure`/`eta`. `shipment.status_changed` / ETA-Änderung senden.","finding":"Nach dem Anlegen können Touren nicht geändert werden: der Router kennt nur create, assign, status und deliver (operations.py:382-484). Fahrzeug, Fahrer oder Zeiten lassen sich nicht ändern, kein Auftrag entfernen, keine Stopps umsortieren. Die v5-Umplanung funktioniert nur für R-106 und nur bis Tagesindex 4 (dispatch.py:16,67-84), und das Ergebnis ist ein fest codierter Anzeigetext `'10.10 · 06:00'` (shared.ts:280-284)."},{"id":"FR-95","type":"FR","date":"2026-10-11","status":"implemented","group":"Tourablauf, Disposition & Go/No-Go-Freigabe","module":"","title":"Auftragsstornierung konsistent mit Stopp und Buchung machen","change":"Beim Stornieren: Stopp entfernen, wenn kein anderer Auftrag für diesen Ort auf der Tour bleibt; verknüpfte Buchung mit Grund auf `cancelled` setzen (neuer Übergang confirmed→cancelled, Desk-Endpunkt `POST /api/bookings/{n}/cancel`); `booking.cancelled` und `shipment.cancelled` senden.","finding":"`cancel_order` setzt `trip_id=None`, lässt aber den `TripStop` bestehen (operations.py:254-266). Die Tour kann dann nie abgeschlossen werden, weil jeder Stopp zugestellt sein muss (operations.py:429-430,476). Die verknüpfte Buchung bleibt `confirmed` und zählt weiter als gebuchte Kapazität (booking.py:30,50-54). Der Kunde erhält keinen Webhook. Die Disposition hat keinen Endpunkt, um eine bestätigte Buchung zu stornieren."},{"id":"FR-96","type":"FR","date":"2026-10-11","status":"implemented","group":"Tourablauf, Disposition & Go/No-Go-Freigabe","module":"","title":"Gebuchte Abfahrt in den Auftrag übernehmen und Touren je Abfahrt planen","change":"`Order.schedule_id`, `departure_date` und `booking_id` ergänzen. In der Disposition „Tour für Abfahrt anlegen“: füllt Hub, alle bestätigten Aufträge dieser Linie und dieses Datums und die geplante Abfahrt aus der Fahrplanzeit vor. `Schedule.capacity_kg` ergänzen, geprüft in `create_booking`. Warnung, wenn gebuchte Paletten die Paletten des zugeordneten Fahrzeugs übersteigen.","finding":"`confirm()` legt einen Auftrag ohne Linie oder Abfahrtsdatum an (booking.py:143-145), und `Order` hat dafür kein Feld (models.py:231-249), sodass die Disposition nicht sieht, welche Abfahrt der Kunde gebucht hat. Die Linienkapazität (`Schedule.pallets_capacity`, models.py:433) ist unabhängig vom tatsächlich zugeordneten Fahrzeug, und das Gewicht wird nie gegen die Linie geprüft."},{"id":"FR-97","type":"FR","date":"2026-10-11","status":"implemented","group":"Tourablauf, Disposition & Go/No-Go-Freigabe","module":"","title":"Abfahrtsausnahmen und ein einheitlicher Buchungshorizont","change":"Tabelle `schedule_exceptions` (Datum, ausgefallen/zusätzlich, Grund), genutzt von `slots()` und `create_booking`. Eine Horizontkonstante für beide. `confirm()` validiert Linie, Klasse und Ziel erneut. Der Ausfall einer Abfahrt benachrichtigt deren Buchungen per Webhook und listet sie am Desk.","finding":"Slots werden für 14 Tage angezeigt (booking.py:57,65), Buchungen aber bis 21 Tage angenommen (booking.py:104). Feiertage oder ausgefallene Abfahrten sind nicht abbildbar, sodass Portal und Partner-API Abfahrten verkaufen, die nicht stattfinden. `confirm()` prüft nicht erneut, ob die Linie noch aktiv ist und das Ziel noch bedient (booking.py:140-142)."},{"id":"FR-98","type":"FR","date":"2026-10-11","status":"implemented","group":"Tourablauf, Disposition & Go/No-Go-Freigabe","module":"","title":"Fehlende Statusübergänge vervollständigen","change":"Auftragsstatus: loaded (alle Packstücke bei Beladung gescannt), partially_delivered, refused, returned, handed_over. Stopp-Endpunkt `arrive` mit `arrived_at` (Standzeit, Lagerfenster 9–17). Tourstatus `aborted` aus in_transit mit Grund und Pflichtverknüpfung zu Alarm/Abweichung. Restaufträge gehen zurück auf `new` oder auf eine Ersatztour. Eine gemeinsame Übergangstabelle für API und v5.","finding":"`OrderStatus.loaded` wird nie gesetzt: Beladung wird auf `planned` abgebildet (models.py:65, operations.py:318-323). `StopStatus.arrived` wird nie gesetzt, und es gibt keinen Ankunfts-Endpunkt (models.py:81). Es gibt keine Teil-, verweigerte oder Rückzustellung. Eine Tour unterwegs kann nur zu delivered wechseln (operations.py:314), sodass Unfall, Panne mit Umladung oder totaler Temperaturverlust nicht abbildbar sind."},{"id":"FR-99","type":"FR","date":"2026-10-11","status":"implemented","group":"Tourablauf, Disposition & Go/No-Go-Freigabe","module":"","title":"Serverseitige Ladeberechn
