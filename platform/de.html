ben), Empfängernamen in ePOD-Ereignissen und -Texten („подпись Г. Абдрахмановой“, `driver.py:57`) und Namen in Texten des Betriebsprotokolls. Sie gelangen auch in Backups und Historie (C06). Es gibt keinen Löschpfad, während das CRM „anonymisieren“ kennt (SECURITY.md §9a)."},{"id":"FR-90","type":"FR","date":"2026-10-11","status":"implemented","group":"Sicherheit & Datenschutz","module":"","title":"Persistente Idempotenz für externe Ereignisse","change":"Tabelle `external_event(source, ref, inbox_id, received_at)` mit UNIQUE-Constraint auf (source, ref). `apply_external_event` fügt in derselben Transaktion wie die Dokumentänderung ein, 409 kommt vom Constraint. `coverage.raise_alarms` (`coverage.py:259`) und `inbox.demo` nutzen dieselbe Prüfung. Aufbewahrung mindestens 13 Monate, damit jährliche Ausschreibungen und Bußgelder dedupliziert bleiben.","finding":"Die Deduplizierung durchsucht nur die gekappte Liste `doc[\"inbox\"]`: geprüft wird in `be/v5/modules/inbox.py:123`, die Liste ist bei INBOX_MAX=200 gekappt (`:46`/`:127`). Sind 200 neuere Ereignisse eingetroffen, werden erneut zugestellte Refs wieder angenommen. Quellen erneuter Zustellung: die 1-Minuten-Überlappung von Wialon (`be/integrations/worker.py:216`), Webhook-Wiederholungen und der goszakup-Abruf, der täglich dieselben offenen Ausschreibungen liefert (bis 10 × 50, `goszakup.py:32`, `worker.py:247-258`). Jede wieder angenommene Ref erzeugt doppelte Bußgelder, Werkstatttickets, Vorfälle und CRM-Leads."},{"id":"FR-91","type":"FR","date":"2026-10-11","status":"implemented","group":"Tourablauf, Disposition & Go/No-Go-Freigabe","module":"","title":"Go/No-Go-Freigabe beim echten Abfahrtsübergang erzwingen","change":"Der Übergang zu `in_transit` erfordert eine gültige Freigabe, und der Server bewertet alle Gates im Moment des Übergangs neu. Übersteuerungsrecht (`trips:override_release`) mit Begründung von mindestens 10 Zeichen, auditiert mit der Liste der fehlgeschlagenen Gates. Aktion `docs.revoke`, automatisch ausgelöst, wenn ein Gate vor Abfahrt kritisch wird.","finding":"`set_trip_status` lässt eine Tour von `loading → in_transit` wechseln, sobald Fahrzeug und Fahrer gesetzt sind (operations.py:421-432). Die Go/No-Go-Freigabe schreibt nur `doc[\"released\"]` (docs.py:212-222), funktioniert nur für Referenztouren und kann nicht widerrufen werden, wenn ein Gate später rot wird (z. B. neuer kritischer Alarm)."},{"id":"FR-92","type":"FR","date":"2026-10-11","status":"implemented","group":"Tourablauf, Disposition & Go/No-Go-Freigabe","module":"","title":"Fest codierte und textbasierte Freigabe-Gates durch Datenprüfungen ersetzen","change":"Gates aus der DB berechnen: (a) Fahrer aktiv, `license_until` und `adr_until` am oder nach dem ETA-Datum der Tour, Medizincheck-Dokument vorhanden; (b) jede Auftragsklasse in `vehicle.temp_classes` enthalten; (c) Logger-Kalibrierdatum als Datumsspalte gespeichert; (d) ADR und Abgleich für jede Tour bewertet; (e) „Dokumente vollständig“ aus Zeilen von `state_document` gelesen (TTN, Fahrtenblatt, ESF/SNT bei Beteiligung Dritter). Das v5-Duplikat `docSt` entfernen.","finding":"Mehrere Gates prüfen keine echten Daten: „Fahrer qualifiziert“ ist immer `True` (docs.py:138); „Geeignet für Temperaturklasse“ prüft nur `veh.thermo`, nicht die Klassen der Aufträge (docs.py:137); jedes Dokument einer Tour, das nicht in `plan` steht, gilt als fertig (docs.py:128); die Logger-Kalibrierung ist ein Regex auf lokalisiertem Text (docs.py:33,132); ADR und Abgleich werden nur für R-106 bewertet (docs.py:98,141,143). Der Dokumentstatus liegt in `doc[\"docs\"]/[\"docSt\"]` (docs.py:123-129,185-209) und dupliziert die Tabelle `state_document` (INTEGRATIONS.md „State documents“)."},{"id":"FR-93","type":"FR","date":"2026-10-11","status":"implemented","group":"Tourablauf, Disposition & Go/No-Go-Freigabe","module":"","title":"Serverseitige Ressourcenprüfung und Doppelbuchungsprüfung","change":"In create, assign und dem neuen PATCH (A07) abweisen: `vehicle.status ≠ active`; Fahrer inaktiv oder Führerschein läuft vor der ETA ab; ADR-Aufträge, wenn `adr_until` vor der ETA liegt; Überlappung von [planned_departure, eta] mit einer anderen nicht stornierten, nicht zugestellten Tour desselben Fahrzeugs oder Fahrers. Fehler liefern 409 mit Grundcode.","finding":"`create_trip` prüft nur, dass Fahrzeug und Fahrer zum Hub gehören (operations.py:387-391). Die UI blendet nicht `active` Fahrzeuge und inaktive Fahrer aus (Operations.tsx:83,91), die API jedoch nicht, sodass eine manipulierte Anfrage angenommen wird. Keine Seite verhindert, dass dasselbe Fahrzeug oder derselbe Fahrer auf zwei überlappenden Touren ist oder ein ADR-Auftrag an einen Fahrer ohne gültige ADR-Bescheinigung geht."},{"id":"FR-94","type":"FR","date":"2026-10-11","status":"implemented","group":"Tourablauf, Disposition & Go/No-Go-Freigabe","module":"","title":"Bestehende Touren bearbeiten, umplanen und Zuordnungen lösen","change":"`PATCH /api/trips/{id}` (Fahrzeug, Fahrer, planned_departure, eta, Notiz) in planning/loading, mit erneuter Kapazitäts- und A06-Prüfung. `DELETE /api/trips/{id}/orders/{oid}` (Auftrag → neu; der Stopp entfällt, wenn kein anderer Auftrag für diesen Ort bleibt). `PUT /api/trips/{id}/stops` zum Umsortieren. `dispatch.replan` verallgemeinern: beliebige Tour, neuer Abfahrtszeitpunkt, Grund (Wetter/Straße/Fahrzeug/Kunde), schreibt `Trip.planned_departure`/`eta`. `shipment.status_changed` / ETA-Änderung senden.","finding":"Nach dem Anlegen können Touren nicht geändert werden: der Router kennt nur create, assign, status und deliver (operations.py:382-484). Fahrzeug, Fahrer oder Zeiten lassen sich nicht ändern, kein Auftrag entfernen, keine Stopps umsortieren. Die v5-Umplanung funktioniert nur für R-106 und nur bis Tagesindex 4 (dispatch.py:16,67-84), und das Ergebnis ist ein fest codierter Anzeigetext `'10.10 · 06:00'` (shared.ts:280-284)."},{"id":"FR-95","type":"FR","date":"2026-10-11","status":"implemented","group":"Tourablauf, Disposition & Go/No-Go-Freigabe","module":"","title":"Auftragsstornierung konsistent mit Stopp und Buchung machen","change":"Beim Stornieren: Stopp entfernen, wenn kein anderer Auftrag für diesen Ort auf der Tour bleibt; verknüpfte Buchung mit Grund auf `cancelled` setzen (neuer Übergang confirmed→cancelled, Desk-Endpunkt `POST /api/bookings/{n}/cancel`); `booking.cancelled` und `shipment.cancelled` senden.","finding":"`cancel_order` setzt `trip_id=None`, lässt aber den `TripStop` bestehen (operations.py:254-266). Die Tour kann dann nie abgeschlossen werden, weil jeder Stopp zugestellt sein muss (operations.py:429-430,476). Die verknüpfte Buchung bleibt `confirmed` und zählt weiter als gebuchte Kapazität (booking.py:30,50-54). Der Kunde erhält keinen Webhook. Die Disposition hat keinen Endpunkt, um eine bestätigte Buchung zu stornieren."},{"id":"FR-96","type":"FR","date":"2026-10-11","status":"implemented","group":"Tourablauf, Disposition & Go/No-Go-Freigabe","module":"","title":"Gebuchte Abfahrt in den Auftrag übernehmen und Touren je Abfahrt planen","change":"`Order.schedule_id`, `departure_date` und `booking_id` ergänzen. In der Disposition „Tour für Abfahrt anlegen“: füllt Hub, alle bestätigten Aufträge dieser Linie und dieses Datums und die geplante Abfahrt aus der Fahrplanzeit vor. `Schedule.capacity_kg` ergänzen, geprüft in `create_booking`. Warnung, wenn gebuchte Paletten die Paletten des zugeordneten Fahrzeugs übersteigen.","finding":"`confirm()` legt einen Auftrag ohne Linie oder Abfahrtsdatum an (booking.py:143-145), und `Order` hat dafür kein Feld (models.py:231-249), sodass die Disposition nicht sieht, welche Abfahrt der Kunde gebucht hat. Die Linienkapazität (`Schedule.pallets_capacity`, models.py:433) ist unabhängig vom tatsächlich zugeordneten Fahrzeug, und das Gewicht wird nie gegen die Linie geprüft."},{"id":"FR-97","type":"FR","date":"2026-10-11","status":"implemented","group":"Tourablauf, Disposition & Go/No-Go-Freigabe","module":"","title":"Abfahrtsausnahmen und ein einheitlicher Buchungshorizont","change":"Tabelle `schedule_exceptions` (Datum, ausgefallen/zusätzlich, Grund), genutzt von `slots()` und `create_booking`. Eine Horizontkonstante für beide. `confirm()` validiert Linie, Klasse und Ziel erneut. Der Ausfall einer Abfahrt benachrichtigt deren Buchungen per Webhook und listet sie am Desk.","finding":"Slots werden für 14 Tage angezeigt (booking.py:57,65), Buchungen aber bis 21 Tage angenommen (booking.py:104). Feiertage oder ausgefallene Abfahrten sind nicht abbildbar, sodass Portal und Partner-API Abfahrten verkaufen, die nicht stattfinden. `confirm()` prüft nicht erneut, ob die Linie noch aktiv ist und das Ziel noch bedient (booking.py:140-142)."},{"id":"FR-98","type":"FR","date":"2026-10-11","status":"implemented","group":"Tourablauf, Disposition & Go/No-Go-Freigabe","module":"","title":"Fehlende Statusübergänge vervollständigen","change":"Auftragsstatus: loaded (alle Packstücke bei Beladung gescannt), partially_delivered, refused, returned, handed_over. Stopp-Endpunkt `arrive` mit `arrived_at` (Standzeit, Lagerfenster 9–17). Tourstatus `aborted` aus in_transit mit Grund und Pflichtverknüpfung zu Alarm/Abweichung. Restaufträge gehen zurück auf `new` oder auf eine Ersatztour. Eine gemeinsame Übergangstabelle für API und v5.","finding":"`OrderStatus.loaded` wird nie gesetzt: Beladung wird auf `planned` abgebildet (models.py:65, operations.py:318-323). `StopStatus.arrived` wird nie gesetzt, und es gibt keinen Ankunfts-Endpunkt (models.py:81). Es gibt keine Teil-, verweigerte oder Rückzustellung. Eine Tour unterwegs kann nur zu delivered wechseln (operations.py:314), sodass Unfall, Panne mit Umladung oder totaler Temperaturverlust nicht abbildbar sind."},{"id":"FR-99","type":"FR","date":"2026-10-11","status":"implemented","group":"Tourablauf, Disposition & Go/No-Go-Freigabe","module":"","title":"Serverseitige Ladeberechnung für jede Tour und jedes Fahrzeug","change":"`loadCalc` und `vehicleMatch` nach `app/loadcalc.py` portieren, parametrisiert durch die Aufträge der Tour und ein Fahrzeugprofil (trucks.json + neue Vehicle-Felder: Zonen, Palettenplätze je Kammer, Thermocontainer-Plätze, Achsmodell). Nutzung in `assign_orders`, `load.plan` und im Freigabe-Gate. `GET /api/trips/{id}/load`, das der Bildschirm darstellt.","finding":"Die Ladeberechnung existiert nur im Browser und ist auf R-106 mit V02 fixiert: `loadCalc` (shared.ts:43-50), das Standardprofil (trucks.ts:74-76), die Kapazitätsprüfung nur für R-106 (dispatch.ts:50,88-89), `LOAD_TRIP` (load.py:117), und `dispatch.assign` zielt immer auf R-106 und nur Astana-Aufträge (dispatch.py:87-99, dispatch.ts:96). Das serverseitige `load.plan` speichert einen Fahrzeugtyp ohne Passprüfung (load.py:206-258), und `_attach_orders` prüft nur Gesamt-kg und Paletten, ohne Kammern, m³ und Achslasten (operations.py:367-372)."},{"id":"FR-100","type":"FR","date":"2026-10-11","status":"implemented","group":"Tourablauf, Disposition & Go/No-Go-Freigabe","module":"","title":"„Touren heute“ und Alarmzähler korrigieren","change":"Touren nach `planned_departure`/`eta` mit Überschneidung zum heutigen Tag in KZ-Zeit filtern. Alarme je Schweregrad per SQL `COUNT … GROUP BY` zählen. Die 20-Zeilen-Liste nur zur Anzeige behalten.","finding":"`trips_today` zählt jede jemals angelegte, nicht stornierte Tour (operations.py:132-136,150). `open_alarms` und `critical_alarms` werden aus einer auf 20 Zeilen begrenzten Liste gezählt (operations.py:140-142,153-154), sodass der KPI nie 20 übersteigt und die kritische Anzahl unvollständig ist."},{"id":"FR-101","type":"FR","date":"2026-10-11","status":"implemented","group":"Kühlkette, Alarme & Qualität","module":"","title":"Ein gemeinsamer Speicher für Alarme und Vorfälle","change":"`Alarm` zum einzigen Speicher machen: Quelle, Dedup-Schlüssel, Stufe 1–3, Eskalation, Vorfallfelder und Abschlusskategorie ergänzen. v5-Sicherheit und die Alarmliste der Übersicht lesen `/api/alarms`; v5-Vorfallaktionen aktualisieren dieselbe Zeile. Wetter-/Lade-/Straßenrisiken als „Risiken“ getrennt von Alarmen zeigen. Die Telemetriesimulation nur im Demo ausführen.","finding":"Es gibt zwei unabhängige Alarmsysteme. Das eine ist die relationale Tabelle `Alarm` (models.py:296-309; /alarms; klassische Übersicht). Das andere ist die v5-Liste, im Browser aus simulierter Telemetrie, Referenzwetter und `extraInc` berechnet (shared.ts:227-258; Simulations-Tick V5.tsx:97-101, der auch im Produktivbetrieb läuft). Ein Wialon-Alarm erzeugt sowohl eine `Alarm`-Zeile als auch einen v5-Vorfall (worker.py:203-207), die getrennt quittiert und geschlossen werden (resources.py:379-394 vs. security.py:73-88)."},{"id":"FR-102","type":"FR","date":"2026-10-11","status":"implemented","group":"Kühlkette, Alarme & Qualität","module":"","title":"Sensorzuordnung je Kammer und Alarmauswertung für alle Messquellen","change":"Zuordnung `vehicle_sensors` (Telematiksensor → Kammer/Temperaturklasse). Gemeinsame `evaluate_reading()` für manuelle Eingabe, Worker und Thermochron-Import: ein offener Alarm je Fahrzeug+Kammer, aktualisiert mit maximaler Abweichung und Dauer, mit Hysterese vor dem automatischen Schließen. Thermochron-Upload speichert Messwerte mit `source=thermochron`. Thermo liest den letzten Messwert je Kammer aus der DB.","finding":"Der Worker-Import speichert Messwerte, löst aber nie Alarme aus (worker.py:104-116); das tut nur die manuelle Eingabe (resources.py:289-302), und sie erzeugt für jeden Wert außerhalb des Bereichs einen neuen Alarm ohne Deduplizierung. Der Worker ordnet den einzigen Sensor der kältesten Klasse zu (worker.py:107-108), sodass ein Wert von +5 °C aus der 2–8-°C-Kammer von V01 als `frozen`-Wert außerhalb des Bereichs gespeichert wird. Ein Thermochron-Import ist nur ein Flag (thermo.py:17-34) und speichert keine Messwerte. Der v5-Thermobildschirm zeigt simulierte Werte (shared.ts:214-224)."},{"id":"FR-103","type":"FR","date":"2026-10-11","status":"implemented","group":"Kühlkette, Alarme & Qualität","module":"","title":"Qualitätssperre für von einer Abweichung betroffene Aufträge","change":"Tabelle `deviation`, erzeugt aus einem Temperaturalarm, mit betroffenen Aufträgen = Aufträge dieses Fahrzeugs und dieser Kammer im Abweichungsfenster; setzt `Order.quality_hold`. Die Zustellung eines gesperrten Auftrags wird abgewiesen (409) oder als „in Quarantäne zugestellt“ erfasst. Die QS-Entscheidung hebt die Sperre auf (Freigabe) oder setzt refused/returned (Sperre). Webhook `shipment.temperature_excursion` (ohne personenbezogene Rohdaten).","finding":"Alarme verweisen nur auf Tour und Fahrzeug (models.py:303-304), nie auf die betroffenen Aufträge. Die QS-Entscheidung Freigabe/Sperre gilt nur für statische Abweichungs-IDs (quality.py:78,96-118) und ändert operativ nichts. `deliver_stop` prüft keine Qualitätssperre (operations.py:461-477). Der Kunde sieht nur den letzten Messwert (partner_api.py `shipment_dict`)."},{"id":"FR-104","type":"FR","date":"2026-10-11","status":"implemented","group":"Kühlkette, Alarme & Qualität","module":"","title":"Ein Eskalationsdienst für jedes Ereignis der Stufe 3","change":"Hook auf `push_incident` für lvl ≥ 3 in eine Outbox-Tabelle. Zustellung: signierter Partner-Webhook, SMS an die Bereitschaftsnummer (SMSC), E-Mail. Eskalationstimer: keine Quittung innerhalb von 5 min (konfigurierbar) → nächste Stufe (Leiter Sicherheit, dann Geschäftsführer). Jeder Schritt wird auditiert. Keine personenbezogenen Daten in den Payloads.","finding":"Nur Wialon-Sicherheitsereignisse werden an den Sicherheitspartner eskaliert (`be/integrations/worker.py:194-215`). Ereignisse, die nur einen Vorfall in der UI erzeugen: SOS per SMS (`coverage.py:322-323`), SOS aus der Fahrer-App (`driver.py:343-348`), Unfall per SMS (`coverage.py:329-330`) und Kontaktverlust bei Kühlgut Stufe 3 (`coverage.py:229`). Das Label `esc=\"guard\"` (`inbox.py:317`) löst nichts aus. Nachts, wenn niemand auf den Bildschirm schaut, wird niemand alarmiert."},{"id":"FR-105","type":"FR","date":"2026-10-11","status":"implemented","group":"Kühlkette, Alarme & Qualität","module":"","title":"SOS vom echten Fahrer/Fahrzeug; expliziter Hub; Pflicht-Abschlussvermerk","change":"SOS nutzt die aktive Tour, das Fahrzeug und die letzte GPS/OL1-Position des angemeldeten Fahrers. Vorfälle erhalten eine explizite `hub_id`. Schließen/Auflösen erfordert eine Kategorie plus ≥ 10 Zeichen Text. Vorfälle der Stufe 3 müssen vor dem Schließen quittiert sein.","finding":"Panik/SOS erzeugt immer „V01 · A. Nurlanov · km 168“ (security.py:26,60-66), egal wer auslöst. Der Hub des Vorfalls wird aus dem Textpräfix geparst (security.py:29-33), sodass Vorfälle ohne Fahrzeug von Nutzern jedes Hubs bearbeitet werden können. Das Schließen eines Vorfalls (security.py:73-88) und das Auflösen eines Alarms (resources.py:342-343,391) brauchen keinen Abschlusstext."},{"id":"FR-106","type":"FR","date":"2026-10-11","status":"implemented","group":"Kühlkette, Alarme & Qualität","module":"","title":"Echter Prognoseimport statt eines Aktualisierungszeitstempels","change":"Worker-Task `forecast` (nur Integrations-Worker; nur Stadtkoordinaten, keine personenbezogenen Daten; Host in die Egress-Allowlist aufnehmen), speichert je Stadt/Tag: Min/Max, Wind, Wetterlage, Stufe nach `WX_RULES`. `wxRisk` und das Gate lesen die Tabelle. Prognose älter als 6 h → Aktualitätswarnung, das Gate wird gelb.","finding":"`weather.refresh` setzt nur den Zeitstempel (weather.py:58-65), während `WX` eine statische Referenz ist. Disponentenrisiko, Alarmliste und Go/No-Go-Gate hängen alle davon ab (dispatch.py:37-46, docs.py:71-83,144)."},{"id":"FR-107","type":"FR","date":"2026-10-11","status":"implemented","group":"Zustellung, Fahrer-App, Netzabdeckung & SMS","module":"","title":"ePOD der Fahrer-App mit Stoppzustellung und Auftragsstatus verbinden","change":"Tabelle `epod`: Stopp-ID, Empfängername (verschlüsselt, zeilengebundener Kontext), Objekt-IDs von Unterschrift/Foto, gescannte vs. erwartete Packstücke, Ausnahmen je Packstück (dmg/short/ref), arrived_at/left_at, Kammertemperatur bei Übergabe. Die Fahrer-App arbeitet auf der eigenen DB-Tour des angemeldeten Fahrers (`Driver.user_id`). Der Abschluss des ePOD führt die Logik von `deliver_stop` aus, markiert das `epod`-Dokument als fertig, und Ausnahmen lösen A12/A15 aus.","finding":"Das Fahrer-App-Modul ist fest auf R-103/V01 verdrahtet (driver.py:27). Das Abschließen des Stoppablaufs (`driver.step` erreicht 4) hängt nur ein Ereignis an (driver.py:181-195). Der relationale Stopp bleibt offen, Aufträge werden nicht auf zugestellt gesetzt, Tracking und Webhooks lösen nicht aus. Das Dokument `epod` ist immer „wait“ (docs.py:121,127). `deliver_stop` speichert nur einen Zeitstempel: keinen Empfänger, keine Unterschrift, keine Packstückzahl, keine Kammertemperatur (operations.py:461-484)."},{"id":"FR-108","type":"FR","date":"2026-10-11","status":"implemented","group":"Zustellung, Fahrer-App, Netzabdeckung & SMS","module":"","title":"ePOD mit rechtlich verwertbaren Nachweisen","change":"ePOD-Datensatz je Stopp: Erfassungszeit am Gerät + Empfangszeit am Server, GPS, Name und Funktion des Empfängers, Unterschriftsbild und Foto (im lokalen Objektspeicher, SHA-256 im Datensatz und im Audit-Log), gescannte vs. erwartete SSCC, Ausnahmen, Thermochron-Ergebnis. SMS `ST` setzt `pod_status=preliminary_sms`, das erst nach vollständigem Sync `final` wird. Ein Partner-ePOD wird über ein Partnerportal-Konto hochgeladen oder als „im Auftrag erfasst“ mit Grund und Scan markiert.","finding":"Der ePOD ist ein Zähler: die Schritte „Foto“ und „Unterschrift“ erhöhen nur `drvStep` (`be/v5/modules/driver.py:181-197`). Der Name des Unterzeichners ist ein statischer Text (`fe/v5/engine/driver.ts:22`). Offline gepufferte Ereignisse erhalten beim Sync die **Server**zeit (`driver.py:125`). Eine SMS `ST` erzeugt einen leeren `epod`-Platzhalter (`be/v5/modules/coverage.py:283-287`). Den Schritt „ePOD hochladen“ im Partnerportal klicken eigene Mitarbeiter mit `partners:write` (`be/v5/modules/partners.py:225-234`). Das hielte in einem GDP- oder Kundenstreit nicht stand."},{"id":"FR-109","type":"FR","date":"2026-10-11","status":"implemented","group":"Zustellung, Fahrer-App, Netzabdeckung & SMS","module":"","title":"Alle Fahrzeuge über Telematik überwachen, nicht nur über die App","change":"Der Worker schreibt minütlich die letzte Wialon-Nachrichtenzeit und Position je Einheit in `covContact[veh]` (Feld `tm`). Letzter Kontakt = das Neueste aus App, Telematik und SMS. Der Monitor durchläuft jedes Fahrzeug einer Tour in loading oder in_transit. „Kein Kontakt seit Abfahrt“ zählt ab der tatsächlichen Abfahrtszeit.","finding":"`covContact` wird nur von der Fahrer-App (nur V01, `be/v5/modules/driver.py:128`, `:339`) und von OL1-SMS (`coverage.py:307-311`) aktualisiert. `sync_temperatures` und `poll_wialon_alarms` berühren es nie (`be/integrations/worker.py:90-124`, `:154-219`). `evaluate` überspringt Fahrzeuge ohne `data`-Zeitstempel (`coverage.py:215-217`). Ein Fahrzeug, dessen App nie geöffnet wurde oder dessen Tracker verstummt ist, löst daher nie einen Kontaktalarm aus."},{"id":"FR-110","type":"FR","date":"2026-10-11","status":"implemented","group":"Zustellung, Fahrer-App, Netzabdeckung & SMS","module":"","title":"Zustellstatus und Quittungs-Timeout für Disponenten-SMS","change":"SMSC-Status-Callback ergänzen (signiert, derselbe eingehende Pfad) → `delivered`/`undeliverable`. Quittungsfrist je Code: STOP 10 min, CHKT 15 min, WAIT, CALL und PARK 30 min. Bei Timeout: Inbox Stufe 2 + Aufgabe „Fahrer anrufen“ + optional erneutes Senden (unter Beachtung des Limits 3 SMS / 10 min).","finding":"Eine Anweisung ist nur `queued → sent` (`be/v5/modules/coverage.py:409-411`). Ein `AK` speichert nur `ack` (`:335-339`). Eine nie quittierte STOP- oder CHKT-Anweisung erzeugt keinen Alarm. SMSC-Zustellberichte sind geplant (ROADMAP), aber nicht umgesetzt."},{"id":"FR-111","type":"FR","date":"2026-10-11","status":"implemented","group":"Zustellung, Fahrer-App, Netzabdeckung & SMS","module":"","title":"Reale Funklöcher aus Telematiklücken lernen","change":"Jede Telematik- oder App-Lücke > 10 min speichern (Start-/Endposition, Netzbetreiber, Fahrzeug, Abschnitt). Ein monatlicher Job schlägt Klassenänderungen je Abschnitt vor (braucht ≥ N Durchfahrten). Ein Analyst übernimmt sie, was `conf: verified, source: own telematics` setzt. Die Karte zeigt Modell vs. Messung.","finding":"Alle 23 Streckenabschnitte sind `conf: estimated` (`be/v5/reference/coverage.json`, Recherche §1.2). Das erwartete Fenster, das Alarme der Stufe 2 unterdrückt, hängt von diesen Schätzungen ab (`be/v5/modules/coverage.py:225`). TTC-Masten sollen bis Ende 2026 an republikanischen Straßen stehen (Recherche F5), das Modell veraltet also schnell. Die ROADMAP nennt „reale Funklöcher lernen“, doch heute speichert nichts Lücken."},{"id":"FR-112","type":"FR","date":"2026-10-11","status":"implemented","group":"Zustellung, Fahrer-App, Netzabdeckung & SMS","module":"","title":"ETA je Stopp und Ereignis-Zeitleiste im Tracking","change":"`TripStop.eta_planned`/`eta_current` ergänzen (aktualisiert durch Umplanung, Ankünfte und den 2GIS-Routen-Worker). Das Tracking liefert die ETA des eigenen Stopps des Auftrags plus eine Zeitleiste nicht personenbezogener Ereignisse (gebucht, geplant, verladen, abgefahren, angekommen, zugestellt, übergeben, Verspätungskategorie) und ein Temperatur-Konformitätsflag (nur ja/nein). Webhook `shipment.eta_changed`, wenn sich die ETA um mehr als 60 min verschiebt.","finding":"Das Tracking zeigt für jeden Auftrag einer Mehrstopp-Tour die ETA der Tour (des letzten Stopps) (public.py:229). Die ETA wird nach zugestellten Stopps, Verspätungen oder Umplanung nie neu berechnet. Es gibt keine Ereignishistorie. Nach Stornierung einer Tour fällt der Auftrag stillschweigend auf `new` zurück (operations.py:436-437)."},{"id":"FR-113","type":"FR","date":"2026-10-11","status":"implemented","group":"Zustellung, Fahrer-App, Netzabdeckung & SMS","module":"","title":"Partnerübergabe in Aufträgen, Stopps und Tracking abbilden","change":"Die Übergabe setzt die gewählten Aufträge/Packstücke auf `handed_over` (Partner-ID, Zeit). Der Stopp der eigenen Tour wird als `handed_over` markiert und gilt als erledigt. Der ePOD-Upload des Partners setzt den Auftrag auf zugestellt; das öffentliche Tracking-Ereignis „an Partnerfrachtführer übergeben“ enthält keine personenbezogenen Partnerdaten.","finding":"`partners.handover` und die Schritte des Partnerportals ändern nur das v5-Dokument (partners.py:145-235). Der relationale Auftrag bleibt auf der eigenen Tour als `in_transit`, sein Stopp blockiert weiter den Tourabschluss, und Tracking und Webhooks zeigen weiter unser Fahrzeug."},{"id":"FR-114","type":"FR","date":"2026-10-11","status":"implemented","group":"Compliance & Staatsdokumente","module":"","title":"Vorfahrt-Medizincheck vor dem 01.01.2027 erzwingen","change":"Ab einem konfigurierbaren Datum (Standard 2027-01-01) für Fahrzeuge > 3,5 t: `driver.signSheet` und die Go/No-Go-Freigabe verlangen einen Medizincheck mit admitted=true und checked_at ≤ 8 h vor Abfahrt (Wert zu verifizieren). Das Fahrtenblatt wird aus Checkliste und Kilometerständen der App befüllt. Der Integrations-Hub zeigt ein Fristenpanel mit Countdown zum 01.01.2027 und 01.06.2027 und dem Anteil der Touren mit vollständigen Fahrtenblatt- und TTN-Daten.","finding":"`medcheck` ist ein optionales manuelles Staatsdokument (`be/routers/integrations.py:365-372`). Das Fahrtenblatt wird mit möglicherweise leerem `pretrip_medical_check` erzeugt (`be/integrations/esutd.py:86`), und nichts sperrt die Freigabe. Die Unterschrift unter das Fahrtenblatt in der Fahrer-App braucht nur die Checkliste (`driver.py:167-178`). Die Fahrtenblatt-Payload lässt `pretrip_technical_check` und `odometer_start`/`end` leer (`esutd.py:85-87`), obwohl die App Checkliste und Kilometerstände erfasst (`driver.py:51-55`, `:98-100`)."},{"id":"FR-115","type":"FR","date":"2026-10-11","status":"implemented","group":"Compliance & Staatsdokumente","module":"","title":"Gefahrgut- und Trockeneisdaten je Sendung","change":"`un_number`, `lq` (bool), `dry_ice_kg` und `adr_class` zu Order und Booking hinzufügen (Portal + API v1 + Spezifikation). `dangerous_goods` der TTN daraus befüllen. Übergabe-, Eilauswahl- und Fahrzeugprüfungen lesen die Auftragsdaten. Über den LQ-Grenzen: ADR-Fahrer und -Fahrzeug sowie Fahrtschreiber erforderlich (B12).","finding":"Die TTN-Payload hat immer `dangerous_goods: None` (`be/integrations/esutd.py:67`). Die Buchungs-API hat keine Gefahrgutfelder (`be/routers/partner_api.py:97-106`). ADR-Prüfungen bei Übergabe und Eilzuordnung nutzen Flags der Referenzpositionen (`partners.py:102`, `staff.py:45`). Die Recherche verlangt UN-Nummer, LQ-Kennzeichen und kg Trockeneis je Sendung (UN 1845, ADR 5.5.3)."},{"id":"FR-116","type":"FR","date":"2026-10-11","status":"implemented","group":"Compliance & Staatsdokumente","module":"","title":"ESF aus dem zugestellten Auftrag erzeugen und eingehende Partnerrechnungen erfassen","change":"Bei finalem ePOD (B06) einen ESF-Entwurf aus `Booking.price_net`/`vat` und `Customer.bin` über `esf.invoice_xml` erzeugen. Einen Speicher (`state_document`) auch für den v5-Dokumentenbildschirm nutzen. Alarm für die Ausstellungsfrist. Eingangsregister (Lieferanten-BIN, ESF-Nr., Betrag), verknüpft mit der HO-/SR-ID und in das Ist-Kosten-Ledger eingespeist (B18).","finding":"Das Staatsdokument `esf` enthält nur `{order, vat_rate:16}`, ohne Betrag, Käufer oder Umsatzdatum (`be/routers/integrations.py:380-382`). Der v5-Dokumentenbildschirm simuliert „an IS ESF gesendet“ in einem eigenen Dokumentspeicher (`be/v5/modules/docs.py:186-195`), es gibt also zwei ESF-Welten. Es gibt keine Fristprüfung für die Ausstellung einer ESF nach dem Umsatzdatum (gesetzliche Frist, zu verifizieren). Übergabekosten an Partner `n × rate` (`partners.py:182`) und Werkstattkosten werden nie als Eingangsrechnung erfasst."},{"id":"FR-117","type":"FR","date":"2026-10-11","status":"implemented","group":"Compliance & Staatsdokumente","module":"","title":"GDP-Nachweise für Partnerstrecken","change":"GDP-Qualifizierung von Partnern (Fahrzeugzuordnung, Auditdatum, Ablauf) als Stammdaten. Bei Übergabe an beiden Enden Logger-ID und Temperatur sowie Plombennummer erfassen. Der Partner-ePOD erfordert ein Logger-Auslesen oder einen Daten-Upload. Fehlende Aufzeichnung oder Abweichung öffnet automatisch eine Abweichung in Qualität.","finding":"Die Übergabeprüfung ist das Boolesche `gdp`/`cold` je Partner (`partners.py:111-116`). Es gibt kein Qualifizierungszertifikat und kein Ablaufdatum, keine Temperaturaufzeichnung für die Partnerstrecke und kein Auslesen des Loggers bei Übergabe oder bei Zustellung durch den Partner. Das Partnerportal hat 3 Klickschritte (`partners.py:221-234`). GDP (MoH ҚР ДСМ-15/2021, EEC-Entscheidung 80) verlangt lückenlose Aufzeichnungen und qualifizierte Fahrzeuge je Strecke."},{"id":"FR-118","type":"FR","date":"2026-10-11","status":"implemented","group":"Ressourcen, Personal, Partner & Planung","module":"","title":"Werkstatttickets steuern Fahrzeugverfügbarkeit und Slotkapazität","change":"Verfügbarkeitskalender für Fahrzeuge (offenes Werkstattticket → nicht verfügbar bis ETA oder Abschluss). Panne- und Mangelmeldungen aus der App erzeugen einen Werkstattticket-Entwurf. Der Fahrplan erhält zugeordnete Fahrzeuge, Kapazität = min(Fahrplan, Summe verfügbarer Fahrzeugpaletten/-kg). Verliert eine Abfahrt mit Buchungen ihr Fahrzeug: Disponentenalarm + Webhook `booking.at_risk` an den API-Kunden.","finding":"`partners.call` setzt nur `vehSt` im v5-Dokument (`be/v5/modules/partners.py:254`). Der Plattformstatus `Vehicle.status` (`be/models.py:204`) bleibt aktiv. Buchungsslots nutzen die statische `Schedule.pallets_capacity`, die mit keinem Fahrzeug verknüpft ist (`be/booking.py:72`, `:106`, `be/models.py:433`), sodass Kunden weiterhin Abfahrten eines defekten Lkw buchen können. Eine Panne in der Fahrer-App und ein bei Schichtende gemeldeter Mangel erzeugen nur Ereignisse (`driver.py:295-322`), obwohl der Docstring einen Werkstattauftrag verspricht (`:312`)."},{"id":"FR-119","type":"FR","date":"2026-10-11","status":"implemented","group":"Ressourcen, Personal, Partner & Planung","module":"","title":"7-Tage-Kapazitätsplan aus echten Daten berechnen","change":"`GET /api/v5/plan?days=7` berechnet den Bedarf aus Buchungen und Aufträgen je Abfahrtsdatum (Paletten, kg, Temperaturklasse). Das Angebot kommt aus dem Fahrzeugkalender (B10) und der Fahrerverfügbarkeit (B12). Das Wetterrisiko kommt aus aktiven `roadMsg`. Ein Fehlmengentag bietet Maßnahmen: Übergabeanfrage an Partner, externer Frachtführer mit Kostenprüfung (B19), Express-Entscheidung (B20). What-if-Szenarien bleiben clientseitig auf der realen Basis.","finding":"Bedarf, Fahrzeug- und Fahrerverfügbarkeit sind fest codierte Arrays (`fe/v5/engine/planning.ts:13`, `:19`, `:20`). Die Empfehlungen sind feste Texte mit Konzeptdaten (`:31-34`). Das Backend-Modul hat weder Zustand noch Aktionen (`be/v5/modules/planning.py:10-12`). Der Bildschirm kann auf keine echte Buchung, kein Ticket und keine Krankmeldung reagieren."},{"id":"FR-120","type":"FR","date":"2026-10-11","status":"implemented","group":"Ressourcen, Personal, Partner & Planung","module":"","title":"Lenkzeitkonto der Fahrer und datenbasierte Eilzuordnung","change":"Zeitkonto aus Schichtbeginn und -ende in der App plus Wialon-Fahreraktivität, sofern verfügbar. Regeln: Tageslenkzeit, 4,5 h ununterbrochen, Tagesruhe, Wochenruhe gemäß Arbeits-/Ruhezeitverordnung des MID (adilet V1500014095, Schwellen zu verifizieren; Fahrtschreiber für Gefahrgut erforderlich). Die Eilauswahl nutzt Zeitkonto, Fahrzeugkalender, DB-Dokumente und gültigen Medizincheck (B15) und legt eine Tour `U-<n>` mit Audit an. Überall das Serverdatum verwenden.","finding":"Die Lenkzeit stammt aus dem statischen `TACHO`. Die einzige Regel ist „9 h − gefahren ≥ 6 h“ (`be/v5/modules/staff.py:42-43`). Es gibt keine Regeln für ununterbrochenes Fahren, Tages- oder Wochenruhe. Die Stunden bei Schichtende sind der feste Text „9,0 h“ (`driver.py:98-100`). Das Szenariodatum ist fix (`staff.py:16`, `TODAY = 06.10.2026`). Belegte Fahrzeuge sind fest codiert (`staff.py:52`, `fe/v5/engine/staff.ts:23`). Die Eiltour ist immer „U-01“, und die Zuordnung legt keine Tour an (`staff.py:69-83`). Gültigkeit von Führerschein und ADR stammt aus der Referenz, nicht aus `Driver.license_until`/`adr_until` (`be/models.py:222-223`)."},{"id":"FR-121","type":"FR","date":"2026-10-11","status":"implemented","group":"Ressourcen, Personal, Partner & Planung","module":"","title":"Gemessenes Partner-SLA, Tageskapazität und kontrollierte Vertragsverlängerungen","change":"Monatliches SLA aus Übergaben und Tickets berechnet (pünktlicher ePOD, ETA vs. Ankunft vor Ort aus `wsSt`), mit Stufenvorschlägen zur Vier-Augen-Freigabe. Kapazitätskonto je Partner und Tag. Verlängerung erfordert hochgeladenen Vertrag (Hash) + zweiten Freigeber + Gültigkeitsdatum der Versicherung. `wsCalls` je Ticket. ETA aus der Serverzeit. Übergabe-IDs aus einer Sequenz.","finding":"Das SLA ist ein statischer Referenztext, der die Stufe nur per Textparsing herabsetzt (`be/v5/modules/partners.py:46-56`). `capUsed` („heute“) wird nie zurückgesetzt oder reduziert (`:187`). Die Vertragsverlängerung ist +1 Jahr durch einen einzelnen Nutzer, ohne Vertragsdokument (`:280-294`). Eine Werkstatt kann nur ein einziges Mal gerufen werden (`wsCalls`, `:247-248`). Die Ticket-ETA hat das fest codierte Datum „06.10“ (`:251`). Die Übergabe-ID wird aus `len(hos)` abgeleitet (`:180`), entgegen der Regel in V5-PORT.md."},{"id":"FR-122","type":"FR","date":"2026-10-11","status":"implemented","group":"Ressourcen, Personal, Partner & Planung","module":"","title":"Bußgelder dem Fahrer zum Tatzeitpunkt zuordnen","change":"Zuordnung aus der Historie der Fahrzeugzuordnung zu Tatdatum und -uhrzeit. Quellen: tatsächliche Abfahrt und Ankunft der Tour, Fahrtenblatt (Fahrer + Fahrzeug) sowie, falls vorhanden, Wialon-Fahrerkarte oder iButton. Passt nichts, Status `unattributed`. Den Nachweis anzeigen (Tour, Fahrtenblatt, Zeitfenster).","finding":"Eingehende Bußgelder werden dem Fahrer der **aktuellen** Tour des Fahrzeugs zugeordnet. Gibt es keine, fällt der Code auf den **ersten Fahrer der Referenzliste** zurück (`be/v5/modules/inbox.py:245-253`). Das Segment des Nutzungsprotokolls wird dann auf den ganzen Tag `[0,1440]` gesetzt (`:263`). Ein Blitzerbescheid, der 3–10 Tage später eintrifft, landet daher bei der falschen Person. Die UI meldet dem Nutzer „Fahrer automatisch ermittelt“ (`be/v5/modules/reports.py:58-59`, `fe/v5/engine/reports.ts:21`)."},{"id":"FR-123","type":"FR","date":"2026-10-11","status":"implemented","group":"Ressourcen, Personal, Partner & Planung","module":"","title":"Bußgeldkonto mit Weiterbelastungsprozess","change":"Bußgeldkonto anlegen. Statusablauf: unpaid → paid_by_company(Betrag, Datum, 50-%-Flag) → recharge_requested → acknowledged_by_driver (Fahrer-App) oder disputed → deducted(Abrechnungszeitraum, Exportzeile) oder written_off (Unternehmenskosten). Der vom Unternehmen gezahlte Betrag geht ins Ist-Kosten-Ledger (B18). Abzüge beachten die gesetzliche Abzugsobergrenze (Arbeitsgesetzbuch RK, Artikel zu verifizieren).","finding":"`reports.fine` → `deduct` speichert nur das Label „Lohnabzug vereinbart“ (`be/v5/modules/reports.py:65`, `:70-83`). Es gibt keine Bestätigung des Fahrers, keinen Betrag oder Zeitraum für die Lohnabrechnung und keinen Nachweis, wer zuerst zahlt. Die Kosten schließen Bußgelder ganz aus („Fahrerhaftung“, `fe/v5/engine/costs.ts:98`), obwohl das Unternehmen sie als Fahrzeughalter (BIN) zahlt."},{"id":"FR-124","type":"FR","date":"2026-10-11","status":"implemented","group":"Ressourcen, Personal, Partner & Planung","module":"","title":"Echter Nachrichtenkanal zu Fahrern und Buchhaltung","change":"Tabelle `notification` (Empfänger Nutzer oder Rolle, Kanal in_app/E-Mail/SMS, Bezugsobjekt, Fälligkeit, read_at, ack_at). Die Fahrer-App liest ihre eigenen Nachrichten und quittiert mit `driver.ack(id)`. Ein Scheduler-Job erzeugt Erinnerungen bei Fälligkeit−2 T und Fälligkeit−0 T für Bußgelder, Vertragsverlängerungen (B21) und Dokumentabläufe (B12, B15). Überfällige Punkte eskalieren an den Rollenverantwortlichen.","finding":"`reports.notify` schreibt nur eine Protokollzeile und einen Toast „gesendet (Fahrer-App)“ (`be/v5/modules/reports.py:86-97`). Die Nachrichten der Fahrer-App sind die festen IDs m1–m3 (`be/v5/modules/driver.py:33`). Der Bußgeldbildschirm behauptet „Erinnerung an Fahrer und Buchhaltung gesendet“ für jedes Bußgeld, dessen 50-%-Rabatt in ≤ 7 Tagen endet, aber nichts wird gesendet (`fe/v5/engine/reports.ts:54`). Die einzige ausgehende Benachrichtigung im Backend ist die Lead-E-Mail (`be/routers/public.py:126`)."},{"id":"FR-125","type":"FR","date":"2026-10-11","status":"implemented","group":"Finanzen, Vertrieb & Partner-API","module":"","title":"Ist-Kosten-Ledger neben dem Bottom-up-Modell","change":"Tabelle `cost_entry` (Datum, Fahrzeug oder Tour, Kategorie Kraftstoff/Maut/Werkstatt/Übergabe/Bußgeld/Sonstiges, Betrag, Quell-Ref, Beleg-Ref). Zuflüsse: Fahrer-Tankung (Liter, Preis, Kilometerstand, Hash des Belegfotos), Abschluss eines Werkstatttickets (Ist-Kosten Pflicht), Übergabe/Eingangs-ESF (B17), Bußgelder (B03), CSV-Import der Mautabrechnung. Plan vs. Ist je Fahrzeug/Monat und l/100 km aus dem App-Kilometerstand anzeigen.","finding":"Затраты ist reines Modell. Ist-Kraftstoff `x.act` stammt aus der Referenz, und die Tankung in der App ist nur eine Notiz (`fe/v5/engine/costs.ts:120`). Maut ist „nicht im Modell“ (`:36`). Bußgelder sind ausgeschlossen (`:98`). Übergabekosten (`partners.py:182`) und Ticketkosten (Referenztext „80 000–150 000 ₸“) erreichen den Bildschirm nie. Der Outsourcing-Vergleich nutzt die Konstante `CP.outs`."},{"id":"FR-126","type":"FR","date":"2026-10-11","status":"implemented","group":"Finanzen, Vertrieb & Partner-API","module":"","title":"Frist, Benachrichtigung und Wirkung für Express-Freigaben","change":"`due_at` (Annahmeschluss des Express-Slots) ergänzen. Die 3 Rollen benachrichtigen (B04), mit Erinnerungen bei Fälligkeit−30 min. Zum Fälligkeitszeitpunkt werden offene Anträge automatisch auf eine Regeltour abgelehnt (auditiert als „system: timeout“). 3/3 erzeugt einen Express-Auftrag (oder eine Partner-Übergabeanfrage), verknüpft mit der EX-ID.","finding":"`baseline.exSign`/`exReject` speichern nur Unterschriften (`be/v5/modules/baseline.py:52-90`). Es gibt keine Fälligkeit, keine Nachricht an die drei Unterzeichner (Geschäftsführer, Analytik, Einkauf) und kein automatisches Ergebnis zum Annahmeschluss. Eine Freigabe 3/3 erzeugt weder Express-Auftrag noch Tour. Eine Ablehnung zeigt die Einsparung nur als Toast."},{"id":"FR-127","type":"FR","date":"2026-10-11","status":"implemented","group":"Finanzen, Vertrieb & Partner-API","module":"","title":"Strukturierte Ausschreibungs-Leads, Aufgaben und Onboarding gewonnener Kunden","change":"Lead-Felder `bin`, `deadline`, `tender_no`, `source_ref`. Automatisch eine Aufgabe „Angebot vorbereiten“ mit Fälligkeit Frist−3 Tage und Bearbeiter je Hub anlegen. Eine manuelle Ausschreibung oder ein manueller Lead in der Inbox erzeugt einen Lead. Bei Konvertierung: Abgleich über BIN, dann Assistent zum Anlegen eines Kundenportal-Nutzers und/oder ApiClient mit Scopes und Webhook. `partners.task` erzeugt eine CRM-Aufgabe mit Verantwortlichem und Fälligkeit.","finding":"`end_date` und `customer_bin` aus goszakup existieren nur in den Ereignisdaten und im Nachrichtentext des Leads (`be/integrations/worker.py:249-254`). Das Lead-Modell hat weder BIN noch Frist noch Ausschreibungsnummer (`be/models.py:364-386`). Ein manuelles `inbox.add` der Art Lead oder Ausschreibung erzeugt **keinen** CRM-Lead (`inbox.py:359`). `convert_lead` legt einen Kunden ohne BIN und ohne Dublettenprüfung an (`be/routers/crm.py:199`). Von `partners.task` gefundene Partnerlücken (`partners.py:314-332`) sind ein Flag, keine CRM-Aufgabe."},{"id":"FR-128","type":"FR","date":"2026-10-11","status":"implemented","group":"Finanzen, Vertrieb & Partner-API","module":"","title":"Strikte Idempotenz, GDP-Daten und Lebenszyklus-Endpunkte","change":"Request-Hash speichern. Gleiche Ref + anderer Hash → 409 `idempotency_conflict`. Neue Endpunkte: `GET /shipments/{n}/temperature` (Verlauf, Min/Max, Abweichungen), `/pod` (Metadaten des finalen ePOD + Hash), `/documents` (ESF-/TTN-Nummern und Status), `POST /bookings/{n}/cancel` vor Annahmeschluss (Webhook `booking.cancelled`). kg-Kapazitätsprüfung je Abfahrt.","finding":"Eine wiederholte `external_ref` mit **anderem** Body liefert stillschweigend die alte Buchung (`be/routers/partner_api.py:119-121`). Der Sendungs-Endpunkt liefert nur den letzten Temperaturwert (`:155-159`), ohne Verlauf, Abweichungen, ePOD oder Belegnummern, obwohl GDP-Kunden sie brauchen. Es gibt keinen Storno- oder Änderungs-Endpunkt. Die Buchungskapazität prüft nur Paletten, nicht `weight_kg` (`be/booking.py:72`, `:106`)."},{"id":"FR-129","type":"FR","date":"2026-10-11","status":"implemented","group":"Betrieb, UX, i18n, Tests & Performance","module":"","title":"Zuverlässiger Backup-Job: pipefail, separater MAC-Schlüssel, Zeitplan, externe Kopie, Fehleralarm","change":"`set -o pipefail` nutzen (busybox ash unterstützt es) oder `pg_dump` über `PIPESTATUS`/eine FIFO prüfen. `pg_dump -Fc` mit `--file` plus Plausibilitätsprüfung `pg_restore --list`. Separater `backup_mac_key`. Zeitplan 02:30 Asia/Almaty per crond. Statusdatei `last_ok.json`, die der Health-Endpunkt liest (C12). Optionales rsync/sftp-Ziel innerhalb KZ. Automatisierter monatlicher Wiederherstellungstest in einen Wegwerf-Container.","finding":"`pg_dump | gzip | openssl` läuft unter `sh` mit `set -eu`, aber ohne `pipefail` (`backup.sh:13-14`). Ein fehlschlagender `pg_dump` erzeugt eine abgeschnittene Datei, die als „backup ok“ protokolliert wird. Derselbe `backup_key` verschlüsselt und berechnet den MAC (`backup.sh:15, 18`). Die Schleife schläft 86 400 s ab Containerstart (`backup.sh:23`), die Uhrzeit driftet also und ist nicht nächtlich. Die externe Kopie ist manuell (`DEPLOYMENT.md` §4). Nichts alarmiert bei Fehlern, und die READY-Checkliste prüft nur, ob eine Datei existiert (`CLAUDE.md` §4)."},{"id":"FR-130","type":"FR","date":"2026-10-11","status":"implemented","group":"Betrieb, UX, i18n, Tests & Performance","module":"","title":"Worker-Zeitplanung je Task, Heartbeats, tiefer Health-Check und Alarmierung","change":"Jedem Task ein eigenes Intervall und Timeout geben (z. B. coverage 60 s, alarms 30 s, goszakup 6 h) über einen Thread-Pool oder einen Prozess je kritischem Task. Tabelle `worker_heartbeat(task, last_ok, last_error, duration)`. `GET /api/health/deep` (internes Netz oder Admin) prüft DB, Heartbeats, Backup-Alter und Export des Audit-Kopfes. `/metrics` im Prometheus-Format im internen Netz und Alarmregeln (Worker veraltet > 5 min, Backup > 26 h, 5xx-Rate, Login-Fehlschläge).","finding":"Der Worker führt alle 7 Tasks nacheinander in einer Schleife mit `time.sleep(60)` aus (`integrations/worker.py:334-359`). Ein langsamer Konnektor (HTTP-Timeout zu goszakup, 2GIS oder Wialon) verzögert `coverage-monitor` und die SOS-Eskalation für alle. Der Integrations-Container hat `healthcheck: { disable: true }` (`deploy/docker-compose.yml:117`), und `api` hat keinen Healthcheck. Überwachung ist nur „docker compose logs“ (`DEPLOYMENT.md` §6): keine Metriken, keine Alarme."},{"id":"FR-131","type":"FR","date":"2026-10-11","status":"implemented","group":"Betrieb, UX, i18n, Tests & Performance","module":"","title":"Dokumentänderungen an offene Clients pushen oder pollen","change":"`GET /api/v5/version` (günstig, liefert `{version}`), alle 5 s gepollt, solange sichtbar; bei Änderung `/state` (oder ein Delta, C05) laden. Phase 2: SSE-Endpunkt `/api/v5/events` über nginx (`proxy_buffering off`, Auth per Session-Cookie, hub-gefiltert nach C01). „aktualisiert hh:mm:ss“ und ein Banner für neue Alarme ab Stufe 2 anzeigen.","finding":"`/api/v5/state` wird einmal beim Mount geladen (`V5.tsx:77-95`) und nur nach dem eigenen `act` aktualisiert. Änderungen anderer Disponenten, des Workers (Coverage-Monitor, Wialon-Alarme) oder eingehender Webhooks (SOS, Werkstattstatus) erscheinen erst nach manuellem Neuladen. Die Live-Anzeige „Онлайн · обновление каждые 2 с“ (`Shell.tsx:48`) suggeriert das Gegenteil."},{"id":"FR-132","type":"FR","date":"2026-10-11","status":"implemented","group":"Betrieb, UX, i18n, Tests & Performance","module":"","title":"Ein Navigationsmodell: doppelte Menüpunkte entfernen und Bildschirmnummerierung korrigieren","change":"Die Altfunktionen als Tabs in die v5-Bildschirme übernehmen (Fuhrpark → `/s/fleet` Tab „Записи/Документы“; Temperaturmesswerte → `/s/thermo` Tab „Журнал“; Tourenplanung → `/s/dispatch`) oder eindeutig umbenennen („Журнал температур“, „Реестр ТС“). In Gruppe 2 nur echte Admin- und Registerseiten belassen. Eine Nummerierungstabelle (`SCREENS.code`) für Navigation, Hilfe und FR-Dokumente. Alte Routen umleiten.","finding":"Die Seitenleiste zeigt die 17 v5-Bildschirme und danach die Gruppe «Учёт и администрирование» mit gleichnamigen Einträgen: «Диспетчер» (`i18n.tsx:14`, `Layout.tsx:14`), «Термостатус» (`i18n.tsx:17`, `Layout.tsx:17`) und «Автопарк» (`i18n.tsx:19`, `Layout.tsx:22`). Sie führen zu anderen Altseiten (`/dispatch`, `/temperature`, `/fleet`), und „Сводка по рейсам“ dupliziert die Übersicht. Die Konzeptcodes in `NAV` wiederholen 04 (ship, thermo) und 10 (partners, staff) und überspringen 14, während die Shell nach Index neu nummeriert (`Shell.tsx:26, 85`), sodass Codes in Konzept- und FR-Dokumenten nicht zur UI passen."},{"id":"FR-133","type":"FR","date":"2026-10-11","status":"implemented","group":"Betrieb, UX, i18n, Tests & Performance","module":"","title":"Navigationsschublade für Smartphone-Breite und Viewport-/Überlappungstests in der UI-Suite","change":"Hamburger-Schublade (`<nav>` off-canvas, `aria-expanded`) unter 900 px und eine untere Leiste für die 4 meistgenutzten Bildschirme je Rolle. `suite-layout.js` ergänzen: für jeden der 17 Bildschirme bei 390×844, 1024×768 und 1500×1000 prüfen, dass kein horizontales Seitenscrollen auftritt (`scrollWidth <= innerWidth`) und sich die Begrenzungsrahmen von `section`/`aside` nicht überlappen (`[data-disp-drv]` vs. `.v5-ops-aside`).","finding":"Unter 900 px wird die Seitenleiste statisch, und alle ≈40 Navigationsknöpfe (17 v5, 5 Simulationsknöpfe, ~20 Registereinträge, Hilfe) umbrechen über dem Inhalt (`index.css:162-165`). Ein Disponent am Telefon scrollt auf jedem Bildschirm am ganzen Menü vorbei. Die UI-Suite läuft nur bei 1500×1000 (`scripts/ui_suite.py:38`, `tools/run-ui-tests.cjs:7`). Das klebende Tourpanel, das „Лента приложения водителя“ im Disponenten verdeckte, wurde manuell gefunden und nur durch Entfernen von `position: sticky` behoben (`v5/v5.css`-Diff an `.v5-ops-aside`), ohne Test."},{"id":"FR-134","type":"FR","date":"2026-10-11","status":"implemented","group":"Betrieb, UX, i18n, Tests & Performance","module":"","title":"Navigation als Links, Skip-Link, Statushinweise nicht nur über Farbe","change":"`<a href=\"/s/<key>\" data-nav>` mit denselben Klassen rendern. Den portierten Selektor `nav button` → `nav [data-nav]` mit `// port:`-Markierung anpassen (nach V5-PORT-Regeln erlaubt). Skip-Link zu `main` und eine `aria-live`-Region für Toasts (bereits `role=status`, beibehalten). Jedem Tag ein Stufenzeichen oder Text voranstellen (●/▲/■ + „крит.“). Reduced-Motion-Media-Query für den Live-Puls.","finding":"Die v5-Navigationspunkte sind `<button onClick={go(...)}>` ohne `href` (`Layout.tsx:52-59`): kein „in neuem Tab öffnen“, keine Link-Semantik für Screenreader. Es gibt keinen Skip-to-content-Link und keine Behandlung von `prefers-reduced-motion` (`index.css`, `v5.css`). Ampel-Tags tragen ihre Bedeutung über Inline-oklch-Farbe (`<Tag l>`, DOM-Vertrag in `V5-PORT.md`)."},{"id":"FR-135","type":"FR","date":"2026-10-11","status":"implemented","group":"Betrieb, UX, i18n, Tests & Performance","module":"","title":"Orts-/Standortstamm mit IDs; kasachische UI; Transliteration externer Texte","change":"Stamm `locations` ergänzen (ID `KZ-AST`, Namen ru/kk/de/en, KATO-Code, Koordinaten, Hub). Namensschlüssel in WX, BLC, BLR und LINES durch IDs ersetzen; die Inbox akzeptiert `city_id` oder einen Resolver (RU/KK/lateinische Aliasse). Helfer `translit(ru→Latin, BGN/PCGN)` für externen Freitext auf DE/EN, Original per Hover. `kk` als 4. UI-Sprache (Beginn mit Navigation, Übersicht und Fahrer, Fallback auf RU).","finding":"Städte werden über Anzeigetexte verknüpft. `WX` ist nach lokalisiertem Namen geschlüsselt (`mock-v5.de.json`, `WX`-Schlüssel „Astana“, „Karaganda“), `CITY_RU` wird per Index abgeleitet (`ref.py:190`), externe Ereignisse müssen Städte auf Russisch nennen (`inbox.py:13`), und die Ausgangsdaten speichern Paare `[\"Астана\",\"Astana\"]` (`BLR.route`, `BLC`). `title/text` aus Konnektoren werden in der Inbox wie empfangen (RU) gespeichert, sodass DE/EN-Bildschirme Kyrillisch zeigen – gegen die DOM-Regel „kein Kyrillisch auf DE/EN“ (`V5-PORT.md:182`). Kasachisch gibt es nur in der Fahrer-App (`i18n.tsx:4` LANGS = ru/de/en, `DV`)."},{"id":"FR-136","type":"FR","date":"2026-10-11","status":"implemented","group":"Betrieb, UX, i18n, Tests & Performance","module":"","title":"494er-Suite in der CI gegen das echte Backend; Parität des Demo-Spiegels","change":"(1) CI-Job: `docker compose -f deploy/demo/docker-compose.yml up`, Nutzer je Rolle anlegen und `suite.dc.js` und `suite-ext.js` gegen die echte API ausführen (Logins skriptgesteuert mit TOTP-Secret aus einer Test-Fixture). (2) Paritätstest: eine gemeinsame JSON-Fixture aus (Aktion, Payload, Rolle) läuft durch den Python-Handler und den TS-Spiegel, Dokumente und Status werden verglichen. (3) Suite auf PRs ausführen. (4) Zustand je Modulgruppe zurücksetzen (`/api/v5/reset` außerhalb von Prod), um Kaskaden zu vermeiden.","finding":"Die 494 Szenarien laufen nur gegen das Browser-Demo (`.github/workflows/pages.yml` „Run ported UI suite“), wo `DEMO_SINGLE_USER = true` die Vier-Augen-Regeln abschaltet (`frontend/src/demo/v5/costs.ts:8`, `baseline.ts:31`, `partners.ts:67`). Die 46 Serveraktionen sind in TS nachimplementiert (`frontend/src/demo/v5/*.ts`) ohne Paritätsprüfung. `ci.yml` (Push/PR) führt weder die Suite noch `oxlint` aus, und `pages.yml` läuft nur auf `main`, sodass PRs nicht durch die UI-Suite abgesichert sind. Geordnete zustandsbehaftete Tests (`V5-PORT.md:198`) lassen Fehler kaskadieren."},{"id":"FR-137","type":"FR","date":"2026-10-11","status":"implemented","group":"Betrieb, UX, i18n, Tests & Performance","module":"","title":"Bildschirm- und Hilfeberechtigungen aus dem Backend generieren; vollständiger Test Rolle × Aktion","change":"`scripts/dump_v5_meta.py` erweitern, sodass es `ROLE_PERMS`, die Zuordnung Bildschirm→Recht und Aktion→Recht ausgibt. Das Frontend importiert die Metadaten für Navigation, Hilfe und Guard. Parametrisierter pytest über alle Rollen × 46+ Aktionen (erwartet 200/403 aus einer deklarativen Tabelle) und über alle Rollen × 17 Bildschirme. Bildschirmumfang des Fahrers ausdrücklich festlegen (nur Fahrer, Abdeckung).","finding":"Berechtigungen werden an vier Stellen gepflegt: `rbac.py:265-286`, `frontend/src/v5/screens/index.ts:23-40` (Bildschirmrechte), `frontend/src/help/screens.ts` (`perm:` je Bildschirm) und `help/roles.ts:1-2` („mirror of rbac.py … keep in sync“). Die Rollenlogik des Konzepts ist nur in einzelnen Modultests sichtbar (`tests/test_v5_*.py`). Ein Fahrer kann Disponent, Beladung, Dokumente, Wetter und Partner öffnen, weil diese nur `trips:read` brauchen (`screens/index.ts:25-34`), das die Fahrerrolle besitzt (`rbac.py:279`)."},{"id":"FR-138","type":"FR","date":"2026-10-11","status":"implemented_partial","group":"Betrieb, UX, i18n, Tests & Performance","module":"","title":"2-s-Live-Tick vom App-Baum isolieren; Bildschirme per Code-Splitting; Bundle-Budget","change":"`live`, `t` und `door` in einen eigenen `LiveContext` verlagern (nur Thermo, Übersicht und Fahrer abonnieren). `alertsAll` und `navBadges` auf `doc` memoisieren. Tick bei `document.hidden` pausieren. `React.lazy` je Bildschirm plus Hilfe und Integrationskatalog. CI-Budget (`vite build` → Fehler, wenn das initiale JS 400 KB gzip oder ein Chunk 250 KB übersteigt).","finding":"Alle 2 s ersetzt `setUiState(tick)` das `ui` (`V5.tsx:100`), was `E` neu erzeugt (`V5.tsx:132-135`). Der ganze Baum rendert neu, einschließlich Seitenleiste (`useV5Nav` berechnet `loadCalc` + `alertsAll` + `navBadges` neu, `Shell.tsx:20-27`) und Kopfzeile (`alertsAll`, `searchLines`, `Shell.tsx:63-65`), auch bei verborgenem Tab. Das Produktiv-JS ist ein einziger Chunk von 972 KB (`frontend/dist/assets/index-COiDXqTD.js`), gestiegen von ~640 KB. Nur DemoBar ist lazy (`main.tsx:15`); die 721 Zeilen `integrationsCatalog.ts` und ~1 500 Zeilen Hilfe werden immer geladen."},{"id":"BUG-32","type":"bug","date":"2026-10-12","status":"fixed","group":"Gemeldete Fehler (Plattform)","module":"","title":"Express-Sendung mit 3-Personen-Freigabe nicht auffindbar (nur auf Bildschirm 17 „Ausgangsdaten“)","change":"Express-Option in der Kundenbuchung + Einstieg im Disponenten + Hilfeartikel; 3 Freigabefunktionen","finding":"Express-Sendung mit 3-Personen-Freigabe nicht auffindbar (nur auf Bildschirm 17 „Ausgangsdaten“)"},{"id":"BUG-31","type":"bug","date":"2026-10-12","status":"fixed","group":"Gemeldete Fehler (Plattform)","module":"","title":"Browserverlauf zeigt nur „Olymp Logistic“/„Hilfe und Anleitungen“ – der Bereich ist nicht erkennbar","change":"Dokumenttitel je Bildschirm/Tab/Datensatz (`<Bereich> · <Bildschirm> · Olymp Logistic`), Zurück/Vor stellt Bereich und Tab wieder her","finding":"Browserverlauf zeigt nur „Olymp Logistic“/„Hilfe und Anleitungen“ – der Bereich ist nicht erkennbar"},{"id":"BUG-30","type":"bug","date":"2026-10-12","status":"fixed","group":"Gemeldete Fehler (Plattform)","module":"","title":"Transportversicherung zeigt nur ₸","change":"Deklarierter Wert und Prämie zusätzlich in EUR und USD zum Tageskurs der NBK, mit Kursdatum","finding":"Transportversicherung zeigt nur ₸"},{"id":"BUG-29","type":"bug","date":"2026-10-12","status":"fixed","group":"Gemeldete Fehler (Plattform)","module":"","title":"Bereich Paletten / Temperatur hat kein Gewicht","change":"Gewicht (kg) Pflichtfeld neben Paletten, genutzt für Preis, Kapazität, Achsprüfung","finding":"Bereich Paletten / Temperatur hat kein Gewicht"},{"id":"BUG-28","type":"bug","date":"2026-10-12","status":"fixed","group":"Gemeldete Fehler (Plattform)","module":"","title":"„Keine Linie verbindet Abholung und Ziel“ wird Kunden angezeigt","change":"Nie ablehnen: Route über einen Hub (Umschlag), +1–2 Arbeitstage als Info anzeigen","finding":"„Keine Linie verbindet Abholung und Ziel“ wird Kunden angezeigt"},{"id":"BUG-27","type":"bug","date":"2026-10-12","status":"fixed","group":"Gemeldete Fehler (Plattform)","module":"","title":"Abhol-/Ziellisten im Portal bieten „KDL Olymp · Hub/Niederlassung“ an; externe Kunden versenden von/zu eigenen Standorten","change":"Städtelisten ohne KDL Olymp; Straßenadresse Pflicht und gegen das Straßenverzeichnis der Stadt validiert","finding":"Abhol-/Ziellisten im Portal bieten „KDL Olymp · Hub/Niederlassung“ an; externe Kunden versenden von/zu eigenen Standorten"},{"id":"BUG-26","type":"bug","date":"2026-10-11","status":"fixed","group":"Gemeldete Fehler (Plattform)","module":"","title":"Orte auf EN/DE-Seiten (Portal) auf Russisch","change":"Behoben in Welle 1 (Anzeigeübersetzung) und FR-135 (Standortstamm)","finding":"Orte auf EN/DE-Seiten (Portal) auf Russisch"},{"id":"BUG-25","type":"bug","date":"2026-10-11","status":"fixed","group":"Gemeldete Fehler (Plattform)","module":"","title":"Abholung und Ziel fehlen / dieselbe Stadt doppelt („Almaty · KDL Olymp · Almaty“)","change":"Behoben in Buchung v2 (getrennte Abholung und Ziel) – ersetzt durch BUG-27","finding":"Abholung und Ziel fehlen / dieselbe Stadt doppelt („Almaty · KDL Olymp · Almaty“)"},{"id":"BUG-24","type":"bug","date":"2026-10-11","status":"fixed","group":"Gemeldete Fehler (Plattform)","module":"","title":"GitHub Pages 404 für das private Plattform-Repo","change":"Vorschau unter Olymp-Logistic-KZ/platform/ veröffentlicht","finding":"GitHub Pages 404 für das private Plattform-Repo"},{"id":"BUG-23","type":"bug","date":"2026-10-11","status":"fixed","group":"Gemeldete Fehler (Plattform)","module":"","title":"Spalten der Fuhrparktabelle brechen bei ≈1080 px auf einen Buchstaben je Zeile zusammen","change":"GridTable-Mindestbreiten + eigener Scrollbereich; Layout-Suite","finding":"Spalten der Fuhrparktabelle brechen bei ≈1080 px auf einen Buchstaben je Zeile zusammen"},{"id":"BUG-22","type":"bug","date":"2026-10-11","status":"fixed","group":"Gemeldete Fehler (Plattform)","module":"","title":"Ladebild/Kacheln nicht synchron mit markierten Aufträgen (übergebene Aufträge blieben markiert)","change":"Ein Zustand in loadSim.ts; gesperrte Zeilen für übergebene Aufträge","finding":"Ladebild/Kacheln nicht synchron mit markierten Aufträgen (übergebene Aufträge blieben markiert)"},{"id":"BUG-21","type":"bug","date":"2026-10-11","status":"fixed","group":"Gemeldete Fehler (Plattform)","module":"","title":"Beladung & Gewicht: Überladungen (Achse, Gesamt, Höhe) nicht immer sichtbar","change":"Überladungsbalken/-tags mit genauer Überschreitung, Höhe in der Seitenansicht","finding":"Beladung & Gewicht: Überladungen (Achse, Gesamt, Höhe) nicht immer sichtbar"},{"id":"BUG-20","type":"bug","date":"2026-10-10","status":"fixed","group":"Gemeldete Fehler (Plattform)","module":"","title":"Disponent: Tourpanel verdeckt beim Scrollen den „Feed der Fahrer-App“","change":"sticky entfernt + Regressionstest","finding":"Disponent: Tourpanel verdeckt beim Scrollen den „Feed der Fahrer-App“"},{"id":"BUG-19","type":"bug","date":"2026-10-10","status
